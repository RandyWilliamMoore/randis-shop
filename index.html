<noscript><div class="noscript"><p>The Randis Shop needs JavaScript to play. Here is everything on its shelves:</p>
<ul>
<li><a href="https://github.com/RandyWilliamMoore/randis-uds/releases/tag/v0.1.13">Download Randis UDS 0.1.13</a>: The app everything in this shop was made with. A universal software with no fixed purpose: describe what you need, and the LLM inside it builds that into the app while you&#x27;re using it.</li>
<li><a href="share/games/battle-tanks-royale/">Battle Tanks Royale</a>: Drive a tank, defend your base and play the story, A Tanker&#x27;s War. Earn coins for upgrades and gear, paint your tank in the garage, or fight a friend on the same keyboard. Online play needs the Randis UDS app.</li>
<li><a href="share/games/bindy-and-louis/">Bindy &amp; Louis</a>: Bindy the binder clip helps you fix your own stuff with 320 repair tips, then teams up with Louis, the repair guy, to fight Mega Corp for the right to repair.</li>
<li><a href="share/games/blockwild/">Blockwild</a>: An original voxel sandbox: an endless generated world of plains, forests, deserts, snow, mountains, oceans and caves. Break and place 22 block types in Survival (health, crafting) or Creative (all blocks, flying), with day and night, glow lamps and several saved worlds.</li>
<li><a href="share/games/card-master/">Card Master</a>: A table of 57 standard card games with the rules for each, 27 of them playable now: solitaires, rummies, blackjack and more. Links to custom and real playing cards.</li>
<li><a href="share/games/castle-mnemosyne/">Castle Mnemosyne</a>: Walk a castle in old-school pixel art, first-person. Write what you learn in books at the scribes&#x27; wing and shelve them in a real memory palace, or play the treasure hunt with Myst-style puzzles.</li>
<li><a href="share/games/coin-flipper/">Coin Flipper</a>: Flip a coin, or a handful. Vanilla, Multi Coin, Call It, Double or Nothing, Race and Streak Hunt, with stats for every flip.</li>
<li><a href="share/games/dice-master/">Dice Master</a>: Roll any dice from d4 to d100, or play Pig, Ship, Captain &amp; Crew and High Roll against the computer. Links to custom dice makers and dice shops.</li>
<li><a href="share/games/diesel-gen-mechanic-simulator/">Diesel Gen Mechanic Simulator</a>: Start as a greenhorn under a scruffy foreman and work up to master repairman. Walk around the generator, open panels, find the worn and broken parts, and fix them, with real manuals, trade schools and training links along the way.</li>
<li><a href="share/games/fossil-collector/">Fossil Collector</a>: Dig for fossils at real sites, clean them in the prep lab with the right tools, conserve and identify them, then file them in the archive and show your best finds in a walkable museum with gardens and vistas.</li>
<li><a href="share/games/gem-collector/">Gem Collector</a>: Mine for gems, cut them on a virtual lapping machine in real known cuts, and keep them in a wooden drawer cabinet.</li>
<li><a href="share/games/gilded-hands/">Gilded Hands</a>: An original poker-hand roguelike. Play hands for Chips x Mult, beat Bronze, Silver and Gold tables over 8 tiers (Gold tables have boss rules), and shop for 32 Charms, Star Charts and Tinctures. Saves your run, with an endless mode after.</li>
<li><a href="share/games/hotdog-tycoon/">Hotdog Tycoon</a>: Start with one hotdog stand and grow to a national hotdog empire. Serve the line, buy upgrades from a condiment bar to your own sausage factory, and move from the beach boardwalk to the big league ballpark.</li>
<li><a href="share/games/lanternfall/">Lanternfall</a>: An original card-building roguelike. Pick the Lamplighter or the Tidecaller, build a deck from 60+ upgradable cards, 27 trinkets and 11 tonics, and climb 3 depths of branching maps past elites, events, shops and 6 bosses. Runs are saved.</li>
<li><a href="share/games/lhc-simulator/">LHC Simulator</a>: Run the Large Hadron Collider from Run 1 (2012) to the High-Luminosity era: fill the beams, collide, dump. Links to CERN, its experiments and open data. 1 run in 100 opens a portal to hell, or tempt fate and open one yourself.</li>
<li><a href="share/games/mail-sorter/">Mail Sorter</a>: The mail just keeps coming. Can you keep up? Sort it, score points for tricks, find free snacks in the break room and win coworker clout in break-time mini games.</li>
<li><a href="share/games/marble-collector/">Marble Collector</a>: Play marbles in an arena, keep the cool ones you win, and build a prized set.</li>
<li><a href="share/games/matching-master/">Matching Master</a>: Flip cards and match pairs, stage after stage. Earn coins and XP, collect prizes and items, and spend coins on hints, reveals and wild cards.</li>
<li><a href="share/games/milk-cap-champ/">Milk Cap Champ</a>: Stack &#x27;em, slam &#x27;em, flip &#x27;em. Win milk caps, earn coins, collect rare ones and level up from Rookie to Cap Master.</li>
<li><a href="share/games/pachinko-player/">Pachinko Player</a>: Shoot balls into a Tokyo pachinko machine and hit the START pocket to spin for FEVER. Trade balls for prize tokens at the counter, then find your way through the back alleys to the little window that buys them.</li>
<li><a href="share/games/pong/">Pong</a>: Classic Pong. Play the computer with W/S, the arrow keys or your mouse, or two players on one keyboard. First to 7 wins.</li>
<li><a href="share/games/rev-the-frog/">REV! The Frog Who Saved the World</a>: An original 3D platformer. Rev, a rocket-booted frog, frees 25 Beat Cores across 5 lands and beats 5 bosses, with a full story, lore tapes, synth music, gamepad support and saved progress.</li>
<li><a href="share/games/sandwich-master/">Sandwich Master</a>: Run a sandwich shop: take each order, build it bread first in the ticket&#x27;s order, wrap it and serve it before the customer runs out of patience. Earn fame and coins to unlock ingredients and upgrades.</li>
<li><a href="share/games/skateboard-collector/">Skateboard Collector</a>: Skate, land tricks for points, open crates for new decks, wheels and gear, and build your collection.</li>
<li><a href="share/games/slot-player/">Slot Player</a>: Spin four machines: Classic Bandit, Fruit Frenzy, Cosmic Spins and Multiplier Mania. Hold reels, set your bet, spin on auto, with sound. Find a real one-arm bandit on eBay.</li>
<li><a href="share/games/topiary-master/">Topiary Master</a>: Get hired to shape people&#x27;s hedges for money. Learn what sells in your area, build your skills, buy better tools, unlock new styles and win gardening awards.</li>
<li><a href="share/apps/atelier-fashion-suite/">Atelier: Fashion Suite</a>: Fashion design from idea to shelves: 30 aesthetics, moodboards, colour studio, sketchbook, parametric flats, print and repeat studio, knit charts, an 86-fabric library, size charts, pattern drafting with allowances and grading, and a tiled home-print pattern.</li>
<li><a href="share/apps/aura-assistant/">Aura Assistant</a>: An assistant with an animated avatar (hologram, anime character, orb, bot or waveform) that blinks, follows the mouse and changes moods. Timers, pomodoro, reminders, notes, to-dos and math work right here; chatting in character and voices need Randis UDS.</li>
<li><a href="share/apps/club-wiki/">Club Wiki</a>: A sample wiki for a club or makerspace: pages, links and how-tos, ready to fill in and make your own.</li>
<li><a href="share/apps/code-editor/">Code Editor</a>: Write HTML, CSS and JavaScript and watch your page run next to it, with a console for console.log and errors. Save your project as a .json file and open it again later. The full IDE with Claude Code is in Randis UDS.</li>
<li><a href="share/apps/codex-academy/">Codex Academy</a>: Learn to code, any language: an atlas of 15 realms and about 200 topics, 87 hand-made exercises, 20 arena challenges, 6 guided projects, 8 labs (sorting, Big-O, regex, neural net, pathfinding and more), XP, streaks and certificates. JavaScript runs right here; other languages and the Sage tutor need Randis UDS.</li>
<li><a href="share/apps/discord-bot-design-suite/">Discord Bot Design Suite</a>: Design Discord bots: a wizard to help decide what to build, slash commands and embeds, a large samples section with simple bots to try right away, and export to discord.js or discord.py.</li>
<li><a href="share/apps/forge-rd-suite/">Forge R&amp;D Suite</a>: Take an idea all the way to production in any field: a project wizard with stage gates, starter requirements, risks and standards, plus 25 field suites (mechanical, medical, electronics, firmware, chemistry, construction and more), each with steps, tools and vendors to look at.</li>
<li><a href="share/apps/free-money-finder/">Free Money Finder</a>: Find money you may be owed or can claim: unclaimed property, old refunds and pensions, credits and deductions, grants and incentives for businesses, a tracker with totals, calendar and CSV export, and a scam shield. Not tax or legal advice. The AI grant writer and Ask the AI need Randis UDS.</li>
<li><a href="share/apps/game-emulator-suite/">Game Emulator Suite</a>: Play retro games you own: an offline emulator for 13 systems that runs inside the app, a built-in CHIP-8 emulator, links to the best web emulators (EmulatorJS, v86, PCjs, Infinite Mac, DOS Zone, Internet Archive) and tips per system. No games included; bring your own files.</li>
<li><a href="share/apps/heirloom-boxes/">Heirloom Boxes</a>: R&amp;D for curio boxes, toy boxes and kids&#x27; toolboxes made to be handed down. Design 7 types with a 3D drawing, cut list, board feet, cost, weight, hardware, build steps and a live safety check, plus safety and selling basics (CPSIA, ASTM F963).</li>
<li><a href="share/apps/heirloom-design-lab/">Heirloom Design Lab</a>: Design things built to be handed down: parts, materials, joints, repairability, a live score with a fix list, a wear-over-generations model with a care plan, a hand-down kit, and a benchmark designer to score your designs.</li>
<li><a href="share/apps/heritage/">Heritage</a>: Ancestry and legacy: pedigree, fan, descendant and hourglass trees, profiles with sourced facts, research checks, timelines, a places map with migrations, DNA match estimates, stories and heirlooms. Web research and the AI genealogist need Randis UDS.</li>
<li><a href="share/apps/intelligence-hijacking/">Intelligence Hijacking</a>: Train 8 thinking skills (speed, memory, attention, reasoning and more) with adaptive tasks, track progress with charts and sealed progress certificates, and learn how learning works. Commander Randis guides you as a hologram with his own recorded voice. Test Center, Gyms, Autism suite, tours and a setup wizard. Nothing to install; Mentor AI and voice cloning come with Randis UDS.</li>
<li><a href="share/apps/life-tree/">Life Tree</a>: A life-planning to-do tree: endless nested checkboxes, folding, zoom, drag to move, status, priority, due dates, repeats with streaks, tags, metrics, wiki notes with [[links]], Today, Cards, Wiki and Done views, undo, export and import. The per-item AI chat needs Randis UDS.</li>
<li><a href="share/apps/media-network/">Media Network</a>: Run your own AI media network: a news wire and assignment desk, an AI newsroom for articles, newsletters and threads, a podcast studio, a video and newscast studio with captions, fact-checking against sources, and publishing to Discord, Mastodon, Bluesky, WordPress and more. AI and publishing parts need Randis UDS.</li>
<li><a href="share/apps/mintworks-exchange/">Mintworks Exchange</a>: A play-money exchange simulation: about 45 markets (coins, bullion, gems, tokens, your own coins) with an order book, file NFTs that hold the real file, a DAO market, a creation suite and a trading-card exchange with packs, singles and a binder. No real money.</li>
<li><a href="share/apps/money-lab/">Money Lab</a>: Paper trading and money skills in one place: about 170 simulated markets (stocks, ETFs, bonds, forex, crypto, futures, metals, real estate, collectibles, options), 93 calculators, budgeting, home buying, an 18-course academy, an encyclopedia and a scam center. No real money.</li>
<li><a href="share/apps/music-studio/">Music Studio</a>: Record tracks with built-in synths and drums, and learn piano with lessons that read a real MIDI keyboard if you plug one in. Computer keys work too.</li>
<li><a href="share/apps/notepad/">Notepad</a>: A plain, fast notepad: type, find, wrap or unwrap lines, change the text size, see words and characters. Open a text file from your computer and Save it back as a .txt in your downloads.</li>
<li><a href="share/apps/omnisight-xint-suite/">Omnisight xINT Suite</a>: A lawful open-source research workbench: cases and entities, a pivot launcher for 228 public sources, username, email, header and image labs (EXIF, hashes, ELA), geo and time tools, a link graph, timeline, analysis of competing hypotheses, an evidence locker with hashes and a report builder, plus radio and mesh tools.</li>
<li><a href="share/apps/pdf-maker/">PDF Maker</a>: Make a PDF from your own text and pictures: type or paste, add photos (any picture your browser shows), pick Letter or A4 and a text size, then Make PDF saves it to your downloads. Works with no internet; nothing leaves your computer.</li>
<li><a href="share/apps/publishing-suite/">Publishing Suite</a>: Make one book or thousands: templates, data and puzzle generators, interior layout with embedded fonts, covers with spine and barcode, ISBN blocks, and export to PDF, EPUB, DOCX, ODT, TXT, Markdown, HTML, RTF, FB2, LaTeX and more. Building straight into a folder needs Randis UDS.</li>
<li><a href="share/apps/quak-quak/">Quak Quak</a>: Quak Quak is a rubber duck for talking your problems out. Explain what you&#x27;re stuck on and he listens and asks the next small question, like a real duck on your desk. Spin him, make him quack, breathe fire, and look for the secrets.</li>
<li><a href="share/apps/randis-antivirus/">Randis Antivirus</a>: A plain-language antivirus with its own engine: 40 editable rules, heuristic levels, known-malware hashes, archive and Office/PDF/shortcut checks, Smart/Full/Custom/Deep scans, quarantine, Shield folder watching, processes, startup and network views. The engine runs inside Randis UDS, so in the shop you can look around but not scan.</li>
<li><a href="share/apps/randis-bench-lab/">Randis Bench Lab</a>: Design and run benchmarks: 14 graders, weights, versions, results with 95% ranges, paired compares, a leaderboard, a health check, a sample-size planner and synthetic data generators. Pasted or imported replies work here; running a linked AI needs Randis UDS.</li>
<li><a href="share/apps/randis-office/">Randis Office</a>: An office suite in one page: Randis Writer, Sheets, Slides, Notes, Draw, Database and Planner, each with many documents open as their own tabs. Opens and saves Word (.docx), Excel (.xlsx), CSV and calendar (.ics) files, and prints to PDF. Add office product: describe a new office app and the AI builds it as its own tab (in the shop, with your own Anthropic API key).</li>
<li><a href="share/apps/randis-paint/">Randis Paint</a>: A paint app made by chatting in Randis UDS. It comes with the app, too.</li>
<li><a href="share/apps/randis-sound-forge/">Randis Sound Forge</a>: Make your own royalty-free music and sound. Pick a genre, elevator music included, and press New song; play long-form ambience, design sound effects, turn text into speech, then save songs, loops and effects as WAV files or record a music video. Randy&#x27;s songs from it are in the Jukebox.</li>
<li><a href="share/apps/repo-scout/">Repo Scout</a>: Finds tools and ideas on GitHub, GitLab, Codeberg, Hugging Face Spaces, Show HN and npm, ranks them by fit, stars, activity and license, reads READMEs and suggests Clone, Use, Fork, Integrate, Watch, Study or Ignore with checkboxes. The searching and cloning run inside Randis UDS, so in the shop you can look around but not search.</li>
<li><a href="share/apps/service-member-helper/">Service Member Helper</a>: For service members, veterans and families: 36 plain guides (pay, TSP, VA loan, GI Bill, TRICARE, PCS, DD214 and more), help lines, TSP and VA loan calculators, a transition timeline, document checklist with expiry alerts and a gear list. Not official military advice. Ask the AI needs Randis UDS.</li>
<li><a href="share/apps/shop-studio/">Shop Studio</a>: Make and run your own shop like this one: sign in to GitHub, make a shop from the Shop Kit, put your tabs on its shelves, send songs to its Jukebox, change its look, publish and watch it go live. The GitHub parts need Randis UDS; in the shop you can look around.</li>
<li><a href="share/apps/sing-in-my-voice/">Sing in My Voice</a>: A step-by-step guide to making Randis Sound Forge songs sung in your own voice (RVC): checks, a built-in recorder with reading and singing scripts, training, and the messages to send Claude in a Randis UDS chat.</li>
<li><a href="share/apps/templeos/">TempleOS</a>: Run the real TempleOS 5.03 (public domain, by Terry A. Davis) in a sandboxed virtual PC with no network and no access to your files. Boot the live CD or install to the tab&#x27;s own small virtual drive. The virtual PC runs in Randis UDS (it uses QEMU).</li>
<li><a href="share/apps/the-dispatch/">The Dispatch</a>: A sample newsletter page for a club: long reads, desk cards, money and events, read as cards or as a magazine. Every story is made up, ready to make your own.</li>
<li><a href="share/apps/vm-suite/">VM Suite</a>: Make many real PCs shown live in a tab, from a catalog of free systems (TempleOS, Tiny Core, SliTaz, Alpine, FreeDOS, ReactOS) or your own disc image, with memory, processors, drive size and Speed boost per machine. Running machines needs Randis UDS; in the shop you can look around.</li>
<li><a href="share/apps/voice-forge/">Voice Forge</a>: A voice design suite with its own speech engine (no internet, no recordings): 40 controls, a 14-effect rack, 32 presets, describe-a-voice, morph and A/B, text tags for emphasis, pauses, whispers and singing, and lip-sync visemes.</li>
<li><a href="share/apps/vr-avatar-designer/">VR Avatar Designer</a>: Design a rigged 3D avatar: body sliders and types, 13 presets (furry, dragon, robot, slime, chibi and more), face shape keys for blinking and lip-sync, ears, horns, hair, tails and wings with spring bones, then export it for VR apps.</li>
<li><a href="share/apps/vtuber-studio/">VTuber Studio</a>: Design, rig and stream your own original VTuber: build the avatar, set faces on keys 1-0, talk with Space, stage-only mode for streaming, and fun extras like throwing things and bonking the head. Camera, voice and saving parts need Randis UDS.</li>
<li><a href="share/apps/weather/">Weather</a>: Weather for any place: now, the next 24 hours and 7 days, with feels-like, wind, rain chance, sunrise and air quality. Save a few places and switch °F/°C. Free Open-Meteo forecasts, no account or key. Radar and marine open as links (the full panels are in Randis UDS).</li>
<li><a href="share/apps/wiki-suite/">Wiki Suite</a>: A wiki workspace: linked pages and templates, with their own suites for books, media and meta pages, and export and import.</li>
<li><a href="share/music/distant-cellar/">Distant Cellar</a> (Deep House): Four-on-the-floor drums, a sawtooth bass and a square lead over sawtooth pads: a dark deep house song at 122 BPM in A minor, 1:11 long across 7 sections.</li>
<li><a href="share/music/furious-ruins/">Furious Ruins</a> (Minimal Techno): Four-on-the-floor drums, a sawtooth bass and a sawtooth lead over sawtooth pads: a dark minimal techno song at 136 BPM in A minor, 1:25 long across 8 sections.</li>

<li><a href="share/music/rusted-cathedral/">Rusted Cathedral</a> (Progressive House): Four-on-the-floor drums, a sawtooth bass and a square lead over sawtooth pads: a dark progressive house song at 124 BPM in A minor, 1:10 long across 7 sections.</li>
<li><a href="share/music/shadow-labyrinth/">Shadow Labyrinth</a> (Tech House): A dark Tech House song in A minor at 127 BPM: four-on-the-floor drums, a sawtooth bass and a square lead over sawtooth pads. 7 sections, 1:08 long.</li>
<li><a href="share/music/winter-furnace-no-5/">Winter Furnace No. 5</a> (Lo-fi House): Boom drums, a sawtooth bass and a sine lead over epiano pads: a dark lo-fi house song at 78 BPM in A minor, 2:28 long across 8 sections.</li>
<li><a href="share/music/winter-wolves/">Winter Wolves</a> (Vaporwave): 2:42 of dark Vaporwave at 71 BPM, in A minor. Boom drums, a sawtooth bass and a sawtooth lead over supersaw pads.</li>
