<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Player</title>
</head>
<body>
<script>
// WebRTC can talk to any server and the rules above can't stop it, so it's taken away before the page runs.
Object.getOwnPropertyNames(window).filter(function (k) { return /^(webkit)?RTC/.test(k); }).forEach(function (k) {
  try { Object.defineProperty(window, k, { value: undefined, writable: false, configurable: false }); } catch (e) {}
});
// Runs in a walled-off frame. The shop hands over one page; the rules above stay in force for it and block ordinary loads from the internet.
addEventListener("message", function take(e) {
  if (e.source !== parent || typeof e.data !== "string") return;
  removeEventListener("message", take);
  document.open(); document.write(e.data); document.close();
});
parent.postMessage("player-ready", "*");
</script>
</body>
</html>
