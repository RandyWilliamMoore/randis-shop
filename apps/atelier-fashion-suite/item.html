<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Atelier: Fashion Design Suite</title>
<!-- Randis UDS™ by Randy Moore. Original: https://github.com/RandyWilliamMoore/randis-uds · Support: https://ko-fi.com/moorescombinatoricsmatrix -->
<style>
:root{--bg:#f6f1ea;--bg2:#fffdf9;--bg3:#efe7dc;--line:#d9cdbd;--tx:#1d1a17;--mut:#776c60;--acc:#a8452f;--acc2:#2f5d62;--card:#fffdf9;--good:#2e7d4f;--warn:#b7791f;--bad:#b23a3a;--serif:"Didot","Bodoni 72","Bodoni MT","Playfair Display",Georgia,serif}
body[data-theme=dark]{--bg:#141210;--bg2:#1c1916;--bg3:#27231f;--line:#3d3630;--tx:#f2ebe2;--mut:#a89c8e;--acc:#e07a5f;--acc2:#81b29a;--card:#1f1b18}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
h2{font:400 26px/1.15 var(--serif);margin:0 0 4px;letter-spacing:.01em}
h3{font:600 15px/1.3 var(--serif);margin:4px 0 8px;color:var(--acc)}
h4{margin:12px 0 6px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
p{margin:6px 0}
.lead{color:var(--mut);margin:0 0 12px;max-width:900px}
code,pre,.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
pre{background:var(--bg3);border-radius:6px;padding:10px;overflow:auto;white-space:pre-wrap;margin:6px 0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:4px 7px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox],input[type=range]{accent-color:var(--acc)}
input[type=color]{padding:0;width:34px;height:28px;border-radius:4px;cursor:pointer}
textarea{width:100%;resize:vertical;min-height:60px}
button{cursor:pointer;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:5px 11px}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--tx);color:var(--bg2);border-color:var(--tx)}
button.pri:hover{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:2px 8px;font-size:12px}
button.x{background:none;border:none;color:var(--mut);padding:2px 6px}
button.x:hover{color:var(--bad)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#top{display:flex;align-items:center;gap:14px;padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
#top .brand{font:400 21px var(--serif);letter-spacing:.18em;text-transform:uppercase}
#top .brand i{font-style:normal;color:var(--acc)}
#top .who{font-size:12px;color:var(--mut)}
#top .credit{font-size:11px;color:var(--mut);margin-left:auto;text-align:right}
#top .credit a{color:var(--mut)}
#main{flex:1;display:flex;min-height:0}
#nav{width:218px;background:var(--bg2);border-right:1px solid var(--line);overflow:auto;padding:6px 0 30px;flex-shrink:0}
#nav .g{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);padding:12px 16px 3px}
#nav a{display:flex;gap:8px;align-items:center;padding:4px 16px;cursor:pointer;color:var(--tx);text-decoration:none;font-size:13px;border-left:3px solid transparent}
#nav a:hover{background:var(--bg3)}
#nav a.cur{border-left-color:var(--acc);background:var(--bg3);font-weight:600}
#nav a span{width:18px;text-align:center}
#view{flex:1;overflow:auto;padding:18px 24px 60px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.grid.lg{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.two{display:grid;gap:16px;grid-template-columns:minmax(300px,380px) 1fr}
.half{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:1100px){.two,.half{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--acc)}
.card h3{margin-top:0}
.mut{color:var(--mut)}.sm{font-size:12px}.tiny{font-size:11px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;border:1px solid var(--line);font-size:11px;margin:1px 2px 1px 0;background:var(--bg3)}
.pill.a{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:4px 0 14px;flex-wrap:wrap}
.tabs b{padding:6px 14px;cursor:pointer;font-weight:400;border-bottom:2px solid transparent;font-size:13px}
.tabs b.cur{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
td input,td select{width:100%}
td input.n{width:80px}
.lnk{color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:var(--acc2)}
label.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut)}
label.f input,label.f select,label.f textarea{color:var(--tx);font-size:13.5px}
.fields{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:8px 0}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.kpi b{display:block;font:400 22px var(--serif)}
.kpi span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.sw{display:inline-block;width:26px;height:26px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:middle;cursor:pointer}
.swbig{height:70px;border-radius:4px;display:flex;align-items:flex-end;padding:4px 6px;font-size:11px;cursor:pointer}
.bar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.ai{border:1px dashed var(--acc);border-radius:6px;padding:10px 12px;margin:10px 0;background:var(--bg2)}
.ai .out{white-space:pre-wrap;margin-top:8px;max-height:460px;overflow:auto;font-size:13px}
.note{background:var(--bg3);border-left:3px solid var(--acc2);padding:8px 12px;border-radius:4px;margin:8px 0;font-size:13px}
.warnbox{background:rgba(183,121,31,.12);border-left:3px solid var(--warn);padding:8px 12px;border-radius:4px;margin:8px 0;font-size:13px}
.svgbox{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:auto}
.svgbox svg{display:block}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg2);padding:8px 16px;border-radius:4px;display:none;z-index:99;max-width:80%;font-size:13px}
.check{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.check input{margin-top:3px}
.check.done span{text-decoration:line-through;color:var(--mut)}
.board{position:relative;background:#fff;border:1px solid var(--line);overflow:hidden;border-radius:4px}
.board .it{position:absolute;cursor:move;user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.board .it.sel{outline:2px solid var(--acc)}
.board .it img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.board .it .rz{position:absolute;right:-6px;bottom:-6px;width:13px;height:13px;background:var(--acc);border-radius:50%;cursor:nwse-resize}
.board .it.txt{box-shadow:none;padding:4px;font:400 20px var(--serif);color:#222;overflow:hidden}
canvas{display:block}
.dz{border:2px dashed var(--line);padding:14px;text-align:center;color:var(--mut);border-radius:6px;cursor:pointer}
.gantt{position:relative;font-size:12px}
.gantt .gr{display:flex;align-items:center;height:24px}
.gantt .gl{width:220px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .gt{flex:1;position:relative;height:16px;background:var(--bg3);border-radius:3px}
.gantt .gt i{position:absolute;top:0;height:16px;background:var(--acc2);border-radius:3px}
.gantt .gt i.m{background:var(--acc)}
.stage{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;margin:1px;border:1px solid var(--line);cursor:pointer}
.stage.d{background:var(--good);color:#fff;border-color:var(--good)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:10px;overflow:auto}
.kan>div{background:var(--bg3);border-radius:6px;padding:8px;min-height:120px}
.kan .kc{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin:6px 0;font-size:12.5px}
.big{font:400 40px/1.1 var(--serif)}
.hero{background:linear-gradient(120deg,var(--bg3),var(--bg2));border:1px solid var(--line);border-radius:8px;padding:22px 26px;margin-bottom:16px}
.idea{font:400 20px/1.35 var(--serif)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{background:var(--card);border:1px solid var(--line);border-radius:4px;min-height:74px;padding:3px 5px;font-size:11px}
.cal div.o{opacity:.4}
.cal .p{background:var(--bg3);border-radius:3px;padding:1px 4px;margin-top:2px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media print{#nav,#top{display:none}#view{overflow:visible}}
</style>
</head>
<body>
<div id="top">
  <div class="brand">Atel<i>i</i>er</div>
  <div class="who" id="who"></div>
  <div class="credit">Randis UDS™ by Randy Moore · <a href="#" data-url="https://github.com/RandyWilliamMoore/randis-uds">Original</a> · <a href="#" data-url="https://ko-fi.com/moorescombinatoricsmatrix">Support</a><br><span id="saved"></span></div>
</div>
<div id="main"><nav id="nav"></nav><div id="view"></div></div>
<div id="toast"></div>
<script>
/* Randis UDS™ by Randy Moore. Original: https://github.com/RandyWilliamMoore/randis-uds · Support: https://ko-fi.com/moorescombinatoricsmatrix */
"use strict";
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const inApp = window.parent !== window;
const tell = m => { try { window.parent.postMessage(m, "*"); } catch (e) {} };
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100, r1 = n => Math.round(n * 10) / 10;
const money = (n, d) => (n < 0 ? "-" : "") + "$" + Math.abs(+n || 0).toLocaleString(undefined, { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d });
const pct = n => (isFinite(n) ? Math.round(n * 1000) / 10 : 0) + "%";
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let toastT; function toast(t, ms) { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => e.style.display = "none", ms || 3200); }

/* ---------- links ---------- */
let WEB_ON = false;
function openLink(url) {
  if (!inApp) { window.open(url, "_blank", "noopener"); return; }
  if (WEB_ON) { tell({ uds: "web-pop", url }); return; }
  try { navigator.clipboard.writeText(url); toast("Link copied: paste it into your browser. (Tick 'Web view' above this tab to open links straight from here.)", 5000); }
  catch (e) { prompt("Copy this link:", url); }
}
const L = (label, url) => `<span class="lnk" data-url="${esc(url)}">${esc(label)} ↗</span>`;
const G = q => "https://www.google.com/search?q=" + encodeURIComponent(q);

/* ---------- saving ---------- */
const KEY = "uds-atelier";
let S, loaded = false, useLocal = true, saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    const data = { atelier: S };
    if (inApp && !useLocal) tell({ uds: "store-set", data });
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    const kb = Math.round(JSON.stringify(data).length / 1024);
    const el = $("#saved"); if (el) el.textContent = `Saved · ${kb} KB of 1024 KB used`;
    if (kb > 900) toast("Storage is nearly full: export a backup in Settings and remove some images.", 6000);
  }, 400);
}
function readLocal() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } }
function getP(path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), S); }
function setP(path, val) { const p = path.split("."); let o = S; while (p.length > 1) { const k = p.shift(); if (o[k] == null) o[k] = {}; o = o[k]; } o[p[0]] = val; }
function download(name, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: type || "text/plain" });
  if (inApp) { tell({ uds: "export-file", name, data: blob }); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const csvCell = c => `"${String(c == null ? "" : c).replace(/"/g, '""')}"`;
const toCSV = rows => rows.map(r => r.map(csvCell).join(",")).join("\r\n");

/* ---------- images: kept small so the 1 MB store lasts ---------- */
function shrinkImage(file, max, q) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, (max || 520) / Math.max(im.width, im.height)); const c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", q || 0.72)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function pickFile(accept, multi) {
  return new Promise(res => { const i = document.createElement("input"); i.type = "file"; i.accept = accept || "*/*"; i.multiple = !!multi; i.onchange = () => res([...i.files]); i.click(); });
}

/* ---------- AI (the linked LLM through the app's planner-ask bridge) ---------- */
const AIS = {};      // key -> {id,status,text,err}
function brandContext() {
  const b = S.brand;
  return `You are the in-house creative director, technical designer, merchandiser and business mentor inside "Atelier", a fashion design suite. Today is ${new Date().toDateString()}. Be concrete, practical and honest (costs, risks, ethics, laws). Use plain words and short sections. When you name real shops, platforms or programs, say the person should check current terms.
Brand: ${b.name || "(no name yet)"}${b.tagline ? " — " + b.tagline : ""}. Business model: ${(MODELS.find(m => m.id === S.path.model) || {}).name || "?"}. Audience: ${b.audience || "?"}. Values: ${b.values || "?"}. Voice: ${b.voice || "?"}. Aesthetic: ${b.aesthetic || "?"}. Price level: ${b.price || "?"}. Country: ${b.country || "?"}.
Styles in the line: ${S.styles.map(s => `${s.code} ${s.name} (${s.category}, ${s.fabric || "fabric?"}, retail ${s.price && s.price.retail ? "$" + s.price.retail : "?"})`).join("; ") || "none yet"}.`;
}
function ask(key, prompt, extra) {
  if (!prompt || !String(prompt).trim()) return toast("Type something to ask first.");
  if (!inApp) { AIS[key] = { status: "", text: "", err: "The AI works inside Randis UDS (link an AI with the LLM button)." }; render(); return; }
  const id = "at-" + uid(); AIS[key] = { id, status: "Asking…", text: "" }; render();
  tell({ uds: "planner-ask", id, history: [{ role: "user", content: String(prompt) }], context: brandContext() + (extra ? "\n" + extra : "") });
}
function aiBox(key, presets, ph) {
  const a = AIS[key] || {}; const q = (MEM.aiq && MEM.aiq[key]) || "";
  return `<div class="ai"><div class="row"><b>✦ AI</b><span class="mut sm">uses the AI linked in Randis UDS</span></div>
  ${presets && presets.length ? `<div class="row" style="margin-top:6px">${presets.map((p, i) => `<button class="sm" data-a="aiPreset" data-v="${key}|${i}">${esc(p[0])}</button>`).join("")}</div>` : ""}
  <div class="row" style="margin-top:6px"><textarea id="aiq-${key}" rows="2" placeholder="${esc(ph || "Ask anything…")}" style="flex:1;min-height:40px">${esc(q)}</textarea><button class="pri" data-a="aiAsk" data-v="${key}">Ask</button></div>
  ${a.status || a.text || a.err ? `<div class="out">${a.err ? `<span class="bad">${esc(a.err)}</span>` : ""}${a.status && !a.text ? `<i class="mut">${esc(a.status)}</i>` : ""}${esc(a.text || "")}</div>
  ${a.text && a.done ? `<div class="row" style="margin-top:6px"><button class="sm" data-a="aiCopy" data-v="${key}">Copy</button><button class="sm" data-a="aiNote" data-v="${key}">Save to Notes</button></div>` : ""}` : ""}</div>`;
}
const AIPRE = {};    // key -> presets list (set when a page renders its box)
function aiP(key, presets, ph) { AIPRE[key] = presets || []; return aiBox(key, presets, ph); }

const MEM = { aiq: {}, sub: {} };   // things that don't need saving
function subTabs(page, list) {
  const cur = MEM.sub[page] || list[0][0];
  return { cur, html: `<div class="tabs">${list.map(([k, l]) => `<b class="${k === cur ? "cur" : ""}" data-a="sub" data-v="${page}|${k}">${l}</b>`).join("")}</div>` };
}
const F = (label, path, opt) => {           // a bound field
  opt = opt || {}; const v = getP(path); const t = opt.type || "text";
  if (t === "select") return `<label class="f">${label}<select data-b="${path}"${opt.rr ? " data-rr" : ""}>${opt.opts.map(o => { const [k, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(k)}"${String(v) === String(k) ? " selected" : ""}>${esc(l)}</option>`; }).join("")}</select></label>`;
  if (t === "area") return `<label class="f" style="grid-column:1/-1">${label}<textarea data-b="${path}" rows="${opt.rows || 3}"${opt.rr ? " data-rr" : ""} placeholder="${esc(opt.ph || "")}">${esc(v == null ? "" : v)}</textarea></label>`;
  return `<label class="f">${label}<input type="${t}" data-b="${path}"${opt.rr ? " data-rr" : ""} value="${esc(v == null ? "" : v)}" placeholder="${esc(opt.ph || "")}"${opt.step ? ` step="${opt.step}"` : ""}></label>`;
};

/* ================= LIBRARIES ================= */

/* The spectrum of ways to run a fashion business, slow to throwaway */
const MODELS = [
  { id: "bespoke", name: "Bespoke & couture", speed: 1, lead: "4–12 weeks per piece", moq: "1", margin: "60–80% (high labour)", cash: "Low stock risk, deposits up front",
    pros: "No waste, highest prices, deep client loyalty", cons: "Doesn't scale; your hours are the limit", eth: "Lowest impact per wear; fair pay is in your hands",
    how: "Fittings with a toile, made-to-measure pattern per client, deposits of 50%, a small atelier or your own studio." },
  { id: "mto", name: "Made-to-order / pre-order", speed: 2, lead: "2–6 weeks after order", moq: "1–30 per style", margin: "55–75%", cash: "Customers pay first: cash funds production",
    pros: "Almost no dead stock, test demand before buying fabric", cons: "Customers wait; needs clear messaging", eth: "Very low waste",
    how: "Show samples, take orders for a window (e.g. 2 weeks), batch-cut, ship. Use Shopify pre-order apps or a crowdfunding page." },
  { id: "slow", name: "Slow fashion / small-batch", speed: 3, lead: "2–4 collections a year", moq: "30–150 per style", margin: "60–70% DTC", cash: "Moderate stock risk",
    pros: "Quality story, loyal community, local factories", cons: "Higher unit cost, slower growth", eth: "Durable, repairable, often local",
    how: "Small runs with local or ethical cut-make-trim (CMT) factories, timeless styles, restocks of best-sellers." },
  { id: "upcycle", name: "Upcycled, deadstock & vintage rework", speed: 3, lead: "Per batch of materials", moq: "1-of-1 to 50", margin: "50–80%", cash: "Low material cost, high labour",
    pros: "Strong sustainability story, unique pieces", cons: "Hard to repeat sizes and fabrics", eth: "Diverts waste",
    how: "Buy deadstock rolls, vintage by the pound, or brand surplus; design around what you find; photograph each unique piece." },
  { id: "circular", name: "Rental, resale & repair", speed: 2, lead: "Ongoing", moq: "n/a", margin: "Varies (service-based)", cash: "Inventory is an asset you rent out many times",
    pros: "Recurring income, extends life of pieces", cons: "Logistics, cleaning, wear tracking", eth: "Circular by design",
    how: "Offer take-back, resale of your own pieces (Trove/Archive-style shops), rental for occasion wear, repair services." },
  { id: "rtw", name: "Ready-to-wear seasonal", speed: 5, lead: "SS & AW, 6–12 months ahead", moq: "100–500 per style", margin: "Wholesale 50%, DTC 65–75%", cash: "Big upfront spend before season",
    pros: "Fits how stores buy; trade shows and showrooms", cons: "Cash-heavy, markdown risk", eth: "Depends on factories and volumes",
    how: "Design → samples → show line sheet to buyers 6 months before delivery → produce against orders + some stock." },
  { id: "drop", name: "Drops & streetwear", speed: 6, lead: "Monthly or random drops", moq: "50–300 per style", margin: "60–80% DTC", cash: "Sell-outs fund the next drop",
    pros: "Hype, community, limited runs avoid overstock", cons: "Needs constant content, can feel exclusive", eth: "Limited runs reduce waste",

function hexToRgb(h) { h = String(h || "#000").replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rgbToHex = (r, g, b) => "#" + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, "0")).join("");
function rgbToHsl(r, g, b) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2; if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; } return [h, s * 100, l * 100]; }
function hslToHex(h, s, l) { h = ((h % 360) + 360) % 360; s = clamp(s, 0, 100) / 100; l = clamp(l, 0, 100) / 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)); return rgbToHex(f(0) * 255, f(8) * 255, f(4) * 255); }
function lum(hex) { const c = hexToRgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }

  ${P.block === "gathered" ? F("Tiers", "pat.tiers", { type: "number", rr: true }) + F("Gather ratio", "pat.gather", { type: "number", step: .1, rr: true }) : ""}${P.block === "trousers" ? F("Hem circumference", "pat.hemC", { type: "number", rr: true }) : ""}${P.block === "tee" ? F("Sleeve length", "pat.sleeveLen", { type: "number", rr: true }) : ""}</div>

  <div><div class="row" style="margin-bottom:6px"><span class="sm mut">Zoom</span><input type="range" min="2" max="9" step="0.5" value="${k}" id="pzoom"><span class="sm">${sizeLabel()}</span>${grades ? chart.sizes.map((z, i) => `<span class="pill" style="border-color:${SIZE_COLS[i % 6]};color:${SIZE_COLS[i % 6]}">${z}</span>`).join("") : ""}</div>

  ${aiP("pattern", [["Fit problems", "I made a toile from a " + P.block + " block. Ask me what I see (wrinkles, pulling, gaping), then tell me which pattern adjustment fixes each one."], ["Turn the block into my style", "Explain step by step how to turn a " + P.block + " block into this style: " + JSON.stringify((curStyleObj() || {}).flat || {}) + " (dart manipulation, adding fullness, facings, closures)."], ["Sewing order", "Give me a sewing order for a garment made from the " + P.block + " block, with seam finishes for " + ((curStyleObj() || {}).fabric || "cotton") + "."]])}</div></div>`;

ACT.rectAdd = () => { S.pat.rects = S.pat.rects || []; S.pat.rects.push({ name: "Pocket", w: 18, h: 20, cut: "Cut 2" }); save(); render(); };

/* PDF writer: pages of vector lines and text (Helvetica), in cm */
function pdfDoc(pages, wCm, hCm) {
  const pt = 72 / 2.54, W = (wCm * pt).toFixed(2), H = (hCm * pt).toFixed(2), objs = [];
  const add = s => { objs.push(s); return objs.length; };
  const catalog = add(""), pagesObj = add(""), font = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"), kids = [];
  for (const ops of pages) { const content = ops.join("\n"); const cs = add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`); kids.push(add(`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${cs} 0 R >>`)); }
  objs[catalog - 1] = `<< /Type /Catalog /Pages ${pagesObj} 0 R >>`; objs[pagesObj - 1] = `<< /Type /Pages /Kids [${kids.map(k => k + " 0 R").join(" ")}] /Count ${kids.length} >>`;
  let out = "%PDF-1.4\n", offs = []; objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length; out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("") + `trailer\n<< /Size ${objs.length + 1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return out;
}
function pdfOps(set, ox, oy, hCm) {    // draw the pattern with page offset (cm) → PDF ops (pt, y up)
  const pt = 72 / 2.54, X = x => ((x - ox) * pt).toFixed(2), Y = y => ((hCm - (y - oy)) * pt).toFixed(2), ops = [];
  const poly = (pc, P, close) => { ops.push(P.map((p, i) => `${X(p[0] + pc.dx)} ${Y(p[1] + pc.dy)} ${i ? "l" : "m"}`).join(" ") + (close ? " h S" : " S")); };
  const txt = (s, x, y, size) => ops.push(`BT /F1 ${size} Tf ${X(x)} ${Y(y)} Td (${String(s).replace(/[^\x20-\x7e]/g, "").replace(/[()\\]/g, "\\$&")}) Tj ET`);
  for (const pc of set.pcs) {
    ops.push("0 0 0 RG 0.8 w []0 d"); poly(pc, pc.cutPts, true);
    ops.push("0.35 0.35 0.35 RG 0.5 w [4 3]0 d"); poly(pc, pc.pts, true); ops.push("[]0 d 0 0 0 RG 0.6 w");
    for (const l of pc.lines || []) poly(pc, l, false);
    poly(pc, pc.grain, false);
    const bb = bbox(pc.pts), cx = bb.x0 + bb.w / 2 + pc.dx - 3, cy = bb.y0 + Math.min(bb.h * .3, 20) + pc.dy;
    txt(pc.name, cx, cy, 11); txt(pc.cut, cx, cy + .6, 8); txt((S.brand.name || "") + " " + sizeLabel() + " SA " + S.pat.sa + "cm", cx, cy + 1.1, 7);
    (pc.notes || []).filter(Boolean).forEach((n, i) => txt(n, cx, cy + 1.6 + i * .45, 6.5));
    for (const nt of pc.notch || []) { const x = nt[0] + pc.dx, y = nt[1] + pc.dy; ops.push(`${X(x - .2)} ${Y(y)} m ${X(x + .2)} ${Y(y)} l S ${X(x)} ${Y(y - .2)} m ${X(x)} ${Y(y + .2)} l S`); }
    if (pc.fold != null) txt("PLACE ON FOLD", pc.fold + pc.dx + .3, bb.y0 + bb.h / 2 + pc.dy, 8);
  }
  return ops;
}
ACT.pdfFull = () => { const set = patternSet(), w = set.w + 4, h = set.h + 4; const ops = pdfOps(set, -2, -2, h); download(`pattern-${S.pat.block}-${sizeLabel().replace(/\W+/g, "_")}-fullsize.pdf`, pdfDoc([ops], w, h), "application/pdf"); toast("Full-size PDF: print at 100% on a wide-format printer or at a copy shop."); };
ACT.pdfTiled = () => {
  const set = patternSet(), paper = ($("#pgPaper") || {}).value === "a4" ? [21, 29.7] : [21.59, 27.94], mg = 1, pw = paper[0] - 2 * mg, ph = paper[1] - 2 * mg, W = set.w + 2, H = set.h + 2, cols = Math.ceil(W / pw), rows = Math.ceil(H / ph), pt = 72 / 2.54, pages = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const ox = c * pw - mg - 1, oy = r * ph - mg - 1, ops = pdfOps(set, ox, oy, paper[1]);
    const X = x => (x * pt).toFixed(2), Y = y => ((paper[1] - y) * pt).toFixed(2);
    ops.push("0.6 0.6 0.6 RG 0.4 w [2 2]0 d", `${X(mg)} ${Y(mg)} m ${X(mg + pw)} ${Y(mg)} l ${X(mg + pw)} ${Y(mg + ph)} l ${X(mg)} ${Y(mg + ph)} l h S`, "[]0 d 0 0 0 RG");
    const lab = String.fromCharCode(65 + r) + (c + 1); ops.push(`BT /F1 9 Tf ${X(mg + .2)} ${Y(mg + .5)} Td (Page ${lab}  - row ${r + 1}/${rows}, column ${c + 1}/${cols}. Trim on the grey line, overlap and tape.) Tj ET`);
    if (r === 0 && c === 0) { ops.push("0.8 w", `${X(2)} ${Y(3)} m ${X(7)} ${Y(3)} l ${X(7)} ${Y(8)} l ${X(2)} ${Y(8)} l h S`, `BT /F1 8 Tf ${X(2.2)} ${Y(5.5)} Td (5 cm test square) Tj ET`, `${X(8)} ${Y(3)} m ${X(13.08)} ${Y(3)} l ${X(13.08)} ${Y(8.08)} l ${X(8)} ${Y(8.08)} l h S`, `BT /F1 8 Tf ${X(8.2)} ${Y(5.5)} Td (2 inch test square) Tj ET`); }
    for (const [x, y] of [[mg, mg + ph / 2], [mg + pw, mg + ph / 2], [mg + pw / 2, mg], [mg + pw / 2, mg + ph]]) ops.push(`${X(x - .4)} ${Y(y)} m ${X(x + .4)} ${Y(y)} l S ${X(x)} ${Y(y - .4)} m ${X(x)} ${Y(y + .4)} l S`);
    pages.push(ops);
  }
  download(`pattern-${S.pat.block}-${sizeLabel().replace(/\W+/g, "_")}-tiled.pdf`, pdfDoc(pages, paper[0], paper[1]), "application/pdf");
  toast(`${pages.length} pages (${rows} rows × ${cols} columns). Print at 100%.`, 5000);
};
ACT.patSvg = () => { const set = patternSet(), w = set.w + 4, h = set.h + 4; download(`pattern-${S.pat.block}.svg`, `<svg xmlns="http://www.w3.org/2000/svg" width="${w}cm" height="${h}cm" viewBox="0 0 ${w * 10} ${h * 10}"><g transform="translate(20,20)">${patternSVG(set, 10, { print: true, sizeLabel: sizeLabel() })}</g></svg>`, "image/svg+xml"); };
ACT.patDxf = () => {
  const set = patternSet(), mm = v => (v * 10).toFixed(2); let d = "0\nSECTION\n2\nHEADER\n9\n$INSUNITS\n70\n4\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n";
  const pl = (pc, P, layer, close) => { d += `0\nPOLYLINE\n8\n${layer}\n66\n1\n70\n${close ? 1 : 0}\n`; for (const p of P) d += `0\nVERTEX\n8\n${layer}\n10\n${mm(p[0] + pc.dx)}\n20\n${mm(-(p[1] + pc.dy))}\n`; d += "0\nSEQEND\n"; };
  for (const pc of set.pcs) { pl(pc, pc.cutPts, "CUT", true); pl(pc, pc.pts, "SEAM", true); (pc.lines || []).forEach(l => pl(pc, l, "INTERNAL", false)); pl(pc, pc.grain, "GRAIN", false); const bb = bbox(pc.pts); d += `0\nTEXT\n8\nTEXT\n10\n${mm(bb.x0 + pc.dx + 2)}\n20\n${mm(-(bb.y0 + pc.dy + 6))}\n40\n10\n1\n${(pc.name + " - " + pc.cut + " - " + sizeLabel()).replace(/[^\x20-\x7e]/g, "")}\n`; }
  d += "0\nENDSEC\n0\nEOF\n"; download(`pattern-${S.pat.block}.dxf`, d, "application/dxf"); toast("DXF in millimetres, layers CUT / SEAM / INTERNAL / GRAIN / TEXT.");
};

/* ---------- MARKER (fabric layout & yardage) ---------- */
function unfold(pc, P) { if (pc.fold == null) return P; const f = pc.fold; return P.concat(P.map(([x, y]) => [2 * f - x, y]).reverse()); }
PAGES.marker = () => {
  const M = S.marker, set = patternSet(), qty = p => /Cut 2/.test(p.cut) ? 2 : 1;
  const ratio = String(M.ratio || "1").split(/[,: ]+/).map(num).filter(x => x > 0), garments = ratio.reduce((a, b) => a + b, 0) || 1;
  const items = []; set.pcs.forEach(pc => { const P = unfold(pc, pc.cutPts), bb = bbox(P), n = qty(pc) * garments; for (let i = 0; i < n; i++) items.push({ pc, P, bb, area: Math.abs(areaOf(P)) }); });
  const FW = num(M.width) - 2 * num(M.selv || 1); items.sort((a, b) => b.bb.h - a.bb.h);
  // shelf packing: columns along the fabric length; pieces' grain (y) runs along the length
  let x = 0, colW = 0, y = 0; const placed = [], gap = num(M.gap || .5); let tooWide = false;
  for (const it of items) { const w = it.bb.w, h = it.bb.h; if (w > FW) tooWide = true; if (y + w > FW && y > 0) { x += colW + gap; y = 0; colW = 0; } placed.push({ it, x, y }); y += w + gap; colW = Math.max(colW, h); }
  const len = x + colW, used = items.reduce((a, i) => a + i.area, 0), eff = len > 0 ? used / (len * FW) : 0, perG = len / garments;
  const k = Math.min(3, 1000 / Math.max(50, len));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${len * k + 20}" height="${num(M.width) * k + 20}"><rect x="10" y="10" width="${len * k}" height="${num(M.width) * k}" fill="#f3efe0" stroke="#999"/>${placed.map(({ it, x, y }, i) => `<path d="M${it.P.map(([px, py]) => `${(10 + (x + py - it.bb.y0) * k).toFixed(1)},${(10 + (num(M.selv || 1) + y + px - it.bb.x0) * k).toFixed(1)}`).join(" L")} Z" fill="hsl(${(i * 47) % 360} 45% 75%)" stroke="#333" stroke-width=".6"/>`).join("")}</svg>`;
  const yd = len / 91.44, m = len / 100;
  MEM.mkPerG = perG * (1 + num(M.shrink) / 100);
  return `<h2>Marker & yardage</h2><p class="lead">Lays your current pattern pieces on the fabric width to estimate how much fabric you need. Grain runs along the length (selvedge at top and bottom). A factory's CAD marker (Gerber, Lectra, Optitex) will be tighter: treat this as a safe estimate.</p>
  <div class="two"><div class="card"><div class="fields">${F("Fabric width (cm)", "marker.width", { type: "select", opts: [["112", "112 cm / 44 in"], ["140", "140 cm / 54–55 in"], ["150", "150 cm / 59–60 in"], ["160", "160 cm"], ["180", "180 cm (knit tube open)"]], rr: true })}${F("Selvedge to avoid (cm each side)", "marker.selv", { type: "number", rr: true })}${F("Size ratio (e.g. 1:2:2:1)", "marker.ratio", { rr: true })}${F("Gap between pieces (cm)", "marker.gap", { type: "number", step: .1, rr: true })}${F("Shrinkage allowance %", "marker.shrink", { type: "number", rr: true })}</div>
  <p class="sm">Pattern: <b>${esc((BLOCKS.find(b => b[0] === S.pat.block) || [])[1] || "")}</b>, ${esc(sizeLabel())}. ${items.length} pieces for ${garments} garment(s).</p>
  ${tooWide ? `<div class="warnbox">A piece is wider than the usable fabric width: choose wider fabric or add a seam.</div>` : ""}
  <div class="kpi"><div><span>Marker length</span><b>${r2(m * (1 + num(M.shrink) / 100))} m</b></div><div><span>Yards</span><b>${r2(yd * (1 + num(M.shrink) / 100))}</b></div><div><span>Per garment</span><b>${r2(perG / 100 * (1 + num(M.shrink) / 100))} m</b></div><div><span>Efficiency</span><b>${pct(eff)}</b></div></div>
  <p class="tiny mut">Industry markers are typically 75–90% efficient. Add 5–10% for flaws, ends and pattern matching (stripes, plaids, one-way prints).</p>
  ${S.styles.length ? `<button data-a="markerToCost">Use ${r2(perG / 91.44 * (1 + num(M.shrink) / 100) * 1.07)} yd per garment in costing for ${esc((curStyleObj() || {}).code || "")}</button>` : ""}</div>
  <div class="svgbox">${svg}</div></div>`;
};
ACT.markerToCost = () => { const s = curStyleObj(); s.cost.fabricYd = r2((MEM.mkPerG || 0) / 91.44 * 1.07); save(); toast(`Fabric use ${s.cost.fabricYd} yd (incl. 7% for waste) set on ${s.code}.`); go("costing"); };

/* ---------- TECH PACK ---------- */
const POMS = {
  top: [["Body length from HPS", 1, 1], ["Chest width (2.5 cm below armhole)", 1, 2.5], ["Waist width", 1, 2.5], ["Hem width (sweep)", 1, 2.5], ["Across shoulder", .6, 1], ["Sleeve length from shoulder", 1, .5], ["Armhole (straight)", .6, 1], ["Bicep width", .6, .75], ["Sleeve opening", .5, .5], ["Neck width (seam to seam)", .5, .5], ["Front neck drop", .5, .3], ["Back neck drop", .3, 0]],
  bottom: [["Waist (relaxed)", 1, 4], ["Hip (at 18 cm below waist)", 1, 4], ["Front rise", .6, .6], ["Back rise", .6, 1], ["Inseam", 1, 0], ["Thigh width", .6, 1.2], ["Knee width", .5, .8], ["Leg opening", .5, .6], ["Waistband height", .3, 0]],
  dress: [["Length from HPS", 1, 1], ["Bust width", 1, 2.5], ["Waist width", 1, 2.5], ["Hip width", 1, 2.5], ["Hem sweep", 1.5, 4], ["Across shoulder", .6, 1], ["Armhole", .6, 1], ["Sleeve length", 1, .5], ["Neck width", .5, .5], ["Front neck drop", .5, .3]],

PAGES.techpack = () => {

    <div class="row" style="margin-top:6px"><button class="sm" data-a="bomAdd">+ Line</button><button class="sm" data-a="bomStarter">Add a typical starter list for ${esc(s.category)}</button><select id="bomTrim"><option value="">Add a trim type…</option>${TRIMS.map((t2, k) => `<option value="${k}">${esc(t2[0])}</option>`).join("")}</select></div>`;
  } else if (t.cur === "spec") {

/* ---------- COSTING & PRICING ---------- */
function costOf(s) {
  const c = s.cost || {}, bomT = s.bom.filter(b => !/^main fabric$/i.test(b.item)).reduce((a, b) => a + num(b.qty) * num(b.cost), 0);
  const fabric = num(c.fabricYd) * num(c.fabricPrice), mats = fabric + num(c.lining) + (c.useBom === false ? num(c.trims) : bomT), labour = num(c.cmt) + num(c.extra);
  const units = Math.max(1, num(c.units) || num(s.units) || 100), dev = num(c.dev) / units, fob = mats + labour + dev + num(c.pack);
  const freight = num(c.freight), duty = (fob) * num(c.duty) / 100, landed = fob + freight + duty;
  const ws = num(s.price.wholesale) || r2(landed * (num(c.wsMult) || 2.2)), rt = num(s.price.retail) || r2(ws * (num(c.rtMult) || 2.2));
  return { fabric, bomT, mats, labour, dev, fob, freight, duty, landed, ws, rt, units, mWs: ws ? (ws - landed) / ws : 0, mDtc: rt ? (rt - landed - rt * num(c.fees || 6) / 100) / rt : 0, mShop: rt ? (rt - ws) / rt : 0 };
}

  const i = styleIdx(s), c = s.cost, k = costOf(s), P = `styles.${i}.cost.`, n = (l, f, o) => F(l, P + f, Object.assign({ type: "number", step: .01, rr: true }, o || {}));
  const fixed = num(c.fixed), be = k.ws > k.landed ? Math.ceil(fixed / (k.ws - k.landed)) : "—", beD = k.rt * (1 - num(c.fees || 6) / 100) > k.landed ? Math.ceil(fixed / (k.rt * (1 - num(c.fees || 6) / 100) - k.landed)) : "—";

  <div><div class="kpi"><div><span>Materials</span><b>${money(k.mats)}</b></div><div><span>Labour</span><b>${money(k.labour)}</b></div><div><span>Dev / unit</span><b>${money(k.dev)}</b></div><div><span>FOB cost</span><b>${money(k.fob)}</b></div><div><span>Landed cost</span><b>${money(k.landed)}</b></div></div>
  <div class="kpi"><div><span>Wholesale</span><b>${money(k.ws)}</b></div><div><span>Retail</span><b>${money(k.rt)}</b></div><div><span>Your wholesale margin</span><b class="${k.mWs < .45 ? "warn" : "good"}">${pct(k.mWs)}</b></div><div><span>Your DTC margin</span><b class="${k.mDtc < .6 ? "warn" : "good"}">${pct(k.mDtc)}</b></div><div><span>Shop's margin</span><b>${pct(k.mShop)}</b></div></div>

  <h4>What volume does</h4>${tbl(["Units", "Dev per unit", "Landed", "Margin at your wholesale"], [25, 50, 100, 300, 1000].map(u => { const d = num(c.dev) / u, l = k.mats + k.labour + d + num(c.pack) + num(c.freight) + (k.mats + k.labour + d + num(c.pack)) * num(c.duty) / 100; return `<tr><td>${u}</td><td>${money(d)}</td><td>${money(l)}</td><td>${pct((k.ws - l) / (k.ws || 1))}</td></tr>`; }))}

};

/* ---------- LINE PLAN & MERCHANDISING ---------- */

  } else if (t.cur === "crm") {

};

PAGES.finance = () => {
  const Fn = S.fin, months = 12, rows = []; let cash = num(Fn.start), low = cash, lowM = 0;
  for (let m = 0; m < months; m++) {
    const units = Math.round(num(Fn.units) * Math.pow(1 + num(Fn.growth) / 100, m)), rev = units * num(Fn.price), cogs = rev * num(Fn.cogs) / 100, mkt = rev * num(Fn.mkt) / 100 + num(Fn.mktFixed), fees = rev * .04, fixed = num(Fn.fixed);
    const prod = (m === num(Fn.prodMonth) - 1 ? num(Fn.prod) * num(Fn.dep) / 100 : 0) + (m === num(Fn.prodMonth) ? num(Fn.prod) * (1 - num(Fn.dep) / 100) : 0);
    const profit = rev - cogs - mkt - fees - fixed; cash += rev - mkt - fees - fixed - prod - (num(Fn.prod) ? 0 : cogs); if (cash < low) { low = cash; lowM = m + 1; }
    rows.push([m + 1, units, rev, cogs, mkt, fixed, profit, prod, cash]);
  }
  const tot = k => rows.reduce((a, r) => a + r[k], 0);
  return `<h2>Finance</h2><p class="lead">A simple 12-month plan: sales, costs, profit and — most important for fashion — cash, because you pay for stock long before it sells.</p>
  <div class="two"><div class="card"><div class="fields">${[["Starting cash $", "start"], ["Units sold month 1", "units"], ["Monthly growth %", "growth"], ["Average selling price $", "price"], ["Cost of goods % of sales", "cogs"], ["Marketing % of sales", "mkt"], ["Marketing fixed $/mo", "mktFixed"], ["Fixed costs $/mo (rent, software, you)", "fixed"], ["Production run cost $", "prod"], ["Production paid in month", "prodMonth"], ["Deposit % (month before)", "dep"]].map(([l, k]) => F(l, "fin." + k, { type: "number", rr: true })).join("")}</div>
  <p class="tiny mut">If you enter a production run, cost of goods is paid through it (deposit the month before, balance that month); otherwise cost of goods is paid as you sell. Card fees assumed 4%.</p></div>
  <div><div class="kpi"><div><span>12-month sales</span><b>${money(tot(2), 0)}</b></div><div><span>12-month profit</span><b class="${tot(6) < 0 ? "bad" : "good"}">${money(tot(6), 0)}</b></div><div><span>Lowest cash</span><b class="${low < 0 ? "bad" : ""}">${money(low, 0)}</b></div><div><span>In month</span><b>${lowM || "—"}</b></div></div>
  ${low < 0 ? `<div class="warnbox">Cash goes negative in month ${lowM}: you'd need about ${money(-low, 0)} more (savings, pre-orders, a loan, smaller run, or later production).</div>` : ""}
  ${tbl(["Month", "Units", "Sales", "COGS", "Marketing", "Fixed", "Profit", "Production paid", "Cash"], rows.map(r => `<tr>${r.map((c, i) => `<td class="${i === 8 && c < 0 ? "bad" : i === 6 && c < 0 ? "warn" : ""}">${i < 2 ? c : money(c, 0)}</td>`).join("")}</tr>`))}
  <h4>Cash at the end of each month</h4>${hbars(rows.map(r => ["Month " + r[0], Math.max(0, r[8])]), v => money(v, 0))}
  <button class="sm" data-a="finCsv">Export CSV</button></div></div>
  ${aiP("fin", [["Explain my numbers", "Explain my 12-month finance plan in plain words: what's healthy, what's risky, and three changes that improve cash the most."]], "")}`;
};

  } else {
    h += `<div class="card"><h3>Returns policy builder</h3><div class="fields">${F("Return window (days)", "rp.days", { type: "number" })}${F("Who pays return shipping", "rp.ship", { type: "select", opts: ["Free returns", "Customer pays", "Free exchanges, paid returns"] })}${F("Condition", "rp.cond", { ph: "Unworn, tags on" })}${F("Final sale items", "rp.final", { ph: "Sale, made-to-order, swimwear" })}</div><pre id="rpText">${esc(`Returns & exchanges\n\nYou can return or exchange items within ${S.rp.days || 30} days of delivery. Items must be ${S.rp.cond || "unworn, unwashed and with tags attached"}. ${S.rp.ship || "Free exchanges, paid returns"}. ${S.rp.final ? S.rp.final + " are final sale." : ""}\n\nTo start a return, email ${S.brand.email || "[email]"} with your order number. Refunds go back to your original payment within 5–10 days of us receiving the item.\n\nRepairs: we'll fix a seam, button or zip on our pieces for free for the first year — just get in touch.`)}</pre><button class="sm" data-a="copyPre" data-v="rpText">Copy</button></div>
    <div class="note">Offering repairs and resale of your own pieces builds loyalty and is becoming expected (and in France, required info). See Impact → Circularity.</div>`;
  }
  return h;
};
