}

  mndel: el => { S.mesh.nodes.splice(+el.dataset.i, 1); save(); render(); },
  // decentralize
  shmake: async () => {

      MEM.shards = { name: f.name, k, m, files, root, enc: !!enc, manifest: { fmt: "omnisight-manifest/1", set, name: f.name, size: orig.length, sha256: fileSha, k, m, merkle_root: root, encrypted: !!enc, created: new Date().toISOString(), shards: files.map((x, i) => ({ i, file: x.name, sha256: x.hash, role: i < k ? "data" : "parity" })), rebuild: `Any ${k} of these ${n} shard files rebuild the original in Omnisight xINT Suite → Shard Forge → Rebuild.` } };

  },
  shdl: el => { const f = MEM.shards.files[+el.dataset.i]; download(f.name, f.blob); },
  shman: () => download(MEM.shards.name + ".manifest.json", JSON.stringify(MEM.shards.manifest, null, 1)),
  shdlall: () => { const R = MEM.shards; download(R.name + ".shards.zip", makeZip([...R.files.map(f => ({ name: f.name, data: f.bytes })), { name: R.name + ".manifest.json", data: new TextEncoder().encode(JSON.stringify(R.manifest, null, 1)) }])); },
  shrebuild: async () => {
    const fl = MEM.shIn || []; if (!fl.length) return toast("Choose shard files.");

  shsave: () => download(MEM.restored.name, MEM.restored.blob),
  sssplit: () => { const s = val("ss_s"), k = +F("ss_k", "3") | 0, n = +F("ss_n", "5") | 0; if (!s) return toast("Type the secret."); try { MEM.shamir = shamirSplit(new TextEncoder().encode(s), k, n).map(sh => `OMNI-SSS-${k}-${String(sh.x).padStart(3, "0")}-${hex(sh.y)}`); render(); } catch (e) { toast(e.message); } },
  sscopy: () => copy(MEM.shamir.join("\n")),
  ssdl: () => download("secret-shares.zip", makeZip(MEM.shamir.map((s, i) => ({ name: `share-${i + 1}-of-${MEM.shamir.length}.txt`, data: new TextEncoder().encode(s + "\n\nShamir share made with Omnisight xINT Suite (Randis UDS). Combine any " + s.split("-")[2] + " shares in Secret Splitter → Combine.\n") })))),
  sscombine: () => { try { const lines = val("ss_c").split(/\s+/).filter(l => /^OMNI-SSS-\d+-\d+-[0-9a-f]+$/i.test(l)); if (!lines.length) throw new Error("No shares found."); const k = +lines[0].split("-")[2]; if (lines.length < k) throw new Error(`Need ${k} shares, have ${lines.length}.`); const sh = lines.slice(0, k).map(l => { const p = l.split("-"); return { x: +p[3], y: unhex(p[4]) }; }); MEM.ssOut = new TextDecoder().decode(shamirCombine(sh)); } catch (e) { MEM.ssOut = "⚠ " + e.message; } render(); },
  stkdl: () => { const chosen = F("stk", "").split(","); download("docker-compose.yml", `# Generated by Omnisight xINT Suite (Randis UDS). Review every value before running.\nservices:\n${STACK.filter(s => chosen.includes(s.id)).map(s => s.compose).join("\n")}\n`, "text/yaml"); },
  stkenv: () => { const chosen = F("stk", "").split(","); download(".env", STACK.filter(s => chosen.includes(s.id) && s.env).map(s => `# ${s.name}\n${s.env}`).join("\n\n") + "\n", "text/plain"); }
};

document.addEventListener("click", e => {
  const t = e.target;
  const g = t.closest("[data-go]"); if (g) return go(g.dataset.go);
  const sb = t.closest("[data-sub]"); if (sb) { const [p, k] = sb.dataset.sub.split("|"); MEM.sub[p] = k; return render(); }
  const u = t.closest("[data-url]"); if (u) return openLink(u.dataset.url);
  const c = t.closest("[data-copy]"); if (c) return copy(c.dataset.copy);
  const pv = t.closest("[data-pivot]"); if (pv) { MEM.f.pq = S.f.pq = pv.dataset.pivot; MEM.f.pt = pv.dataset.pt || ""; MEM.f.ptlock = pv.dataset.pt ? "1" : ""; return go("pivot"); }
  const ae = t.closest("[data-addent]"); if (ae) return addEntity(ae.dataset.addent, ae.dataset.v);
  const su = t.closest("[data-setuser]"); if (su) { MEM.f.ul_u = S.f.ul_u = su.dataset.setuser; return renderKeep(); }
  const sr = t.closest("[data-src]"); if (sr) { MEM.src = sr.dataset.src; return render(); }
  const aq = t.closest("[data-aiq]"); if (aq) { MEM.f.ai_q = aq.dataset.aiq; return ask(aq.dataset.aiq); }
  const a = t.closest("[data-act]"); if (a && ACT[a.dataset.act]) { e.preventDefault(); ACT[a.dataset.act](a); }
});
function setFromInput(t) {
  const d = t.dataset;
  if (d.f !== undefined && t.id) { MEM.f[t.id] = t.value; if (d.f !== "nosave") S.f[t.id] = t.value; if (t.id === "pq") { MEM.f.ptlock = ""; } if (t.id === "pt") MEM.f.ptlock = "1"; return true; }
  if (d.case) { CASE()[d.case] = t.value; return true; }
  if (d.note !== undefined) { S.notes[S.active] = t.value; return true; }
  if (d.ent) { const [id, k] = d.ent.split("|"), en = S.entities.find(x => x.id === id); if (en) en[k] = t.value; return true; }
  if (d.srcf) { const s = S.sources.find(x => x.id === MEM.src) || S.sources[0]; if (s) s[d.srcf] = t.value; return true; }
  if (d.achh) { S.ach[S.active].hyps[+d.achh] = t.value; return true; }
  if (d.ache) { const [j, k] = d.ache.split("|"); S.ach[S.active].ev[+j][k] = k === "w" ? +t.value : t.value; return true; }
  if (d.achs) { const [j, h] = d.achs.split("|"); S.ach[S.active].ev[+j].s[h] = t.value; return true; }
  if (d.kac) { const [i, k] = d.kac.split("|"); S.kac[S.active][+i][k] = t.value; return true; }
  if (d.judg) { S.judg[S.active][d.judg] = t.value; return true; }
  if (d.kj) { const [i, k] = d.kj.split("|"); S.judg[S.active].kj[+i][k] = t.value; return true; }
  if (d.mn) { const [i, k] = d.mn.split("|"); S.mesh.nodes[+i][k] = k === "name" ? t.value : +t.value; return true; }
  if (d.mesh) { S.mesh[d.mesh] = +t.value; return true; }
  return false;
}
document.addEventListener("input", e => { if (setFromInput(e.target)) saveSoon(); });
document.addEventListener("change", async e => {
  const t = e.target, d = t.dataset;
  if (d.casesel !== undefined) { S.active = t.value; save(); return render(); }
  if (d.check) { S.checks[d.check] = t.checked; save(); return; }
  if (d.fchk) { MEM.f[d.fchk] = S.f[d.fchk] = t.checked ? "1" : "0"; save(); return renderKeep(); }
  if (d.stack) { const cur = new Set(F("stk", "peertube,kubo,syncthing,conduit,searxng").split(",").filter(Boolean)); t.checked ? cur.add(d.stack) : cur.delete(d.stack); MEM.f.stk = S.f.stk = [...cur].join(","); save(); return renderKeep(); }
  if (setFromInput(t)) { save(); if (t.tagName === "SELECT" || t.type === "number" || t.type === "date" || t.type === "datetime-local" || d.mn || d.mesh) renderKeep(); return; }
  if (t.id === "shFile") { MEM.shFile = t.files[0] || null; return renderKeep(); }
  if (t.id === "shIn") { MEM.shIn = [...t.files]; MEM.restored = null; return renderKeep(); }
  if (t.id === "impFile" && t.files[0]) { try { const x = JSON.parse(await t.files[0].text()); if (!x || !Array.isArray(x.cases)) throw 0; S = Object.assign(fresh(), x); save(); render(); toast("Backup restored."); } catch (er) { toast("That isn't an Omnisight backup."); } return; }
  if (t.id === "mediaFile" && t.files[0]) { const f = t.files[0]; try { const buf = await f.arrayBuffer(); let img = null, dh = ""; try { img = await imgFromFile(f); dh = dHash(img); } catch (er) {} MEM.media = { name: f.name, size: f.size, mod: f.lastModified, sha: await digestHex(buf), exif: readExif(buf), dhash: dh, img }; render(); } catch (er) { toast("Couldn't read that file: " + er.message); } return; }
  if (t.id === "evFiles" && t.files.length) { for (const f of t.files) { if (f.size > 1024 * 1048576) { toast(f.name + " is over 1 GB; hash it with Get-FileHash instead."); continue; } S.evidence.push({ id: uid(), case: S.active, name: f.name, size: f.size, hash: await digestHex(await f.arrayBuffer()), notes: f.type || "", when: Date.now(), custody: [{ when: new Date().toISOString(), who: "me", act: "hashed into locker" }] }); } save(); render(); toast("Hashed and logged."); return; }
  if (t.id === "evVerify" && t.files[0]) { const h = await digestHex(await t.files[0].arrayBuffer()), m = S.evidence.find(x => x.hash === h); $("#evVOut").innerHTML = m ? `<div class="ok">✔ Matches “${esc(m.name)}” logged ${new Date(m.when).toISOString().slice(0, 19)}Z. Unchanged.</div>` : `<div class="bd">✖ No match. SHA-256 ${h}. Either it changed or it was never logged.</div>`; return; }
  if (t.id === "hlFile" && t.files[0]) { const f = t.files[0], u = new Uint8Array(await f.arrayBuffer()), ch = []; for (let i = 0; i < Math.max(1, u.length); i += 262144) ch.push(await digestHex(u.subarray(i, i + 262144))); MEM.hashFile = { name: f.name, size: f.size, sha: await digestHex(u), cid: cidRaw(u), root: merkle(ch).root, chunks: ch.length }; render(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.shiftKey || e.target.tagName !== "INPUT") return;
  const id = e.target.id;
  if (id === "qp") return ACT.quickpivot();
  if (id === "pq" || id === "ul_u" || id === "g_c" || id === "md_url" || id === "at_f" || id === "dk_t" || id === "cl_v" || id === "sd_f") { setFromInput(e.target); renderKeep(); }
  if (id === "newcase") ACT.newcase(); if (id === "ne_v") ACT.addent(); if (id === "tl_x") ACT.addevent();
});
window.addEventListener("message", e => {
  const m = e.data || {};
  if (m.uds === "web-state") { WEB_ON = !!m.on; if (loaded) render(); }
  if (m.uds === "exported") toast(m.note || (m.ok ? "Saved." : "Not saved."), 4000);
  if (m.uds === "exporting") toast(m.note, 4000);
  if (m.uds === "store" && !loaded) { useLocal = false; boot(m.data && m.data.xint ? m.data.xint : readLocal()); }
  if (m.uds === "store-error") { useLocal = true; toast("Couldn't save to the app: " + m.note); }
  if (m.uds === "planner" && m.id === MEM.ai.id) {
    if (m.done) { MEM.ai.status = m.error ? "⚠ " + m.error : ""; MEM.ai.text = m.text || MEM.ai.text; } else { MEM.ai.status = m.status || ""; if (m.text) MEM.ai.text = m.text; }
    const st = $("#aiSt"), tx = $("#aiTx"); if (st) st.textContent = MEM.ai.status; if (tx) tx.textContent = MEM.ai.text || "—"; else if (m.done && MEM.view === "ai") render();
  }
});
function readLocal() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } }
function boot(saved) {
  if (loaded) return; loaded = true;
  S = Object.assign(fresh(), saved || {}); if (!S.cases.length) S.cases = fresh().cases; if (!S.cases.find(c => c.id === S.active)) S.active = S.cases[0].id; if (!S.mesh || !S.mesh.nodes) S.mesh = fresh().mesh;
  render();
}
$("#view").innerHTML = "<div class='mut'>Loading…</div>";
if (inApp) { tell({ uds: "store-get" }); tell({ uds: "web-hello" }); setTimeout(() => { if (!loaded) { useLocal = true; boot(readLocal()); } }, 1500); }
else boot(readLocal());
