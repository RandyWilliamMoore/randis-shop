<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PDF Maker</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1f24; color: #e8e6e3; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: #2a2c33; border-bottom: 1px solid #3a3d46; flex-wrap: wrap; }
  button, select, label.b { background: #3a3d46; color: #e8e6e3; border: 1px solid #50545f; border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover, label.b:hover { background: #474b56; }
  button.go { background: #2f6f4f; border-color: #3f8f66; }
  input.t { background: #1e1f24; color: #e8e6e3; border: 1px solid #50545f; border-radius: 4px; padding: 4px 6px; font: inherit; }
  #pics { display: none; }
  #main { flex: 1; display: flex; min-height: 0; }
  #text { flex: 1; resize: none; border: 0; outline: 0; padding: 12px 14px; background: #1e1f24; color: #e8e6e3; font: 15px/1.5 system-ui, sans-serif; }
  #side { width: 210px; border-left: 1px solid #3a3d46; background: #24262c; overflow-y: auto; padding: 8px; }
  #side h3 { margin: 2px 0 8px; font-size: 13px; color: #a9a6a0; font-weight: 600; }
  .pic { position: relative; margin-bottom: 8px; background: #1e1f24; border: 1px solid #3a3d46; border-radius: 4px; padding: 4px; }
  .pic img { width: 100%; display: block; }
  .pic .row { display: flex; gap: 4px; margin-top: 4px; }
  .pic .row button { padding: 2px 6px; font-size: 12px; }
  #status { padding: 3px 10px; background: #2a2c33; border-top: 1px solid #3a3d46; color: #a9a6a0; font-size: 12px; }
</style></head>
<body>
<div id="bar">
  <input class="t" id="title" value="My document" aria-label="Title" style="width:170px" spellcheck="false">
  <select id="page" aria-label="Page size"><option value="612x792">Letter</option><option value="595x842">A4</option></select>
  <select id="size" aria-label="Text size"><option>10</option><option selected>12</option><option>14</option><option>18</option></select>
  <label class="b" for="pics">Add pictures…</label><input type="file" id="pics" accept="image/*" multiple>
  <label class="b"><input type="checkbox" id="picpages"> Each picture on its own page</label>
  <button class="go" id="make" title="Ctrl+S">Make PDF</button>
</div>
<div id="main">
  <textarea id="text" spellcheck="true" autofocus placeholder="Type or paste your text. Blank lines start new paragraphs; a line with only --- starts a new page. Add pictures on the right, then Make PDF puts a .pdf in your downloads."></textarea>
  <div id="side"><h3>Pictures (<span id="n">0</span>)</h3><div id="list"></div></div>
</div>
<div id="status"><span id="note">Nothing leaves your computer and nothing is kept in the shop: Make PDF to keep your work.</span></div>
<script>
  const $ = id => document.getElementById(id);
  const pics = [];
  function note(t) { $("note").textContent = t; }

  function toJpeg(file) {
    return new Promise((ok, bad) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 2400 / Math.max(w, h));
        w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
        const b64 = c.toDataURL("image/jpeg", 0.88).split(",")[1], bin = atob(b64), u = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        ok({ name: file.name, jpeg: u, w, h, url });
      };
      img.onerror = () => { URL.revokeObjectURL(url); bad(new Error(file.name + " isn't a picture this browser can read.")); };
      img.src = url;
    });
  }
  function drawList() {
    $("n").textContent = pics.length; const L = $("list"); L.textContent = "";
    pics.forEach((p, i) => {
      const d = document.createElement("div"); d.className = "pic";
      const im = document.createElement("img"); im.src = p.url; im.alt = p.name; d.append(im);
      const r = document.createElement("div"); r.className = "row";
      [["▲", -1], ["▼", 1]].forEach(([t, s]) => { const b = document.createElement("button"); b.textContent = t; b.title = s < 0 ? "Move up" : "Move down";
        b.onclick = () => { const j = i + s; if (j < 0 || j >= pics.length) return; [pics[i], pics[j]] = [pics[j], pics[i]]; drawList(); }; r.append(b); });
      const x = document.createElement("button"); x.textContent = "Remove"; x.onclick = () => { URL.revokeObjectURL(p.url); pics.splice(i, 1); drawList(); }; r.append(x);
      d.append(r); L.append(d);
    });
  }
  $("pics").addEventListener("change", async e => {
    const fs = [...e.target.files]; e.target.value = "";
    for (const f of fs) {
      if (f.size > 25e6) { note(f.name + " is too big (25 MB max)."); continue; }
      try { pics.push(await toJpeg(f)); } catch (err) { note(err.message); }
    }
    drawList(); note(pics.length + " picture" + (pics.length == 1 ? "" : "s") + " ready.");
  });

  const meas = document.createElement("canvas").getContext("2d");
  function width(s, pt) { meas.font = pt + "px Helvetica, Arial, sans-serif"; return meas.measureText(s).width; }
  function winAnsi(s) {
    const map = { "‘": "'", "’": "'", "“": '"', "”": '"', "–": "-", "—": "--", "…": "...", "•": "\xB7", " ": " ", "\t": "    " };
    return s.replace(/[^\x20-\x7E\xA0-\xFF]/g, ch => map[ch] ?? "?");
  }
  function wrap(line, pt, maxW) {
    const out = []; let cur = "";
    for (const word of line.split(/(\s+)/)) {
      const next = cur + word;
      if (width(next, pt) <= maxW || !cur.trim()) {
        if (width(next, pt) > maxW && !cur.trim()) {
          let piece = "";
          for (const ch of next) { if (width(piece + ch, pt) > maxW && piece) { out.push(piece); piece = ""; } piece += ch; }
          cur = piece;
        } else cur = next;
      } else { out.push(cur.trimEnd()); cur = word.trimStart(); }
    }
    out.push(cur.trimEnd()); return out;
  }
  function esc(s) { return s.replace(/[\\()]/g, m => "\\" + m); }

  function makePdf() {
    const [PW, PH] = $("page").value.split("x").map(Number), M = 54, pt = +$("size").value, lead = pt * 1.35;
    const title = winAnsi($("title").value.trim() || "Document");
    const pages = []; let ops = [], y = PH - M;
    ops.imgs = [];
    const flush = () => { pages.push({ ops, imgs: ops.imgs }); ops = []; ops.imgs = []; y = PH - M; };
    const text = (s, size, bold) => {
      if (y - size < M) flush();
      y -= size * 1.35;
      ops.push(`BT /${bold ? "F2" : "F1"} ${size} Tf ${M} ${y.toFixed(2)} Td (${esc(s)}) Tj ET`);
    };
    for (const l of wrap(title, pt + 8, PW - 2 * M)) text(l, pt + 8, true);
    y -= lead * 0.6;
    for (const raw of $("text").value.replace(/\r/g, "").split("\n")) {
      if (raw.trim() === "---") { flush(); continue; }
      if (!raw.trim()) { y -= lead * 0.6; continue; }
      for (const l of wrap(winAnsi(raw), pt, PW - 2 * M)) text(l, pt, false);
    }
    const own = $("picpages").checked;
    pics.forEach((p, i) => {
      const maxW = PW - 2 * M, maxH = own ? PH - 2 * M : Math.min(PH - 2 * M, (PH - 2 * M) * 0.6);
      const k = Math.min(maxW / p.w, maxH / p.h, 1.5), w = p.w * k, h = p.h * k;
      if (own) { if (ops.length) flush(); y = PH - M - (PH - 2 * M - h) / 2; }
      else if (y - h - 8 < M) flush();
      y -= h + (own ? 0 : 8);
      ops.imgs.push(i);
      ops.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${(M + (maxW - w) / 2).toFixed(2)} ${y.toFixed(2)} cm /Im${i} Do Q`);
      if (own) flush();
    });
    if (ops.length || !pages.length) flush();

    const parts = [], offsets = [];
    let len = 0;
    const put = x => { const b = typeof x === "string" ? latin1(x) : x; parts.push(b); len += b.length; };
    const latin1 = s => { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; };
    const obj = (n, body) => { offsets[n] = len; put(`${n} 0 obj\n`); body(); put("\nendobj\n"); };
    put("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
    const imgBase = 6, pageBase = imgBase + pics.length, n = pages.length;
    const kids = pages.map((_, i) => `${pageBase + 2 * i} 0 R`).join(" ");
    obj(1, () => put("<< /Type /Catalog /Pages 2 0 R >>"));
    obj(2, () => put(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`));
    obj(3, () => put("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"));
    obj(4, () => put("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"));
    obj(5, () => put(`<< /Title (${esc(title)}) /Producer (Randis PDF Maker) >>`));
    pics.forEach((p, i) => obj(imgBase + i, () => {
      put(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`);
      put(p.jpeg); put("\nendstream");
    }));
    pages.forEach((pg, i) => {
      const xo = pg.imgs.map(k => `/Im${k} ${imgBase + k} 0 R`).join(" ");
      obj(pageBase + 2 * i, () => put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${xo ? " /XObject << " + xo + " >>" : ""} >> /Contents ${pageBase + 2 * i + 1} 0 R >>`));
      const body = latin1(pg.ops.join("\n"));
      obj(pageBase + 2 * i + 1, () => { put(`<< /Length ${body.length} >>\nstream\n`); put(body); put("\nendstream"); });
    });
    const total = pageBase + 2 * n, xref = len;
    let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
    for (let i = 1; i < total; i++) x += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
    put(x + `trailer\n<< /Size ${total} /Root 1 0 R /Info 5 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return { blob: new Blob(parts, { type: "application/pdf" }), pages: n };
  }
  function fileName() { return (($("title").value.trim().replace(/[\\/:*?"<>|]+/g, "")) || "document").slice(0, 80) + ".pdf"; }
  function make() {
    try {
      const { blob, pages } = makePdf(), a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = fileName(); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 30000);
      note("Made " + a.download + " (" + pages + " page" + (pages == 1 ? "" : "s") + ", " + Math.ceil(blob.size / 1024) + " KB) in your downloads.");
    } catch (err) { note("Couldn't make the PDF: " + err.message); }
  }
  $("make").onclick = make;
  document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() == "s") { e.preventDefault(); make(); } });
  window.PDFMAKER = { makePdf, pics, toJpeg };
</script>
</body></html>
