// ---------------------------------------------------------------- BPE tokenizer
LAB.bpe = el => {
  el.innerHTML = `<div class="card"><p class="small mut">Byte-pair encoding, the way GPT-style tokenizers are trained: start from characters, repeatedly merge the most frequent neighbouring pair. Watch the vocabulary grow and the token count shrink.</p>
  <textarea id="tkT" rows="4" style="width:100%">the cat sat on the mat. the cat ate the rat. then the cat sat on the hat.</textarea>
  <div class="row" style="margin-top:6px"><label class="small">Merges <input id="tkM" type="range" min="0" max="60" value="10"></label><span id="tkSt" class="small mut"></span></div><div id="tkOut" style="margin-top:10px;line-height:2"></div><div id="tkMerges" class="small mut" style="margin-top:8px"></div></div>`;
  const go2 = () => { let t = Array.from($("#tkT").value), n = +$("#tkM").value, merges = [];
    for (let k = 0; k < n; k++) { const cnt = new Map(); for (let i = 0; i < t.length - 1; i++) { const p = t[i] + "\u0000" + t[i + 1]; cnt.set(p, (cnt.get(p) || 0) + 1); } let best = null, bc = 1; for (const [p, c] of cnt) if (c > bc) { best = p; bc = c; } if (!best) break; const [a, b] = best.split("\u0000"); merges.push(`${a}+${b} (${bc})`); const o = []; for (let i = 0; i < t.length; i++) { if (i < t.length - 1 && t[i] === a && t[i + 1] === b) { o.push(a + b); i++; } else o.push(t[i]); } t = o; }
    const col = s => `hsl(${hash(s) % 360} 60% ${S.theme === "light" ? 85 : 30}%)`;
    ($("#tkOut") || {}).innerHTML = t.map(x => `<span style="background:${col(x)};padding:2px 3px;border-radius:4px;margin:1px;font-family:var(--mono);white-space:pre">${esc(x).replace(/ /g, "␣")}</span>`).join("");
    ($("#tkSt") || {}).textContent = `${Array.from($("#tkT").value).length} characters → ${t.length} tokens · vocabulary ${new Set(t).size}`;
    ($("#tkMerges") || {}).innerHTML = merges.length ? "Merges: " + merges.map(esc).join(" · ").replace(/ /g, " ") : ""; };
  $("#tkT").oninput = go2; $("#tkM").oninput = go2; go2();
};

// ---------------------------------------------------------------- neural net playground
LAB.nn = el => {
  el.innerHTML = `<div class="row"><select id="nnD"><option value="xor">XOR (4 clusters)</option><option value="circle">circle</option><option value="spiral">two spirals</option><option value="moons">two moons</option></select>
  <label class="small">Hidden units <input id="nnH" type="range" min="2" max="32" value="8"></label><label class="small">Learning rate <select id="nnLr"><option>0.03</option><option selected>0.1</option><option>0.3</option><option>1</option></select></label>
  <select id="nnAct"><option value="tanh">tanh</option><option value="relu">ReLU</option><option value="sig">sigmoid</option></select><button class="pri" id="nnGo">▶ Train</button><button id="nnReset">Reset</button><span class="small mut" id="nnSt"></span></div>
  <div class="row" style="align-items:flex-start">${cv(420, 420)}<canvas id="nnLoss" width="420" height="200" style="background:var(--code);border:1px solid var(--line);border-radius:10px"></canvas></div>
  <p class="small mut">A real 2-layer network trained by backpropagation in your browser. The background shows what it predicts everywhere. A single layer can't separate XOR, but one hidden layer can. Spirals need more units.</p>`;
  const c = $("#cv"), g = c.getContext("2d"), lc = $("#nnLoss"), lg = lc.getContext("2d");
  let P = [], W1, b1, W2, b2, H, losses = [], running = false, timer = null, ep = 0;
  const R = rng(7);
  const data = k => { const pts = []; for (let i = 0; i < 200; i++) { let x, y, l;
    if (k === "xor") { x = R() * 2 - 1; y = R() * 2 - 1; l = x * y > 0 ? 1 : 0; }
    else if (k === "circle") { x = R() * 2 - 1; y = R() * 2 - 1; l = x * x + y * y < 0.4 ? 1 : 0; }
    else if (k === "spiral") { l = i % 2; const t = (i >> 1) / 100 * 3.5 * Math.PI / 1.0, r = (i >> 1) / 100 * 0.9; x = r * Math.cos(t + l * Math.PI) + (R() - .5) * .05; y = r * Math.sin(t + l * Math.PI) + (R() - .5) * .05; }
    else { l = i % 2; const t = R() * Math.PI; x = l ? 1 - Math.cos(t) - 0.5 : Math.cos(t) - 0.5; y = l ? 0.4 - Math.sin(t) + 0.2 : Math.sin(t) - 0.2; x *= 0.8; y *= 0.8; }
    pts.push([x, y, l]); } return pts; };
  const act = (z, k) => k === "tanh" ? Math.tanh(z) : k === "relu" ? Math.max(0, z) : 1 / (1 + Math.exp(-z));
  const dact = (a, z, k) => k === "tanh" ? 1 - a * a : k === "relu" ? (z > 0 ? 1 : 0) : a * (1 - a);
  const init = () => { H = +$("#nnH").value; const r = rng(42); W1 = Array.from({ length: H }, () => [(r() * 2 - 1), (r() * 2 - 1)]); b1 = Array(H).fill(0).map(() => r() * 0.2 - 0.1); W2 = Array.from({ length: H }, () => (r() * 2 - 1) / Math.sqrt(H)); b2 = 0; losses = []; ep = 0; };
  const fwd = (x, y, k) => { const z = W1.map((w, i) => w[0] * x + w[1] * y + b1[i]), h = z.map(v => act(v, k)); const o = 1 / (1 + Math.exp(-(h.reduce((s, v, i) => s + v * W2[i], 0) + b2))); return { z, h, o }; };
  const train = () => { const k = $("#nnAct").value, lr = +$("#nnLr").value; let L = 0;
    for (let rep = 0; rep < 10; rep++) { L = 0; for (const [x, y, t] of P) { const { z, h, o } = fwd(x, y, k); L += -(t * Math.log(o + 1e-9) + (1 - t) * Math.log(1 - o + 1e-9)); const d = o - t;
      for (let i = 0; i < H; i++) { const dh = d * W2[i] * dact(h[i], z[i], k); W2[i] -= lr * d * h[i] / 4; W1[i][0] -= lr * dh * x / 4; W1[i][1] -= lr * dh * y / 4; b1[i] -= lr * dh / 4; } b2 -= lr * d / 4; } ep++; }
    losses.push(L / P.length); if (losses.length > 400) losses.shift(); };
  const draw = () => { const k = $("#nnAct").value, W = c.width, s = 6; for (let px = 0; px < W; px += s) for (let py = 0; py < W; py += s) { const o = fwd(px / W * 2 - 1, 1 - py / W * 2, k).o; g.fillStyle = `rgba(${Math.round(244 * o + 94 * (1 - o))},${Math.round(114 * o + 234 * (1 - o))},${Math.round(182 * o + 212 * (1 - o))},0.35)`; g.fillRect(px, py, s, s); }
    let ok = 0; for (const [x, y, t] of P) { const o = fwd(x, y, k).o; if ((o > .5) === !!t) ok++; g.beginPath(); g.arc((x + 1) / 2 * W, (1 - y) / 2 * W, 4, 0, 7); g.fillStyle = t ? "#be185d" : "#0f766e"; g.fill(); g.strokeStyle = "#ffffff"; g.lineWidth = 1.5; g.stroke(); }
    lg.fillStyle = css("--code"); lg.fillRect(0, 0, lc.width, lc.height); lg.strokeStyle = css("--acc2"); lg.lineWidth = 2; lg.beginPath(); const mx = Math.max(0.8, ...losses); losses.forEach((v, i) => { const X = i / 400 * lc.width, Y = lc.height - v / mx * (lc.height - 10); i ? lg.lineTo(X, Y) : lg.moveTo(X, Y); }); lg.stroke(); lg.fillStyle = css("--mut"); lg.font = "12px Segoe UI"; lg.fillText("loss", 6, 14);
    ($("#nnSt") || {}).textContent = `epoch ${ep} · loss ${losses.length ? losses[losses.length - 1].toFixed(4) : "–"} · accuracy ${Math.round(ok / P.length * 100)}%`; };
  const loop = () => { if (!running) return; train(); draw(); timer = setTimeout(loop, 16); };
  const reset = () => { running = false; clearTimeout(timer); ($("#nnGo") || {}).textContent = "▶ Train"; P = data($("#nnD").value); init(); draw(); };
  $("#nnGo").onclick = () => { running = !running; ($("#nnGo") || {}).textContent = running ? "⏸ Pause" : "▶ Train"; loop(); };
  $("#nnReset").onclick = reset; $("#nnD").onchange = reset; $("#nnH").onchange = reset; $("#nnAct").onchange = reset;
  labStop = () => { running = false; clearTimeout(timer); };
  reset();
};

// ---------------------------------------------------------------- pathfinding
LAB.path = el => {
  el.innerHTML = `<div class="row"><select id="pfA"><option>BFS</option><option>Dijkstra</option><option selected>A*</option><option>Greedy best-first</option><option>DFS</option></select><button class="pri" id="pfGo">▶ Find path</button><button id="pfMaze">Random walls</button><button id="pfClear">Clear</button><span class="small mut" id="pfSt">Click/drag to draw walls; shift+drag for mud (cost 5).</span></div>${cv(900, 450)}
  <p class="small mut">BFS and Dijkstra explore evenly; A* uses a guess (distance to the goal) to head the right way, and still finds the shortest path when the guess never overestimates. Greedy is fast but not always shortest. DFS isn't shortest at all.</p>`;
  const c = $("#cv"), g = c.getContext("2d"), CS = 18, Cw = 50, Rh = 25; let grid, run = 0; const S0 = [12, 3], E0 = [12, 46];
  const clear = () => { grid = Array.from({ length: Rh }, () => Array(Cw).fill(0)); draw(); };
  const draw = (seen, path) => { for (let r = 0; r < Rh; r++) for (let q = 0; q < Cw; q++) { const v = grid[r][q]; g.fillStyle = v === 1 ? css("--mut") : v === 5 ? "#7c5a2a" : seen && seen.has(r * Cw + q) ? "color-mix(in srgb, " + css("--acc2") + " 35%, " + css("--code") + ")" : css("--code"); g.fillRect(q * CS, r * CS, CS - 1, CS - 1); }
    if (path) { g.fillStyle = css("--warn"); path.forEach(k => g.fillRect((k % Cw) * CS + 4, Math.floor(k / Cw) * CS + 4, CS - 9, CS - 9)); }
    g.fillStyle = css("--ok"); g.fillRect(S0[1] * CS, S0[0] * CS, CS - 1, CS - 1); g.fillStyle = css("--bad"); g.fillRect(E0[1] * CS, E0[0] * CS, CS - 1, CS - 1); };
  let down = false; const paint = e => { const b = c.getBoundingClientRect(), q = Math.floor((e.clientX - b.left) / b.width * c.width / CS), r = Math.floor((e.clientY - b.top) / b.height * c.height / CS); if (r < 0 || q < 0 || r >= Rh || q >= Cw || (r === S0[0] && q === S0[1]) || (r === E0[0] && q === E0[1])) return; grid[r][q] = e.shiftKey ? 5 : down === "erase" ? 0 : 1; draw(); };
  c.onmousedown = e => { const b = c.getBoundingClientRect(), q = Math.floor((e.clientX - b.left) / b.width * c.width / CS), r = Math.floor((e.clientY - b.top) / b.height * c.height / CS); down = grid[r] && grid[r][q] ? "erase" : "draw"; paint(e); }; c.onmousemove = e => { if (down) paint(e); }; window.addEventListener("mouseup", () => down = false);
  $("#pfClear").onclick = () => { run++; clear(); };
  $("#pfMaze").onclick = () => { run++; clear(); for (let r = 0; r < Rh; r++) for (let q = 0; q < Cw; q++) if (Math.random() < 0.28) grid[r][q] = Math.random() < 0.2 ? 5 : 1; grid[S0[0]][S0[1]] = grid[E0[0]][E0[1]] = 0; draw(); };
  $("#pfGo").onclick = async () => { const my = ++run, alg = $("#pfA").value, s = S0[0] * Cw + S0[1], t = E0[0] * Cw + E0[1];
    const h = k => Math.abs(Math.floor(k / Cw) - E0[0]) + Math.abs(k % Cw - E0[1]);
    const dist = new Map([[s, 0]]), prev = new Map(), seen = new Set(); let open = [[0, s]], steps = 0;
    while (open.length) { if (run !== my) return;
      let u; if (alg === "DFS") u = open.pop()[1]; else if (alg === "BFS") u = open.shift()[1]; else { open.sort((a, b) => a[0] - b[0]); u = open.shift()[1]; }
      if (seen.has(u)) continue; seen.add(u); steps++; if (u === t) break;
      const r = Math.floor(u / Cw), q = u % Cw;
      for (const [dr, dq] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) { const nr = r + dr, nq = q + dq; if (nr < 0 || nq < 0 || nr >= Rh || nq >= Cw || grid[nr][nq] === 1) continue; const v = nr * Cw + nq, w = grid[nr][nq] === 5 ? 5 : 1, nd = dist.get(u) + (alg === "BFS" || alg === "DFS" ? 1 : w);
        if (seen.has(v) || (dist.has(v) && dist.get(v) <= nd && alg !== "DFS")) continue; dist.set(v, nd); prev.set(v, u);
        open.push([alg === "A*" ? nd + h(v) : alg === "Greedy best-first" ? h(v) : nd, v]); }
      if (steps % 6 === 0) { draw(seen); await sleep(10); } }
    const path = []; if (seen.has(t)) { let k = t; while (k !== undefined && k !== s) { path.push(k); k = prev.get(k); } }
    let cost = 0; path.forEach(k => cost += grid[Math.floor(k / Cw)][k % Cw] === 5 ? 5 : 1);
    draw(seen, path); ($("#pfSt") || {}).textContent = seen.has(t) ? `${alg}: explored ${seen.size} cells · path length ${path.length} · cost ${cost}` : `${alg}: no path`; };
  clear();
};

// ---------------------------------------------------------------- hashing & crypto (real SubtleCrypto)
LAB.hash = el => {
  el.innerHTML = `<div class="grid big"><div class="card"><h3>Hashes</h3><textarea id="hT" rows="3" style="width:100%">hello world</textarea><div id="hOut" style="font-family:var(--mono);font-size:12px;word-break:break-all"></div><p class="small mut">Change one letter and about half the bits change: the <i>avalanche effect</i>. A hash is one-way; for passwords use slow, salted ones (Argon2, bcrypt).</p></div>
  <div class="card"><h3>AES-GCM encryption</h3><input id="eK" value="correct horse battery staple" style="width:100%" placeholder="passphrase"><textarea id="eT" rows="2" style="width:100%;margin-top:6px">Meet at the library at noon.</textarea><div class="row" style="margin-top:6px"><button class="pri" id="eGo">Encrypt</button><button id="eDe">Decrypt it back</button></div><div id="eOut" style="font-family:var(--mono);font-size:12px;word-break:break-all;margin-top:6px"></div><p class="small mut">The key comes from the passphrase with PBKDF2 (200,000 rounds). AES-GCM also authenticates: change one byte and decryption fails.</p></div>
  <div class="card"><h3>Toy RSA</h3><div class="row"><span class="small">p</span><input id="rP" value="61" style="width:70px"><span class="small">q</span><input id="rQ" value="53" style="width:70px"><span class="small">e</span><input id="rE" value="17" style="width:70px"><span class="small">message (number)</span><input id="rM" value="65" style="width:80px"></div><div id="rOut" class="small" style="margin-top:8px"></div><p class="small mut">Real RSA uses primes with hundreds of digits. Its security rests on factoring n being hard, which a big quantum computer would break (see Post-quantum cryptography).</p></div></div>`;
  const hex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
  const enc = new TextEncoder();
  const hashes = async () => { const t = enc.encode($("#hT").value); let out = ""; for (const a of ["SHA-1", "SHA-256", "SHA-384", "SHA-512"]) out += `<p><b>${a}</b> ${a === "SHA-1" ? '<span class="mut">(broken, don\'t use)</span>' : ""}<br>${hex(await crypto.subtle.digest(a, t))}</p>`; out += `<p><b>FNV-1a 32</b> <span class="mut">(fast, not secure)</span><br>${hash($("#hT").value).toString(16).padStart(8, "0")}</p>`; ($("#hOut") || {}).innerHTML = out; };
  let last = null;
  const key = async salt => { const base = await crypto.subtle.importKey("raw", enc.encode($("#eK").value), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); };
  $("#eGo").onclick = async () => { const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await key(salt), enc.encode($("#eT").value)); last = { salt, iv, ct }; ($("#eOut") || {}).innerHTML = `salt ${hex(salt)}<br>iv ${hex(iv)}<br>ciphertext+tag ${hex(ct)}`; };
  $("#eDe").onclick = async () => { if (!last) return toast("Encrypt something first."); try { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: last.iv }, await key(last.salt), last.ct); $("#eOut").innerHTML += `<br><span style="color:var(--ok)">decrypted: ${esc(new TextDecoder().decode(pt))}</span>`; } catch (e) { $("#eOut").innerHTML += `<br><span style="color:var(--bad)">decryption failed (wrong passphrase?)</span>`; } };
  const rsa = () => { const p = BigInt($("#rP").value || 0), q = BigInt($("#rQ").value || 0), e = BigInt($("#rE").value || 0), m = BigInt($("#rM").value || 0);
    const isP = n => { if (n < 2n) return false; for (let i = 2n; i * i <= n; i++) if (n % i === 0n) return false; return true; };
    if (!isP(p) || !isP(q) || p === q) { ($("#rOut") || {}).textContent = "p and q must be different primes."; return; }
    const n = p * q, phi = (p - 1n) * (q - 1n); const egcd = (a, b) => { let [x0, x1, a0, b0] = [1n, 0n, a, b]; while (b0) { const t = a0 / b0;[a0, b0] = [b0, a0 - t * b0];[x0, x1] = [x1, x0 - t * x1]; } return [a0, x0]; };
    const [gcd, inv] = egcd(e, phi); if (gcd !== 1n) { ($("#rOut") || {}).textContent = "e must share no factor with (p−1)(q−1) = " + phi; return; }
    const d = ((inv % phi) + phi) % phi; const pw = (b, x, md) => { let r = 1n; b %= md; while (x) { if (x & 1n) r = r * b % md; b = b * b % md; x >>= 1n; } return r; };
    if (m >= n) { ($("#rOut") || {}).textContent = "The message must be smaller than n = " + n; return; }
    const c2 = pw(m, e, n); ($("#rOut") || {}).innerHTML = `n = p·q = <b>${n}</b> · φ = ${phi}<br>public key (e, n) = (${e}, ${n}) · private d = <b>${d}</b> (e·d ≡ 1 mod φ)<br>encrypt: c = m^e mod n = <b>${c2}</b><br>decrypt: c^d mod n = <b>${pw(c2, d, n)}</b> ✔`; };
  $("#hT").oninput = hashes; ["#rP", "#rQ", "#rE", "#rM"].forEach(s => $(s).oninput = rsa); hashes(); rsa();
};

function afterLoad() {
  const b = blank(); for (const k in b) if (S[k] == null) S[k] = b[k];
  for (const a of S.arenaGen || []) if (!ARENA.find(x => x.id === a.id)) ARENA.push(a);
  document.body.classList.toggle("light", S.theme === "light");
}
function boot(d) {
  if (loaded) return; loaded = true;
  S = d && typeof d === "object" ? d : blank(); afterLoad();
  render();
  loadTools().then(() => { if (view === "lesson" || view === "languages" || view === "playground") render(); });
}
if (inApp) { tell({ uds: "store-get" }); setTimeout(() => { if (!loaded) { useLocal = true; let d = null; try { d = JSON.parse(localStorage.getItem(LKEY) || "null"); } catch (e) {} boot(d); } }, 1500); }
else { useLocal = true; let d = null; try { d = JSON.parse(localStorage.getItem(LKEY) || "null"); } catch (e) {} boot(d); }
