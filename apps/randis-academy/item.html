function molarMass(f) {
  const tok = f.match(/[A-Z][a-z]?|\d+|\(|\)/g) || []; const st = [{}]; let i = 0;
  const add = (o, k, n) => o[k] = (o[k] || 0) + n;
  while (i < tok.length) {
    const t = tok[i++];
    if (t === "(") st.push({});
    else if (t === ")") { const g = st.pop(); const n = /^\d+$/.test(tok[i]) ? +tok[i++] : 1; for (const k in g) add(st[st.length - 1], k, g[k] * n); }
    else if (/^[A-Z]/.test(t)) { const n = /^\d+$/.test(tok[i]) ? +tok[i++] : 1; if (!EL_BY_SYM[t]) throw new Error("Unknown element " + t); add(st[st.length - 1], t, n); }
  }
  let m = 0; for (const k in st[0]) m += EL_BY_SYM[k].w * st[0][k]; return m;
}
function drillPlayer(el, id, opts) {
  opts = opts || {};
  const d = DRILLS.find(x => x.id === id); if (!d) { el.innerHTML = "No such drill."; return; }
  const N = opts.n || 10; let i = 0, right = 0, cur = null, t0 = Date.now(), streak = 0, best = 0; const timed = opts.timed;
  const key = "drill/" + id;
  const finish = () => {
    const pct = Math.round(100 * right / Math.max(1, timed ? Math.max(i, 1) : N)), secs = Math.round((Date.now() - t0) / 1000);
    setMastery(key, pct, d.name); gainXP(right * 2 + (pct === 100 ? 10 : 0), "Drill: " + d.name);
    el.innerHTML = `<div class="q" style="text-align:center"><h2>${pct >= 90 ? "🏆" : pct >= 70 ? "🌟" : "💪"} ${right} / ${timed ? i : N} right</h2><p>${secs}s · best streak ${best} · +${right * 2 + (pct === 100 ? 10 : 0)} XP</p>
      <button class="btn pri" id="again">Again</button> <button class="btn" id="tm">60-second sprint</button></div>`;
    $("#again", el).onclick = () => drillPlayer(el, id, { n: N });
    $("#tm", el).onclick = () => drillPlayer(el, id, { timed: 60 });
  };
  const next = () => {
    if (!timed && i >= N) return finish();
    if (timed && Date.now() - t0 > timed * 1000) return finish();
    cur = d.g();
    const left = timed ? `⏱ <span id="tleft">${Math.max(0, Math.ceil(timed - (Date.now() - t0) / 1000))}</span>s` : `${i + 1} / ${N}`;
    el.innerHTML = `<div class="q"><div class="row small muted"><span>${esc(d.name)}</span><span style="margin-left:auto">${left} · ✓ ${right} · 🔥 ${streak}</span></div>
      <div class="drill">${cur.html || ""}<div>${esc(cur.q)} ${cur.speak ? `<button class="btn" id="spk">🔊</button>` : ""}</div>
      ${cur.choices ? `<div style="max-width:520px;margin:10px auto">${cur.choices.map(c => `<button class="btn ch" style="display:block;width:100%;font-size:18px" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>`
        : `<input id="ans" autocomplete="off"> <button class="btn pri" id="go">Check</button>`}</div>
      <div id="fb" style="text-align:center;min-height:30px"></div>${cur.hint ? `<details class="small"><summary>Hint</summary>${esc(cur.hint)}</details>` : ""}</div>`;
    if (cur.speak) { $("#spk", el).onclick = () => { const v = S.settings.voice; S.settings.voice = true; say(cur.speak); S.settings.voice = v; }; setTimeout(() => $("#spk", el).click(), 200); }
    const judge = given => {
      const ok = cur.choices ? given === cur.right : checkAns(given, cur.a, cur.tol);
      i++; if (ok) { right++; streak++; best = Math.max(best, streak); } else streak = 0;
      const shown = Array.isArray(cur.a) ? cur.a[0] : (cur.right || cur.a);
      $("#fb", el).innerHTML = ok ? `<b style="color:var(--ok)">✓ Right!</b>` : `<b style="color:var(--bad)">✗ Answer: ${esc(shown)}</b>${cur.hint && cur.choices ? " · " + esc(cur.hint) : ""}`;
      $$("button.ch, #go", el).forEach(b => b.disabled = true); const inp = $("#ans", el); if (inp) inp.disabled = true;
      setTimeout(next, ok ? 450 : 1600);
    };
    if (cur.choices) $$(".ch", el).forEach(b => b.onclick = () => judge(b.dataset.c));
    else { const inp = $("#ans", el); inp.focus(); inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()) judge(inp.value); }; $("#go", el).onclick = () => inp.value.trim() && judge(inp.value); }
  };
  if (timed) { const tk = setInterval(() => { const s = $("#tleft", el); if (!s || !document.body.contains(el)) return clearInterval(tk); s.textContent = Math.max(0, Math.ceil(timed - (Date.now() - t0) / 1000)); }, 500); }
  next();
}

function studyPlan(exam, dateStr, hoursPerWeek) {
  const days = Math.max(1, dayDiff(today(), dateStr)); const weeks = Math.max(1, Math.round(days / 7));
  const out = [];
  const ph = weeks >= 8 ? [["Diagnose", 0.1], ["Learn the content", 0.45], ["Practice by section", 0.25], ["Full mocks & review", 0.15], ["Taper", 0.05]] : weeks >= 3 ? [["Diagnose", 0.1], ["Targeted learning", 0.4], ["Mixed practice", 0.3], ["Mocks & review", 0.2]] : [["Quick diagnostic", 0.15], ["Weakest areas", 0.5], ["Mocks & rest", 0.35]];
  let w = 0;
  for (const [name, f] of ph) { const n = Math.max(1, Math.round(weeks * f)); out.push({ name, from: w + 1, to: Math.min(weeks, w + n) }); w += n; }
  out[out.length - 1].to = weeks;
  return { days, weeks, hours: hoursPerWeek * weeks, phases: out, mocks: Math.max(1, Math.min(8, Math.floor(weeks / 2))) };
}

{ id: "build", lv: 1, icon: "🧱", name: "Building tabs by chat", lessons: [

{ id: "undo", lv: 1, icon: "⏪", name: "Undo, snapshots & safety", lessons: [

 ["restore.py", "From PowerShell in the app folder:\n```\npython restore.py\npython restore.py --undo-last\n```\nThe first lists recent turns. The second puts the folder back to before the last one. (In an installed copy, use `..\\python\\python.exe`.)\n\n**Warning:** it restores the whole folder, including anything else changed since."],

{ id: "tools", lv: 1, icon: "🧰", name: "Built-in tools", lessons: [

{ id: "claude", lv: 2, icon: "🤖", name: "Claude Code: changing the app itself", lessons: [

{ id: "craft", lv: 4, icon: "🛠️", name: "Building tabs like an engineer", lessons: [

 ["Talking to the app", "A tab talks to the app with `window.parent.postMessage({uds: ...}, \"*\")`:\n- `{uds: \"store-get\"}` → the app answers `{uds: \"store\", data}`. This is how tabs remember things. Up to 1 MB per tab, saved as `store.json`.\n- `{uds: \"store-set\", data}` saves.\n- `{uds: \"export-file\", name, data}` lets the person save a file where they pick.\n\nSpecial abilities (running code, the tutor AI, the antivirus engine, VMs) are switched on per tab by flags in its `meta.json`, like `\"codelab\": true` or `\"academy\": true`, and checked by `app.py`."],

{ id: "arch", lv: 5, icon: "🏗️", name: "Inside the app: architecture", lessons: [

 ["Security model", "Tabs are walled off by a content security policy (and on Linux an extra content filter). Special powers are granted per tab by `meta.json` flags and checked server-side. Keys stay outside the folder, encrypted. Bots run read-only. Online messages are end-to-end sealed."]],

function openKey(k) {
  if (k.startsWith("drill/")) return go("drill", k.slice(6));
  if (k.startsWith("kids/")) return go("kidset", k.slice(5));
  if (k.startsWith("udsu/")) return go("udsmod", k.slice(5));

  const t = ATLAS_INDEX.find(x => x.key === k); if (t) return go("lesson", t);
  go("lesson", { key: k, name: (S.mast[k] && S.mast[k].name) || k.split("/").pop() });
}

function typingTrainer(z) {
  const texts = ["asdf jkl; asdf jkl; fjfj dkdk slsl a;a;", "the quick brown fox jumps over the lazy dog", "practice makes progress, not perfect", "learning to type fast saves hours every week", "Randis Academy teaches every subject from zero to infinity."];
  let t = pick(texts), t0 = 0;
  z.innerHTML = `<div class="card"><h3>⌨️ Type this:</h3><p id="tt" style="font-family:Consolas,monospace;font-size:20px"></p><input id="ti" style="width:100%;font-size:20px;font-family:Consolas,monospace" autocomplete="off"><p id="tr"></p><button class="btn" id="tn">New text</button></div>`;
  const show = v => { $("#tt", z).innerHTML = t.split("").map((c, i) => `<span style="background:${i < v.length ? (v[i] === c ? "#c9f0d5" : "#f9c9c5") : i === v.length ? "#ffe9a8" : "none"}">${esc(c)}</span>`).join(""); };
  show(""); const inp = $("#ti", z); inp.focus();
  inp.oninput = () => { if (!t0) t0 = Date.now(); const v = inp.value; show(v); if (v.length >= t.length) { const min = (Date.now() - t0) / 60000, ok = v.split("").filter((c, i) => c === t[i]).length; const wpm = Math.round(t.length / 5 / min), acc = Math.round(100 * ok / t.length); $("#tr", z).innerHTML = `<b>${wpm} WPM</b> · ${acc}% accuracy`; gainXP(3, "Typing"); (S.mind.typing = S.mind.typing || []).push({ d: today(), wpm, acc }); save(); inp.disabled = true; } };
  $("#tn", z).onclick = () => typingTrainer(z);
}

class Mat {

  static col(arr) { const m = new Mat(arr.length, 1); m.re.set(arr); return m; }
  static row(arr) { const m = new Mat(1, arr.length); m.re.set(arr); return m; }
  get n() { return this.r * this.c; }
  get scalar() { return this.r === 1 && this.c === 1; }
