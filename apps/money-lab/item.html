function defaultState(){const st={v:1,sim:{t:0,speed:0,start:DAY0_MS},mk:{},news:[],watch:['SPY','AAPL','BTC','EURUSD','XAU','CL'],learn:{done:{},quiz:{}},budget:null,set:{fees:true,news:true,events:true,inflation:.028},acct:null,accts:[],page:'dash',goals:[]};

function hashS(s){let x=2166136261;for(const c of s)x=Math.imul(x^c.charCodeAt(0),16777619);return x>>>0}
function seedMarket(){for(const a of AS){const r=rng(hashS(a.s));const hist=[a.p0];let p=a.p0;const dt=1/365;
  for(let i=0;i<249;i++){const z=gauss(r);p=p/Math.exp(((a.mu??CLS[a.c].mu)-.5*a.v*a.v)*dt+a.v*Math.sqrt(dt)*z);if(a.mr||CLS[a.c].mr){p=Math.exp(Math.log(p)+(Math.log(a.p0)-Math.log(p))*.02)}hist.unshift(p)}
  S.mk[a.s]={p:a.p0,h:hist.map(x=>+x.toPrecision(6)),o:a.p0}}}
function mk(sym){let m=S.mk[sym];if(!m&&AM[sym]){const a=AM[sym];m=S.mk[sym]={p:a.p0,h:[a.p0],o:a.p0}}return m}

function tstr(){const d=simDate();const fr=S.sim.t-Math.floor(S.sim.t);const mins=Math.floor(fr*1440);return dstr()+' '+String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')}

function quote(sym){const a=qs(sym),p=price(sym);let sp=spreadOf(a);let half=p*sp/2;if(a.c==='opt')half=Math.max(.01,half);return{bid:Math.max(0,p-half),ask:p+half,mid:p}}
function q2u(a){if(a.c!=='fx')return 1;const qc=a.s.slice(3);if(qc==='USD')return 1;if(AM['USD'+qc])return 1/price('USD'+qc);if(AM[qc+'USD'])return price(qc+'USD');return 1}

function ncdf(x){const t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2);const p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p}
function bs(Sp,K,T,r,v,type,q=0){if(T<=0)return{p:Math.max(0,type==='C'?Sp-K:K-Sp),d:type==='C'?(Sp>K?1:0):(Sp<K?-1:0),g:0,th:0,ve:0};
 const sq=Math.sqrt(T),d1=(Math.log(Sp/K)+(r-q+v*v/2)*T)/(v*sq),d2=d1-v*sq,nd1=Math.exp(-d1*d1/2)/Math.sqrt(2*Math.PI);
 const p=type==='C'?Sp*Math.exp(-q*T)*ncdf(d1)-K*Math.exp(-r*T)*ncdf(d2):K*Math.exp(-r*T)*ncdf(-d2)-Sp*Math.exp(-q*T)*ncdf(-d1);
 const delta=type==='C'?Math.exp(-q*T)*ncdf(d1):Math.exp(-q*T)*(ncdf(d1)-1);const g=Math.exp(-q*T)*nd1/(Sp*v*sq);
 const th=(type==='C'?(-Sp*nd1*v/(2*sq)-r*K*Math.exp(-r*T)*ncdf(d2)):(-Sp*nd1*v/(2*sq)+r*K*Math.exp(-r*T)*ncdf(-d2)))/365;
 return{p:Math.max(0,p),d:delta,g,th,ve:Sp*nd1*sq/100}}
const RF=.04;
function optParts(sym){const [u,t,K,e]=sym.split('|');return{u,t,K:+K,e:+e}}
function optAsset(sym){if(!sym||!sym.includes('|'))return null;const o=optParts(sym);const ua=AM[o.u];if(!ua)return null;
 return{s:sym,n:`${o.u} ${dstr(o.e)} $${o.K} ${o.t==='C'?'call':'put'}`,c:'opt',mult:100,v:ua.v,y:0,u:o.u,K:o.K,t:o.t,e:o.e,p0:1}}
function optGreeks(sym){const o=optParts(sym),a=AM[o.u];return bs(price(o.u),o.K,(o.e-S.sim.t)/365,RF,a.v*1.05,o.t,a.y)}
function optPrice(sym){return optGreeks(sym).p}
function expiries(){const t=S.sim.t,out=[];let d=Math.ceil(t+1);while(out.length<4){if(d%7===4)out.push(d);d++}
 for(let x=Math.ceil((t+30)/28)*28+4;x<t+400;x+=28)if(!out.includes(x))out.push(x);return out.sort((a,b)=>a-b)}

function pmt(r,n,pv){return r?pv*r/(1-Math.pow(1+r,-n)):pv/n}

C('Home & real estate','afford','How much house can I afford?','Using the 28/36 lender rules.',[['inc','Gross yearly income',95000],['debt','Other monthly debt payments',450],['d','Down payment saved',40000],['r','Rate %',6.3,'%'],['tx','Tax + insurance % of price per year',1.6,'%']],v=>{const m=v.inc/12;const maxH=Math.min(m*.28,m*.36-v.debt);const r=v.r/1200,n=360;
 let lo=0,hi=5e6;for(let i=0;i<60;i++){const pr=(lo+hi)/2;const pay=pmt(r,n,Math.max(0,pr-v.d))+pr*v.tx/1200;if(pay>maxH)hi=pr;else lo=pr}return{big:['Up to about',money(lo,0)],rows:[['Max housing payment',money(maxH)],['Front-end limit (28%)',money(m*.28)],['Back-end limit (36%) minus debts',money(m*.36-v.debt)]],note:'What a lender approves is a ceiling, not a target. Leave room for repairs (1–2% of the price per year) and savings.'}});
C('Home & real estate','rvb','Rent vs buy','Which leaves you wealthier after N years.',[['pr','Home price',400000],['d','Down payment %',20,'%'],['r','Mortgage rate %',6.3,'%'],['rent','Monthly rent for similar home',2300],['ri','Rent increase per year %',3,'%'],['ap','Home price growth per year %',3.5,'%'],['inv','Investment return %',7,'%'],['tx','Property tax %',1.1,'%'],['mt','Maintenance %',1.2,'%'],['ins','Insurance per year',1800],['y','Years you\'ll stay',10]],v=>{
 const down=v.pr*v.d/100,close=v.pr*.03,P=v.pr-down;const a=amort(P,v.r/100,30);let home=v.pr,bal=P,rent=v.rent,port=down+close;const B=[],Rn=[];
 for(let y=0;y<=v.y;y++){const sell=home*.92-bal;B.push(sell);Rn.push(port);if(y===v.y)break;let ownCost=0;for(let m=0;m<12;m++){const i=bal*v.r/1200;bal=Math.max(0,bal-(a.p-i));ownCost+=a.p}ownCost+=home*(v.tx+v.mt)/100+v.ins;
  const rentCost=rent*12+200;port=port*(1+v.inv/100)+(ownCost-rentCost);home*=1+v.ap/100;rent*=1+v.ri/100}
 const diff=B[v.y]-Rn[v.y];return{big:[diff>=0?'Buying comes out ahead by':'Renting comes out ahead by',money(Math.abs(diff),0)],rows:[['Owner\'s wealth after selling (8% costs)',money(B[v.y],0)],['Renter\'s invested savings',money(Rn[v.y],0)],['Price-to-rent ratio',(v.pr/(v.rent*12)).toFixed(1)+' (over ~20 often favors renting)']],chart:yrsCh([B,Rn],['Buy','Rent and invest']),note:'The renter invests the down payment and any monthly difference. Short stays favor renting because buying and selling cost ~10%.'}});
C('Home & real estate','refi','Refinance break-even','When a refinance pays for itself.',[['b','Loan balance',300000],['r1','Current rate %',7.2,'%'],['y1','Years left',27],['r2','New rate %',6.0,'%'],['y2','New term (years)',30],['c','Closing costs',6000]],v=>{const p1=pmt(v.r1/1200,v.y1*12,v.b),p2=pmt(v.r2/1200,v.y2*12,v.b);const s=p1-p2;return{big:['Break-even in',s>0?Math.ceil(v.c/s)+' months':'never (payment rises)'],rows:[['Old payment',money(p1)],['New payment',money(p2)],['Monthly savings',money(s)],['Lifetime interest change',money((p2*v.y2*12-v.b+v.c)-(p1*v.y1*12-v.b))]],note:'Restarting at 30 years can lower the payment but raise lifetime interest.'}});

C('Investing','rr','Risk/reward & win rate','What win rate you need to break even.',[['e','Entry',50],['s','Stop',47],['t','Target',59]],v=>{const risk=Math.abs(v.e-v.s),rew=Math.abs(v.t-v.e);return{big:['Reward : risk',(rew/risk).toFixed(2)+' : 1'],rows:[['Break-even win rate',(risk/(risk+rew)*100).toFixed(1)+'%']]}});
C('Investing','fee','Fee drag','What fund fees cost over decades.',[['p','Invested',100000],['r','Return before fees %',7,'%'],['f1','Low fee %',.05,'%'],['f2','High fee %',1,'%'],['y','Years',30]],v=>{const A=[],B=[];for(let i=0;i<=v.y;i++){A.push(v.p*Math.pow(1+(v.r-v.f1)/100,i));B.push(v.p*Math.pow(1+(v.r-v.f2)/100,i))}return{big:['High fee costs you',money(A[v.y]-B[v.y],0)],chart:yrsCh([A,B],['Low fee','High fee']),note:'A 1% fee sounds small but can eat about a quarter of your money over 30 years.'}});
C('Investing','dca','Dollar-cost averaging','Buying a fixed $ amount each month.',[['a','Amount each time',500],['p','Prices (comma separated)','50,40,30,40,50,60']],v=>{const ps=String(v.p).split(',').map(Number).filter(x=>x>0);const sh=ps.reduce((s,p)=>s+v.a/p,0);const avg=ps.length*v.a/sh;return{big:['Average cost per share',money(avg)],rows:[['Average price',money(ps.reduce((a,b)=>a+b,0)/ps.length)],['Shares bought',num(sh,3)],['Value at last price',money(sh*ps[ps.length-1])],['Invested',money(ps.length*v.a)]],note:'Fixed amounts buy more shares when prices are low, so your average cost is below the average price.'}});
C('Investing','graham','Graham number & P/E','Old-school value checks.',[['eps','Earnings per share',6],['bv','Book value per share',30],['p','Share price',95]],v=>{const g=Math.sqrt(22.5*v.eps*v.bv);return{big:['Graham number',money(g)],rows:[['P/E ratio',(v.p/v.eps).toFixed(1)],['P/B ratio',(v.p/v.bv).toFixed(2)],['Earnings yield',(v.eps/v.p*100).toFixed(2)+'%'],[v.p<g?'Below Graham number':'Above Graham number','']]}});

 const be=v.t==='call'?v.k+v.p:v.k-v.p;return{big:['Break-even price',money(be)],rows:[['Max loss',v.side==='buy'?money(v.p*100*v.n):'unlimited (call) / large (put)'],['Max gain',v.side==='buy'?(v.t==='call'?'unlimited':money((v.k-v.p)*100*v.n)):money(v.p*100*v.n)]],chart:lineChart([{name:'Profit',data:ys}],{x:xs,zero:true,tf:v=>money(v,0)})}});

/* ---------- calculator page ---------- */
function pgCalc(el){S.calcV=S.calcV||{};const cats=[...new Set(CALCS.map(c=>c.cat))];const cur=CALCS.find(c=>c.id===S.calc)||CALCS[0];
 el.append(h('h1',null,'🧮 Calculators'),h('p',{class:'sub'},CALCS.length+' calculators for everyday money choices. Your inputs are remembered.'));
 const g=h('div',{class:'grid',style:'grid-template-columns:250px minmax(0,1fr)'});el.append(g);
 const q=h('input',{placeholder:'Search calculators…',value:S.cq||'',style:'width:100%;margin-bottom:6px',oninput:e=>{S.cq=e.target.value;list()}});const ln=h('div',{class:'calcl list',style:'max-height:72vh'});g.append(h('div',{class:'card'},q,ln));
 function list(){ln.innerHTML='';const t=(S.cq||'').toLowerCase();for(const c of cats){const it=CALCS.filter(x=>x.cat===c&&(!t||(x.name+' '+x.desc).toLowerCase().includes(t)));if(!it.length)continue;ln.append(h('div',{class:'mut',style:'font-size:11px;text-transform:uppercase;margin:8px 0 2px'},c),it.map(x=>h('a',{class:x===cur?'on':'',onclick:()=>{S.calc=x.id;render()}},x.name)))}}list();
 const right=h('div');g.append(right);right.append(calcBox(cur))}
function calcBox(c){S.calcV=S.calcV||{};const V=S.calcV[c.id]=Object.assign({},Object.fromEntries(c.inp.map(i=>[i[0],Array.isArray(i[3])?i[3].includes(String(i[2]))?String(i[2]):i[3][0]:i[2]])),S.calcV[c.id]||{});
 const box=h('div',{class:'card'},h('h2',{style:'margin-top:0'},c.name),h('p',{class:'mut',style:'margin-top:0'},c.desc));const f=h('div',{class:'form'});box.append(f);const out=h('div');
 for(const [k,l,d,kind] of c.inp){let inp;if(Array.isArray(kind))inp=h('select',{onchange:e=>{V[k]=e.target.value;run()}},kind.map(o=>h('option',{value:o,selected:String(V[k])===o},(FS.find(f=>f[0]===o)||[0,o])[1])));
  else if(kind==='txt')inp=h('textarea',{rows:5,oninput:e=>{V[k]=e.target.value;run()}},String(V[k]));
  else inp=h('input',{type:typeof d==='number'?'number':'text',step:'any',value:V[k],oninput:e=>{V[k]=typeof d==='number'?+e.target.value:e.target.value;run()}});
  f.append(h('label',null,l),inp)}

const COURSES=[
{id:'basics',ic:'🌱',t:'Money basics',d:'Budgeting, saving and the habits everything else is built on.',L:[
['Where your money goes','<p>Most money problems are not income problems first; they are <b>visibility</b> problems. Before changing anything, track every dollar for one month. Group spending into <b>needs</b> (housing, food, transport, insurance, minimum debt payments), <b>wants</b> (eating out, hobbies, upgrades) and <b>future you</b> (saving, investing, extra debt payments).</p><p>The <b>50/30/20</b> guideline splits take-home pay 50% needs, 30% wants, 20% future. It is a starting point, not a law. <b>Zero-based budgeting</b> gives every dollar a job until nothing is unassigned. Use the Budget page to try both.</p>'],
['Pay yourself first','<p>If you save what is left at the end of the month, there usually isn\'t anything left. Flip it: set up an <b>automatic transfer</b> to savings and investments the day you get paid, then live on the rest. Automation beats willpower.</p><p>Start small: even 1% of pay builds the habit. Each time you get a raise, send half of it to savings before you get used to spending it (this avoids <b>lifestyle creep</b>).</p>'],
['The emergency fund','<p>An emergency fund is cash for job loss, car repairs and medical bills, so a surprise doesn\'t become credit card debt. Build a <b>starter fund</b> of $1,000–$2,000 first, then grow it to <b>3–6 months of essential expenses</b> (more if your income is irregular).</p><p>Keep it in a <b>high-yield savings account</b>: safe, easy to reach, and paying interest. It is not an investment; its job is to be there.</p>'],
['Order of operations','<ol><li>Starter emergency fund</li><li>Get your full employer 401(k) match (free money)</li><li>Pay off high-interest debt (over ~8%)</li><li>Full emergency fund</li><li>Max out tax-advantaged accounts (Roth IRA, HSA, 401(k))</li><li>Save for big goals (home, kids\' education)</li><li>Invest in taxable accounts, pay off low-rate debt early</li></ol><p>This order puts the highest guaranteed returns first.</p>']],
Q:[['Which is a "need"?',['Streaming service','Rent','New phone upgrade','Concert tickets'],1,'Housing is an essential need.'],['What does "pay yourself first" mean?',['Buy something nice each payday','Save automatically before spending','Pay your bills late','Pay off the smallest bill first'],1,'Saving comes off the top, automatically.'],['Where should an emergency fund live?',['In stocks','In crypto','In a high-yield savings account','Under the mattress'],2,'It must be safe and easy to reach, and should still earn interest.']]},
{id:'credit',ic:'💳',t:'Credit & debt',d:'Credit scores, interest, cards and getting out of debt.',L:[
['How interest works against you','<p><b>APR</b> is the yearly interest rate on a loan. Credit cards average over 20% APR. A $5,000 balance at 22% costs about $1,100 a year in interest alone. <b>Compound interest</b> grows savings, and it grows debt just as fast.</p><p>Paying only the <b>minimum</b> on a card can stretch a balance over a decade or more. Try the credit card calculator.</p>'],
['Your credit score','<p>In the US a FICO score runs 300–850, built from: <b>payment history</b> (35%), <b>amounts owed / utilization</b> (30%), <b>length of history</b> (15%), <b>new credit</b> (10%) and <b>credit mix</b> (10%).</p><ul><li>Never miss a payment: set up autopay for at least the minimum.</li><li>Keep card balances under 30% of limits (under 10% is better).</li><li>Keep old cards open; don\'t apply for lots of credit at once.</li></ul><p>Check your reports free at AnnualCreditReport.com. A credit <b>freeze</b> at all three bureaus is free and stops most identity-theft accounts.</p>'],
['Good debt, bad debt','<p>Debt is a tool. It can make sense when it buys something that grows in value or raises your income at a low rate: a reasonable mortgage, an affordable degree with good job prospects. It hurts when it funds things that lose value at a high rate: credit card lifestyle spending, expensive car loans, payday loans.</p><p>Ask: what is the rate, what does it buy, and could I pay it back if my income dropped?</p>'],
['Getting out of debt','<p>List every debt with balance, rate and minimum. Pay all minimums, then throw every extra dollar at one target:</p><ul><li><b>Avalanche</b>: highest rate first. Cheapest overall.</li><li><b>Snowball</b>: smallest balance first. Quick wins keep you motivated.</li></ul><p>Also: call card issuers and ask for a lower rate; consider a 0% balance transfer (watch the 3–5% fee and the end date); avoid debt settlement companies that charge big fees and wreck your credit.</p>']],
Q:[['What is the biggest factor in a FICO score?',['Credit mix','Payment history','Income','Number of cards'],1,'Payment history is about 35%.'],['Debt avalanche pays first the debt with…',['The smallest balance','The highest interest rate','The newest date','The biggest balance'],1,'Highest rate first saves the most interest.'],['A good credit utilization is…',['Under 30%','About 50%','Exactly 100%','It doesn\'t matter'],0,'Under 30%, ideally under 10%.']]},
{id:'invest101',ic:'📈',t:'Investing 101',d:'Stocks, bonds, funds, risk and why time matters most.',L:[
['Why invest at all?','<p>Cash loses buying power to <b>inflation</b> (around 2–3% a year in normal times). Investing lets money grow faster than prices rise. Over the long run, US stocks have returned roughly 10% a year before inflation (about 7% after), though with big drops along the way.</p><p>The key ingredient is <b>time</b>: $200 a month from age 25 at 7% grows to about $525,000 by 65. Starting at 35 gives about $245,000.</p>'],
['Stocks, bonds and cash','<ul><li><b>Stocks</b>: ownership in companies. Highest long-run return, biggest swings.</li><li><b>Bonds</b>: loans to governments or companies that pay interest. Steadier, lower return. Prices fall when interest rates rise.</li><li><b>Cash</b> (savings, money market, T-bills): safest, lowest return.</li></ul><p>Your <b>asset allocation</b>, the mix of these, drives most of your results and your risk. A common rule of thumb: hold a % of bonds near your age minus 10–20, but it depends on your goals and nerves.</p>'],
['Funds, index funds and ETFs','<p>A <b>mutual fund</b> or <b>ETF</b> pools money to buy many investments at once. An <b>index fund</b> simply copies a market index like the S&P 500, so it has very low costs.</p><p>Most professional fund managers fail to beat their index over 15+ years after fees. That is why low-cost index funds are the default recommendation for most people. Check the <b>expense ratio</b>: 0.03–0.20% is low, 1% is high (see the fee drag calculator).</p>'],
['Risk, return and diversification','<p>Higher expected return comes with more risk. Risk you can\'t avoid (the whole market) is rewarded; risk you can avoid (one company) usually isn\'t. <b>Diversification</b>, owning many different things, reduces the chance one disaster sinks you.</p><p>Match risk to your <b>time horizon</b>: money needed within 3–5 years shouldn\'t be in stocks. Money for 20+ years can ride out crashes.</p>'],
['Behavior beats brilliance','<p>Investors often earn less than the funds they own because they buy after prices rise and sell in panics. The fix: a written plan, automatic contributions, <b>rebalancing</b> once a year, and not checking prices daily. In this tab, try the "Crash" scenario and practice holding.</p>']],
Q:[['What usually has the highest long-run return?',['Savings account','Bonds','Stocks','Cash'],2,'Stocks, with the most volatility.'],['An index fund…',['Tries to beat the market by picking stocks','Copies a market index at low cost','Is guaranteed not to lose money','Only holds bonds'],1,'It tracks an index cheaply.'],['When interest rates rise, existing bond prices…',['Rise','Fall','Stay the same','Double'],1,'New bonds pay more, so old ones are worth less.'],['Money you need in 2 years should be in…',['Crypto','Small-cap stocks','Savings or short-term bonds','Options'],2,'Short horizons need safe assets.']]},
{id:'trading',ic:'⚡',t:'Trading & markets',d:'Orders, spreads, margin, shorting and managing risk.',L:[
['How a trade happens','<p>The <b>bid</b> is the highest price a buyer will pay; the <b>ask</b> is the lowest price a seller will take. The gap is the <b>spread</b>, a hidden cost. You buy at the ask and sell at the bid.</p><ul><li><b>Market order</b>: fill now at the best available price.</li><li><b>Limit order</b>: only at your price or better; may never fill.</li><li><b>Stop order</b>: becomes a market order once the price hits your stop. Used to limit losses.</li><li><b>Stop-limit</b>: becomes a limit order at the stop. Protects price but may not fill in a crash.</li><li><b>Trailing stop</b>: a stop that follows the price up by a set %.</li></ul>'],
['Margin and leverage','<p><b>Margin</b> is borrowing from your broker to buy more. Leverage magnifies both directions: with 2× leverage a 10% drop is a 20% loss. If your equity falls too far you get a <b>margin call</b>: add cash or the broker sells for you, often at the worst moment. In this tab, forex is 50:1 and futures 10:1, so you can see how fast it goes.</p>'],
['Short selling','<p>Shorting means borrowing shares, selling them, and hoping to buy them back cheaper. Your gain is capped (the price can only go to zero) but your <b>loss is unlimited</b>, because the price can keep rising. You also pay borrowing fees and any dividends. Short squeezes happen when many shorts rush to buy back at once.</p>'],
['Fundamental vs technical analysis','<p><b>Fundamental</b> analysis values a business: revenue, profits, debt, growth, competitive moat (see Modeling: DCF, ratios). <b>Technical</b> analysis studies price and volume patterns: moving averages, support/resistance, RSI. Evidence that technical rules beat the market after costs is weak; try the backtester.</p>'],
['Risk management','<p>Professional traders focus on not losing big. Rules many use: risk only 0.5–2% of the account per trade (position size calculator); decide your exit before you enter; use stops; avoid revenge trading after a loss; keep a trading journal. Most day traders lose money over time; studies of retail day traders find only a small fraction profit consistently.</p>']],
Q:[['You buy at the…',['Bid','Ask','Mid','Close'],1,'Buyers pay the ask.'],['A limit buy order at $50 fills…',['At any price','Only at $50 or lower','Only above $50','Never'],1,'At your price or better.'],['Maximum loss on a short sale is…',['The amount invested','Zero','Unlimited','50%'],2,'Prices can rise without limit.'],['With 10× leverage, a 10% move against you…',['Loses 1%','Loses 10%','Wipes out your margin','Has no effect'],2,'10 × 10% = 100%.']]},
{id:'options',ic:'🎯',t:'Options & derivatives',d:'Calls, puts, the Greeks and common strategies.',L:[
['Calls and puts','<p>An <b>option</b> is a contract giving the right, not the obligation, to buy (<b>call</b>) or sell (<b>put</b>) 100 shares at a set <b>strike</b> price until <b>expiration</b>. You pay a <b>premium</b> for that right.</p><p>Buy a call if you think the price will rise a lot, soon. Buy a put to profit from a fall or to insure shares you own. If the option isn\'t worth exercising at expiry it expires worthless and you lose the premium.</p>'],
['What sets the price','<p>Premium = <b>intrinsic value</b> (how far in the money) + <b>time value</b>. Time value depends on time left, volatility and interest rates. This tab prices options with the <b>Black-Scholes</b> model.</p><ul><li><b>Delta</b>: price change per $1 move in the stock.</li><li><b>Gamma</b>: how fast delta changes.</li><li><b>Theta</b>: value lost per day (time decay).</li><li><b>Vega</b>: change per 1% change in volatility.</li></ul>'],
['Selling options','<p>Option sellers (writers) collect the premium and take the risk. A <b>covered call</b> (own the shares, sell a call) earns income but caps your upside. A <b>cash-secured put</b> gets paid to wait to buy a stock cheaper. Selling <b>naked calls</b> has unlimited risk.</p>'],
['Strategies','<p>Spreads combine options to shape risk: <b>bull call spread</b> (cheaper bullish bet with capped gain), <b>protective put</b> (insurance), <b>straddle</b> (bet on a big move either way), <b>iron condor</b> (bet on the price staying in a range). Try them in Modeling → Option strategies.</p><p><b>Futures</b> are different: an obligation to buy or sell at a set price on a date, with leverage and daily settlement.</p>']],
Q:[['A put option gains value when the stock…',['Rises','Falls','Pays a dividend','Is flat'],1,'Puts are the right to sell at the strike.'],['Theta measures…',['Sensitivity to volatility','Time decay','Interest rates','Dividend yield'],1,'Value lost each day.'],['One stock option contract usually covers…',['1 share','10 shares','100 shares','1,000 shares'],2,'100 shares.']]},
{id:'fx',ic:'💱',t:'Forex, commodities & futures',d:'Currencies, oil, grain and the contracts behind them.',L:[
['Currency pairs','<p>Forex quotes are pairs: EUR/USD 1.16 means 1 euro costs 1.16 dollars. The first is the <b>base</b>, the second the <b>quote</b> currency. Buying the pair means betting the base rises. A <b>pip</b> is usually the 4th decimal (0.0001), or the 2nd for yen pairs.</p><p>Currencies move on interest rate differences, inflation, trade and risk mood. The US dollar tends to strengthen in crises (safe haven).</p>'],
['Why most retail forex traders lose','<p>Forex brokers offer leverage up to 50:1 in the US and higher elsewhere. At 50:1 a 2% move wipes out the deposit. Regulators in Europe require brokers to disclose that roughly 70–80% of retail CFD and forex accounts lose money. Watch for unregulated offshore brokers and "forex signal" groups, both common scams.</p>'],
['Commodities','<p>Commodities are raw materials: <b>energy</b> (oil, natural gas), <b>agriculture</b> (corn, wheat, coffee, cattle), <b>metals</b> (copper, gold). Prices swing with supply shocks (weather, wars, OPEC decisions) and the business cycle. Most people get commodity exposure through funds; note that oil funds holding futures can lag the oil price because of <b>contango</b> (rolling into pricier future contracts).</p>'],
['Futures contracts','<p>A future is a standardized agreement to buy or sell an amount (e.g. 1,000 barrels of oil) at a set price on a future date. Farmers and airlines use them to <b>hedge</b>; speculators use them for leverage. Margin is a deposit, and gains and losses settle every day (<b>mark-to-market</b>). The E-mini S&P 500 future moves $50 per index point.</p>']],
Q:[['EUR/USD = 1.16 means…',['1 dollar = 1.16 euros','1 euro = 1.16 dollars','Euros are 16% cheaper','Nothing'],1,'Base currency priced in quote currency.'],['Why do farmers use futures?',['To gamble','To lock in prices (hedge)','To avoid taxes','To get loans'],1,'Hedging removes price uncertainty.'],['Contango can make oil funds…',['Beat oil','Lag oil','Pay dividends','Risk-free'],1,'Rolling into pricier contracts costs money.']]},
{id:'crypto',ic:'🪙',t:'Crypto',d:'Blockchains, wallets, stablecoins and the risks.',L:[
['What crypto is','<p>A <b>cryptocurrency</b> is a digital token tracked on a <b>blockchain</b>, a shared ledger kept by many computers. Bitcoin (2009) has a fixed supply of 21 million coins. Ethereum runs programs called <b>smart contracts</b>, used for decentralized finance (DeFi) and NFTs.</p><p>Crypto has no earnings or cash flow; prices come from adoption, scarcity and sentiment. Drops of 70–80% have happened several times.</p>'],
['Wallets and custody','<p>Whoever holds the <b>private key</b> controls the coins. "Not your keys, not your coins": exchanges have failed and frozen withdrawals (Mt. Gox, FTX). Options: keep on a regulated exchange (convenient, counterparty risk), a <b>hot wallet</b> app, or a <b>hardware wallet</b> (safest, but lose the seed phrase and the coins are gone for good).</p><p><b>Never share a seed phrase.</b> No legitimate support agent will ever ask for it.</p>'],
['Stablecoins, DeFi and yield','<p><b>Stablecoins</b> aim to stay at $1, backed by cash and Treasuries (USDC, USDT) or by algorithms. Algorithmic TerraUSD collapsed in 2022, wiping out about $40 billion. High "yield" on crypto deposits means someone is taking risk with your money; several lenders paying 8–20% went bankrupt in 2022.</p>'],
['Investing in crypto sensibly','<p>If you buy crypto, treat it as a high-risk slice you can afford to lose (many suggest 1–5% of investments at most). Prefer the largest assets on regulated platforms or spot ETFs, avoid leverage, and keep records: every sale or swap is taxable in the US. Most scams today involve crypto; read the Scam center.</p>']],
Q:[['Who controls crypto in a wallet?',['The exchange always','Whoever has the private key','The government','The miner'],1,'Keys = control.'],['A support agent asks for your seed phrase. You…',['Give it','Give half','Never share it; it\'s a scam','Email it'],2,'No legitimate service ever needs it.'],['In the US, swapping one coin for another is…',['Tax-free','A taxable event','Illegal','Only taxed over $10k'],1,'Crypto is treated as property.']]},
{id:'real',ic:'🥇',t:'Metals, gems, collectibles & property',d:'Real things you can hold, and their hidden costs.',L:[
['Gold and silver','<p>Gold has been money for thousands of years. It pays no income but often holds value in inflation, currency crises and panics. You can own <b>bullion</b> (bars and coins; buy near spot from reputable dealers, mind storage and insurance), <b>ETFs</b> (cheap and liquid) or mining stocks (leveraged to the gold price).</p><p>Avoid "numismatic" or "collector" coins pushed on TV or by phone: markups of 30–100% over metal value are common. In the US, gains on physical metal are taxed as collectibles (up to 28%).</p>'],
['Gems and jewelry','<p>Gems are poor investments for most people. Each stone is unique, there is no transparent market, and retail prices carry 50–200% markups. Selling back to a dealer typically gets 20–50% of the retail price. <b>Lab-grown diamonds</b> are chemically real diamonds, but their prices have fallen sharply as production grew, and resale value is near zero. Buy jewelry because you love it, not as savings. Always insist on a lab report (GIA for diamonds).</p>'],
['Collectibles','<p>Watches, wine, classic cars, cards, comics and art can rise in value, but: no income, high transaction costs (auction fees of 10–25% on each side), storage and insurance, fakes, and tastes change (think Beanie Babies). Treat them as a passion that might appreciate. Fractional collectible apps add their own fees and risks.</p>'],
['Real estate','<p>Ways to own property: your <b>home</b> (a place to live first, investment second), <b>rentals</b> (income, leverage, tax breaks, but tenants, repairs and concentration risk), <b>REITs</b> (stocks of property companies; liquid, diversified, high dividends) and <b>crowdfunding</b> (illiquid, check fees). Key numbers: cap rate, cash-on-cash return, the 1% rule (see Calculators → Home & real estate).</p>']],
Q:[['Typical dealer buyback on a retail gem is…',['110% of retail','About retail','20–50% of retail','Exactly spot'],2,'Markups are huge.'],['Which gives property exposure with daily liquidity?',['A duplex','Farmland','REITs','A timeshare'],2,'REITs trade like stocks.'],['US long-term gains on gold bullion are taxed up to…',['0%','15%','28%','50%'],2,'As collectibles.']]},
{id:'retire',ic:'🏖',t:'Retirement',d:'401(k)s, IRAs, Social Security and making money last.',L:[
['The accounts','<p><b>401(k)/403(b)</b>: through your employer, often with a <b>match</b> (free money). <b>IRA</b>: you open it yourself. <b>Traditional</b> versions give a tax break now and are taxed when withdrawn; <b>Roth</b> versions are taxed now and grow tax-free. Withdrawals before 59½ usually carry a 10% penalty, with exceptions. See Taxes → Account types for '+2026+' limits.</p>'],
['How much is enough?','<p>A common target: savings of about <b>25× the yearly spending</b> your pension and Social Security don\'t cover. That comes from the <b>4% rule</b>: historically, withdrawing 4% in year one and raising it with inflation lasted 30 years in most US market histories. Saving 15% of income from your 20s or 30s usually gets most people there. Use the retirement and Monte Carlo tools.</p>'],
['Social Security','<p>You can claim from 62 to 70. Full retirement age is 67 for people born 1960 or later. Claiming at 62 permanently cuts benefits about 30%; waiting to 70 raises them 24% above the full amount. Waiting usually pays off if you expect to live past about 80 or want the bigger survivor benefit for a spouse. Check your record at ssa.gov.</p>'],
['Spending it down','<p>Retirement risks: <b>sequence of returns</b> (a crash early in retirement hurts most), longevity (living to 95+), inflation and health costs. Tools: keep 1–3 years of spending in cash or short bonds, flexible spending rules, delaying Social Security, annuities for a guaranteed floor. <b>RMDs</b> force withdrawals from traditional accounts from age 73 (75 for those born 1960+).</p>']],
Q:[['The 4% rule suggests a nest egg of about…',['4× spending','10× spending','25× spending','100× spending'],2,'1 ÷ 4% = 25.'],['Roth accounts are taxed…',['When you withdraw','When you contribute (then grow tax-free)','Never at all','Twice'],1,'Pay tax now, tax-free later.'],['Claiming Social Security at 70 instead of 67 gives about…',['The same','8% more','24% more','Double'],2,'8% per year of delay.']]},
{id:'taxes',ic:'🧾',t:'Taxes',d:'Brackets, deductions, capital gains and legal ways to pay less.',L:[
['Brackets and rates','<p>The US uses <b>progressive brackets</b>: each slice of income is taxed at its own rate (10% to 37%). Your <b>marginal rate</b> is the rate on your last dollar; your <b>effective rate</b> is total tax ÷ income, always lower. A raise can never reduce your take-home pay through brackets.</p>'],
['Deductions vs credits','<p>A <b>deduction</b> lowers taxable income (worth your bracket %: a $1,000 deduction saves $220 in the 22% bracket). A <b>credit</b> cuts tax dollar for dollar ($1,000 credit = $1,000). Most people take the <b>standard deduction</b>; itemize only if mortgage interest, state taxes (SALT), and charity add up to more.</p>'],
['Investment taxes','<p><b>Short-term gains</b> (held 1 year or less) are taxed as ordinary income. <b>Long-term gains</b> and qualified dividends get 0%, 15% or 20%. High earners add the 3.8% net investment income tax. Losses offset gains and up to $3,000 of ordinary income a year. Watch the <b>wash sale</b> rule.</p>'],
['Paying less, legally','<ul><li>Use tax-advantaged accounts (401(k), IRA, HSA, 529).</li><li>Hold investments over a year.</li><li>Harvest losses; place bonds in tax-deferred accounts.</li><li>Give appreciated stock to charity instead of cash.</li><li>Claim credits you qualify for (EITC, child, education, saver\'s credit).</li></ul><p>Tax <b>avoidance</b> (using the rules) is legal; tax <b>evasion</b> (hiding income) is a crime. Beware anyone promising to make your taxes disappear.</p>']],
Q:[['A $1,000 tax credit saves…',['$1,000','$220','Depends on bracket','$0'],0,'Credits cut tax dollar for dollar.'],['Long-term capital gains require holding more than…',['30 days','6 months','1 year','5 years'],2,'More than one year.'],['Your effective rate is…',['Your top bracket','Total tax ÷ income','Always 37%','The sales tax'],1,'It is your average rate.']]},
{id:'estate',ic:'🏛',t:'Estate planning',d:'Wills, trusts, beneficiaries and passing on wealth.',L:[
['Why everyone needs a plan','<p>Estate planning isn\'t just for the rich. It decides who raises your kids, who makes medical decisions if you can\'t, and who gets what you own, without a court deciding for you. The core documents: <b>will</b>, <b>financial power of attorney</b>, <b>healthcare proxy</b>, <b>living will</b>, plus up-to-date <b>beneficiary designations</b>.</p>'],
['Probate and trusts','<p><b>Probate</b> is the public court process for settling a will; it can be slow and costly. A <b>revocable living trust</b> avoids it: you keep control while alive and your successor trustee distributes assets privately. Accounts with beneficiaries or transfer-on-death designations skip probate too.</p>'],
['Estate and gift tax','<p>In 2026 each person can give or leave $15 million free of federal estate tax (married couples $30M). Above that the rate is 40%. You can also give $19,000 per person per year with no paperwork. Some states tax much smaller estates. Inherited assets usually get a <b>step-up in basis</b>, erasing capital gains.</p>'],
['Keeping it current','<p>Review after marriage, divorce, births, deaths, moves to a new state, or big changes in wealth. Tell your executor where documents are. List digital accounts and how to access them. Use the checklist on the Estate planning page.</p>']],
Q:[['Which overrides your will?',['Nothing','Beneficiary designations on accounts','Your social media','A verbal promise'],1,'Beneficiary forms control those accounts.'],['A revocable living trust mainly helps you…',['Avoid income tax','Avoid probate','Avoid all estate tax','Get a loan'],1,'It skips probate and keeps things private.'],['The 2026 annual gift exclusion per recipient is…',['$3,000','$19,000','$100,000','$15 million'],1,'$19,000.']]},
{id:'home',ic:'🏡',t:'Buying a home',d:'Down payments, mortgages, closing and rent vs buy.',L:[
['Are you ready?','<p>Signs you\'re ready: stable income, an emergency fund that survives the down payment, manageable debt (total debt payments under ~36% of gross income), a credit score of 680+ (740+ for the best rates), and a plan to stay at least 5 years.</p>'],
['Mortgages explained','<p>A <b>fixed-rate</b> mortgage keeps the same rate for 15 or 30 years. An <b>ARM</b> starts lower then adjusts. <b>Conventional</b> loans need 3–20% down (PMI under 20%); <b>FHA</b> needs 3.5%; <b>VA</b> and <b>USDA</b> can be 0%. Your payment (PITI) = principal + interest + taxes + insurance. Compare lenders using the <b>Loan Estimate</b> and APR; shopping several lenders can save thousands.</p>'],
['Closing and hidden costs','<p>Budget 2–5% for closing costs (appraisal, title, origination, escrow) and 1–2% of the home\'s value every year for maintenance. Get an <b>inspection</b>. <b>Wire fraud</b> is common at closing: criminals send fake wiring instructions by email. Always confirm by phone using a number you already know.</p>'],
['Rent vs buy','<p>Renting is not "throwing money away"; it buys flexibility and frees money to invest. Buying makes sense when you\'ll stay long enough to beat ~10% round-trip costs and the monthly cost of owning is near the rent. Try the rent vs buy calculator with your real numbers.</p>']],
Q:[['PMI is usually required when the down payment is under…',['5%','10%','20%','50%'],2,'Under 20% on conventional loans.'],['PITI stands for…',['Price, Interest, Tax, Income','Principal, Interest, Taxes, Insurance','Payment In Time Installments','None of these'],1,'The four parts of a mortgage payment.'],['Before wiring money at closing you should…',['Trust the email','Confirm by phone with a known number','Send it twice','Use crypto'],1,'Wire fraud is common.']]},
{id:'insure',ic:'🛡',t:'Insurance & protection',d:'Covering the risks you can\'t afford to carry.',L:[
['What insurance is for','<p>Insurance transfers risks <b>you can\'t afford</b> to an insurer. Insure against catastrophes; self-insure small stuff with your emergency fund. Higher deductibles lower premiums.</p>'],
['The essentials','<ul><li><b>Health</b>: medical bills are a leading cause of US bankruptcy. Know your deductible and out-of-pocket max.</li><li><b>Auto</b>: liability limits well above state minimums.</li><li><b>Homeowners/renters</b>: renters insurance is cheap and covers your stuff and liability.</li><li><b>Disability</b>: protects your biggest asset, your income.</li><li><b>Term life</b>: if anyone depends on your income.</li><li><b>Umbrella</b>: extra liability coverage once you have assets to protect.</li></ul>'],
['What to skip','<p>Usually poor value: extended warranties, credit card payment protection, flight insurance, cancer-only policies, whole life sold as an "investment" to people who just need coverage. "Buy term and invest the difference" works for most families.</p>']],
Q:[['Insurance is best used for…',['Small, frequent costs','Catastrophic costs you can\'t afford','Investing','Avoiding taxes'],1,'Transfer big risks.'],['For most families, the best-value life insurance is…',['Whole life','Term life','None ever','Variable universal life'],1,'Term is cheap and simple.']]},
{id:'scams',ic:'🚨',t:'Scams & fraud',d:'Spot the tricks before they cost you.',L:[
['The scam playbook','<p>Almost every scam uses the same levers: <b>urgency</b> ("act now"), <b>authority</b> (IRS, police, bank, Microsoft), <b>emotion</b> (fear, love, greed), <b>secrecy</b> ("don\'t tell your bank") and <b>unusual payment</b> (gift cards, wire, crypto, cash by courier). Any two together should stop you cold.</p>'],
['Investment scams','<p>Guaranteed high returns with no risk don\'t exist. Red flags: returns that are too smooth, unregistered sellers (check FINRA BrokerCheck and the SEC\'s IAPD), pressure to recruit others, complex secret strategies, trouble withdrawing. <b>Pig butchering</b>: a stranger builds a friendship or romance online, then shows you a "trading platform" where fake profits grow until you try to withdraw.</p>'],
['Protect yourself','<ul><li>Hang up and call back on a number you look up yourself.</li><li>Never pay with gift cards, crypto ATMs or wires to strangers.</li><li>Freeze your credit; use two-factor authentication.</li><li>Pause and talk to someone you trust before sending money.</li><li>Report to reportfraud.ftc.gov and ic3.gov; contact your bank immediately.</li></ul><p>See the Scam center for 30+ common scams and a quiz.</p>']],
Q:[['A caller says they\'re from the IRS and want gift cards. This is…',['Normal','A scam','A new IRS policy','A tax refund'],1,'The IRS never takes gift cards.'],['Pig butchering usually starts with…',['A bank letter','A friendly stranger online','A TV ad','A tax form'],1,'Long grooming, then fake investing.'],['Best first step when pressured to pay quickly:',['Pay to be safe','Pause, hang up, verify independently','Send half','Use crypto'],1,'Urgency is the scammer\'s tool.']]},
{id:'model',ic:'📐',t:'Financial statements & modeling',d:'Reading a company\'s numbers and valuing it.',L:[
['The three statements','<p>The <b>income statement</b> shows revenue, costs and profit over a period. The <b>balance sheet</b> shows what a company owns (assets), owes (liabilities) and the owners\' stake (equity) at a moment: assets = liabilities + equity. The <b>cash flow statement</b> shows actual cash in and out from operations, investing and financing. Profits can be shaped by accounting; cash is harder to fake.</p>'],
['Key ratios','<p>Margins (gross, operating, net) show profitability; ROE and ROA show efficiency; current and quick ratios show short-term safety; debt-to-equity and interest coverage show leverage; P/E, EV/EBITDA and FCF yield show valuation. Compare to peers and the company\'s own history. Try Modeling → Ratio analysis.</p>'],
['Valuation','<p><b>Intrinsic</b> valuation (DCF) estimates future free cash flows and discounts them at a required return (WACC). <b>Relative</b> valuation (comps) compares multiples with similar companies. Both depend on assumptions; good analysts test ranges (sensitivity analysis) and look for a <b>margin of safety</b>.</p>']],
Q:[['Assets equal…',['Revenue minus costs','Liabilities plus equity','Cash plus debt','Profit times shares'],1,'The balance sheet identity.'],['Which statement is hardest to fake?',['Income statement','Cash flow statement','Press release','Annual letter'],1,'Cash is concrete.']]},
{id:'behave',ic:'🧠',t:'Money psychology',d:'Biases that cost money, and penny wise vs pound foolish.',L:[
['Your brain on money','<ul><li><b>Loss aversion</b>: losses hurt about twice as much as equal gains feel good, so we sell in panics.</li><li><b>Overconfidence</b>: most people think they\'re above-average investors.</li><li><b>Herding / FOMO</b>: buying what everyone else is buying, usually near the top.</li><li><b>Anchoring</b>: fixating on the price you paid.</li><li><b>Recency bias</b>: expecting the recent past to continue.</li><li><b>Mental accounting</b>: treating a tax refund as "fun money" while carrying card debt.</li></ul>'],
['Penny wise, pound foolish','<p>Being careful with small amounts while wasting large ones. Examples: driving across town to save $2 on gas; skipping a $100 car service then paying $3,000 for an engine; buying cheap shoes three times; hunting coupons but paying 1% fund fees on $200,000 ($2,000 a year); skipping insurance to save a few dollars a month.</p><p>The fix: focus on the <b>big three</b> (housing, transportation, food), then fees, taxes and insurance, and only then small habits. Use the "Penny wise" calculator.</p>'],
['Building good habits','<p>Automate the right choices; make bad ones harder (delete saved cards, wait 30 days before buying); set specific goals; celebrate progress. Talk about money with people you trust; secrecy makes mistakes bigger.</p>']],
Q:[['Loss aversion means…',['You enjoy losing','Losses feel worse than equal gains feel good','You never lose','You avoid saving'],1,'About twice as painful.'],['Which is "pound foolish"?',['Comparing unit prices','Skipping cheap maintenance that prevents big repairs','Using a budget','Paying cards in full'],1,'Small savings that cause big costs.']]},
{id:'econ',ic:'🌍',t:'Economics for investors',d:'Inflation, rates, the Fed, recessions and the yield curve.',L:[
['Inflation and interest rates','<p><b>Inflation</b> is the general rise in prices, measured by the CPI. Central banks like the US <b>Federal Reserve</b> target about 2% and use the <b>federal funds rate</b> to steer it: raise rates to cool inflation, cut them to support growth. Higher rates make borrowing costlier, lower bond prices and often pressure stock valuations.</p>'],
['The business cycle','<p>Economies move through expansion, peak, contraction (recession) and recovery. Signals people watch: GDP, unemployment, jobless claims, purchasing managers\' surveys, consumer spending. Markets usually move <b>before</b> the economy, which is why timing them is so hard.</p>'],
['The yield curve','<p>The yield curve plots Treasury yields from short to long maturities. It normally slopes up. When short rates exceed long rates it <b>inverts</b>, which has preceded most US recessions, though with long and variable lags.</p>']],
Q:[['To fight high inflation, the Fed usually…',['Cuts rates','Raises rates','Prints coupons','Buys stocks'],1,'Higher rates cool demand.'],['An inverted yield curve means…',['Long rates above short','Short rates above long','All rates zero','Stocks always rise'],1,'And it often precedes recessions.']]},
{id:'kids',ic:'🎒',t:'Money for teens & young adults',d:'First jobs, first accounts, first credit card.',L:[
['First paycheck','<p>Your pay stub shows gross pay, then deductions: federal and state tax, Social Security and Medicare (FICA), and maybe benefits or 401(k). Net pay is what lands in your account. Fill in your W-4 carefully so you don\'t owe a lot in April.</p>'],
['First accounts','<p>Open a checking account with no monthly fee and a high-yield savings account. If you have earned income, a <b>Roth IRA</b> is a superpower: $1,000 at 18 can grow to about $21,000 by 65 at 7%, tax-free.</p>'],
['First credit','<p>A secured card or student card used for one small bill, paid in full by autopay every month, builds a score with zero interest. Never carry a balance on a card to "build credit": that\'s a myth.</p>'],
['College and student loans','<p>Fill in the FAFSA; apply for scholarships; compare total cost after aid. Borrow federal before private, and no more in total than your expected first-year salary. Community college for two years then transferring can halve the cost.</p>']],
Q:[['To build credit you should…',['Carry a balance','Pay in full every month','Max out the card','Open 10 cards'],1,'Interest is never needed to build credit.'],['A good rule for total student loans:',['No limit','Under your expected first-year salary','5× expected salary','Only private loans'],1,'Keeps payments manageable.']]}
];
/* ---------- encyclopedia: [term, category, definition] ---------- */
const GLOSS=`401(k)|Retirement|An employer retirement plan where you save part of your paycheck, often with a matching contribution, in a tax-advantaged account.
403(b)|Retirement|The 401(k)-style plan for public schools, hospitals and non-profits.
457(b)|Retirement|A deferred-compensation plan for government workers; no 10% early-withdrawal penalty after leaving the job.
529 plan|Education|A tax-advantaged education savings account; growth is tax-free when used for qualified education costs.
Accrued interest|Bonds|Interest earned on a bond since the last coupon payment, paid by the buyer to the seller in a trade.
Active management|Investing|Picking investments to try to beat an index. Usually costs more than passive investing.
Adjustable-rate mortgage (ARM)|Home|A mortgage whose rate is fixed for a few years and then adjusts with market rates.
Adjusted gross income|Taxes|Total income minus certain adjustments (like traditional IRA or HSA contributions); the base for many tax rules.
Alpha|Investing|Return above what the risk taken would predict; a measure of a manager's skill.
Amortization|Debt|Paying off a loan with regular payments that cover interest and gradually reduce principal.
Annual percentage rate (APR)|Debt|The yearly cost of borrowing, including some fees, without compounding.
Annual percentage yield (APY)|Saving|The yearly return on savings including compounding.
Annuity|Retirement|An insurance contract that turns a lump sum into a stream of payments, sometimes for life.
Appreciation|Investing|An increase in the value of an asset.
Arbitrage|Trading|Profiting from price differences of the same thing in different markets at the same time.
Ask|Trading|The lowest price a seller will accept; what you pay when you buy.
Asset|Basics|Anything you own that has value.
Asset allocation|Investing|How your money is split between stocks, bonds, cash and other assets.
Asset location|Taxes|Putting tax-inefficient investments in tax-advantaged accounts to lower total taxes.
Balance sheet|Modeling|A snapshot of what a company owns, owes, and the owners' equity.
Balance transfer|Debt|Moving a credit card balance to another card, often at a 0% promotional rate with a fee.
Basis point|Bonds|One hundredth of one percent (0.01%).
Bear market|Markets|A fall of 20% or more from a recent high.
Beneficiary|Estate|The person named to receive money or property from an account, policy, will or trust.
Beta|Investing|How much an investment moves relative to the market; 1.0 moves with it, 2.0 twice as much.
Bid|Trading|The highest price a buyer will pay; what you receive when you sell.
Bid-ask spread|Trading|The gap between bid and ask; a hidden trading cost.
Black-Scholes|Options|A formula for pricing options from price, strike, time, volatility and interest rates.
Blockchain|Crypto|A shared, append-only ledger maintained by many computers.
Blue chip|Stocks|A large, established, financially strong company.
Bond|Bonds|A loan to a government or company that pays interest and returns principal at maturity.
Bond ladder|Bonds|Bonds with staggered maturities so some money comes due regularly.
Book value|Modeling|A company's assets minus liabilities on its balance sheet.
Bubble|Markets|Prices rising far above fundamental value, driven by speculation, usually ending in a crash.
Budget|Basics|A plan for spending and saving your income.
Bull market|Markets|A sustained rise in prices, often defined as 20%+ from a low.
Buy and hold|Investing|Buying investments and keeping them for years regardless of short-term moves.
Buy now, pay later (BNPL)|Debt|Splitting a purchase into installments, often interest-free if paid on time; late fees apply.
Call option|Options|The right to buy an asset at a set price before a date.
Capital gain|Taxes|Profit from selling an asset for more than its cost basis.
Capital gains tax|Taxes|Tax on capital gains; lower rates for assets held more than a year in the US.
Cap rate|Real estate|Net operating income ÷ property price; a property's unlevered yield.
Cash flow|Basics|Money coming in minus money going out over a period.
Cash-on-cash return|Real estate|Yearly pre-tax cash flow ÷ cash invested.
Certificate of deposit (CD)|Saving|A bank deposit with a fixed rate and term; early withdrawal costs a penalty.
Churning|Scams|A broker trading excessively in your account to earn commissions.
Closing costs|Home|Fees paid to finalize a home purchase or mortgage: appraisal, title, origination and more.
Coinsurance|Insurance|Your share of costs after the deductible, such as 20%.
Collateral|Debt|An asset pledged to secure a loan, which the lender can take if you don't pay.
Collectible|Alternatives|Items like art, coins, wine or cards; taxed up to 28% on long-term gains in the US.
Commodity|Commodities|A basic raw material traded in bulk: oil, wheat, copper, gold.
Compound interest|Saving|Interest earned on both your original money and past interest.
Consumer Price Index (CPI)|Economics|The main US measure of inflation, tracking prices of a basket of goods and services.
Contango|Commodities|When future prices are higher than spot prices; costs funds that roll futures.
Contrarian|Investing|Investing against the crowd.
Convexity|Bonds|How a bond's duration changes as yields change.
Correlation|Investing|How two investments move together, from −1 (opposite) to +1 (lockstep).
Cost basis|Taxes|What you paid for an investment, used to compute gain or loss.
Coupon|Bonds|A bond's interest payment.
Covered call|Options|Owning shares and selling call options on them for income.
Credit freeze|Credit|Blocking new credit in your name at the bureaus; free and the best defense against identity theft.
Credit report|Credit|Your borrowing and payment history kept by Equifax, Experian and TransUnion.
Credit score|Credit|A number (e.g. FICO 300–850) predicting how likely you are to repay debt.
Credit utilization|Credit|Card balances ÷ credit limits; under 30% is good.
Cryptocurrency|Crypto|A digital token recorded on a blockchain.
Currency pair|Forex|Two currencies quoted against each other, like EUR/USD.
Current ratio|Modeling|Current assets ÷ current liabilities; short-term financial health.
Custodian|Investing|The institution that holds your assets for safekeeping.
Day trading|Trading|Buying and selling within the same day. Most retail day traders lose money.
Debt-to-income ratio (DTI)|Debt|Monthly debt payments ÷ gross monthly income; lenders like under 36–43%.
Debt snowball|Debt|Paying the smallest debt first for momentum.
Debt avalanche|Debt|Paying the highest-rate debt first to minimize interest.
Deductible|Insurance|What you pay before insurance pays.
Default|Debt|Failing to repay a loan as agreed.
Deflation|Economics|A general fall in prices.
Delta|Options|How much an option's price moves per $1 move in the underlying.
Depreciation|Basics|Loss of value over time; also a tax deduction for business and rental assets.
Derivative|Trading|A contract whose value comes from another asset: options, futures, swaps.
DeFi|Crypto|Decentralized finance: lending, trading and earning yield via smart contracts without banks.
Dilution|Stocks|Your ownership share shrinking when a company issues new shares.
Discount rate|Modeling|The rate used to convert future cash to today's value; also the Fed's lending rate to banks.
Diversification|Investing|Spreading money across many investments to reduce risk.
Dividend|Stocks|A share of company profits paid to shareholders.
Dividend yield|Stocks|Yearly dividends ÷ share price.
Dollar-cost averaging|Investing|Investing a fixed amount at regular intervals regardless of price.
Dow Jones Industrial Average|Markets|An index of 30 large US companies, weighted by share price.
Down payment|Home|The cash you pay upfront when buying a home.
DRIP|Stocks|Dividend reinvestment plan: dividends automatically buy more shares.
Due diligence|Investing|Researching an investment thoroughly before buying.
Duration|Bonds|A bond's sensitivity to interest rates, in years; ~% price change per 1% rate move.
EBITDA|Modeling|Earnings before interest, taxes, depreciation and amortization; a rough cash-profit measure.
Earnings per share (EPS)|Stocks|Net income ÷ shares outstanding.
Efficient frontier|Investing|The set of portfolios with the highest expected return for each level of risk.
Efficient market hypothesis|Investing|The idea that prices reflect available information, so beating the market consistently is hard.
Emergency fund|Basics|Cash saved for unexpected expenses or job loss, usually 3–6 months of essentials.
Enterprise value (EV)|Modeling|Market value of equity plus debt minus cash; the price of the whole business.
Equity|Basics|Ownership: the value of an asset minus debts on it (home equity, shareholders' equity).
Escrow|Home|A neutral third party holding money; also the part of a mortgage payment for taxes and insurance.
Estate|Estate|Everything you own at death.
Estate tax|Estate|Tax on large estates; the 2026 federal exemption is $15 million per person.
ETF|Investing|Exchange-traded fund: a fund that trades like a stock during the day.
Exchange|Markets|A marketplace where securities are bought and sold (NYSE, Nasdaq).
Executor|Estate|The person named in a will to settle the estate.
Expense ratio|Investing|A fund's yearly cost as a % of assets.
Expiration date|Options|The last day an option can be exercised.
Face value (par)|Bonds|The amount a bond pays back at maturity, often $1,000.
Federal funds rate|Economics|The interest rate banks charge each other overnight, set as a target by the Fed.
Federal Reserve|Economics|The US central bank: sets interest-rate policy and supervises banks.
Fiat money|Economics|Currency backed by government decree rather than a commodity.
Fiduciary|Advice|An adviser legally required to act in your best interest. Ask "are you a fiduciary at all times?"
FICA|Taxes|Social Security (6.2%) and Medicare (1.45%) payroll taxes.
FIRE|Retirement|Financial Independence, Retire Early: saving aggressively to live off investments.
Fixed income|Bonds|Investments paying set income, mainly bonds.
Float|Stocks|Shares available for public trading.
Forex|Forex|The foreign exchange market for trading currencies.

['Ponzi scheme','Early investors are paid "returns" from new investors\' money. It grows until new money slows, then collapses (Madoff, ~$65B on paper).','Steady high returns in any market · secretive strategy · unregistered seller · pressure to reinvest · trouble withdrawing','Check registration on FINRA BrokerCheck and SEC IAPD. Ask for audited statements from a known firm.'],

['Pig butchering (romance-investment)','A stranger (wrong-number text, dating app, social media) builds trust for weeks, then introduces a "trading platform" showing fake profits. Withdrawals demand "taxes" or "fees" until you\'re drained.','Wrong-number text that turns friendly · moves chat to WhatsApp/Telegram · rich lifestyle · crypto platform you\'ve never heard of · fees to withdraw','Stop contact. Never pay to withdraw. Report to ic3.gov and the FTC.'],
