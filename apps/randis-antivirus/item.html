    if (!(job && !job.done)) {
      const since = S.shield.last || Date.now() / 1000 - 60; S.shield.pending = Date.now() / 1000;
      await startScan({ paths: S.shield.folders, since, label: "Shield", silent: true, src: "shield", only_risky: true });
    }
    shieldTick();
  }, Math.max(5, S.shield.every) * 1000);
}
async function shieldAfter(j) {

  for (const f of j.flagged) {
    let act = "flagged";

    S.shield.log.push({ t: Date.now() / 1000, path: f.path, verdict: f.verdict, why: f.findings.map(x => x.name).join(", "), act });
    if (["malware", "dangerous", "test"].includes(f.verdict)) toast(`🛡️ Shield: ${f.verdict.toUpperCase()} – ${base(f.path)} (${act})`);

}

  $("#rex").onclick = () => exportFile("randis-av-rules.json", JSON.stringify({ format: "randis-av-rules/1", rules: S.custom, tweaks: S.rules }, null, 1));
  $("#rim").onclick = () => $("#rfile").click();
  $("#rfile").onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const j = JSON.parse(rd.result); (j.rules || []).forEach(r => { if (r && r.name && Array.isArray(r.strings)) { r.id = "u-" + uid(); r.builtin = false; S.custom.push(r); } }); Object.assign(S.rules, j.tweaks || {}); save(); render(); toast("Imported."); } catch (x) { toast("That isn't a rules file."); } }; rd.readAsText(f); };
  $("#rtest").onclick = () => {
    const txt = $("#rt").value, low = txt.toLowerCase(), hits = [];
    for (const r of rules().filter(r => r.on)) {
      let n = 0; for (const s of r.strings) { try { if (s.t === "re") { let src = s.v, fl = s.i ? "i" : ""; if (src.startsWith("(?i)")) { src = src.slice(4); fl = "i"; } if (new RegExp(src, fl).test(txt)) n++; } else if (s.t === "hex") {} else if ((s.i === false ? txt : low).includes(s.i === false ? s.v : s.v.toLowerCase())) n++; } catch (e) {} }
      const need = r.cond === "all" ? r.strings.length : r.cond === "any" ? 1 : +r.cond; if (n >= need) hits.push(r);
    }
    $("#rto").innerHTML = hits.length ? hits.map(r => `<span class="s${r.sev}">● ${esc(r.name)}</span>`).join(" ") : `<span class="ok">No rule matched.</span>`;
  };
};
function ruleEditor(r, ro) {
  const x = r ? JSON.parse(JSON.stringify(r)) : { id: "u-" + uid(), name: "", cat: "custom", sev: 2, types: ["any"], strings: [{ t: "text", v: "" }], cond: "any", desc: "", on: true };
  const box = document.createElement("div"); box.className = "modal"; document.body.appendChild(box);
  const draw = () => {
    box.innerHTML = `<div><h1>${ro ? "Built-in rule" : r ? "Edit rule" : "New rule"}</h1>
    <div class="grid" style="grid-template-columns:1fr 1fr"><label>Name<br><input id="en" value="${esc(x.name)}" style="width:100%"></label><label>Category<br><input id="ec" value="${esc(x.cat)}" style="width:100%"></label>
    <label>Looks in (comma list: any, pe, script, office, ole, pdf, lnk, zip, or .ext)<br><input id="et" value="${esc(x.types.join(", "))}" style="width:100%"></label>
    <label>Match when<br><select id="ecd">${["any", "all", "2", "3", "4"].map(c => `<option ${String(x.cond) === c ? "selected" : ""} value="${c}">${c === "any" ? "any one matches" : c === "all" ? "all match" : c + " or more match"}</option>`).join("")}</select></label></div>
    <label>What it means (shown in results)<br><input id="ed" value="${esc(x.desc)}" style="width:100%"></label>
    <h2>Patterns</h2>${x.strings.map((s, i) => `<div class="row" style="margin-bottom:4px"><select data-st="${i}">${["text", "hex", "re"].map(t => `<option ${s.t === t ? "selected" : ""} value="${t}">${{ text: "text", hex: "hex bytes", re: "regex" }[t]}</option>`).join("")}</select><input data-sv="${i}" value="${esc(s.v)}" style="flex:1" class="mono"><label class="mut"><input type="checkbox" data-si="${i}" ${s.i !== false ? "checked" : ""}> any case</label><a href="#" data-sx="${i}" class="mut">✕</a></div>`).join("")}
    ${ro ? "" : `<button class="btn sm" id="eadd">+ pattern</button>`}<div class="row" style="margin-top:14px"><span style="flex:1"></span><button class="btn" id="ecancel">${ro ? "Close" : "Cancel"}</button>${ro ? `<button class="btn" id="ecopy">Copy as my own rule</button>` : `<button class="btn pri" id="esave">Save</button>`}</div></div>`;
    const read = () => { x.name = $("#en", box).value; x.cat = $("#ec", box).value; x.desc = $("#ed", box).value; x.types = $("#et", box).value.split(",").map(s => s.trim()).filter(Boolean); x.cond = $("#ecd", box).value;
      $$("[data-sv]", box).forEach(el => { const i = +el.dataset.sv; x.strings[i] = { t: $(`[data-st="${i}"]`, box).value, v: el.value, i: $(`[data-si="${i}"]`, box).checked }; }); };
    $("#ecancel", box).onclick = () => box.remove();
    const a = $("#eadd", box); if (a) a.onclick = () => { read(); x.strings.push({ t: "text", v: "" }); draw(); };
    $$("[data-sx]", box).forEach(el => el.onclick = e => { e.preventDefault(); if (ro) return; read(); x.strings.splice(+el.dataset.sx, 1); draw(); });
    const sv = $("#esave", box); if (sv) sv.onclick = () => { read(); x.strings = x.strings.filter(s => s.v); if (!x.name || !x.strings.length) return toast("Give it a name and at least one pattern.");
      for (const s of x.strings) if (s.t === "re") { try { new RegExp(s.v.replace(/^\(\?i\)/, "")); } catch (e) { return toast("Bad regex: " + s.v); } }
      const i = S.custom.findIndex(c => c.id === x.id); if (i >= 0) S.custom[i] = x; else S.custom.push(x); save(); box.remove(); render(); };
    const cp = $("#ecopy", box); if (cp) cp.onclick = () => { const c = JSON.parse(JSON.stringify(x)); c.id = "u-" + uid(); c.builtin = false; c.name += " (mine)"; S.custom.push(c); save(); box.remove(); render(); };
  };
  draw();
}

  <div class="card"><b>Public malware list</b><div class="mut">${esc(f.source || "Malicious hash aggregation (MIT license), github.com/romainmarcoux/malicious-hash, updated hourly")}</div>
   <div id="fi" style="margin:8px 0">${Object.keys(f.files || {}).length ? Object.entries(f.files).map(([k, v]) => `<div>${esc(k)}: ${mb(v.bytes)}, downloaded ${when(v.time)}</div>`).join("") : `<span class="meh">Not downloaded yet.</span>`}</div>
   <div class="row"><button class="btn pri" id="fu">Update now</button><label class="opt"><input type="checkbox" id="fa" ${S.autoFeed ? "checked" : ""}> Update automatically once a day</label></div></div>
  <h2>My block list</h2><div class="card"><div class="row"><input id="bh" placeholder="paste a SHA-256, MD5 or SHA-1" style="flex:1" class="mono"><input id="bn" placeholder="label"><button class="btn" id="badd">Add</button></div>
   <table>${S.block.map((b, i) => `<tr><td class="mono">${esc(b.h)}</td><td>${esc(b.name)}</td><td><a href="#" data-bx="${i}" class="mut">✕</a></td></tr>`).join("")}</table></div>
  <h2>Trusted files (skipped)</h2><div class="card"><table>${S.allow.map((b, i) => `<tr><td class="mono">${esc(b.h)}</td><td>${esc(b.name)}</td><td><a href="#" data-ax="${i}" class="mut">✕</a></td></tr>`).join("") || `<tr><td class="mut">none</td></tr>`}</table></div>`;
  $("#fu").onclick = async () => { $("#fi").innerHTML = `<span class="pulse">Downloading…</span>`; const r = await call("feed_update"); toast(r.error || (r.errors && r.errors.length ? r.errors.join("; ") : `Got ${Object.values(r.got || {}).reduce((a, b) => a + b, 0).toLocaleString()} fingerprints.`)); if (ST && r.info) ST.feed = r.info; S.feedAt = Date.now(); save(); render(); };

  $$("[data-bx]").forEach(a => a.onclick = e => { e.preventDefault(); S.block.splice(+a.dataset.bx, 1); save(); render(); });
  $$("[data-ax]").forEach(a => a.onclick = e => { e.preventDefault(); S.allow.splice(+a.dataset.ax, 1); save(); render(); });
  if (!ST) loadStatus();
};

// ------------------------------------------------------------ quarantine
VIEWS.quar = m => {
  m.innerHTML = `<h1>Quarantine</h1><div class="sub">Files moved out of harm's way, scrambled so they can't run. Put one back if it was a false alarm, or delete it for good.</div><div class="card" id="ql"><span class="pulse">…</span></div>`;
  call("q_list").then(r => {
    QL = r.items || []; const el = $("#ql"); if (!el) return;
    el.innerHTML = QL.length ? `<table><tr><th>File</th><th>Why</th><th>When</th><th></th></tr>${QL.map(q => `<tr><td><b>${esc(base(q.path))}</b><div class="mono mut">${esc(q.path)}</div></td><td>${esc(q.reason)}</td><td class="mut">${when(q.time)}</td>
     <td style="white-space:nowrap"><button class="btn sm" data-qr="${q.id}">Put back</button> <button class="btn sm bad" data-qd="${q.id}">Delete forever</button></td></tr>`).join("")}</table>` : `<span class="ok">Empty.</span>`;
    $$("[data-qr]", el).forEach(b => b.onclick = async () => { if (!confirm("Put this file back where it was? Only do this if you're sure it's safe.")) return; const x = await call("q_restore", { id: b.dataset.qr }); toast(x.error || "Put back: " + x.path); render(); });
    $$("[data-qd]", el).forEach(b => b.onclick = async () => { if (!confirm("Delete it forever? This can't be undone.")) return; const x = await call("q_delete", { id: b.dataset.qd }); toast(x.error || "Deleted."); render(); });
  });
};

// ------------------------------------------------------------ engines
let procJob = null;
VIEWS.engines = m => {
  const e = ST && ST.engines;
  m.innerHTML = `<h1>Engines</h1><div class="sub">Randis Antivirus can hand a file or folder to other scanners on this PC for a second opinion.</div>
  ${!e ? `<span class="pulse">checking…</span>` : `<div class="grid">
   <div class="card"><b>🛡️ Randis engine</b><div class="ok">● ready</div><div class="mut">${rules().filter(r => r.on).length} rules, 4 heuristic levels, hash lists, signatures, archives, Office/PDF/shortcut analysis.</div></div>
   <div class="card"><b>Microsoft Defender</b><div class="${e.defender.running ? "ok" : "mut"}">${e.defender.running ? "● running" : "○ standing by: another antivirus is in charge (normal)"}</div>
     <div class="row" style="margin-top:6px"><button class="btn sm" data-eng="defender" data-k="quick" ${e.defender.running ? "" : "disabled"}>Quick scan</button><button class="btn sm" data-eng="defender" data-k="custom" ${e.defender.running ? "" : "disabled"}>Scan folder…</button></div></div>
   <div class="card"><b>ClamAV</b> <span class="mut">free, open source, ~8 million signatures</span><div class="${e.clamav.ready ? "ok" : "mut"}">${e.clamav.here ? (e.clamav.ready ? "● ready" : "○ installed, signatures not downloaded") : "○ not installed"}</div>
     <div class="row" style="margin-top:6px">${e.clamav.here ? `<button class="btn sm" data-eng="clamupd">Download / update signatures</button><button class="btn sm" data-eng="clamav" ${e.clamav.ready ? "" : "disabled"}>Scan folder…</button>` : `<button class="btn sm" data-eng="clamins">Install ClamAV (winget)</button>`}</div></div>
   <div class="card"><b>Avast</b><div class="${e.avast.here ? "ok" : "mut"}">${e.avast.here ? "● installed" : "○ not installed"}</div><div class="row" style="margin-top:6px"><button class="btn sm" data-eng="avast" ${e.avast.here ? "" : "disabled"}>Scan folder with Avast…</button></div></div>
   <div class="card"><b>🧪 Test your protection</b><div class="mut">Writes the harmless industry test file (EICAR) into a folder you pick. Your real-time antivirus should grab it within seconds, and Randis should flag it.</div><button class="btn sm" data-eng="test" style="margin-top:6px">Make test file…</button></div>
  </div>`}<h2>Output</h2><pre class="log" id="eo">${procJob ? esc(procJob.lines.join("\n")) : "–"}</pre>`;
  $$("[data-eng]").forEach(b => b.onclick = async () => {
    const k = b.dataset.eng; let r;
    const pick = async () => (await call("pick_folder")).path;
    if (k === "defender") { const p = b.dataset.k === "custom" ? await pick() : null; if (b.dataset.k === "custom" && !p) return; r = await call("defender", { kind: b.dataset.k, path: p }); }
    if (k === "clamav") { const p = await pick(); if (!p) return; r = await call("clamav", { path: p }); }
    if (k === "clamupd") r = await call("clamav_update");
    if (k === "clamins") { if (!confirm("Install ClamAV with winget? Windows will ask for permission (this installs outside Randis UDS).")) return; r = await call("install_clamav"); }
    if (k === "avast") { const p = await pick(); if (!p) return; r = await call("avast", { path: p }); return toast(r.error || r.note); }
    if (k === "test") { const p = await pick(); if (!p) return; r = await call("test_file", { path: p }); return toast(r.error || (r.still_there ? "Test file written. Now run a scan of that folder: Randis should flag it." : "Written, and your real-time antivirus already removed it. ✔ It works.")); }
    if (r.error) return toast(r.error);
    procJob = { id: r.job, lines: [], done: false }; pollProc();
  });
  if (!ST) loadStatus();
};
async function pollProc() {
  const r = await call("poll", { job: procJob.id, since: procJob.lines.length }); if (r.error) return toast(r.error);
  procJob.lines.push(...(r.lines || [])); procJob.done = r.done;
  const o = $("#eo"); if (o) { o.textContent = procJob.lines.join("\n") + (r.done ? `\n\n[finished, code ${r.code}]` : ""); o.scrollTop = 1e9; }
  if (!r.done) setTimeout(pollProc, 800); else { call("forget", { job: procJob.id }); ST = null; loadStatus(true); }
}

VIEWS.history = m => {

  <h2>Daily scan</h2><div class="card"><label class="opt"><input type="checkbox" id="sc" ${S.sched.on ? "checked" : ""}><span>Run a Smart scan once a day, after <input type="number" id="sh" min="0" max="23" value="${S.sched.hour}" style="width:55px">:00<small>Only while Randis UDS is open.</small></span></label></div>`;

// ------------------------------------------------------------ analyst AI
let aiBusy = false;
function askAbout(q) { go("ai"); sendAI(q); }
async function sendAI(q) {
  if (aiBusy) return toast("Still answering…");
  S.chat.push({ role: "user", content: q }); aiBusy = true; render();
  const r = await call("ask", { history: S.chat });
  if (r.error) { S.chat.push({ role: "assistant", content: "⚠ " + r.error }); aiBusy = false; save(); return render(); }
  for (;;) { const p = await call("ai_poll", { job: r.job }); const el = $("#aiwait"); if (el) el.textContent = p.text || "thinking…";
    if (p.done) { S.chat.push({ role: "assistant", content: p.error ? "⚠ " + p.error : p.text }); break; } await new Promise(z => setTimeout(z, 700)); }
  aiBusy = false; save(); render();
}
VIEWS.ai = m => {
  m.innerHTML = `<h1>Analyst AI</h1><div class="sub">Ask the AI linked in Randis UDS about any finding, program, startup entry or setting. "Ask AI" buttons across this tab send the details here.</div>
  <div class="card chat" id="ch">${S.chat.map(c => `<div class="msg ${c.role === "user" ? "u" : "a"}">${esc(c.content)}</div>`).join("") || `<span class="mut">No questions yet.</span>`}${aiBusy ? `<div class="msg a pulse" id="aiwait">thinking…</div>` : ""}</div>
  <div class="row" style="margin-top:8px"><textarea id="aq" rows="2" style="flex:1" placeholder="e.g. Is it normal to have both Norton and Avast?"></textarea><button class="btn pri" id="as">Ask</button><button class="btn" id="ac">Clear</button></div>`;
  $("#as").onclick = () => { const q = $("#aq").value.trim(); if (q) sendAI(q); };
  $("#ac").onclick = () => { S.chat = []; save(); render(); };
  const ch = $("#ch"); ch.scrollTop = 1e9;
};

// ------------------------------------------------------------ start
function daily() {
  const d = new Date(), today = d.toISOString().slice(0, 10);
  if (S.sched.on && S.sched.last !== today && d.getHours() >= S.sched.hour && !(job && !job.done)) { S.sched.last = today; save(); startScan({ quick: true, label: "Daily smart scan", silent: page !== "scan" }); }
  if (S.autoFeed && (!S.feedAt || Date.now() - S.feedAt > 864e5)) { S.feedAt = Date.now(); save(); call("feed_update").then(r => { if (ST && r.info) ST.feed = r.info; }); }
}
function boot(saved) {
  if (loaded) return; loaded = true;
  S = Object.assign(blank(), saved || {}); S.opt = Object.assign(blank().opt, S.opt || {}); S.shield = Object.assign(blank().shield, S.shield || {}); S.sched = Object.assign(blank().sched, S.sched || {});
  nav(); render(); shieldTick(); daily(); setInterval(daily, 5 * 60 * 1000);
}
if (inApp) { tell({ uds: "store-get" }); setTimeout(() => { if (!loaded) boot(JSON.parse(localStorage.getItem("randis-av") || "null")); }, 1500); }
else boot(JSON.parse(localStorage.getItem("randis-av") || "null"));
</script></body></html>
