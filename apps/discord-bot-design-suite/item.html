<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord Bot Design Suite</title>
<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif;height:100vh;overflow:hidden}

h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:18px 0 8px} h3{font-size:14px;margin:12px 0 6px}
p.sub{color:var(--mu);margin:0 0 14px}

.grid{display:grid;gap:12px} .g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))} .g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))} .g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.b:hover{background:#43464d} .b.pri{background:var(--ac);border-color:var(--ac)} .b.pri:hover{background:var(--ac2)}
.b.grn{background:var(--gr);border-color:var(--gr)} .b.red{background:#a12d2f;border-color:#a12d2f} .b.sm{padding:3px 8px;font-size:12px} .b.ghost{background:none;border-color:transparent;color:var(--mu)} .b.ghost:hover{color:var(--tx);background:var(--p3)}
input,select,textarea{background:#1e1f22;color:var(--tx);border:1px solid #3a3c42;border-radius:6px;padding:7px 9px;font:inherit;font-size:13px;width:100%}

.fld{display:block;margin-bottom:10px} .fld>span{display:block;font-size:12px;color:#b5bac1;margin-bottom:4px;font-weight:600} .fld small{display:block;color:var(--mu);font-size:11.5px;margin-top:3px}
.tog{display:flex;gap:10px;align-items:center;cursor:pointer;margin:6px 0 10px;user-select:none}
.tog input{display:none} .tog i{width:38px;height:22px;border-radius:11px;background:#4e5058;position:relative;flex:none;transition:.15s}
.tog i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.tog input:checked+i{background:var(--gr)} .tog input:checked+i:after{left:19px}
.tog small{color:var(--mu);display:block;font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:var(--p3);color:#cfd2d6;margin:2px 3px 2px 0}

.chip{display:inline-block;padding:2px 8px;border-radius:5px;background:#26282c;border:1px solid #3a3c42;font:12px Consolas,monospace;cursor:pointer;margin:2px;color:#c9cdfb}
.chip:hover{border-color:var(--ac)}
.mu{color:var(--mu)} .sm{font-size:12px} code,.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px} code{background:#111214;padding:1px 5px;border-radius:4px}
.tbl{width:100%;border-collapse:collapse} .tbl td,.tbl th{padding:6px 8px;border-bottom:1px solid #34363c;text-align:left;vertical-align:top} .tbl th{color:var(--mu);font-size:12px;font-weight:600}
.lr{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.listrow{display:grid;gap:6px;align-items:center;margin-bottom:6px}

.feat{background:var(--p1);border:1px solid #2f3136;border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}

.scard p{margin:0;color:#c4c7cc;font-size:13px;flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid #34363c;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:none;border:0;color:var(--mu);padding:7px 12px;cursor:pointer;border-bottom:2px solid transparent;font:inherit}
.tabs button.on{color:#fff;border-color:var(--ac)}

.hc{color:#6a9955;font-style:normal} .hs{color:#ce9178;font-style:normal} .hk{color:#569cd6;font-style:normal} .hd{color:#c586c0;font-style:normal}
.issue{display:flex;gap:10px;padding:8px 10px;border-radius:8px;background:#26282c;margin-bottom:6px;align-items:center}
.issue .lv{font-size:16px} .issue div{flex:1}

#modal.on{display:flex} #modal .box{background:var(--p2);border-radius:12px;padding:18px;width:min(900px,94vw);max-height:90vh;overflow:auto;border:1px solid #444}
/* discord look */
.dc{background:#313338;border-radius:8px;padding:6px 0}
.dmsg{display:flex;gap:12px;padding:6px 14px;position:relative} .dmsg:hover{background:#2e3035}

.app{background:var(--ac);color:#fff;font-size:10px;font-weight:700;padding:0 4px;border-radius:3px;position:relative;top:-1px}

.spoil{background:#1e1f22;color:#1e1f22;border-radius:3px} .spoil:hover{color:#dbdee1}

.emb .eft{font-size:11.5px;color:#b5bac1;margin-top:8px;grid-column:1/-1} .emb .th{width:72px;height:72px;border-radius:6px;background:#3a3c42;display:grid;place-items:center;font-size:26px;grid-row:1/4;grid-column:2}

.sysm{color:var(--mu);font-size:12.5px;padding:4px 14px 4px 64px}

.sim .inp{padding:0 14px 14px;position:relative} .sim .inp input{background:#383a40;border:0;padding:11px 14px;font-size:14px;border-radius:8px}

.ac{position:absolute;bottom:58px;left:14px;right:14px;background:#2b2d31;border:1px solid #1e1f22;border-radius:8px;max-height:260px;overflow:auto;box-shadow:0 8px 20px #0007}
.ac div{padding:7px 12px;cursor:pointer;display:flex;gap:10px} .ac div:hover,.ac div.on{background:#35373c} .ac small{color:var(--mu)}
.wz{max-width:860px} .wzopt{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}

.trybar{background:#3b3f86;border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:900px){#app{grid-template-columns:1fr}nav{display:none}.sim{grid-template-columns:1fr}.sim .chs,.sim .mem{display:none}}
</style></head><body>

<script>
'use strict';

const rnd=n=>Math.floor(Math.random()*n);
const rand=a=>a&&a.length?a[rnd(a.length)]:'';
const q=v=>JSON.stringify(v);
const pb=b=>b?'True':'False';
const hx=c=>'0x'+(String(c||'#5865f2').replace('#','')+'000000').slice(0,6).toLowerCase();
function pyv(v){if(v===true)return'True';if(v===false)return'False';if(v==null)return'None';if(Array.isArray(v))return'['+v.map(pyv).join(', ')+']';if(typeof v==='object')return'{'+Object.keys(v).map(k=>q(k)+': '+pyv(v[k])).join(', ')+'}';return q(v);}

function getP(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setP(o,p,v){const k=p.split('.');let a=o;for(let i=0;i<k.length-1;i++)a=a[k[i]];a[k[k.length-1]]=v;}

function copy(t){const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied ✅');}catch(e){toast('Copy failed');}a.remove();};try{navigator.clipboard.writeText(t).then(()=>toast('Copied ✅'),fb);}catch(e){fb();}}
function dl(name,text){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Saving '+name);}catch(e){toast('Download blocked here — use Copy');}}
function fillT(t,c){return String(t==null?'':t).replace(/\{random:([^}]+)\}/g,(_,s)=>rand(s.split('|'))).replace(/\{([\w.:]+)\}/g,(m,k)=>k in c?String(c[k]):m);}

/* ================= word lists ================= */

/* ================= permissions & intents ================= */

const R=String.raw;
function embedJS(x){const L=[R`const e = new EmbedBuilder().setTitle(fill(${q(x.title||'Title')}, c)).setDescription(fill(${q(x.reply||'\u200b')}, c)).setColor(${hx(x.color)}).setTimestamp();`];
 if(x.author)L.push(R`e.setAuthor({ name: fill(${q(x.author)}, c) });`);
 if(x.footer)L.push(R`e.setFooter({ text: fill(${q(x.footer)}, c) });`);
 (x.fields||[]).filter(f=>f.name&&f.value).forEach(f=>L.push(R`e.addFields({ name: fill(${q(f.name)}, c), value: fill(${q(f.value)}, c), inline: ${!!f.inline} });`));
 if(x.thumb)L.push(R`e.setThumbnail(${q(x.thumb)});`);if(x.image)L.push(R`e.setImage(${q(x.image)});`);
 const lk=(x.links||[]).filter(l=>l.label&&/^https?:\/\//.test(l.url)).slice(0,5);
 if(lk.length){L.push('const row = new ActionRowBuilder().addComponents('+lk.map(l=>R`new ButtonBuilder().setLabel(${q(l.label)}).setURL(${q(l.url)}).setStyle(ButtonStyle.Link)`).join(', ')+');');L.push(R`await i.reply({ embeds: [e], components: [row], ephemeral: ${!!x.ephemeral} });`);}
 else L.push(R`await i.reply({ embeds: [e], ephemeral: ${!!x.ephemeral} });`);return L.join('\n');}
function embedPY(x){const L=[R`e = discord.Embed(title=fill(${q(x.title||'Title')}, c), description=fill(${q(x.reply||'\u200b')}, c), color=${hx(x.color)}, timestamp=discord.utils.utcnow())`];
 if(x.author)L.push(R`e.set_author(name=fill(${q(x.author)}, c))`);
 if(x.footer)L.push(R`e.set_footer(text=fill(${q(x.footer)}, c))`);
 (x.fields||[]).filter(f=>f.name&&f.value).forEach(f=>L.push(R`e.add_field(name=fill(${q(f.name)}, c), value=fill(${q(f.value)}, c), inline=${pb(f.inline)})`));
 if(x.thumb)L.push(R`e.set_thumbnail(url=${q(x.thumb)})`);if(x.image)L.push(R`e.set_image(url=${q(x.image)})`);
 const lk=(x.links||[]).filter(l=>l.label&&/^https?:\/\//.test(l.url)).slice(0,5);
 L.push('view = discord.ui.View()');lk.forEach(l=>L.push(R`view.add_item(discord.ui.Button(label=${q(l.label)}, url=${q(l.url)}))`));
 L.push(R`await inter.response.send_message(embed=e, view=view, ephemeral=${pb(x.ephemeral)})`);return L.join('\n');}

 js:()=>R`const prize = i.options.getString("prize"), mins = i.options.getInteger("minutes");

/* ================= project model ================= */
function defEmbed(){return{content:'',author:'',title:'Welcome to the server! 🎉',desc:'Read the rules, grab your roles and say hi in **#general**.',color:'#5865f2',footer:'Made with Bot Design Suite',thumb:'',image:'',ts:true,fields:[{name:'📜 Rules',value:'Be kind. No spam.',inline:true},{name:'🎭 Roles',value:'Pick them in #roles',inline:true}],links:[]};}
function cmd(name,action,desc,extra){const a=A[action];return Object.assign({name,desc:desc||a.label,action,reply:a.defReply,title:'',color:'#5865f2',choices:a.choices?a.choices.slice():[],roles:[],channel:'',role:'',author:'',footer:'',fields:[],links:[],thumb:'',image:'',ephemeral:false,perm:a.perm,cooldown:0,opts:[]},extra||{});}
const C=cmd;
function newProject(name){return{id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name||'My Bot',emoji:'🤖',color:'#5865f2',about:'',lang:'js',status:'online',actType:'Playing',actText:'/help',clientId:'',perms:null,
 commands:[cmd('ping','ping','Check if the bot is alive'),cmd('help','help','Show all commands')],
 welcome:{on:false,channel:'welcome',msg:'Welcome {user.mention} to **{server}**! You are member #{memberCount} 🎉',embed:true,dm:false,dmMsg:'Hi {user}! Thanks for joining {server}. Say hi in #general!'},
 leave:{on:false,channel:'welcome',msg:'👋 **{user}** has left the server.'},autorole:{on:false,role:'Member'},
 logging:{on:false,channel:'mod-log',deletes:true,edits:true,joins:true},
 automod:{on:false,badwords:[],antilink:false,caps:0,mentions:0,spam:0,timeout:0},
 autoresp:[],leveling:{on:false,min:15,max:25,msg:'🎉 GG {user.mention}, you reached **level {level}**!',roles:[]},
 economy:{currency:'coins',emoji:'🪙',daily:100,start:100},rr:[],schedules:[],embed:defEmbed()};}
function fixProject(p){const d=newProject(p.name);for(const k in d){if(p[k]==null)p[k]=d[k];else if(typeof d[k]==='object'&&!Array.isArray(d[k])&&d[k]){for(const kk in d[k])if(p[k][kk]==null)p[k][kk]=d[k][kk];}}
 p.commands=(p.commands||[]).filter(c=>A[c.action]).map(c=>Object.assign(cmd(c.name,c.action,c.desc),c));return p;}
function allOpts(x){const a=A[x.action];return a.opts.concat(a.uses.includes('opts')?(x.opts||[]):[]).slice().sort((m,n)=>(n.r?1:0)-(m.r?1:0));}
function helpText(p){return p.commands.map(c=>'`/'+c.name+'` · '+(c.desc||A[c.action].label)).join('\n')||'No commands yet.';}
function needs(p){const acts=new Set(p.commands.map(c=>c.action));const lg=p.logging.on;
 return{acts,msgs:p.automod.on||p.autoresp.length>0||p.leveling.on||(lg&&(p.logging.deletes||p.logging.edits)),members:p.welcome.on||p.leave.on||p.autorole.on||(lg&&p.logging.joins),reacts:p.rr.length>0,
 econ:['balance','daily','pay','gamble'].some(a=>acts.has(a)),ticket:acts.has('ticket'),roleBtn:acts.has('rolebutton')};}
function intentsOf(p){const n=needs(p),r=['Guilds'];if(n.msgs)r.push('GuildMessages','MessageContent');if(n.members)r.push('GuildMembers');if(n.reacts)r.push('GuildMessageReactions');return r;}
function recPerms(p){const s=new Set(['ViewChannel','SendMessages','EmbedLinks','AttachFiles','ReadMessageHistory','AddReactions','UseExternalEmojis','SendMessagesInThreads']);
 p.commands.forEach(c=>{if(c.action==='kick')s.add('KickMembers');if(c.action==='ban')s.add('BanMembers');if(['timeout'].includes(c.action))s.add('ModerateMembers');if(['purge','say'].includes(c.action))s.add('ManageMessages');if(['ticket','lock','slowmode'].includes(c.action)){s.add('ManageChannels');s.add('ManageRoles');}if(c.action==='rolebutton')s.add('ManageRoles');});
 if(p.automod.on){s.add('ManageMessages');if(p.automod.timeout)s.add('ModerateMembers');}
 if(p.autorole.on||p.rr.length||p.leveling.roles.length)s.add('ManageRoles');return[...s];}
function featCount(p){const n=needs(p);return[p.welcome.on,p.leave.on,p.autorole.on,p.logging.on,p.automod.on,p.autoresp.length>0,p.leveling.on,n.econ,p.rr.length>0,p.schedules.length>0,n.ticket].filter(Boolean).length;}

/* ================= health check ================= */
function issues(p){const I=[],add=(lv,msg,pg)=>I.push({lv,msg,pg});const seen={};
 if(!p.commands.length&&!featCount(p))add('tip','Your bot does nothing yet. Add a command or try the Wizard.','wizard');
 if(p.commands.length>100)add('err','Discord allows at most 100 slash commands.','commands');
 p.commands.forEach((c,ix)=>{const nm='/'+(c.name||'?');
  if(!/^[a-z0-9_-]{1,32}$/.test(c.name))add('err',nm+': names must be 1-32 lowercase letters, numbers, - or _.','commands');
  if(seen[c.name])add('err',nm+' is used twice.','commands');seen[c.name]=1;

                await inter.response.send_message(f"➕ Added **{role.name}**", ephemeral=True)

        return cb

function embJSON(e){const o={};if(e.content)o.content=e.content;const em={color:parseInt((e.color||'#5865f2').slice(1),16)};if(e.title)em.title=e.title;if(e.desc)em.description=e.desc;if(e.author)em.author={name:e.author};if(e.footer)em.footer={text:e.footer};if(e.thumb)em.thumbnail={url:e.thumb};if(e.image)em.image={url:e.image};if(e.ts)em.timestamp=new Date().toISOString();const f=e.fields.filter(z=>z.name&&z.value);if(f.length)em.fields=f.map(z=>({name:z.name,value:z.value,inline:!!z.inline}));o.embeds=[em];const l=e.links.filter(z=>z.label&&z.url);if(l.length)o.components=[{type:1,components:l.slice(0,5).map(z=>({type:2,style:5,label:z.label,url:z.url}))}];return o;}
PAGES.embed.after=()=>{LIVE=()=>{const e=P().embed;if(!$('#eprev'))return;$('#eprev').innerHTML=msgHTML({a:'bot',content:e.content,embed:{author:e.author,title:e.title,desc:e.desc,color:e.color,footer:e.footer,thumb:!!e.thumb,image:!!e.image,ts:e.ts,fields:e.fields.filter(f=>f.name)},buttons:e.links.filter(l=>l.label).map(l=>({label:l.label,style:'Link',url:l.url}))});
 const tot=(e.title+e.desc+e.footer+e.author).length+e.fields.reduce((a,f)=>a+f.name.length+f.value.length,0);const lim=(n,v,m)=>`<div>${v>m?'❌':'✅'} ${n}: ${v} / ${m}</div>`;
 $('#elim').innerHTML=lim('Title',e.title.length,256)+lim('Description',e.desc.length,4096)+lim('Fields',e.fields.length,25)+lim('Footer',e.footer.length,2048)+lim('Whole embed',tot,6000)+lim('Link buttons',e.links.length,5);};LIVE();};

 else if(e.key==='Escape')ac.style.display='none';};};

PAGES.perms=()=>{const p=P();if(!p.perms)p.perms=recPerms(p);const bits=permBits(p.perms);const id=(p.clientId||'').trim();

 <div class="tabs">${fs.map((x,k)=>`<button class="${k===EXPF?'on':''}" data-a="expf" data-v="${k}">${esc(x.n)}</button>`).join('')}</div>
 <div class="row" style="margin-bottom:8px"><b class="mono">${esc(f.n)}</b><span class="sm mu">${f.c.split('\n').length} lines</span><span class="grow"></span><button class="b sm pri" data-a="copyf">Copy</button><button class="b sm" data-a="dlf">⬇ Save</button></div>
 <pre class="code">${hl(f.c,f.n.endsWith('.py'))}</pre>`;};
function hl(code,py){if(!/\.?(js|py)$/.test('x.'+(py?'py':'js')))return esc(code);const re=py?/(#.*$)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(async|await|def|class|return|if|elif|else|for|in|not|and|or|while|try|except|import|from|as|True|False|None|lambda|pass|break|with|raise)\b|(@[\w.]+)/gm:/(\/\/.*$)|("(?:[^"\\\n]|\\.)*")|\b(const|let|async|await|function|return|if|else|for|of|in|new|true|false|null|try|catch|switch|case|break|require)\b|(=>)/gm;
 let out='',last=0;code.replace(re,(m,c,s,k,d,off)=>{out+=esc(code.slice(last,off))+'<i class="'+(c?'hc':s?'hs':k?'hk':'hd')+'">'+esc(m)+'</i>';last=off+m.length;return m;});return out+esc(code.slice(last));}

 <div class="row" style="margin-top:6px">${['#5865f2','#57f287','#fee75c','#eb459e','#ed4245','#ffffff','#23272a','#f1c40f','#e67e22','#1abc9c','#9b59b6'].map(c=>`<span data-a="colset" data-v="${c}" style="width:22px;height:22px;border-radius:5px;background:${c};cursor:pointer;border:1px solid #555"></span>`).join('')}</div></div>
 <div class="card"><h3 style="margin-top:0">✍️ Markdown preview</h3><textarea id="mdin" rows="4">**bold** *italic* __underline__ ~~strike~~ \`code\` ||spoiler||\n> a quote</textarea><div class="dc" id="mdout" style="margin-top:8px;padding:10px"></div></div>
 <div class="card"><h3 style="margin-top:0">📏 Discord limits</h3><table class="tbl sm">${[['Message',2000],['Embed title',256],['Embed description',4096],['Embed fields',25],['Field name / value','256 / 1024'],['Footer',2048],['Whole embed',6000],['Embeds per message',10],['Slash commands (global)',100],['Command name / description','32 / 100'],['Options per command',25],['Buttons','5 per row, 5 rows'],['Bulk delete','100, newer than 14 days'],['Timeout max','28 days']].map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join('')}</table></div>
 <div class="card"><h3 style="margin-top:0">🧩 Template variables</h3><table class="tbl sm"><tr><td><code>{user}</code></td><td>Their username</td></tr><tr><td><code>{user.mention}</code></td><td>@pings them</td></tr><tr><td><code>{server}</code></td><td>Server name</td></tr><tr><td><code>{memberCount}</code></td><td>How many members</td></tr><tr><td><code>{channel}</code></td><td>#channel link</td></tr><tr><td><code>{opt:name}</code></td><td>What they typed in option “name”</td></tr><tr><td><code>{random:a|b|c}</code></td><td>Picks one at random</td></tr><tr><td><code>{pick}</code></td><td>The random line (Random pick)</td></tr><tr><td><code>{level}</code></td><td>New level (level-up message)</td></tr></table></div>
 <div class="card"><h3 style="margin-top:0">💡 Bot idea generator</h3><div id="idea" style="font-size:15px;min-height:44px"></div><button class="b sm" data-a="idea">🎲 New idea</button></div></div>`;
const IDEA=[['A','pet bot','feeds, walks and levels up a virtual pet everyone shares'],['A','quote bot','saves funny messages with /quote and replays them'],['A','study bot','runs focus timers and tracks study streaks'],['A','birthday bot','announces birthdays and gives a birthday role'],['A','trivia bot','asks questions and keeps a scoreboard'],['A','mood bot','asks how everyone feels each morning'],['A','word-chain bot','plays a word game in one channel'],['A','starboard bot','reposts messages that get ⭐ reactions'],['A','counting bot','lets the channel count up together'],['A','recipe bot','suggests a random dinner and the steps'],['A','LFG bot','helps gamers find a team for tonight'],['An','art-prompt bot','posts a daily drawing challenge']];
PAGES.tools.after=()=>{const ts=$('#tsin'),d=new Date(Date.now()+3600e3);d.setMinutes(0,0,0);ts.value=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
 const tsr=()=>{const u=Math.floor(new Date(ts.value).getTime()/1000);if(!u){$('#tsout').innerHTML='';return;}const dt=new Date(u*1000);const F={t:dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),T:dt.toLocaleTimeString(),d:dt.toLocaleDateString(),D:dt.toLocaleDateString([],{dateStyle:'long'}),f:dt.toLocaleString([],{dateStyle:'long',timeStyle:'short'}),F:dt.toLocaleString([],{dateStyle:'full',timeStyle:'short'}),R:'relative (“in 2 hours”)'};
  $('#tsout').innerHTML='<table class="tbl sm">'+Object.entries(F).map(([k,v])=>`<tr><td><code>&lt;t:${u}:${k}&gt;</code></td><td>${esc(v)}</td><td><button class="b sm" data-a="copyv" data-v="&lt;t:${u}:${k}&gt;">Copy</button></td></tr>`).join('')+'</table>';};ts.oninput=tsr;tsr();
 const sf=$('#sfin');sf.oninput=()=>{try{const t=Number((BigInt(sf.value.trim())>>22n)+1420070400000n);$('#sfout').innerHTML=sf.value.trim()?'Created <b>'+new Date(t).toLocaleString()+'</b>':'';}catch(e){$('#sfout').innerHTML='<span class="mu">Not a valid ID.</span>';}};
 const co=$('#colin');const cr=()=>{const h=co.value,n=parseInt(h.slice(1),16);$('#colout').innerHTML=`<div class="sm">Hex <code>${h}</code> · Decimal <code>${n}</code> · Code <code>0x${h.slice(1)}</code> · RGB <code>${n>>16}, ${n>>8&255}, ${n&255}</code></div>`;};co.oninput=cr;cr();PAGES.tools.col=v=>{co.value=v;cr();};
 const mi=$('#mdin');const mr=()=>{$('#mdout').innerHTML=md(mi.value);};mi.oninput=mr;mr();newIdea();};
function newIdea(){const i=rand(IDEA);$('#idea').innerHTML=`${i[0]} <b>${i[1]}</b> that ${i[2]}.`;}

/* --- projects --- */
PAGES.projects=()=>`<h1>🗂️ My Bots</h1><p class="sub">All your bot designs. They save in this app automatically.</p>
 <div class="row" style="margin-bottom:10px"><button class="b pri" data-a="newproj">＋ New blank bot</button><button class="b" data-a="importp">⬆ Import JSON</button><button class="b" data-a="exportall">Copy all as JSON</button></div>
 <div class="grid g3">${Object.values(store.projects).map(p=>`<div class="scard" style="${p.id===store.cur?'border-color:var(--ac)':''}"><div class="hd"><div class="em" style="background:${esc(p.color)}">${esc(p.emoji)}</div><div><b>${esc(p.name)}</b><div class="sm mu">${p.commands.length} commands · ${featCount(p)} features · ${p.lang==='py'?'Python':'JS'}</div></div></div><p>${esc(p.about||'')}</p>
 <div class="row">${p.id===store.cur?'<span class="pill g">open</span>':`<button class="b sm pri" data-a="openp" data-v="${p.id}">Open</button>`}<button class="b sm" data-a="dupp" data-v="${p.id}">Duplicate</button><button class="b sm" data-a="pjson" data-v="${p.id}">JSON</button><button class="b sm red" data-a="delp" data-v="${p.id}">Delete</button></div></div>`).join('')}</div>`;

/* ================= modal ================= */
function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('on');}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
let MCODE=null;
function showCode(p,title){MCODE={p,f:0};const draw=()=>{const fs=files(MCODE.p),f=fs[MCODE.f]||fs[0];modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(title)}</h2><div class="row"><button class="b sm ${MCODE.p.lang==='js'?'pri':''}" data-a="mlang" data-v="js">JavaScript</button><button class="b sm ${MCODE.p.lang==='py'?'pri':''}" data-a="mlang" data-v="py">Python</button><button class="b sm" data-a="mclose">✕</button></div></div>
 <div class="tabs" style="margin-top:10px">${fs.map((x,k)=>`<button class="${k===MCODE.f?'on':''}" data-a="mfile" data-v="${k}">${esc(x.n)}</button>`).join('')}</div><div class="row" style="margin-bottom:6px"><span class="grow"></span><button class="b sm pri" data-a="mcopy">Copy</button></div><pre class="code" style="max-height:60vh">${hl(f.c,f.n.endsWith('.py'))}</pre>`);};MCODE.draw=draw;draw();}

/* ================= actions ================= */
const ROWDEF={field:()=>({name:'Field',value:'Value',inline:true}),link:()=>({label:'Website',url:'https://'}),opt:()=>({n:'text',t:'string',d:'Some text',r:false}),ar:()=>({trigger:'',reply:'',exact:false}),lr:()=>({level:5,role:''}),rr:()=>({message:'',emoji:'✅',role:''}),sc:()=>({channel:'general',minutes:60,message:''})};
function startTry(s){const p=buildSample(s);p._t=s.t;TRY=p;simReset();PAGE='sim';render();toast('Trying '+s.n);}
function addProject(p){p.id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);delete p._t;store.projects[p.id]=p;store.cur=p.id;SEL=0;ADDING=false;save();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v,p=P();
 switch(a){
 case'go':TRY&&v!=='sim'&&(TRY=null,simReset());go(v);break;
 case'lang':p.lang=v;save();render();break;
 case'newproj':{const n=prompt('Name for the new bot?','My Bot');if(n===null)break;addProject(newProject(n||'My Bot'));go('home');break;}
 case'ins':{const t=lastFocus;if(!t||!document.body.contains(t)){toast('Click in a text box first');break;}const s=t.selectionStart||t.value.length;t.value=t.value.slice(0,s)+v+t.value.slice(t.selectionEnd||s);t.focus();t.selectionStart=t.selectionEnd=s+v.length;bindSet(t);break;}
 case'selcmd':SEL=+v;ADDING=false;render();break;
 case'addcmd':ADDING=true;render();break;
 case'canceladd':ADDING=false;render();break;
 case'newcmd':{let nm=v.replace(/[^a-z0-9]/g,'')||'cmd';let k=2;const base=nm;while(p.commands.some(c=>c.name===nm))nm=base+(k++);p.commands.push(cmd(nm,v,A[v].label));SEL=p.commands.length-1;ADDING=false;save();render();break;}
 case'addact':{if(!p.commands.some(c=>c.name===v))p.commands.push(cmd(v==='rolebutton'?'roles':v,v,A[v].label));save();render();toast('Added /'+(v==='rolebutton'?'roles':v));break;}
 case'addlvcmds':['rank','leaderboard'].forEach(k=>{if(!p.commands.some(c=>c.action===k))p.commands.push(cmd(k,k,A[k].label));});save();render();break;
 case'delcmd':if(confirm('Delete /'+p.commands[SEL].name+'?')){p.commands.splice(SEL,1);SEL=Math.max(0,SEL-1);save();render();}break;
 case'dupcmd':{const c=JSON.parse(JSON.stringify(p.commands[SEL]));c.name=c.name+'2';p.commands.splice(SEL+1,0,c);SEL++;save();render();break;}
 case'mvcmd':{const j=SEL+ +v;if(j<0||j>=p.commands.length)break;const t=p.commands[SEL];p.commands[SEL]=p.commands[j];p.commands[j]=t;SEL=j;save();render();break;}
 case'addrow':{const[path,kind]=v.split('|');const arr=getP(p,path)||[];arr.push(ROWDEF[kind]());setP(p,path,arr);save();render();break;}
 case'rmrow':{const[path,j]=v.split('|');getP(p,path).splice(+j,1);save();render();break;}
 case'arpack':p.autoresp.push({trigger:'hello',reply:'Hi {user}! 👋',exact:false},{trigger:'good morning',reply:'Good morning ☀️ {user}!',exact:false},{trigger:'gn',reply:'Good night {user} 🌙',exact:true},{trigger:'thank',reply:'You\'re welcome! 💙',exact:false});save();render();break;
 case'ampreset':Object.assign(p.automod,{light:{antilink:false,caps:0,mentions:8,spam:7,timeout:0},normal:{antilink:true,caps:75,mentions:5,spam:5,timeout:0},strict:{antilink:true,caps:60,mentions:3,spam:4,timeout:10}}[v]);if(!p.automod.badwords.length)p.automod.badwords=['scam','freenitro'];save();render();toast(v+' preset applied');break;
 case'emb2cmd':{const e=p.embed;let nm='card',k=2;while(p.commands.some(c=>c.name===nm))nm='card'+(k++);p.commands.push(cmd(nm,'embed','Show the '+(e.title||'card').replace(/[^\w ]/g,'').trim().slice(0,60),{title:e.title,reply:e.desc,color:e.color,author:e.author,footer:e.footer,thumb:e.thumb,image:e.image,fields:JSON.parse(JSON.stringify(e.fields)),links:JSON.parse(JSON.stringify(e.links))}));SEL=p.commands.length-1;save();go('commands');toast('Made /'+nm);break;}
 case'embjson':copy(JSON.stringify(embJSON(p.embed),null,2));break;
 case'embreset':p.embed=defEmbed();save();render();break;
 case'try':startTry(SAMPLES.find(s=>s.id===v));break;
 case'use':{const s=SAMPLES.find(z=>z.id===v);addProject(buildSample(s));toast('Created '+s.n+' ✨');go('home');break;}
 case'scode':{const s=SAMPLES.find(z=>z.id===v);const sp=buildSample(s);sp.lang=p.lang;showCode(sp,s.e+' '+s.n);break;}
 case'scat':SFILT.cat=v;render();break;
 case'keeptry':{const t=TRY;TRY=null;addProject(t);toast('Saved as your bot ⭐');render();break;}
 case'endtry':TRY=null;simReset();render();break;
 case'wz':{const[g,k,m]=v.split('|');if(m==='1'){const ar=WIZ.a[g],ix=ar.indexOf(k);ix<0?ar.push(k):ar.splice(ix,1);}else WIZ.a[g]=k;render();break;}
 case'wzstep':WIZ.step=Math.max(0,Math.min(6,WIZ.step+ +v));render();break;
 case'wzreset':WIZ.step=0;WIZ.a={goals:[],size:'small',tone:'friendly',exp:'none',lang:'auto',extras:[],name:'',emoji:'🤖'};render();break;
 case'wzemoji':WIZ.a.emoji=v;render();break;
 case'wzmake':addProject(wizBuild());toast('Your bot is ready ✨');go('home');break;
 case'wztry':{const t=wizBuild();t._t=['/help'];TRY=t;simReset();go('sim');break;}
 case'simrun':TRY=null;go('sim');setTimeout(()=>{const i=$('#siminp');if(i){i.value='/'+v+' ';i.focus();simAC();}},30);break;
 case'simch':SIM.ch=v;delete SIM.unread[v];simDraw();$('#siminp').placeholder='Message #'+v;$('#siminp').focus();break;
 case'simas':SIM.as=v;simDraw();toast('Now talking as '+memberName(v));$('#siminp').focus();break;
 case'simpick':{const i=$('#siminp');i.value='/'+v+' ';i.focus();simAC();break;}
 case'simjoin':if(PAGE!=='sim')go('sim');simJoin();simDraw();break;
 case'simleave':simLeave();simDraw();break;
 case'simsched':simSched();simDraw();break;
 case'simrr':simRR();simDraw();break;
 case'simreset':simReset();simDraw();break;
 case'simreact':{const[id,k]=v.split(':');const m=simFind(+id);if(!m)break;const r=m.reacts[+k];r.me=!r.me;r.n+=r.me?1:-1;
  if(m.rr){const rr=simP().rr.find(z=>z.emoji===r.e),u=simUser();if(rr){if(r.me){if(!u.roles.includes(rr.role))u.roles.push(rr.role);simPost(SIM.ch,{a:'sys',content:'🏷️ '+u.name+' got the '+rr.role+' role.'});}else{u.roles=u.roles.filter(x=>x!==rr.role);simPost(SIM.ch,{a:'sys',content:'🏷️ '+u.name+' lost the '+rr.role+' role.'});}}}simDraw();break;}
 case'simbtn':{const[id,k]=v.split(':');const m=simFind(+id);if(!m)break;const b=m.buttons[+k],u=simUser();
  if(b.style==='Link'){toast('In Discord this opens '+b.url);break;}
  if(b.id==='ticket_close'){const ch=SIM.ch;simPost(ch,{a:'bot',content:'🔒 Closing this ticket in 5 seconds...'});simLog('🔒 '+u.name+' closed '+ch);SIM.timers.push(setTimeout(()=>{delete SIM.chans[ch];if(SIM.ch===ch)SIM.ch='general';simDraw();},3000));break;}
  if(b.id&&b.id.startsWith('role:')){const r=b.id.slice(5);if(u.roles.includes(r)){u.roles=u.roles.filter(x=>x!==r);simPost(SIM.ch,{a:'bot',content:'➖ Removed **'+r+'**',eph:true,used:{by:u.id,cmd:'button'}});}else{u.roles.push(r);simPost(SIM.ch,{a:'bot',content:'➕ Added **'+r+'**',eph:true,used:{by:u.id,cmd:'button'}});}}break;}
 case'perm':{const ix=p.perms.indexOf(v);ix<0?p.perms.push(v):p.perms.splice(ix,1);save();render();break;}
 case'permrec':p.perms=recPerms(p);save();render();break;
 case'permnone':p.perms=[];save();render();break;
 case'copyv':copy(v);break;
 case'expf':EXPF=+v;render();break;
 case'copyf':copy(files(p)[EXPF].c);break;
 case'dlf':{const f=files(p)[EXPF];dl(f.n,f.c);break;}
 case'dlall':files(p).forEach((f,k)=>setTimeout(()=>dl(f.n,f.c),k*400));break;
 case'projjson':copy(JSON.stringify(p,null,2));break;
 case'chk':{const ck=store.checks[p.id]||(store.checks[p.id]={});ck[v]=el.checked;save();render();break;}
 case'colset':PAGES.tools.col&&PAGES.tools.col(v);break;
 case'idea':newIdea();break;
 case'openp':store.cur=v;SEL=0;ADDING=false;save();go('home');break;
 case'dupp':{const c=JSON.parse(JSON.stringify(store.projects[v]));c.name+=' (copy)';addProject(c);render();break;}
 case'delp':{if(Object.keys(store.projects).length<2){toast('Keep at least one bot');break;}if(!confirm('Delete '+store.projects[v].name+'? This can\'t be undone.'))break;delete store.projects[v];if(store.cur===v)store.cur=Object.keys(store.projects)[0];save();render();break;}
 case'pjson':copy(JSON.stringify(store.projects[v],null,2));break;
 case'exportall':copy(JSON.stringify(Object.values(store.projects),null,2));break;
 case'importp':modal(`<h2 style="margin-top:0">Import a bot</h2><p class="sm mu">Paste project JSON (from “Copy project JSON”), or pick a .json file.</p><textarea id="impt" rows="10" class="mono"></textarea><div class="row" style="margin-top:8px"><input type="file" id="impf" accept=".json" style="width:auto"><span class="grow"></span><button class="b" data-a="mclose">Cancel</button><button class="b pri" data-a="impgo">Import</button></div>`);
  $('#impf').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#impt').value=r.result;};r.readAsText(f);};break;
 case'impgo':{try{let d=JSON.parse($('#impt').value);if(!Array.isArray(d))d=[d];let n=0;d.forEach(x=>{if(x&&x.commands){addProject(fixProject(x));n++;}});closeModal();toast('Imported '+n+' bot(s)');go('home');}catch(err){toast('That isn\'t valid project JSON');}break;}
 case'mclose':closeModal();break;
 case'mlang':MCODE.p.lang=v;MCODE.f=0;MCODE.draw();break;
 case'mfile':MCODE.f=+v;MCODE.draw();break;
 case'mcopy':copy(files(MCODE.p)[MCODE.f].c);break;
 }});
document.addEventListener('change',e=>{if(e.target.id==='projsel'){store.cur=e.target.value;SEL=0;ADDING=false;save();render();}});

/* ================= boot ================= */
load();simReset();render();
</script></body></html>
