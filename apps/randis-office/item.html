<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Randis Office</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px "Segoe UI",system-ui,sans-serif;color:#222;background:#f5f6f8}
button,select,input,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh}
#top{display:flex;align-items:center;gap:6px;background:var(--ac,#2b579a);color:#fff;padding:0 8px;height:40px;flex:none}
#top .brand{font-weight:700;font-size:15px;margin-right:10px;white-space:nowrap}
#apps{display:flex;gap:2px;overflow-x:auto;flex:1;height:100%;align-items:flex-end}
#apps button{border:0;background:transparent;color:#fff;opacity:.85;padding:7px 12px;border-radius:7px 7px 0 0;cursor:pointer;white-space:nowrap}
#apps button:hover{opacity:1;background:rgba(255,255,255,.15)}
#apps button.on{background:#f5f6f8;color:var(--ac);opacity:1;font-weight:600}
#savestate{font-size:11px;opacity:.9;white-space:nowrap}
#docbar{display:flex;align-items:flex-end;gap:2px;padding:4px 6px 0;background:#e6e8ec;border-bottom:1px solid #cfd3d9;flex:none;overflow-x:auto;min-height:34px}
.dtab{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;background:#d6d9df;border:1px solid #c5c9d0;border-bottom:0;border-radius:7px 7px 0 0;cursor:pointer;max-width:220px;white-space:nowrap}
.dtab span{overflow:hidden;text-overflow:ellipsis}
.dtab.on{background:#fff;box-shadow:inset 0 3px 0 var(--ac)}
.dtab .x{border:0;background:none;cursor:pointer;padding:0 3px;border-radius:3px;opacity:.6}
.dtab .x:hover{background:#c33;color:#fff;opacity:1}
.dbtn{border:1px solid #c5c9d0;background:#f4f5f7;border-radius:6px;padding:4px 10px;margin:0 2px 4px;cursor:pointer;white-space:nowrap}
.dbtn:hover{background:#fff}
#work{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff}
.rib{display:flex;flex-wrap:wrap;align-items:stretch;background:#f8f9fb;border-bottom:1px solid #dcdfe4;padding:3px 4px;flex:none}
.grp{display:flex;flex-direction:column;padding:0 6px;border-right:1px solid #e0e3e8}
.grp .gi{display:flex;align-items:center;gap:2px;flex-wrap:wrap;flex:1}
.grp .gl{font-size:10px;color:#777;text-align:center;margin-top:1px}
.tb{min-width:28px;height:28px;border:1px solid transparent;background:none;border-radius:4px;cursor:pointer;padding:0 6px;white-space:nowrap}
.tb:hover{background:#e3e7ee;border-color:#cdd3dc}
.tb.on{background:#d5def0;border-color:#a8b8d8}
.tbs{height:26px;border:1px solid #cdd3dc;border-radius:4px;background:#fff;max-width:150px}
.tbc{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 4px;border-radius:4px;cursor:pointer}
.tbc:hover{background:#e3e7ee}
.tbc input{width:22px;height:20px;border:0;padding:0;background:none;cursor:pointer}
.status{display:flex;gap:16px;align-items:center;padding:3px 10px;background:var(--ac);color:#fff;font-size:11px;flex:none}
.status .sp{flex:1}
.start{flex:1;overflow:auto;padding:40px;display:flex;flex-direction:column;align-items:center;gap:18px;background:#f5f6f8}
.start h2{margin:0;color:var(--ac)}
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.card{width:150px;height:120px;border:1px solid #d5d9e0;border-radius:10px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600;text-align:center;padding:8px}
.card:hover{border-color:var(--ac);box-shadow:0 2px 10px rgba(0,0,0,.1)}
.card b{font-size:30px}
.recent{width:min(560px,100%)}
.recent div{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid #e3e5e9;cursor:pointer;background:#fff}
.recent div:hover{background:#eef2fa}
.mbg{position:fixed;inset:0;background:rgba(20,25,35,.45);display:flex;align-items:center;justify-content:center;z-index:1000}
.mbox{background:#fff;border-radius:10px;padding:16px 18px;min-width:340px;max-width:92vw;max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 12px;color:var(--ac)}
.mrow{display:flex;align-items:center;gap:10px;margin:7px 0}
.mrow span{width:110px;color:#555;flex:none}
.mrow input:not([type=checkbox]),.mrow select,.mrow textarea{flex:1;padding:5px 7px;border:1px solid #c9ced6;border-radius:5px;min-width:0}
.mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.mbtns button,.btn{padding:6px 14px;border:1px solid #c5c9d0;border-radius:6px;background:#f4f5f7;cursor:pointer}
.mbtns button.pri,.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.mbtns button.danger{background:#c0392b;color:#fff;border-color:#c0392b}
.lib{width:min(620px,85vw)}
.lib .row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #eee}
.lib .row span{flex:1}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:2000;max-width:80vw;text-align:center}
#toast.show{opacity:.95}
.menu{position:fixed;background:#fff;border:1px solid #cdd2da;border-radius:7px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:4px;z-index:1500;min-width:170px}
.menu div{padding:6px 12px;border-radius:5px;cursor:pointer;white-space:nowrap}
.menu div:hover{background:#eef2fa}
.side{width:220px;flex:none;border-right:1px solid #dde0e5;background:#fafbfc;display:flex;flex-direction:column;min-height:0}
.side .list{flex:1;overflow:auto}
.findbar{display:flex;gap:6px;align-items:center;padding:5px 8px;background:#fffbe6;border-bottom:1px solid #eadf9d;flex:none;flex-wrap:wrap}
.findbar input[type=text]{padding:3px 6px;border:1px solid #ccc;border-radius:4px}
#print{display:none}
@media print{
  body.printing>*:not(#print){display:none!important}
  body.printing #print{display:block}
  body.printing{background:#fff}
}
/* Writer */
.wscroll{flex:1;overflow:auto;background:#e9ebee;padding:24px 0}
.wzoom{transform-origin:top center;margin:0 auto}
.page{background:#fff;margin:0 auto;box-shadow:0 1px 6px rgba(0,0,0,.2);outline:none;font-family:Calibri,"Segoe UI",sans-serif;font-size:11pt;line-height:1.4;word-wrap:break-word}
.page p{margin:0 0 8px}.page h1{font-size:22pt;margin:12px 0 8px;color:#1f3864}.page h2{font-size:16pt;margin:10px 0 6px;color:#2f5496}.page h3{font-size:13pt;margin:8px 0 5px;color:#2f5496}.page h4{font-size:11pt;margin:8px 0 4px;font-style:italic;color:#2f5496}
.page pre{background:#f4f4f4;padding:8px;font-family:Consolas,monospace;font-size:10pt;white-space:pre-wrap}
.page blockquote{margin:0 0 0 40px;border:0;padding:0}
.page table{border-collapse:collapse;margin:6px 0;width:100%}.page td,.page th{border:1px solid #888;padding:4px 6px;min-width:30px;vertical-align:top}
.page img{max-width:100%}.page img.sel{outline:2px solid #2b579a}
.page hr.pb{border:0;border-top:2px dashed #9aa;margin:14px 0;position:relative;overflow:visible}
.page hr.pb::after{content:"page break";position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:#fff;color:#9aa;font-size:9px;padding:0 6px}
.page a{color:#0563c1}
.page ul.check{list-style:none;padding-left:8px}
@media print{.page hr.pb{break-after:page;border:0}.page hr.pb::after{display:none}}
/* Sheets */
.fbar{display:flex;align-items:center;gap:6px;padding:3px 6px;border-bottom:1px solid #dcdfe4;flex:none}
.fbar .nb{width:90px;padding:3px 6px;border:1px solid #cdd3dc;border-radius:4px}
.fbar .fx{flex:1;padding:3px 6px;border:1px solid #cdd3dc;border-radius:4px;font-family:Consolas,monospace}
.gwrap{flex:1;overflow:auto;position:relative;outline:none;background:#fff}
.ginner{position:relative;display:inline-block;min-width:100%}
table.sg{border-collapse:collapse;table-layout:fixed;font-size:12px}
.sg th{background:#f0f2f5;color:#555;font-weight:400;border:1px solid #d4d8de;position:sticky;z-index:3;user-select:none;height:22px;padding:0}
.sg thead th{top:0;position:sticky;cursor:pointer}
.sg th.rh{left:0;width:46px;cursor:pointer}
.sg th.corner{left:0;top:0;z-index:4}
.sg th.hl{background:#d3dcea;color:#1d3e7a;font-weight:600}
.sg td{border:1px solid #e2e5ea;height:22px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:clip;cursor:cell}
.sg th .rz{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
.selbox{position:absolute;border:2px solid #217346;background:rgba(33,115,70,.07);pointer-events:none;z-index:2}
.cellin{position:absolute;z-index:6;border:2px solid #217346;padding:0 3px;font-size:12px;font-family:inherit;outline:none;display:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.stabs{display:flex;gap:2px;padding:0 6px;background:#f0f2f5;border-top:1px solid #d4d8de;flex:none;align-items:flex-start;overflow-x:auto}
.stab{padding:4px 14px;border:1px solid #d0d4da;border-top:0;border-radius:0 0 6px 6px;background:#e4e7eb;cursor:pointer;white-space:nowrap}
.stab.on{background:#fff;color:#217346;font-weight:600;border-bottom:2px solid #217346}
.chart{position:absolute;background:#fff;border:1px solid #bbb;box-shadow:0 3px 12px rgba(0,0,0,.18);z-index:7;resize:both;overflow:hidden;display:flex;flex-direction:column;min-width:220px;min-height:160px}
.chart .ch{display:flex;align-items:center;gap:6px;background:#f2f4f6;padding:3px 6px;cursor:move;font-size:12px;flex:none}
.chart .ch b{flex:1}
.chart canvas{flex:1;width:100%;min-height:0}
/* Slides */
.sl-main{flex:1;display:flex;min-height:0}
.thumbs{width:190px;flex:none;overflow:auto;background:#f0f1f3;border-right:1px solid #dcdfe4;padding:8px}
.thumb{position:relative;margin:0 0 10px 18px;border:2px solid transparent;border-radius:3px;cursor:pointer;background:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.thumb.on{border-color:#b7472a}
.thumb i{position:absolute;left:-18px;top:0;font-style:normal;color:#666;font-size:11px}
.thumbwrap{position:relative}
.thumbwrap i{position:absolute;left:0;top:2px;font-style:normal;color:#666;font-size:11px}
.stagecol{flex:1;display:flex;flex-direction:column;min-width:0;background:#e3e5e8}
.stagebox{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.slide{position:relative;width:960px;height:540px;overflow:hidden;background:#fff;transform-origin:0 0}
.se{position:absolute;overflow:hidden;word-wrap:break-word;line-height:1.25}
.se-text{padding:4px 8px}
.se-text ul,.se-text ol{margin:0;padding-left:1.2em}
.se-shape{display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}
.se img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.se table{border-collapse:collapse;width:100%}.se td{border:1px solid currentColor;padding:4px 6px}
.edit .se{cursor:move}
.edit .se:hover{outline:1px dashed #b7472a88}
.edit .se.sel{outline:2px solid #b7472a}
.edit .se[contenteditable=true]{cursor:text;outline:2px solid #2b79d0}
.se .hd{position:absolute;right:0;bottom:0;width:14px;height:14px;background:#b7472a;cursor:nwse-resize;border:2px solid #fff}
.ph:empty::before{content:attr(data-ph);opacity:.45}
.notesbox{height:80px;flex:none;border:0;border-top:1px solid #ccc;padding:6px 10px;resize:vertical;font:12px "Segoe UI";outline:none}
.slideshow{position:fixed;inset:0;background:#000;z-index:3000;display:flex;align-items:center;justify-content:center;cursor:none}
.slideshow .cnt{position:absolute;right:14px;bottom:10px;color:#888;font-size:12px}
.tr-fade{animation:trf .6s}.tr-slide{animation:trs .5s}.tr-zoom{animation:trz .5s}
@keyframes trf{from{opacity:0}to{opacity:1}}@keyframes trs{from{transform:translateX(100%)}to{transform:none}}@keyframes trz{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* Notes */
.nl-item{padding:8px 10px;border-bottom:1px solid #e6e8eb;cursor:pointer}
.nl-item.on{background:#efe3f7;border-left:3px solid #7719aa}
.nl-item small{display:block;color:#888}
.ntitle{font-size:22px;font-weight:600;border:0;outline:none;padding:14px 24px 4px;width:100%}
.nbody{flex:1;overflow:auto;padding:4px 24px 40px;outline:none;line-height:1.5}
.nbody ul.check{list-style:none;padding-left:6px}
.nbody table{border-collapse:collapse}.nbody td{border:1px solid #aaa;padding:4px 8px;min-width:40px}
.nbody img{max-width:100%}
/* Draw */
.dwrap{flex:1;overflow:auto;background:#d9dce1;padding:20px}
.dwrap svg{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);display:block;margin:auto}
.dwrap svg .hdl{fill:#0f7b6c;stroke:#fff;stroke-width:2;cursor:nwse-resize}
/* Database */
.dbgrid{border-collapse:collapse;font-size:12px}
.dbgrid th{background:#f3e9e9;position:sticky;top:0;border:1px solid #d8c9c9;padding:5px 8px;cursor:pointer;text-align:left;white-space:nowrap;z-index:1}
.dbgrid td{border:1px solid #e3e3e3;padding:0}
.dbgrid td input:not([type=checkbox]),.dbgrid td select{border:0;padding:4px 6px;width:100%;min-width:110px;background:transparent;outline:none}
.dbgrid td input:focus,.dbgrid td select:focus{background:#fff8d8}
.dbgrid tr:hover td{background:#fafafa}
.dbform{max-width:560px;margin:20px auto;padding:20px;border:1px solid #ddd;border-radius:10px;background:#fff}
.rep table{border-collapse:collapse;margin:8px 0 18px;width:100%}.rep td,.rep th{border:1px solid #ccc;padding:4px 8px;text-align:left}.rep th{background:#f3e9e9}
/* Planner */
.cal{flex:1;display:flex;flex-direction:column;min-width:0}
.calgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;border-left:1px solid #ddd;min-height:0}
.calh{display:grid;grid-template-columns:repeat(7,1fr);background:#eef4fb;font-weight:600;text-align:center;padding:4px 0;border-bottom:1px solid #ddd}
.day{border-right:1px solid #ddd;border-bottom:1px solid #ddd;padding:3px;overflow:hidden;cursor:pointer;min-height:70px}
.day:hover{background:#f6f9fd}
.day.other{background:#f7f7f7;color:#aaa}
.day.today .dn{background:#0078d4;color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.ev{font-size:11px;color:#fff;border-radius:3px;padding:1px 4px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tasks{width:280px;flex:none;border-left:1px solid #ddd;display:flex;flex-direction:column;background:#fafbfc}
.task{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid #eee}
.task.done span{text-decoration:line-through;color:#999}
.task span{flex:1}
.prio{font-size:10px;padding:1px 5px;border-radius:8px;color:#fff}
</style></head>
<body>
<div id="app">
  <header id="top"><div class="brand">▦ Randis Office</div><nav id="apps"></nav><div id="savestate">Loading…</div></header>
  <div id="docbar"></div>
  <main id="work"></main>
</div>
<div id="print"></div>
<div id="toast"></div>
<script>
'use strict';
/* ---------- shared helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,a,...k){const e=document.createElement(tag);if(a)for(const[x,y]of Object.entries(a)){if(y==null||y===false)continue;if(x==='style'&&typeof y==='object')Object.assign(e.style,y);else if(x.startsWith('on')&&typeof y==='function')e.addEventListener(x.slice(2),y);else if(x==='class')e.className=y;else if(x==='html')e.innerHTML=y;else if(y===true)e.setAttribute(x,'');else e.setAttribute(x,y)}for(const c of k.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms)}
function tb(label,title,fn,cls){const b=h('button',{class:'tb'+(cls?' '+cls:''),title,type:'button'},label);b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',e=>fn(e,b));return b}
function grp(name,...items){return h('div',{class:'grp'},h('div',{class:'gi'},...items),h('div',{class:'gl'},name))}
function sel(opts,title,fn,val){const s=h('select',{class:'tbs',title});for(const o of opts){const[v,l]=Array.isArray(o)?o:[o,o];s.append(h('option',{value:v},l))}if(val!=null)s.value=val;s.addEventListener('change',()=>fn(s.value,s));return s}
function colorBtn(label,title,val,fn){const i=h('input',{type:'color',value:val});const w=h('label',{class:'tbc',title},label,i);i.addEventListener('mousedown',()=>keepSel());i.addEventListener('input',()=>fn(i.value));i.addEventListener('change',()=>fn(i.value));return w}
function menu(x,y,items){closeMenu();const m=h('div',{class:'menu'});for(const it of items){if(!it)continue;m.append(h('div',{onclick:()=>{closeMenu();it[1]()}},it[0]))}document.body.append(m);const r=m.getBoundingClientRect();m.style.left=Math.min(x,innerWidth-r.width-4)+'px';m.style.top=Math.min(y,innerHeight-r.height-4)+'px';setTimeout(()=>document.addEventListener('mousedown',closeMenuOut),0)}
function closeMenuOut(e){if(!e.target.closest('.menu'))closeMenu()}
function closeMenu(){$$('.menu').forEach(m=>m.remove());document.removeEventListener('mousedown',closeMenuOut)}
function menuAt(btn,items){const r=btn.getBoundingClientRect();menu(r.left,r.bottom+2,items)}
function modal(title,fields,o={}){return new Promise(res=>{const bg=h('div',{class:'mbg'});const box=h('div',{class:'mbox'},h('h3',null,title));if(o.html)box.append(o.html);const ins={};
  for(const f of fields){let i;if(f.type==='select'){i=h('select');for(const op of f.opts){const[v,l]=Array.isArray(op)?op:[op,op];i.append(h('option',{value:v},l))}i.value=f.value??''}else if(f.type==='textarea'){i=h('textarea',{rows:f.rows||4});i.value=f.value??''}else if(f.type==='checkbox'){i=h('input',{type:'checkbox'});i.checked=!!f.value}else{i=h('input',{type:f.type||'text'});i.value=f.value??''}ins[f.k]=i;box.append(h('label',{class:'mrow'},h('span',null,f.label),i))}
  const collect=()=>{const r={};for(const k in ins)r[k]=ins[k].type==='checkbox'?ins[k].checked:ins[k].value;return r};
  const done=v=>{bg.remove();res(v)};const btns=h('div',{class:'mbtns'});
  for(const[lab,val,cls]of(o.extra||[]))btns.append(h('button',{class:cls||'',onclick:()=>done({...collect(),_btn:val})},lab));
  if(o.cancel!==false)btns.append(h('button',{onclick:()=>done(null)},'Cancel'));btns.append(h('button',{class:'pri',onclick:()=>done({...collect(),_btn:'ok'})},o.ok||'OK'));
  box.append(btns);bg.append(box);document.body.append(bg);
  bg.addEventListener('mousedown',e=>{if(e.target===bg)done(null)});
  box.addEventListener('keydown',e=>{if(e.key==='Escape')done(null);if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();done({...collect(),_btn:'ok'})}});
  setTimeout(()=>{const f=box.querySelector('input,select,textarea');if(f){f.focus();if(f.select)f.select()}},0)})}
async function ask(title,label,value){const r=await modal(title,[{k:'v',label,value}]);return r?r.v:null}
function pickFile(accept,asText){return new Promise(res=>{const i=h('input',{type:'file',accept,style:{display:'none'}});document.body.append(i);i.addEventListener('change',async()=>{const f=i.files[0];i.remove();if(!f)return res(null);res({file:f,name:f.name,data:asText?await f.text():await f.arrayBuffer()})});i.click()})}
function readImage(maxW=1100){return new Promise(async res=>{const p=await pickFile('image/*');if(!p)return res(null);const url=URL.createObjectURL(new Blob([p.data],{type:p.file.type}));const img=new Image();img.onload=()=>{const k=Math.min(1,maxW/img.width);const c=h('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const png=/png|gif|svg/.test(p.file.type);res({src:c.toDataURL(png?'image/png':'image/jpeg',.82),w:c.width,h:c.height})};img.onerror=()=>{toast('That picture could not be read.');res(null)};img.src=url})}
function baseName(n){return n.replace(/\.[^.]+$/,'')}
function safeName(n){return String(n||'Untitled').replace(/[\\/:*?"<>|]+/g,'_').slice(0,80)}
/* Save a file: the app shows a Save box (export-file). Outside the app, fall back to a normal download. */

<script>
'use strict';
/* ---------- the suite: app tabs → document tabs → the app ---------- */

  if(d.uds==='store-none'&&!loaded){fallback='shop';boot(null);toast('Work here isn\'t kept after you close it. Export anything you want to keep.',6000)}
  if(d.uds==='exporting')toast(d.note,4000);
  if(d.uds==='exported')toast(d.note,d.ok?3500:6000)});

function startScreen(app){const s=st(app.id);const box=h('div',{class:'start'},h('h2',null,app.icon+' '+app.name),h('p',{style:{color:'#666',margin:0}},'Start a new '+app.noun+', or open one you made before.'));
  const cards=h('div',{class:'cards'});for(const[k,t]of Object.entries(app.templates||{blank:{name:'Blank',icon:app.icon}}))cards.append(h('div',{class:'card',onclick:()=>newDoc(k)},h('b',null,t.icon),t.name));

  if(s.docs.length){const r=h('div',{class:'recent'},h('h3',{style:{color:'#555'}},'Saved '+app.noun+'s'));for(const d of[...s.docs].sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,12))r.append(h('div',{onclick:()=>openDoc(d.id)},h('span',null,app.icon+' '+d.name),h('small',{style:{color:'#999'}},new Date(d.created||Date.now()).toLocaleDateString())));box.append(r)}

function mount(){if(CUR){try{CUR.flush&&CUR.flush()}catch(e){}try{CUR.destroy&&CUR.destroy()}catch(e){}CUR=null}closeMenu();const work=$('#work');work.innerHTML='';const app=appOf(S.active),s=st(app.id);

addEventListener('keydown',e=>{if(!loaded)return;const l=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&l==='s'){e.preventDefault();persist();toast('Saved')}
