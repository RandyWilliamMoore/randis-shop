<style>

body[data-theme=light]{--bg:#f4efe4;--bg2:#fbf7ee;--bg3:#ece4d3;--line:#d5c9b0;--tx:#221d14;--mut:#6c624e;--acc:#8d6110;--card:#fffcf6;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:15px;margin:2px 0 8px;color:var(--acc)}
h4{margin:12px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
p{margin:6px 0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 7px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc)}
textarea{width:100%;resize:vertical;min-height:60px}
button{cursor:pointer;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:5px 11px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#1b1408;border-color:var(--acc);font-weight:600}
button.sm{padding:2px 8px;font-size:12px}
button.x{background:none;border:none;color:var(--mut);padding:2px 6px}
button.x:hover{color:var(--bad)}
#top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
#top .brand{font-family:Georgia,serif;font-size:18px;color:var(--acc)}
#top .credit{font-size:11px;color:var(--mut);margin-left:auto}
#top .credit a{color:var(--mut)}
#suites button{border-radius:16px;padding:3px 13px}
#suites button.on{background:var(--acc);color:#1b1408;border-color:var(--acc);font-weight:600}
#wrap{flex:1;display:flex;min-height:0}
#side{width:200px;background:var(--bg2);border-right:1px solid var(--line);padding:8px;overflow:auto;flex:none}
#side h4{margin:10px 6px 4px}
#side button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;margin-bottom:2px}
#side button.on{background:var(--bg3);border-color:var(--line);color:var(--acc)}
#side .pick{margin:4px 2px 8px;width:calc(100% - 4px)}
#view{flex:1;overflow:auto;padding:16px 20px 50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:14px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.form label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.form label>span{color:var(--mut)}
.form input[type=number]{width:90px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}
.small{font-size:12px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle;font-size:13px}
th{color:var(--mut);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
td input,td select{width:100%}
td input[type=number]{width:70px}
td input[type=checkbox]{width:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--bg3);border:1px solid var(--line);font-size:12px}
.st{display:inline-flex;gap:4px;align-items:center;font-weight:600;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid}
.st.good{color:var(--good);border-color:var(--good)} .st.warn{color:var(--warn);border-color:var(--warn)} .st.bad{color:var(--bad);border-color:var(--bad)}
.big{font-size:34px;font-family:Georgia,serif;line-height:1}
.dcard{cursor:pointer}
.dcard:hover{border-color:var(--acc)}
.dcard.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.bar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--s1);border-radius:4px}
.fix li{margin:3px 0}
.ai{white-space:pre-wrap;background:var(--bg3);border-radius:8px;padding:10px;min-height:40px;font-size:13px}
.cell{text-align:center;font-variant-numeric:tabular-nums;border:2px solid var(--card);border-radius:5px;padding:4px 2px}
.tabs2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
#tip{position:fixed;pointer-events:none;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px #0006;display:none;z-index:50;max-width:320px}
#tip .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--acc);color:#1b1408;padding:7px 14px;border-radius:8px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:6px 0}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
svg text{fill:var(--mut);font-size:11px}
.crit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--bg2)}
.crit .row>label{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--mut)}
details summary{cursor:pointer;color:var(--mut);font-size:12px}
</style>
</head>

// condition simulation
function simulate(d) {
  const T = target(d), H = Math.max(50, Math.ceil(T * 1.25 / 10) * 10), events = [];
  const lines = d.comps.map((c, i) => {
    const m = mat(c.mat), L = Math.max(1, effLife(c)), pts = [];
    let cond = 1, cap = 1, last = 0, svc = m.interval || 0;
    const repairEvery = c.repl === "repairable" ? Math.max(2, Math.min(L * .5, svc || L * .5)) : 0;
    const replaceEvery = c.repl === "replaceable" ? Math.max(1, Math.min(L * .85, svc ? Math.max(svc, L * .85) : L * .85)) : 0;
    for (let y = 0; y <= H; y++) {
      if (y > 0) {
        cond = Math.max(0, cond - 1 / L);
        if (svc && c.repl !== "fixed" && y % Math.round(svc) === 0 && Math.round(svc) < (replaceEvery || 1e9)) { cond = Math.min(cap, cond + .25); events.push({ y, c, kind: "service" }); }
        if (repairEvery && y - last >= repairEvery) { cap = Math.max(.35, cap - .04); cond = cap; last = y; events.push({ y, c, kind: "repair" }); }
        if (replaceEvery && y - last >= replaceEvery) { cond = 1; last = y; events.push({ y, c, kind: "replace" }); }
        if (c.repl === "fixed" && cond <= 0 && !pts.failed) { pts.failed = y; events.push({ y, c, kind: "fail" }); }
        if (c.repl === "repairable" && cond <= 0 && !pts.failed) { pts.failed = y; events.push({ y, c, kind: "fail" }); }
      }
      pts.push(cond);
    }
    return { c, i, pts };
  });
  const overall = [];
  for (let y = 0; y <= H; y++) { const crit = lines.filter(l => l.c.repl !== "replaceable"); overall.push(crit.length ? Math.min(...crit.map(l => l.pts[y])) : 1); }
  return { T, H, lines, overall, events };
}

// recommendations
function fixList(d, b) {
  const out = [], T = target(d);
  d.comps.forEach(c => {
    const m = mat(c.mat);
    if (c.repl !== "replaceable" && reachLife(c) < T) {
      const better = S.mats.filter(x => x.group === m.group && x.life * (LOADS[c.load] || LOADS.med)[1] * (c.repl === "repairable" ? 2 : 1) >= T && !x.hazard).sort((x, y) => y.repair - x.repair || x.cost - y.cost)[0];
      out.push(`<b>${esc(c.name)}</b> (${esc(m.name)}) only reaches about ${Math.round(reachLife(c))} of ${T} years. ${c.repl === "fixed" ? "Make it repairable or swappable" : "Make it swappable"}${better ? `, or switch to <b>${esc(better.name)}</b>` : ""}.`);
    }
    if (m.hazard) out.push(`<b>${esc(c.name)}</b>: ${esc(m.name)} — ${esc(m.hazard)}.`);
    if ((m.id === MID("Epoxy") || m.id === MID("PVA (yellow/white) glue")) && c.load !== "low") out.push(`<b>${esc(c.name)}</b>: ${esc(m.name)} in a stressed joint can't be undone cleanly. Hide glue or a mechanical joint lets a future repairer take it apart.`);
    if (c.join === "Glued only" && c.load !== "low") out.push(`<b>${esc(c.name)}</b> is glue-only under load. Add a mechanical joint (dovetail, tenon, screw) so it survives glue failure.`);
    if (m.aging === "degrades" && c.repl !== "replaceable") out.push(`<b>${esc(c.name)}</b>: ${esc(m.name)} looks worse with age. Pick a material that takes a patina, or make this part swappable.`);
    if (c.repl === "replaceable" && !c.std) out.push(`<b>${esc(c.name)}</b> is swappable but not a standard size: write its exact size on the care card or include spares.`);
  });
  const miss = PRINCIPLES.filter(p => !d.pr[p[0]]).slice(0, 3);
  if (miss.length) out.push("Principles still open: " + miss.map(p => esc(p[1])).join("; ") + ".");
  const md = DOCS.filter(x => !d.docs[x[0]]).map(x => x[1]);
  if (md.length) out.push("Still to make: " + md.join(", ") + ".");
  if (b) { const r = scoreDesign(b, d); const weak = b.crits.filter(c => r.vals[c.id] != null && r.vals[c.id] < .5).map(c => esc(c.name)); if (weak.length) out.push(`Weak in ${esc(b.name)}: ${weak.join(", ")}.`); const un = b.crits.filter(c => r.vals[c.id] == null).map(c => esc(c.name)); if (un.length) out.push(`Not scored yet in ${esc(b.name)}: ${un.join(", ")} (Score designs page).`); }
  return out;
}

// ---------------------------------------------------------------- charts
function tipOn(el) { return `data-tip="${esc(el)}"`; }
function lineChart(sim, maxLines) {
  const W = 760, Hh = 260, L = 40, R = 14, T0 = 14, B = 30, w = W - L - R, h = Hh - T0 - B;
  const x = y => L + y / sim.H * w, y = v => T0 + (1 - v) * h;
  const lines = sim.lines.slice(0, maxLines);
  let s = `<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="max-width:${W}px" id="lc" data-h="${sim.H}">`;
  [0, .25, .5, .75, 1].forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v * 100}%</text>`; });
  const step = sim.H > 200 ? 50 : sim.H > 100 ? 25 : 10;
  for (let t = 0; t <= sim.H; t += step) s += `<text x="${x(t)}" y="${Hh - 10}" text-anchor="middle">${t}</text>`;
  s += `<line x1="${x(sim.T)}" x2="${x(sim.T)}" y1="${T0}" y2="${T0 + h}" stroke="var(--mut)" stroke-dasharray="4 4"/><text x="${x(sim.T) + 4}" y="${T0 + 10}">target ${sim.T}y</text>`;
  lines.forEach((l, i) => { s += `<polyline fill="none" stroke="${SER(i)}" stroke-width="2" stroke-linejoin="round" points="${l.pts.map((v, t) => x(t).toFixed(1) + "," + y(v).toFixed(1)).join(" ")}"/>`; });
  s += `<polyline fill="none" stroke="var(--tx)" stroke-width="2.5" stroke-dasharray="6 3" points="${sim.overall.map((v, t) => x(t).toFixed(1) + "," + y(v).toFixed(1)).join(" ")}"/>`;
  s += `<line id="lcx" x1="0" x2="0" y1="${T0}" y2="${T0 + h}" stroke="var(--mut)" visibility="hidden"/><rect id="lcr" x="${L}" y="${T0}" width="${w}" height="${h}" fill="transparent"/></svg>`;
  return s;
}
function radar(series, axes) {
  const W = 420, Hh = 340, cx = 210, cy = 172, R = 120, n = axes.length;
  if (n < 3) return `<p class="mut">The benchmark needs criteria in at least 3 dimensions to draw a radar.</p>`;
  const pt = (i, v) => [cx + Math.sin(i / n * 2 * Math.PI) * R * v, cy - Math.cos(i / n * 2 * Math.PI) * R * v];
  let s = `<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="max-width:${W}px">`;
  [.25, .5, .75, 1].forEach(r => s += `<polygon fill="none" stroke="var(--grid)" points="${axes.map((a, i) => pt(i, r).join(",")).join(" ")}"/>`);
  axes.forEach((a, i) => { const [x2, y2] = pt(i, 1), [lx, ly] = pt(i, 1.17); s += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--grid)"/><text x="${lx}" y="${ly + 4}" text-anchor="middle">${esc(a)}</text>`; });
  series.forEach(se => {
    s += `<polygon fill="${SER(se.slot)}" fill-opacity=".10" stroke="${SER(se.slot)}" stroke-width="2" points="${se.vals.map((v, i) => pt(i, v || 0).join(",")).join(" ")}"/>`;
    se.vals.forEach((v, i) => { const [px, py] = pt(i, v || 0); s += `<circle cx="${px}" cy="${py}" r="4" fill="${SER(se.slot)}" stroke="var(--card)" stroke-width="2"/><circle cx="${px}" cy="${py}" r="11" fill="transparent" ${tipOn(`<b>${esc(axes[i])}</b><br>` + series.map(o => `<span class="sw" style="background:${SER(o.slot)}"></span>${esc(o.name)}: ${o.vals[i] == null ? "not scored" : pct(o.vals[i])}`).join("<br>"))}/>`; });
  });
  return s + "</svg>";
}
function heat(v) { // sequential blue ramp, one hue light->dark
  if (v == null) return `background:transparent;color:var(--mut)`;
  const dark = S.theme !== "light";
  const L = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"];
  const k = Math.round(clamp(v, 0, 1) * 6), bg = dark ? L[6 - k] : L[k];
  const txt = (dark ? 6 - k : k) >= 3 ? "#fff" : "#0b0b0b";
  return `background:${bg};color:${txt}`;
}

// ---------------------------------------------------------------- benchmark health
function pearson(a, b) { const n = a.length; if (n < 3) return null; const ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n; let num = 0, da = 0, db = 0; for (let i = 0; i < n; i++) { num += (a[i] - ma) * (b[i] - mb); da += (a[i] - ma) ** 2; db += (b[i] - mb) ** 2; } return da && db ? num / Math.sqrt(da * db) : null; }
function rankOrder(b, crits) { return S.designs.map(d => ({ id: d.id, s: scoreDesign(b, d, crits).score ?? -1 })).sort((x, y) => y.s - x.s).map(x => x.id).join(","); }
function health(b) {
  const out = []; const tw = b.crits.reduce((s, c) => s + Math.max(0, +c.weight || 0), 0);
  if (!b.crits.length) return [["bad", "✖", "No criteria yet."]];
  if (!tw) out.push(["bad", "✖", "All weights are zero."]);
  b.crits.forEach(c => { const sh = (+c.weight || 0) / (tw || 1); if (sh > .4) out.push(["warn", "⚠", `"${c.name}" carries ${pct(sh)} of the weight: one criterion decides the result.`]); if (!(+c.weight)) out.push(["warn", "⚠", `"${c.name}" has zero weight: it is only a gate or does nothing.`]); if (c.type === "test" && !S.protos.find(p => p.id === c.proto)) out.push(["bad", "✖", `"${c.name}" points at a missing test protocol.`]); if (c.type === "auto" && !METRICS[c.metric]) out.push(["bad", "✖", `"${c.name}" has no metric picked.`]); if (c.type === "rubric" && (c.levels || []).filter(Boolean).length < 6) out.push(["warn", "⚠", `"${c.name}" rubric has unfilled levels: judges will disagree.`]); });
  const dims = new Set(b.crits.map(c => c.dim)); const miss = DIMS.filter(x => !dims.has(x));
  out.push([miss.length > 3 ? "warn" : "good", miss.length > 3 ? "⚠" : "✔", miss.length ? `Covers ${dims.size} of ${DIMS.length} dimensions (missing: ${miss.join(", ")}). Fine if on purpose.` : "Covers every dimension."]);
  const obj = b.crits.filter(c => c.type !== "rubric").reduce((s, c) => s + (+c.weight || 0), 0) / (tw || 1);
  out.push([obj >= .6 ? "good" : "warn", obj >= .6 ? "✔" : "⚠", `${pct(obj)} of the weight is measured (computed or tested) rather than judged.`]);
  const gates = b.crits.filter(c => c.gate).length;
  out.push([gates > 3 ? "warn" : "good", gates > 3 ? "⚠" : "✔", gates ? `${gates} gate${gates > 1 ? "s" : ""}: failing one caps the tier, whatever the score.` : "No gates: a dangerous item could still score well. Consider a safety gate."]);
  const ts = (b.tiers || []).map(t => +t.min).sort((x, y) => x - y);
  if (ts[0] !== 0) out.push(["warn", "⚠", "The lowest tier should start at 0."]);
  for (let i = 1; i < ts.length; i++) if (ts[i] - ts[i - 1] < 8) out.push(["warn", "⚠", `Tiers ${ts[i - 1]} and ${ts[i]} are very close: small errors flip the tier.`]);
  // discrimination & redundancy over designs + reference cases
  const pts = S.designs.map(d => c => critValue(c, d, b)).concat((b.refs || []).map(r => c => refValue(c, r)));
  if (pts.length >= 2) b.crits.forEach(c => { const vs = pts.map(f => f(c)).filter(v => v != null); if (vs.length >= 2 && Math.max(...vs) - Math.min(...vs) < .05) out.push(["warn", "⚠", `"${c.name}" gives every item the same score: it doesn't tell them apart.`]); });
  for (let i = 0; i < b.crits.length; i++) for (let j = i + 1; j < b.crits.length; j++) {
    const a = [], bb = []; pts.forEach(f => { const x = f(b.crits[i]), y = f(b.crits[j]); if (x != null && y != null) { a.push(x); bb.push(y); } });
    if (a.length >= 4) { const r = pearson(a, bb); if (r != null && r > .95) out.push(["warn", "⚠", `"${b.crits[i].name}" and "${b.crits[j].name}" move together (r=${r.toFixed(2)}): you may be counting one thing twice.`]); }
  }
  // calibration
  if ((b.refs || []).length) { const ok = b.refs.filter(r => scoreRef(b, r).tier === r.expect).length; out.push([ok === b.refs.length ? "good" : "warn", ok === b.refs.length ? "✔" : "⚠", `Calibration: ${ok} of ${b.refs.length} reference cases land in the expected tier.`]); }
  else out.push(["warn", "⚠", "No reference cases: add known-good and known-bad items to check the benchmark ranks them right."]);
  // sensitivity
  if (S.designs.length >= 2 && b.crits.length) {
    const base = rankOrder(b); let same = 0, tot = 0; const flips = [];
    b.crits.forEach((c, i) => [.75, 1.25].forEach(f => { const cr = b.crits.map((x, j) => j === i ? Object.assign({}, x, { weight: (+x.weight || 0) * f }) : x); tot++; if (rankOrder(b, cr) === base) same++; else flips.push(c.name); }));
    out.push([same / tot >= .8 ? "good" : "warn", same / tot >= .8 ? "✔" : "⚠", `Robustness: the design ranking survives ${same} of ${tot} ±25% weight changes${flips.length ? " (sensitive to: " + [...new Set(flips)].join(", ") + ")" : ""}.`]);
  }
  return out;
}

V.gens = () => {
  const d = curD(); if (!d) return needD(); const sim = simulate(d), shown = sim.lines.slice(0, 8);
  const fail = sim.overall.findIndex(v => v <= 0);
  const plan = [];
  for (let g = 1; g <= d.gens; g++) {
    const a = (g - 1) * d.ypg, z = g * d.ypg, ev = sim.events.filter(e => e.y > a && e.y <= z), byC = {};
    ev.forEach(e => { const k = e.c.name + "|" + e.kind; byC[k] = (byC[k] || 0) + 1; });
    const acts = Object.entries(byC).map(([k, n]) => { const [nm, kind] = k.split("|"); return kind === "fail" ? `<span class="st bad">✖ ${esc(nm)} wears out</span>` : `${{ service: "Care for", repair: "Repair/refit", replace: "Replace" }[kind]} ${esc(nm)}${n > 1 ? " ×" + n : ""}`; });
    plan.push(`<tr><td><b>Generation ${g}</b><br><span class="small mut">years ${a}–${z} (${(+d.year || 0) + a}–${(+d.year || 0) + z})</span></td><td class="small">${acts.join("<br>") || "Everyday care only"}</td></tr>`);
  }
  return `<h2>Generations: ${esc(d.name)}</h2><p class="mut">A simple wear model: each part loses condition over its life, care and repairs restore it, swappable parts get replaced. The dashed line is the item as a whole (its weakest non-swappable part). Hover the chart for values.</p>
<div class="card"><div class="row"><span class="big">${fail < 0 ? "✔" : fail + "y"}</span><span>${fail < 0 ? `Still going at ${sim.H} years with the care below.` : `A permanent part wears out at about year <b>${fail}</b> (target ${sim.T}).`}</span></div>
<div class="legend">${shown.map((l, i) => `<span><i style="background:${SER(i)}"></i>${esc(l.c.name)}</span>`).join("")}<span><i style="background:var(--tx)"></i>Whole item</span></div>
${sim.lines.length ? lineChart(sim, 8) : "<p class='mut'>Add parts in the Designer first.</p>"}
${sim.lines.length > 8 ? `<p class="small mut">Showing the first 8 parts; the whole-item line includes all ${sim.lines.length}.</p>` : ""}</div>
<div class="card"><h3>Care plan by generation</h3><table>${plan.join("")}</table></div>
<div class="card"><h3>Condition table</h3><div style="overflow:auto"><table><tr><th>Part</th>${[0, .25, .5, .75, 1, 1.25].map(f => `<th>Year ${Math.round(sim.T * f)}</th>`).join("")}</tr>
${sim.lines.map(l => `<tr><td>${esc(l.c.name)}</td>${[0, .25, .5, .75, 1, 1.25].map(f => `<td>${pct(l.pts[Math.min(sim.H, Math.round(sim.T * f))])}</td>`).join("")}</tr>`).join("")}</table></div></div>`;
};

${b.history.length ? `<h4>Versions</h4>${b.history.map((h, i) => `<div class="small row">v${esc(h.version)} · ${esc(h.date)} · ${esc(h.note)} <button class="sm" data-act="restoreV" data-i="${i}">Restore</button></div>`).join("")}` : ""}</div>
<div class="card"><h3>Weight share</h3>${weightBars(b, tw)}</div></div>
<div class="card"><h3>Criteria</h3><p class="small mut"><b>Computed</b> = worked out from the design. <b>Judged</b> = a person scores 0–5 against written levels. <b>Yes/no</b> = a checkbox. <b>Test</b> = a physical test protocol's latest result. A <b>gate</b> must reach its minimum or the item drops to the lowest tier.</p>
${b.crits.map((c, i) => `<div class="crit"><div class="row"><input data-set="b:crits.${i}.name" value="${esc(c.name)}" style="flex:1;min-width:180px;font-weight:600">

<label>Type <select data-set="b:crits.${i}.type">${[["auto", "Computed"], ["rubric", "Judged 0–5"], ["check", "Yes/no"], ["test", "Test"]].map(([k, v]) => `<option value="${k}"${k === c.type ? " selected" : ""}>${v}</option>`).join("")}</select></label>
${c.type === "auto" ? `<label>Metric <select data-set="b:crits.${i}.metric"><option value="">— pick —</option>${metricOpts(c.metric)}</select></label>` : ""}

<div class="row"><button class="pri" data-act="addCr">+ Add criterion</button></div></div>
${aiBox("bench", "e.g. Is anything important missing? Are the weights sensible? Suggest rubric levels.")}`;
};
function weightBars(b, tw) {
  const W = 420, rowH = 22, L = 170, n = b.crits.length, Hh = n * rowH + 6;
  if (!n) return "<p class='mut'>No criteria yet.</p>";
  let s = `<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="max-width:${W}px">`;
  b.crits.forEach((c, i) => { const v = Math.max(0, +c.weight || 0) / tw, w = Math.max(2, (W - L - 50) * v), y = i * rowH + 4;
    s += `<text x="${L - 6}" y="${y + 12}" text-anchor="end">${esc(c.name.length > 26 ? c.name.slice(0, 25) + "…" : c.name)}</text><rect x="${L}" y="${y + 3}" width="${w}" height="12" rx="3" fill="var(--s1)"/><text x="${L + w + 5}" y="${y + 13}">${pct(v)}</text>
<rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent" ${tipOn(`<b>${esc(c.name)}</b><br>${esc(c.dim)} · weight ${c.weight} (${pct(v)})${c.gate ? "<br>Gate: needs " + pct(c.gateMin) : ""}`)}/>`; });
  return s + "</svg>";
}

V.run = () => {
  const b = curB(); if (!b) return "<p>No benchmark.</p>";
  const rows = S.designs.map(d => ({ d, r: scoreDesign(b, d) })).sort((x, y) => (y.r.score ?? -1) - (x.r.score ?? -1));
  return `<h2>Score designs: ${esc(b.name)} ${esc(b.version)}</h2><p class="mut">Computed and test cells fill in by themselves. Pick 0–5 (or yes/no) in the judged cells. The further a cell's shade is from the page color, the higher the score. Hover a cell for why.</p>

${rows.map(({ d, r }, k) => `<tr><td>${k + 1}</td><td><b>${esc(d.name)}</b><br><span class="small mut">${pct(r.coverage)} scored</span></td><td class="big" style="font-size:22px">${r.score == null ? "–" : Math.round(r.score)}</td><td>${stBadge(r)}</td>
${b.crits.map(c => { const v = r.vals[c.id], st = heat(v);
  if (c.type === "rubric") { const m = ((d.manual || {})[b.id] || {})[c.id]; return `<td><select data-set="d@${d.id}:manual.${b.id}.${c.id}" data-num="1" title="${esc((c.levels || LV)[m] || "")}" style="${st}"><option value="">?</option>${[0, 1, 2, 3, 4, 5].map(n => `<option value="${n}"${m !== "" && m != null && +m === n ? " selected" : ""}>${n}</option>`).join("")}</select></td>`; }
  if (c.type === "check") { const m = ((d.manual || {})[b.id] || {})[c.id]; return `<td><select data-set="d@${d.id}:manual.${b.id}.${c.id}" data-num="1" style="${st}"><option value="">?</option><option value="1"${m === 1 ? " selected" : ""}>Yes</option><option value="0"${m === 0 ? " selected" : ""}>No</option></select></td>`; }
  const why = c.type === "auto" ? metric(c.metric, d).why : (lastResult(c.proto, d.id) ? "Last result: " + lastResult(c.proto, d.id).result : "Not tested yet: log a result on Test protocols");
  return `<td><div class="cell" style="${st}" ${tipOn(`<b>${esc(c.name)}</b>: ${pct(v)}<br>${esc(why)}`)}>${pct(v)}</div></td>`; }).join("")}</tr>`).join("")}</table></div>
<div class="card"><h3>Reading this</h3><p class="small">✔ complete · ◐ provisional (some weight not scored yet; the score is the average of what is scored) · ⚠ a gate isn't checked yet · ✖ failed a gate (tier drops to the lowest whatever the score).</p><button data-act="runCsv">⬇ Results (.csv)</button></div>`;
};

V.guide = () => `<h2>Guide</h2><div class="grid2"><div class="card"><h3>Heritable item design</h3><ol class="small">
<li><b>Designs</b>: start from one of ${Object.keys(TEMPLATES).length - 1} templates (furniture, jewelry, watch, quilt, tools, pen, book, toys, instruments, clock, bag, gown, silver, archive box) or blank.</li>
<li><b>Designer</b>: set how many generations it should serve, list its parts with material, joint, load and whether each part is swappable, repairable or fixed. Tick the design principles. The right side scores it live and lists what to change.</li>
<li><b>Generations</b>: a wear model shows each part's condition over the years, when the item would fail, and a care plan for each generation.</li>
<li><b>Story & hand-down</b>: inscription, keepers, letter, and downloadable care card, certificate and materials list.</li>
<li><b>Compare</b> designs on a radar; edit the <b>Materials</b> library's planning numbers.</li></ol></div>
<div class="card"><h3>Benchmark design</h3><ol class="small">
<li><b>Benchmarks</b>: four starters (Heirloom Standard, Repair Score, Century Test, Generations of Kids) or your own; import/export as JSON or a Markdown spec.</li>
<li><b>Benchmark designer</b>: criteria (computed, judged 0–5 with written levels, yes/no, or physical test), weights, gates, tiers; publish versions with change notes.</li>
<li><b>Score designs</b>: a heat-map matrix of every design against the benchmark.</li>
<li><b>Health check</b>: balance, coverage, objectivity, gates, tier spacing, discrimination, double-counting, calibration and robustness.</li>
<li><b>Reference cases</b>: known-good and known-bad items that prove the benchmark ranks things correctly.</li>
<li><b>Test protocols</b>: write physical tests and log pass/partial/fail per design.</li></ol>

function render() {

  if (!V[S.view]) S.view = "designs";
  nav(); const v = $("#view"), st = v.scrollTop; v.innerHTML = V[S.view](); v.scrollTop = st;

}
function hookLine(rect) {
  const svg = $("#lc"), d = curD(), sim = simulate(d), xl = $("#lcx");
  rect.addEventListener("mousemove", e => {
    const bb = svg.getBoundingClientRect(), sc = 760 / bb.width, px = (e.clientX - bb.left) * sc, L = 40, w = 760 - 40 - 14;
    const yr = clamp(Math.round((px - L) / w * sim.H), 0, sim.H), x = L + yr / sim.H * w;
    xl.setAttribute("x1", x); xl.setAttribute("x2", x); xl.setAttribute("visibility", "visible");
    showTip(`<b>Year ${yr}</b> (${(+d.year || 0) + yr})<br>` + sim.lines.slice(0, 8).map((l, i) => `<span class="sw" style="background:${SER(i)}"></span>${esc(l.c.name)}: ${pct(l.pts[yr])}`).join("<br>") + `<br><b>Whole item: ${pct(sim.overall[yr])}</b>`, e);
  });

}
function showTip(html, e) { const t = $("#tip"); t.innerHTML = html; t.style.display = "block"; const x = Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - t.offsetHeight - 8); t.style.left = x + "px"; t.style.top = y + "px"; }
function hideTip() { $("#tip").style.display = "none"; }
document.addEventListener("mousemove", e => { if (e.target.closest && e.target.closest("#lcr")) return; const el = e.target.closest && e.target.closest("[data-tip]"); if (el) showTip(el.dataset.tip, e); else hideTip(); });

function rootOf(key) {
  if (key === "S") return S; if (key === "d") return curD(); if (key === "b") return curB(); if (key === "p") return curP();
  if (key.startsWith("d@")) return S.designs.find(d => d.id === key.slice(2));
  return null;
}
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; for (let i = 0; i < ks.length - 1; i++) { const k = ks[i]; if (o[k] == null || typeof o[k] !== "object") o[k] = {}; o = o[k]; } o[ks[ks.length - 1]] = val; }
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.pick) { if (el.dataset.pick === "d") S.curD = el.value; else S.curB = el.value; save(); render(); return; }
  if (el.id === "impD" || el.id === "impB" || el.id === "restoreIn") return readFile(el);
  if (el.dataset.act === "cmp") { S.cmp = S.cmp.filter(x => x !== el.dataset.id); if (el.checked) { S.cmp.push(el.dataset.id); if (S.cmp.length > 4) { S.cmp.shift(); toast("Up to 4 at a time."); } } save(); render(); return; }
  const ds = el.dataset.set; if (!ds) return;
  const ci = ds.indexOf(":"), root = rootOf(ds.slice(0, ci)); let path = ds.slice(ci + 1); if (!root) return;
  let val = el.type === "checkbox" ? el.checked : el.value;
  if (el.type === "number" || el.dataset.num) val = val === "" ? (el.dataset.num ? "" : 0) : +val;
  if (path.endsWith(".gateMinPct")) { path = path.replace(/Pct$/, ""); val = clamp(val / 100, 0, 1); }
  if (/^refs\.\d+\.scores\./.test(path) && val !== "") val = clamp(val, 0, 5);
  if (el.type === "number" && /\.(life)$/.test(path)) val = Math.max(1, val);
  setPath(root, path, val);
  if (/^crits\.\d+\.type$/.test(path) && val === "rubric") { const c = root.crits[+path.split(".")[1]]; if (!c.levels || c.levels.length < 6) c.levels = LV.slice(); }
  save(); render();
});
function readFile(el) {
  const f = el.files[0]; if (!f) return; const fr = new FileReader();
  fr.onload = () => {
    let v; try { v = JSON.parse(fr.result); } catch (_) { toast("That file isn't JSON."); return; }
    if (el.id === "impD") { if (!v || v.kind !== "heirloom-design" || !v.design || !Array.isArray(v.design.comps)) return toast("That isn't a design file from this tab.");
      const d = Object.assign(newDesign("Blank (start empty)"), v.design, { id: "d" + uid() }); (v.materials || []).forEach(m => { if (m && m.id && !S.mats.some(x => x.id === m.id)) S.mats.push(m); }); S.designs.push(d); S.curD = d.id; toast("Design imported."); }
    if (el.id === "impB") { if (!v || v.kind !== "heirloom-benchmark" || !v.benchmark || !Array.isArray(v.benchmark.crits)) return toast("That isn't a benchmark file from this tab.");
      const b = Object.assign({ history: [], refs: [], tiers: [{ name: "Fail", min: 0 }] }, v.benchmark, { id: "b" + uid() }); (v.protocols || []).forEach(p => { if (p && p.id && !S.protos.some(x => x.id === p.id)) S.protos.push(Object.assign({ results: [] }, p, { results: [] })); }); S.benches.push(b); S.curB = b.id; toast("Benchmark imported."); }
    if (el.id === "restoreIn") { if (!v || !Array.isArray(v.designs) || !Array.isArray(v.benches)) return toast("That isn't a backup from this tab."); if (!confirm("Replace everything here with this backup?")) return; S = Object.assign(fresh(), v); toast("Restored."); }
    save(); render();
  };
  fr.readAsText(f);
}
const today = () => new Date().toISOString().slice(0, 10);
function bumpVersion(v) { const p = String(v || "1.0").split("."); p[1] = String((+p[1] || 0) + 1); return p.slice(0, 2).join("."); }
function benchMd(b) {
  return `# ${b.name} (${b.code}) v${b.version}\n\n${b.purpose}\n\n## Tiers\n\n${b.tiers.slice().sort((x, y) => x.min - y.min).map(t => `- **${t.name}**: score ${t.min}+`).join("\n")}\n\nFailing any gate puts an item in the lowest tier.\n\n## Criteria\n\n| Criterion | Dimension | How it's scored | Weight | Gate |\n|---|---|---|---|---|\n` +
    b.crits.map(c => `| ${c.name} | ${c.dim} | ${c.type === "auto" ? "Computed: " + (METRICS[c.metric] || ["?"])[0] : c.type === "test" ? "Test: " + ((S.protos.find(p => p.id === c.proto) || {}).name || "?") : c.type === "check" ? "Yes/no" : "Judged 0–5"} | ${c.weight} | ${c.gate ? "≥ " + pct(c.gateMin) : ""} |`).join("\n") +
    "\n\n" + b.crits.filter(c => c.type === "rubric").map(c => `### ${c.name}: rubric\n\n${c.desc ? c.desc + "\n\n" : ""}${(c.levels || LV).map(l => "- " + l).join("\n")}`).join("\n\n") +
    "\n\n" + b.crits.filter(c => c.type === "test").map(c => { const p = S.protos.find(x => x.id === c.proto); return p ? `### Test: ${p.name}\n\n${p.purpose}\n\n**Equipment:** ${p.equip}\n\n${p.steps}\n\n**Pass:** ${p.pass}` : ""; }).join("\n\n") +
    (b.refs && b.refs.length ? `\n\n## Reference cases\n\n${b.refs.map(r => `- ${r.name}: expected **${r.expect}**, scores **${scoreRef(b, r).tier}**`).join("\n")}` : "") +
    (b.history.length ? `\n\n## Version history\n\n${b.history.map(h => `- v${h.version} (${h.date}): ${h.note}`).join("\n")}` : "") + "\n\n---\nMade with Heirloom Design Lab in Randis UDS™ by Randy Moore.\n";
}

    case "dupB": { const x = JSON.parse(JSON.stringify(byId(S.benches, id))), map = {}; x.id = "b" + uid(); x.name += " (copy)"; x.history = []; x.crits.forEach(c => { const n = "c" + uid(); map[c.id] = n; c.id = n; }); x.refs.forEach(r => { const sc = {}; Object.keys(r.scores).forEach(k => sc[map[k] || k] = r.scores[k]); r.scores = sc; r.id = "r" + uid(); });
      const old = byId(S.benches, id); S.designs.forEach(dd => { const m = (dd.manual || {})[old.id]; if (m) { const n = {}; Object.keys(m).forEach(k => n[map[k] || k] = m[k]); dd.manual[x.id] = n; } }); S.benches.push(x); S.curB = x.id; break; }
    case "expB": { const x = byId(S.benches, id); exportFile(fname(x.name) + ".rbench.json", JSON.stringify({ kind: "heirloom-benchmark", v: 1, benchmark: x, protocols: S.protos.filter(pp => x.crits.some(c => c.proto === pp.id)).map(pp => Object.assign({}, pp, { results: [] })) }, null, 1), "application/json"); return; }
    case "mdB": { const x = byId(S.benches, id); exportFile(fname(x.name) + "_spec.md", benchMd(x), "text/markdown"); return; }
    case "publish": { const note = prompt("What changed in this version?", ""); if (note === null) return; b.history.push({ version: b.version, date: today(), note: note || "(no note)", crits: JSON.parse(JSON.stringify(b.crits)), tiers: JSON.parse(JSON.stringify(b.tiers)) }); b.version = bumpVersion(b.version); toast("Now v" + b.version + ". The old version is kept below."); break; }
    case "restoreV": { const h = b.history[i]; if (!confirm(`Put back the criteria and tiers of v${h.version}? The current ones are saved as a version first.`)) return; b.history.push({ version: b.version, date: today(), note: "before restoring v" + h.version, crits: JSON.parse(JSON.stringify(b.crits)), tiers: JSON.parse(JSON.stringify(b.tiers)) }); b.crits = JSON.parse(JSON.stringify(h.crits)); b.tiers = JSON.parse(JSON.stringify(h.tiers)); b.version = bumpVersion(b.version); break; }
    case "addT": b.tiers.push({ name: "New tier", min: Math.min(100, Math.max(0, ...b.tiers.map(t => +t.min)) + 10) }); break;
    case "delT": if (b.tiers.length < 2) { toast("Keep at least one tier."); return; } b.tiers.splice(i, 1); break;
    case "addCr": b.crits.push(C("New criterion", "Durability", "rubric")); break;
    case "delCr": if (!confirm(`Remove "${b.crits[i].name}"?`)) return; b.crits.splice(i, 1); break;
    case "upCr": if (i > 0) { const t = b.crits[i]; b.crits[i] = b.crits[i - 1]; b.crits[i - 1] = t; } break;
    case "runCsv": { const rows = S.designs.map(dd => { const r = scoreDesign(b, dd); return [dd.name, r.score == null ? "" : Math.round(r.score), r.tier, pct(r.coverage), ...b.crits.map(c => r.vals[c.id] == null ? "" : Math.round(r.vals[c.id] * 100))]; });
      exportFile(fname(b.name) + "_results.csv", [["Design", "Score", "Tier", "Scored", ...b.crits.map(c => c.name)], ...rows].map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv"); return; }
    case "addR": b.refs = b.refs || []; b.refs.push({ id: "r" + uid(), name: "Known item", expect: b.tiers[0].name, scores: {} }); break;
    case "delR": b.refs.splice(i, 1); break;
    case "refFromD": { const dd = byId(S.designs, $("#refFrom").value), sc = {}; b.crits.forEach(c => { const v = critValue(c, dd, b); if (v != null) sc[c.id] = Math.round(v * 50) / 10; }); const r = scoreDesign(b, dd); b.refs = b.refs || []; b.refs.push({ id: "r" + uid(), name: dd.name + " (as reference)", expect: r.tier, scores: sc }); break; }
    case "openP": S.curP = id; break;
    case "addP": { const np = { id: "pr_" + uid(), name: "New test", basis: "", purpose: "", equip: "", steps: "1. ", pass: "", results: [] }; S.protos.push(np); S.curP = np.id; break; }
    case "delP": { if (S.benches.some(x => x.crits.some(c => c.proto === id))) { toast("A benchmark uses this test."); return; } if (!confirm("Delete this protocol and its results?")) return; S.protos = S.protos.filter(x => x.id !== id); if (S.curP === id) S.curP = S.protos[0] ? S.protos[0].id : null; break; }
    case "expP": exportFile(fname(p.name) + "_test_sheet.html", printable("Test: " + p.name, `<h1>Test: ${esc(p.name)}</h1><p><i>${esc(p.basis)}</i></p><p>${esc(p.purpose)}</p><p><b>Equipment:</b> ${esc(p.equip)}</p><h2>Steps</h2><p>${esc(p.steps).replace(/\n/g, "<br>")}</p><h2>Pass when</h2><p>${esc(p.pass)}</p><h2>Record</h2><table><tr><th>Date</th><th>Item</th><th>Measurements</th><th>Result</th></tr>${"<tr><td>&nbsp;</td><td></td><td></td><td></td></tr>".repeat(8)}</table>`)); return;
    case "addRes": p.results.push({ date: today(), design: (d || S.designs[0]).id, result: "pass", notes: "" }); break;
    case "delRes": p.results.splice(i, 1); break;
    case "backup": exportFile("heirloom_design_lab_backup_" + today() + ".json", JSON.stringify(S), "application/json"); return;
    case "wipe": if (!confirm("Erase every design, benchmark and result here and start fresh? Save a backup first if unsure.")) return; localStorage.removeItem(LKEY); location.reload(); return;
    default: return;
  }
  save(); render();
});
$("#themeBtn").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; save(); render(); };
render();
</script>
</body>
