<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Code Editor</title>
<style>
  html, body { margin: 0; height: 100%; background: #16181d; color: #dcdfe4; font: 13px system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  #bar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: #22252c; border-bottom: 1px solid #333843; flex-wrap: wrap; }
  #bar b { margin-right: 8px; color: #8ab4f8; }
  button, label.b { background: #333843; color: #dcdfe4; border: 1px solid #4a505d; border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover, label.b:hover { background: #3f4552; } #run { background: #2e6b3a; border-color: #3f8a4e; }
  #file { display: none; } #auto { margin-left: 4px; }
  #main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  #code { display: grid; grid-template-rows: auto 1fr; min-height: 0; border-right: 1px solid #333843; }
  #tabs { display: flex; background: #1c1f25; }
  #tabs button { border: 0; border-radius: 0; background: none; padding: 7px 14px; color: #9aa0ab; }
  #tabs button.on { color: #fff; background: #16181d; box-shadow: inset 0 2px #8ab4f8; }
  .ed { display: none; min-height: 0; } .ed.on { display: grid; grid-template-columns: auto 1fr; }
  .gut { padding: 10px 6px 10px 10px; text-align: right; color: #5c6370; font: 14px/1.5 Consolas, "Cascadia Mono", monospace; white-space: pre; overflow: hidden; user-select: none; }
  textarea { resize: none; border: 0; outline: 0; padding: 10px; background: #16181d; color: #dcdfe4; white-space: pre; overflow: auto;
             font: 14px/1.5 Consolas, "Cascadia Mono", monospace; tab-size: 2; }
  #out { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  #log { max-height: 30vh; overflow: auto; margin: 0; padding: 6px 10px; background: #0f1115; border-top: 1px solid #333843; font: 12px/1.4 Consolas, monospace; }
  #log .err { color: #ff8a80; } #log .warn { color: #ffd180; } #log:empty::before { content: "Console: console.log() from your page shows here."; color: #5c6370; }
</style></head>
<body>
<div id="bar">
  <b>Code Editor</b>
  <button id="run" title="Ctrl+Enter">▶ Run</button>
  <label><input type="checkbox" id="auto" checked> Run as I type</label>
  <button id="new">New</button>
  <label class="b" for="file">Open…</label><input type="file" id="file" accept=".json,.html,.htm,.css,.js,.txt">
  <button id="save" title="Ctrl+S">Save</button>
  <button id="clear">Clear console</button>
</div>
<div id="main">
  <div id="code">
    <div id="tabs"><button data-k="html" class="on">HTML</button><button data-k="css">CSS</button><button data-k="js">JavaScript</button></div>
    <div class="ed on" data-k="html"><div class="gut"></div><textarea spellcheck="false"></textarea></div>
    <div class="ed" data-k="css"><div class="gut"></div><textarea spellcheck="false"></textarea></div>
    <div class="ed" data-k="js"><div class="gut"></div><textarea spellcheck="false"></textarea></div>
  </div>
  <div id="out"><iframe id="view" sandbox="allow-scripts allow-modals" title="Your page"></iframe><pre id="log"></pre></div>
</div>
<script>
  // Write HTML, CSS and JavaScript and see the page next to it. Save keeps the project as a .json file; Open loads it
  // (or a single .html, .css or .js file into its box). Your page runs walled off, like every shop item.
  const $ = id => document.getElementById(id), eds = {}, view = $("view"), log = $("log");
  document.querySelectorAll(".ed").forEach(d => eds[d.dataset.k] = d.querySelector("textarea"));
  const START = {
    html: '<h1>Hello!</h1>\n<p>Edit the HTML, CSS and JavaScript on the left.</p>\n<button id="b">Click me</button>\n',
    css: 'body { font-family: system-ui, sans-serif; padding: 20px; }\nh1 { color: #2a7ae2; }\n',
    js: 'let n = 0;\ndocument.getElementById("b").onclick = () => {\n  n++;\n  console.log("clicked", n, "times");\n};\n'
  };
  function gutter(k) {
    const t = eds[k], g = t.previousElementSibling, n = t.value.split("\n").length;
    let s = ""; for (let i = 1; i <= n; i++) s += i + "\n"; g.textContent = s; g.scrollTop = t.scrollTop;
  }
  const HOOK = "<script>(function(){function s(k,a){try{parent.postMessage({ce:k,text:Array.from(a).map(function(x){try{return typeof x=='object'?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(' ')},'*')}catch(e){}}" +
    "['log','info','warn','error'].forEach(function(k){var o=console[k];console[k]=function(){s(k,arguments);o.apply(console,arguments)}});" +
    "addEventListener('error',function(e){s('error',[e.message+' (line '+e.lineno+')'])});})()<\/script>";
  function run() {
    const js = eds.js.value.replace(/<\/script/gi, "<\\/script");
    view.srcdoc = "<!doctype html><html><head><meta charset='utf-8'>" + HOOK + "<style>" + eds.css.value + "</style></head><body>" +
      eds.html.value + "<script>" + js + "<\/script></body></html>";
  }
  addEventListener("message", e => {
    if (e.source !== view.contentWindow || !e.data || !e.data.ce) return;
    const line = document.createElement("div"); line.className = e.data.ce; line.textContent = e.data.text;
    log.append(line); log.scrollTop = log.scrollHeight;
  });
  let timer = 0;
  Object.keys(eds).forEach(k => {
    const t = eds[k];
    t.addEventListener("input", () => { gutter(k); if ($("auto").checked) { clearTimeout(timer); timer = setTimeout(run, 500); } });
    t.addEventListener("scroll", () => t.previousElementSibling.scrollTop = t.scrollTop);
    t.addEventListener("keydown", e => {
      if (e.key == "Tab") { e.preventDefault(); t.setRangeText("  ", t.selectionStart, t.selectionEnd, "end"); gutter(k); }
      if (e.key == "Enter" && !e.ctrlKey) {
        // keep the line's indent
        e.preventDefault(); const s = t.selectionStart, line = t.value.slice(0, s).split("\n").pop(), ind = line.match(/^\s*/)[0];
        t.setRangeText("\n" + ind, s, t.selectionEnd, "end"); t.dispatchEvent(new Event("input"));
      }
    });
  });
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#tabs button, .ed").forEach(x => x.classList.toggle("on", x.dataset.k == b.dataset.k));
    eds[b.dataset.k].focus();
  });
  function load(p) { ["html", "css", "js"].forEach(k => { eds[k].value = typeof p[k] == "string" ? p[k] : ""; gutter(k); }); log.textContent = ""; run(); }
  $("run").onclick = run;
  $("clear").onclick = () => log.textContent = "";
  $("new").onclick = () => { if (confirm("Start a new project? What you haven't saved will be lost.")) load({ html: "", css: "", js: "" }); };
  function save() {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: "Code Editor", html: eds.html.value, css: eds.css.value, js: eds.js.value }, null, 1)], { type: "application/json" }));
    a.download = "my-page.json"; document.body.append(a); a.click(); a.remove();
  }
  $("save").onclick = save;
  $("file").addEventListener("change", e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f || f.size > 2e6) return;
    f.text().then(t => {
      const ext = (f.name.split(".").pop() || "").toLowerCase();
      if (ext == "json") { try { load(JSON.parse(t)); } catch (err) { alert("That .json isn't a Code Editor project."); } }
      else { const k = ext == "css" ? "css" : ext == "js" ? "js" : "html"; eds[k].value = t; gutter(k); document.querySelector('#tabs button[data-k="' + k + '"]').click(); run(); }
    });
  });
  addEventListener("keydown", e => {
    if (e.ctrlKey && e.key == "Enter") { e.preventDefault(); run(); }
    if (e.ctrlKey && e.key.toLowerCase() == "s") { e.preventDefault(); save(); }
  });
  load(START);
</script>
</body></html>
