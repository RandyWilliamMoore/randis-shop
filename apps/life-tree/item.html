<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Life Tree</title>
<!-- Randis UDS™ by Randy Moore. Original: https://github.com/RandyWilliamMoore/randis-uds · Support: https://ko-fi.com/moorescombinatoricsmatrix -->
<style>
:root{--bg:#0f1115;--bg2:#161a21;--bg3:#1e232c;--line:#2b313c;--tx:#e6e8ec;--mut:#8b93a3;--acc:#5b8cff;--ok:#30a46c;--warn:#f5a524;--bad:#e5484d}
body[data-theme=light]{--bg:#f6f7f9;--bg2:#fff;--bg3:#eef0f4;--line:#dde1e8;--tx:#1c2027;--mut:#687080}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.4 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;margin-right:6px;white-space:nowrap}
#views{display:flex;gap:2px;background:var(--bg3);border-radius:8px;padding:2px}
#views button,.tb{border:0;background:none;padding:5px 10px;border-radius:6px;color:var(--mut)}
#views button.on{background:var(--bg2);color:var(--tx);box-shadow:0 1px 2px #0003}
.tb:hover,#views button:hover{color:var(--tx)}
.tb.on{color:var(--acc)}
#search{flex:1;min-width:140px;max-width:300px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none}
.grp{display:flex;align-items:center;gap:1px;background:var(--bg3);border-radius:8px;padding:2px}
.grp span{font-size:11px;color:var(--mut);padding:0 4px}
#saved{font-size:11px;color:var(--mut);min-width:56px;text-align:right}
#bar2{display:flex;gap:8px;align-items:center;padding:6px 18px;border-bottom:1px solid var(--line)}
#crumbs{flex:1;display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut);min-width:0}
#crumbs a{cursor:pointer;color:var(--mut)} #crumbs a:hover{color:var(--tx);text-decoration:underline}
#quick{flex:0 1 420px;background:var(--bg3);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;outline:none}
#quick:focus{border-style:solid;border-color:var(--acc)}
#wrap{flex:1;display:flex;min-height:0}
#main{flex:1;overflow:auto;padding:10px 18px 120px}
#drawer{width:min(560px,48vw);border-left:1px solid var(--line);background:var(--bg2);overflow:auto;padding:14px 16px 60px;flex:none}
.muted{color:var(--mut)} .small{font-size:12px}
/* tree */
.kids{margin-left:21px;border-left:1px solid var(--line);padding-left:3px}
.row{display:flex;align-items:center;gap:3px;padding:0 4px 0 2px;border-radius:6px;min-height:31px;border-left:3px solid var(--c,transparent)}
.row:hover,.row:focus-within{background:var(--bg3)}
.caret{width:18px;height:22px;border:0;background:none;color:var(--mut);padding:0;flex:none;font-size:12px}
.caret:disabled{cursor:default}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);cursor:grab;margin:0 5px 0 1px;flex:none;opacity:.7}
.dot:hover{opacity:1;transform:scale(1.3)}
.is-card>.row .dot{border-radius:2px;background:var(--acc);opacity:1}
.ck{width:16px;height:16px;accent-color:var(--ok);flex:none;margin:0 4px 0 0;cursor:pointer}
.txt{flex:1;min-width:100px;background:none;border:0;color:var(--tx);padding:5px 2px;outline:none;text-overflow:ellipsis}
.done>.row .txt{text-decoration:line-through;color:var(--mut)}
.has-kids>.row .txt{font-weight:600}
.badges{display:flex;gap:4px;align-items:center;overflow:hidden;max-width:48%;flex:none}
body.compact .badges .chip,body.compact .badges .tag,body.compact .badges .pill{display:none}
.acts{display:flex;gap:1px;opacity:0;flex:none}
.row:hover .acts,.row:focus-within .acts{opacity:1}
.acts button{border:0;background:none;color:var(--mut);border-radius:5px;padding:2px 6px;font-size:13px}
.acts button:hover,.acts button.on{background:var(--line);color:var(--tx)}
.acts button.on{opacity:1}
.chip,.tag,.pill{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--bg3);color:var(--mut);white-space:nowrap;border:1px solid var(--line)}
.tag{cursor:pointer;color:var(--acc)}
.cardb{cursor:pointer;color:var(--acc)}
.due-over{color:#fff;background:var(--bad);border-color:var(--bad)} .due-today{color:#111;background:var(--warn);border-color:var(--warn)}
.pri{font-weight:800;font-size:12px} .p1{color:var(--mut)} .p2{color:var(--warn)} .p3{color:var(--bad)}
.pill.st-active{color:var(--acc)} .pill.st-blocked{color:var(--bad)} .pill.st-waiting{color:var(--warn)}
.prog{width:38px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex:none} .prog i{display:block;height:100%;background:var(--ok)}
.cnt{font-size:11px;color:var(--mut)}
.row.dr-before{box-shadow:inset 0 2px 0 var(--acc)} .row.dr-after{box-shadow:inset 0 -2px 0 var(--acc)} .row.dr-in{outline:1px dashed var(--acc)}
.flash>.row{animation:fl 1.4s}
@keyframes fl{0%,40%{background:color-mix(in srgb,var(--acc) 30%,transparent)}100%{background:none}}
.ghost{color:var(--mut);padding:6px 30px;cursor:pointer;border-radius:6px} .ghost:hover{background:var(--bg3);color:var(--tx)}
.focushead{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.focushead input.big{flex:1;font-size:22px;font-weight:700;background:none;border:0;outline:none;color:var(--tx)}
/* panels */
.panel{margin:2px 0 8px 48px;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:10px 12px}
.sec{margin-top:12px} .sec:first-child{margin-top:0}
.sh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:6px}
.sh .sp{flex:1}
.mini{border:1px solid var(--line);background:var(--bg3);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--tx)}
.mini:hover{border-color:var(--acc)}
.mini.pri-b{background:var(--acc);border-color:var(--acc);color:#fff}
.fields{display:flex;flex-wrap:wrap;gap:8px 12px}
.fields label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:2px}
.fields label.sw{flex-direction:row;align-items:center;gap:6px;font-size:12px;color:var(--tx)}
.fld,.fields select,.fields input:not([type=checkbox]){background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 6px;outline:none;min-width:0}
.fld:focus,.fields input:focus{border-color:var(--acc)}
.mrow,.lrow2{display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.mrow .fld{width:70px} .mrow .fld.nm{width:120px} .mrow .fld.un{width:50px}
.bar{flex:1;min-width:60px;height:6px;background:var(--line);border-radius:3px;overflow:hidden} .bar i{display:block;height:100%;background:var(--acc)}
.x{border:0;background:none;color:var(--mut);padding:0 4px} .x:hover{color:var(--bad)}
.lrow2 .fld{flex:1;min-width:80px}
textarea.notes{width:100%;min-height:90px;resize:vertical;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px;outline:none;line-height:1.45}
textarea.notes:focus{border-color:var(--acc)}
.md{line-height:1.55;word-wrap:break-word} .md h3,.md h4,.md h5,.md h6{margin:.6em 0 .3em} .md p{margin:.25em 0} .md ul{margin:.2em 0;padding-left:20px}
.md code{background:var(--bg3);padding:0 4px;border-radius:4px} .md a{color:var(--acc);cursor:pointer}
.md li.tk{list-style:none;margin-left:-16px}
.wl{text-decoration:underline dotted}
.wl.missing{color:var(--warn)}
/* chat */
.clog{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.msg{max-width:88%;padding:6px 10px;border-radius:10px;background:var(--bg3);position:relative}
.msg.user{align-self:flex-end;background:color-mix(in srgb,var(--acc) 22%,var(--bg3))}
.msg.note{align-self:flex-end;background:color-mix(in srgb,var(--warn) 16%,var(--bg3))}
.msg.err{color:var(--bad)}
.msg .meta{font-size:10px;color:var(--mut);margin-top:2px}
.msg .x{position:absolute;top:2px;right:2px;display:none;font-size:11px} .msg:hover .x{display:block}
.cin{display:flex;gap:6px;align-items:flex-end}
.cin textarea{flex:1;resize:none;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:none;max-height:140px}
.cin textarea:focus{border-color:var(--acc)}
.qp{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
/* drawer */
.dtop{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;color:var(--mut)}
.dtop .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtop .path a{cursor:pointer} .dtop .path a:hover{text-decoration:underline;color:var(--tx)}
.dtitle{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dtitle input.big{flex:1;font-size:20px;font-weight:700;background:none;border:0;outline:none;color:var(--tx);border-bottom:2px solid var(--c,var(--acc));padding:2px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px} .stat span{font-size:11px;color:var(--mut)}
.subl{display:flex;align-items:center;gap:4px;padding:1px 0}
.subl .txt{padding:3px 2px} .subl.done .txt{text-decoration:line-through;color:var(--mut)}
/* lists, cards, wiki */
.vh{font-size:20px;font-weight:700;margin:6px 0 12px;display:flex;align-items:center;gap:10px}
.lsec{margin-bottom:18px} .lsec>h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 6px}
.lrow{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px}
.lrow:hover{background:var(--bg3)}
.lrow .lt{cursor:pointer} .lrow .lt:hover{text-decoration:underline} .lrow.done .lt{text-decoration:line-through;color:var(--mut)}
.lrow .lp{font-size:11px;color:var(--mut);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--c,var(--acc));border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:140px}
.tile:hover{border-color:var(--acc)}
.tile.done{opacity:.6}
.th{display:flex;align-items:center;gap:6px} .th b{flex:1;font-size:15px}
.tp{font-size:11px;color:var(--mut)}
.tm{display:flex;gap:10px;align-items:center}
.tmets{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px}
.tmets .bar{height:5px}
.tf{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.newtile{display:flex;align-items:center;justify-content:center;color:var(--mut);border-style:dashed;border-top-style:dashed;font-size:15px}
.wpage{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.wpage:hover{border-color:var(--acc)} .wpage b{font-size:15px} .wpage .ex{color:var(--mut);font-size:13px;margin-top:3px;max-height:3.2em;overflow:hidden}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px;margin:8px 0 16px}
.bars div{flex:1;background:var(--ok);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:9px;color:var(--mut)}
.welcome{max-width:620px;margin:40px auto;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:28px}
.welcome h1{margin:0 0 8px} .welcome p{color:var(--mut)}
.welcome .mini{font-size:14px;padding:8px 14px;margin:4px}
.help{font-size:13px;line-height:1.7} .help kbd{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
/* popups */
#menu{position:fixed;z-index:20;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 30px #0006;min-width:210px;max-height:80vh;overflow:auto}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px}
#menu button:hover{background:var(--bg3)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:0 8px 30px #0006;z-index:30;display:flex;gap:10px;align-items:center}
#modal{position:fixed;inset:0;background:#0008;z-index:25;display:flex;align-items:center;justify-content:center}
#modal>div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px 24px;max-width:640px;width:92%;max-height:86vh;overflow:auto}
[hidden]{display:none!important}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
</style>
</head>
<body data-theme="dark">
<header>
  <div class="brand">🌳 Life Tree</div>
  <div id="views">
    <button data-view="tree">🌳 Tree</button>
    <button data-view="today">📅 Today</button>
    <button data-view="cards">🗂 Cards</button>
    <button data-view="wiki">📚 Wiki</button>
    <button data-view="log">✅ Done</button>
  </div>
  <input id="search" placeholder="Search everything…  ( / )">
  <div class="grp" title="Fold the tree to a level"><span>Fold</span>
    <button class="tb" data-fold="1">1</button><button class="tb" data-fold="2">2</button><button class="tb" data-fold="3">3</button><button class="tb" data-fold="99" title="Unfold all">∞</button>
  </div>
  <button class="tb" id="hideDone" title="Hide done items">◐ Hide done</button>
  <button class="tb" id="closeAll" title="Close every open chat and details panel">⊟ Close panels</button>
  <button class="tb" id="undo" title="Undo (Ctrl+Z)">↶</button>
  <button class="tb" id="redo" title="Redo (Ctrl+Y)">↷</button>
  <span id="saved"></span>
  <button class="tb" id="more" title="Menu">☰</button>
</header>
<div id="bar2">
  <div id="crumbs"></div>
  <input id="quick" placeholder="＋ Quick add… (Enter)  #tag  @today  @tomorrow  @2026-12-31  !!">
</div>
<div id="wrap">
  <main id="main"></main>
  <aside id="drawer" hidden></aside>
</div>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<div id="modal" hidden><div></div></div>
<input type="file" id="file" accept=".json,.md,.txt" hidden>
<script>
"use strict";
// ---------- small helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const DAY = 864e5;
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => ymd(new Date());
const num = v => { const x = parseFloat(String(v).replace(/[$,%\s]/g, "")); return isFinite(x) ? x : null; };
const fmt = v => { const x = num(v); return x == null ? esc(v) : (Math.abs(x) >= 1000 ? x.toLocaleString() : String(+x.toFixed(2))); };
const clone = o => JSON.parse(JSON.stringify(o));
const inApp = window.parent !== window;
const tell = m => { try { window.parent.postMessage(m, "*"); } catch (e) {} };

// ---------- state ----------
let S = null, par = {}, hist = [], fut = [], typingT = 0, want = null, dragId = null, drawerId = null, drawerEdit = false;
let q = "", vis = null, loaded = false, useLocal = false, webOn = false, saveT = 0;
const memo = new Map(), pending = {};
const DEF = { t: "", done: false, kids: [], open: true, card: false, notes: "", metrics: [], links: [], tags: [], due: "", pri: 0,
  status: "", repeat: "", streak: 0, doneAt: 0, hist: [], chat: [], panel: "", color: "" };
const COLORS = [["", "none"], ["#e5484d", "red"], ["#f76b15", "orange"], ["#ffb224", "yellow"], ["#30a46c", "green"], ["#12a594", "teal"],
  ["#3e63dd", "blue"], ["#8e4ec6", "purple"], ["#d6409f", "pink"], ["#8b93a3", "gray"]];
const STATUSES = ["", "idea", "planned", "active", "waiting", "blocked", "someday"];
const REPEATS = [["", "never"], ["daily", "daily"], ["weekly", "weekly"], ["monthly", "monthly"]];

function fresh() { return { v: 1, nodes: {}, top: [], set: { hideDone: false, cascade: true, autoParent: true, theme: "dark", compact: false }, focus: null, view: "tree" }; }
function fix(n) { for (const k in DEF) if (n[k] === undefined) n[k] = clone(DEF[k]); return n; }
function mk(t, x) { const n = fix(Object.assign({ id: uid(), created: Date.now(), t: t || "" }, x || {})); S.nodes[n.id] = n; return n; }
function listOf(pid) { return pid ? S.nodes[pid].kids : S.top; }
function reindex() {
  par = {}; const seen = new Set();
  const walk = (ids, p) => { for (let i = ids.length - 1; i >= 0; i--) { const id = ids[i]; if (!S.nodes[id] || seen.has(id)) { ids.splice(i, 1); continue; } seen.add(id); par[id] = p; } for (const id of ids) walk(S.nodes[id].kids, id); };
  walk(S.top, null);
  for (const id in S.nodes) if (!seen.has(id)) delete S.nodes[id];
}
function ancestors(id) { const a = []; let p = par[id]; while (p) { a.unshift(p); p = par[p]; } return a; }
function pathText(id) { return ancestors(id).map(a => S.nodes[a].t || "untitled").join(" › "); }
function walkIds(ids, fn, d = 0) { for (const id of ids) { const n = S.nodes[id]; if (!n) continue; if (fn(n, d) === false) continue; walkIds(n.kids, fn, d + 1); } }
function allInOrder() { const a = []; walkIds(S.top, n => { a.push(n); }); return a; }
function isUnder(id, anc) { let p = par[id]; while (p) { if (p === anc) return true; p = par[p]; } return false; }
function stat(id) {
  if (memo.has(id)) return memo.get(id);
  let tot = 0, done = 0;
  for (const k of S.nodes[id].kids) { const n = S.nodes[k]; if (!n) continue; tot++; if (n.done) done++; const s = stat(k); tot += s.tot; done += s.done; }
  const r = { tot, done }; memo.set(id, r); return r;
}

// ---------- repeats & streaks ----------
function pkey(rep, ts) {
  const d = new Date(ts);
  if (rep === "weekly") { const m = new Date(d); m.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return "w" + ymd(m); }
  if (rep === "monthly") return "m" + d.getFullYear() + "-" + d.getMonth();
  return "d" + ymd(d);
}
function prevTs(rep, ts) { if (rep === "weekly") return ts - 7 * DAY; if (rep === "monthly") { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth() - 1, 15).getTime(); } return ts - DAY; }
function liveStreak(n) {
  if (!n.repeat || !n.doneAt) return 0; const now = Date.now(), k = pkey(n.repeat, n.doneAt);
  return (k === pkey(n.repeat, now) || k === pkey(n.repeat, prevTs(n.repeat, now))) ? n.streak : 0;
}
function resetRepeats() {
  let ch = false; const now = Date.now();
  for (const id in S.nodes) { const n = S.nodes[id]; if (n.repeat && n.done && n.doneAt && pkey(n.repeat, n.doneAt) !== pkey(n.repeat, now)) { n.done = false; ch = true; } }
  return ch;
}
function apply(n, v, now) {
  if (n.done === v) return;
  if (v) {
    n.prevDoneAt = n.doneAt; n.prevStreak = n.streak;
    if (n.repeat) n.streak = (n.doneAt && pkey(n.repeat, n.doneAt) === pkey(n.repeat, prevTs(n.repeat, now))) ? n.streak + 1 : (n.doneAt && pkey(n.repeat, n.doneAt) === pkey(n.repeat, now) ? n.streak : 1);
    n.doneAt = now; n.hist.push(now); if (n.hist.length > 400) n.hist.splice(0, n.hist.length - 400);
  } else {
    if (n.hist.length && n.hist[n.hist.length - 1] === n.doneAt) n.hist.pop();
    n.doneAt = n.prevDoneAt || 0; n.streak = n.prevStreak || 0;
  }
  n.done = v;
}
function setDone(id, v) {
  const n = S.nodes[id], now = Date.now();
  apply(n, v, now);
  if (v && S.set.cascade) walkIds(n.kids, k => { apply(k, true, now); });
  if (S.set.autoParent) {
    let p = par[id];
    while (p) {
      const pn = S.nodes[p], all = pn.kids.length > 0 && pn.kids.every(k => S.nodes[k].done);
      if (all && !pn.done) apply(pn, true, now); else if (!all && pn.done) apply(pn, false, now); else break;
      p = par[p];

// ---------- markdown (small) ----------
function inl(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[\[([^\]]+)\]\]/g, (a, b) => `<a class="wl${findByName(b.replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"')) ? "" : " missing"}" data-wl="${b}">${b}</a>`)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a class="ext" href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a class="ext" href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(src) {
  let out = "", list = false; const close = () => { if (list) { out += "</ul>"; list = false; } };
  for (const L of esc(src || "").split("\n")) {
    let m;
    if ((m = L.match(/^(#{1,4})\s+(.*)/))) { close(); out += `<h${m[1].length + 2}>${inl(m[2])}</h${m[1].length + 2}>`; }
    else if ((m = L.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)/))) { if (!list) { out += "<ul>"; list = true; } out += `<li class="tk">${m[1] === " " ? "☐" : "☑"} ${inl(m[2])}</li>`; }
    else if ((m = L.match(/^\s*[-*]\s+(.*)/))) { if (!list) { out += "<ul>"; list = true; } out += `<li>${inl(m[1])}</li>`; }
    else if (!L.trim()) { close(); out += "<div style='height:.5em'></div>"; }
    else { close(); out += `<p>${inl(L)}</p>`; }
  }

}

<kbd>Ctrl</kbd>+<kbd>Enter</kbd> tick · <kbd>Alt</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> move item · <kbd>↑</kbd>/<kbd>↓</kbd> go to the row above/below<br>
<kbd>Ctrl</kbd>+<kbd>.</kbd> fold/unfold · <kbd>Ctrl</kbd>+<kbd>]</kbd> zoom in · <kbd>Ctrl</kbd>+<kbd>[</kbd> zoom out · <kbd>Backspace</kbd> on an empty row deletes it<br>
<kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Y</kbd> undo / redo · <kbd>/</kbd> search · paste a list (indented or markdown) to add many rows at once<br>

function copyText(t) { try { navigator.clipboard.writeText(t).then(() => toast("Copied"), () => fallbackCopy(t)); } catch (e) { fallbackCopy(t); } }
function fallbackCopy(t) { const a = el("textarea"); a.value = t; document.body.append(a); a.select(); try { document.execCommand("copy"); toast("Copied"); } catch (e) { toast("Couldn't copy"); } a.remove(); }
function mainMenu(x, y) {
  const tick = b => b ? "✓ " : "   ";
  popMenu(x, y, [
    ["❓ How it works", showHelp],
    "-",
    [tick(S.set.cascade) + "Ticking a parent ticks everything under it", () => { S.set.cascade = !S.set.cascade; save(); }],
    [tick(S.set.autoParent) + "Parent ticks itself when all sub-items are done", () => { S.set.autoParent = !S.set.autoParent; save(); }],
    [tick(S.set.compact) + "Clean rows (hide tags, chips and metrics)", () => { S.set.compact = !S.set.compact; save(); render(); }],
    [tick(S.set.theme === "light") + "Light theme", () => { S.set.theme = S.set.theme === "light" ? "dark" : "light"; save(); render(); }],
    "-",
    ["💾 Export backup (.json)", () => exportFile("life-tree-backup-" + today() + ".json", JSON.stringify(S, null, 1), "application/json")],
    ["📝 Export as Markdown checklist (.md)", () => exportFile("life-tree-" + today() + ".md", "# Life Tree\n\n" + toMd(S.top, 0, true), "text/markdown")],

    "-",
    ["🌱 Add the life plan starter", loadTemplate],

    ["🧹 Delete all done items (not repeating ones)", () => { act(() => { const kill = id => { const l = listOf(par[id]); l.splice(l.indexOf(id), 1); }; Object.values(S.nodes).filter(n => n.done && !n.repeat && !(par[n.id] && S.nodes[par[n.id]].done && !S.nodes[par[n.id]].repeat)).forEach(n => kill(n.id)); }); toast("Done items deleted", "Undo", undo); }],
    ["⚠ Start over (empty tree)", () => { act(() => { S.top = []; S.nodes = {}; S.focus = null; drawerId = null; }); toast("Everything cleared", "Undo", undo); }],
  ]);

function toMd(ids, d, notes) {
  let s = "";
  walkIds(ids, (n, dd) => {
    const pad = "  ".repeat(d + dd);
    s += `${pad}- [${n.done ? "x" : " "}] ${n.t}${n.due ? " (due " + n.due + ")" : ""}${n.tags.length ? " " + n.tags.map(t => "#" + t).join(" ") : ""}\n`;
    if (notes && n.notes.trim()) s += n.notes.trim().split("\n").map(l => pad + "  > " + l).join("\n") + "\n";
  });
  return s;
}
function exportFile(name, text, type) {
  const blob = new Blob([text], { type });

  const a = el("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove();
}
$("#file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const text = await f.text();
  if (/\.json$/i.test(f.name)) {
    let o; try { o = JSON.parse(text); } catch (err) { return toast("That file isn't a Life Tree backup."); }
    if (o.life) o = o.life;
    if (!o.nodes || !o.top) return toast("That file isn't a Life Tree backup.");
    act(() => { Object.assign(S, { nodes: o.nodes, top: o.top, focus: null }); S.set = Object.assign(S.set, o.set || {}); for (const id in S.nodes) fix(S.nodes[id]); });
    toast("Backup loaded", "Undo", undo);
  } else {
    const items = parseLines(text); if (!items.length) return toast("No list found in that file.");
    act(() => { const r = addChild(null, "📂 " + f.name.replace(/\.\w+$/, ""), false); insertTree(items, r.id); });
    toast(`Imported ${countTree(items)} items`);
  }
};
function loadTemplate() {
  const T = [
    ["🧭 Vision & values", { card: true, notes: "## Who I want to be\n- \n\n## What matters most\n- \n\nSee also [[Yearly goals]]." }, [

      ["Reach a healthy weight", { card: true, metrics: [{ name: "Weight", val: "", target: "", unit: "lb", log: [] }] }, [["Plan meals for the week", { repeat: "weekly" }], ["Book a check-up"]]]]],
    ["💰 Money", { color: "#30a46c" }, [

      ["Review budget", { repeat: "weekly" }], ["Pay off debt", { card: true }, [["List every debt with its rate"], ["Pick snowball or avalanche"]]]]],
    ["💼 Work & career", { color: "#3e63dd" }, [["Update résumé"], ["Learn one new skill", { card: true }]]],
    ["👪 People", { color: "#d6409f" }, [["Call family", { repeat: "weekly" }], ["Plan a meet-up with friends"]]],
    ["🏠 Home", { color: "#f76b15" }, [["Weekly clean", { repeat: "weekly" }], ["Fix-it list"]]],

// ---------- events: tree ----------
const main = $("#main");
main.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const holder = a.closest("[data-id]"); const id = holder && holder.dataset.id; const n = id && S.nodes[id];
  const k = a.dataset.act;
  if (k === "tag") { q = "#" + a.dataset.tag.toLowerCase(); $("#search").value = q; render(); return; }
  if (!n) return;
  if (k === "toggle") act(() => { n.open = !n.open; }, true);
  else if (k === "zoom") { S.focus = id; save(); render(); }
  else if (k === "child") { let nid; act(() => { nid = addChild(id, "", true).id; }, true); want = { id: nid }; render(); }
  else if (k === "below") { let nid; act(() => { nid = addAfter(id, "").id; }, true); want = { id: nid }; render(); }
  else if (k === "chat") { act(() => { n.panel = n.panel === "chat" ? "" : "chat"; }, true); if (n.panel === "chat") setTimeout(() => { const t = $(`#main [data-chat="${id}"] textarea`); if (t) t.focus(); }, 20); }
  else if (k === "cardp") act(() => { n.panel = n.panel === "card" ? "" : "card"; }, true);
  else if (k === "menu") { const r = a.getBoundingClientRect(); rowMenu(id, r.left - 160, r.bottom + 4); }
  else if (k === "open") openDrawer(id);
  else if (k === "reveal") reveal(id);
});
main.addEventListener("change", e => {
  if (!e.target.classList.contains("ck") || e.target.dataset.fid) return;
  const h = e.target.closest("[data-id]"); if (!h) return;
  const id = h.dataset.id; act(() => setDone(id, e.target.checked));
  if (e.target.checked) { const n = S.nodes[id]; if (n.repeat && liveStreak(n) > 1) toast(`🔥 ${liveStreak(n)} ${n.repeat === "daily" ? "days" : n.repeat === "weekly" ? "weeks" : "months"} in a row!`); }
});
main.addEventListener("input", e => {
  if (!e.target.classList.contains("txt")) return;
  const n = S.nodes[e.target.dataset.id]; if (!n) return;
  typing(); n.t = e.target.value; e.target.title = n.t; save();
  if (drawerId === n.id) { const b = $("#drawer .big"); if (b) b.value = n.t; }
});
main.addEventListener("click", e => { const c = e.target.closest(".tile"); if (c && !e.target.classList.contains("ck")) openDrawer(c.dataset.id); });
function visibleRows() { return $$("#main input.txt"); }
main.addEventListener("keydown", e => {
  const inp = e.target; if (!inp.classList || !inp.classList.contains("txt")) return;
  const id = inp.dataset.id, n = S.nodes[id]; if (!n) return;
  const pos = inp.selectionStart, k = e.key, mod = e.ctrlKey || e.metaKey;
  const go = (fn, keep) => { e.preventDefault(); let r; act(() => { r = fn(); }, true); want = { id: r || id, pos: keep ? pos : "end" }; render(); };
  if (k === "Enter" && mod) { e.preventDefault(); act(() => setDone(id, !n.done), true); want = { id, pos }; render(); }
  else if (k === "Enter" && e.shiftKey) go(() => addChild(id, "", true).id);
  else if (k === "Enter") {
    e.preventDefault();
    let nid;
    act(() => {
      if (pos === 0 && inp.value) nid = addBefore(id, "").id;
      else if (n.kids.length && n.open) nid = addChild(id, "", true).id;
      else nid = addAfter(id, "").id;
    }, true);
    want = { id: nid, pos: 0 }; render();
  }
  else if (k === "Tab") { e.preventDefault(); act(() => e.shiftKey ? outdent(id) : indent(id), true); want = { id, pos }; render(); }
  else if (k === "Backspace" && !inp.value && !n.kids.length) {
    e.preventDefault(); const rows = visibleRows(), i = rows.indexOf(inp), prev = rows[i - 1] || rows[i + 1];
    act(() => detach(id), true); if (prev) want = { id: prev.dataset.id, pos: "end" }; render();
  }
  else if (e.altKey && (k === "ArrowUp" || k === "ArrowDown")) { e.preventDefault(); act(() => moveBy(id, k === "ArrowUp" ? -1 : 1), true); want = { id, pos }; render(); }
  else if (k === "ArrowUp" || k === "ArrowDown") {
    const rows = visibleRows(), i = rows.indexOf(inp), t = rows[i + (k === "ArrowUp" ? -1 : 1)];
    if (t) { e.preventDefault(); t.focus(); const p = Math.min(pos, t.value.length); t.setSelectionRange(p, p); }
  }
  else if (mod && k === ".") { e.preventDefault(); act(() => { n.open = !n.open; }, true); want = { id, pos }; render(); }
  else if (mod && k === "]") { e.preventDefault(); S.focus = id; save(); render(); }
  else if (mod && k === "[") { e.preventDefault(); if (S.focus) { const f = S.focus; S.focus = par[S.focus]; save(); want = { id: f, pos: "end" }; render(); } }
});
main.addEventListener("paste", e => {

    ids = items.length ? insertTree(items, null, id) : [id];

});
main.addEventListener("focusout", e => { if (e.target.classList && e.target.classList.contains("txt")) { const b = $("#drawer .big"); if (b && drawerId === e.target.dataset.id) b.value = S.nodes[drawerId].t; } });
// drag & drop
main.addEventListener("dragstart", e => { const d = e.target.closest && e.target.closest(".dot"); if (!d) return; dragId = d.closest("[data-id]").dataset.id; e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; });
const clearDrop = () => $$(".dr-before,.dr-after,.dr-in").forEach(r => r.classList.remove("dr-before", "dr-after", "dr-in"));

document.addEventListener("click", e => {

document.addEventListener("keydown", e => {

// ---------- talking to Randis UDS ----------
window.addEventListener("message", e => {
  const d = e.data; if (!d || typeof d.uds !== "string") return;
  if (d.uds === "store") { if (!loaded) { useLocal = false; boot(d.data && d.data.life ? d.data.life : null); } }
  else if (d.uds === "store-error") { $("#saved").textContent = "⚠ not saved"; toast("⚠ Not saved: " + (d.note || "")); }
  else if (d.uds === "web-state") webOn = !!d.on;
  else if (d.uds === "exporting") toast(d.note);
  else if (d.uds === "exported") toast(d.note || (d.ok ? "Saved" : "Not saved"));
  else if (d.uds === "planner") {
    const m = pending[d.id]; if (!m) return; m.heard = true;
    if (d.done) return finish(d.id, d);
    if (d.status) m.status = d.status; if (d.text) m.content = d.text;
    refreshChat(d.id);
  }
});
setInterval(() => {
  if (!S) return; const a = document.activeElement;
