<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Publishing Suite</title>
<style>
:root{--bg:#13151a;--pn:#1b1e25;--pn2:#232732;--ln:#343a4a;--tx:#e8eaf0;--mu:#9aa3b5;--ac:#e9b949;--ac2:#5aa9e6;--ok:#4caf7a;--bad:#e06464;--warn:#e0a84a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
header h1{font-size:16px;margin:0;color:var(--ac)}
header .sp{flex:1}
#saveState{color:var(--mu);font-size:12px}
nav#tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px 0;background:var(--pn);border-bottom:1px solid var(--ln)}
nav#tabs button{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--mu);padding:6px 11px;border-radius:7px 7px 0 0;cursor:pointer;font:inherit}
nav#tabs button:hover{color:var(--tx)}
nav#tabs button.on{background:var(--bg);color:var(--tx);border-color:var(--ln)}
main{flex:1;overflow:auto;padding:14px 18px 60px}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:15px;margin:16px 0 6px;color:var(--ac)}
p{margin:6px 0}
.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 12px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
label.c{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-right:12px}
input,select,textarea{background:#0f1116;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px}
input[type=checkbox],input[type=radio]{padding:0}
input[type=color]{padding:1px;height:32px;width:52px}
textarea{width:100%;min-height:90px;resize:vertical;font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
textarea.prose{font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.6;min-height:260px}
button{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:7px;padding:6px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ac2)}
button.pri{background:var(--ac);color:#1a1405;border-color:var(--ac);font-weight:600}
button.dng{border-color:#6b2c2c;color:#f0a0a0}
button:disabled{opacity:.45;cursor:default}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th,table.t td{border-bottom:1px solid var(--ln);padding:4px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--mu);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--pn2);border:1px solid var(--ln);font-size:12px;margin:2px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.step{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;cursor:pointer}
.step b{display:block}
.step.done{border-color:var(--ok)}
.step.done b::after{content:"  ✓";color:var(--ok)}
.chap{border:1px solid var(--ln);border-radius:8px;padding:8px;margin:8px 0;background:var(--pn2)}
.prev{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.prev canvas{background:#fff;box-shadow:0 4px 18px #0008;border-radius:2px;max-width:100%}
.log{background:#0c0e12;border:1px solid var(--ln);border-radius:8px;padding:8px;height:220px;overflow:auto;font:12px Consolas,monospace;white-space:pre-wrap}
.bar{height:12px;background:#0c0e12;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));width:0}
.guide h3{margin-top:18px}
.guide li{margin:3px 0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:13px}
.kv b{color:var(--mu);font-weight:500}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%;z-index:9}
#toast.on{opacity:1}
.small{font-size:12px}
.vars code{background:#0f1116;border:1px solid var(--ln);border-radius:4px;padding:0 4px;margin:2px;display:inline-block;cursor:pointer}
code{font-family:Consolas,monospace}
details>summary{cursor:pointer;color:var(--ac2)}
hr{border:none;border-top:1px solid var(--ln);margin:12px 0}
</style></head>

  '<li><b>United States:</b> there is no free source. Bowker (myidentifiers.com) is the only agency. Its list prices have been about $125 for 1, $295 for 10, $575 for 100 and $1,500 for 1,000. Ask Bowker about larger blocks. Check current prices before you buy.</li></ul>' +

/* ===================== the guide: the whole craft ===================== */
const GUIDE = `
<h2>From dirt to finished books: the whole craft</h2>
<p>Publishing is a dozen crafts in a row. This tab does the mechanical ones for you (typesetting, files, covers, identifiers, metadata). The human ones are listed here so nothing is missed.</p>
<h3>1. Idea and plan</h3><ul><li><b>Premise:</b> one sentence: who wants what, what stops them, what’s at stake. For non-fiction: who it’s for and what they will be able to do after.</li><li><b>Reader and shelf:</b> name three recent books yours sits beside. That decides length, tone, trim size, price and categories.</li><li><b>Series plan:</b> what changes per volume (title, data, puzzle set, characters) and what stays (design, voice, structure). Write it as a recipe: that is exactly what Book &amp; series and Content take.</li><li><b>Series bible:</b> names, ages, places, rules of your world, spellings. Craft room keeps it.</li></ul>
<h3>2. Writing or making the content</h3><ul><li><b>Drafting:</b> outline beats (Craft room), then write fast; fix later.</li><li><b>Data-driven books:</b> a spreadsheet row per volume feeds {{fields}}. Lists multiply into every combination. Generators make puzzles, worksheets and journal pages with answers.</li><li><b>Research and fact-checking:</b> keep sources; quotes over a line or two from in-copyright works need permission.</li><li><b>Illustration:</b> commission, license or make your own; keep the licence for each picture.</li><li><b>Translation:</b> each language is a new edition with its own ISBNs.</li></ul>
<h3>3. Editing (in this order)</h3><ul><li><b>Developmental edit:</b> structure, pacing, character, argument.</li><li><b>Line edit:</b> sentences, voice, rhythm.</li><li><b>Copyedit:</b> grammar, consistency, the style sheet (Craft room).</li><li><b>Sensitivity and expert reads</b> where they matter.</li><li><b>Proofreading:</b> on the laid-out pages, after typesetting, ideally on a printed proof.</li><li>At scale: edit the template and the data, then proofread a sample spread across the series.</li></ul>
<h3>4. Book design and typesetting</h3><ul><li>Trim size, margins, gutter that grows with page count, font and leading, chapter openings, running heads and page numbers, widows and orphans: all in Interior.</li><li>Front matter order: half title, title page, copyright page, dedication, epigraph, contents. Back matter: acknowledgments, glossary, about the author, also by, colophon.</li><li>Print files need embedded fonts: add a .ttf. Ebooks reflow, so EPUB is made separately with real structure.</li></ul>
<h3>5. Cover</h3><ul><li>The front must read as a thumbnail: big title, strong contrast, one clear image or shape.</li><li>Print covers are one wide sheet: back + spine + front + 0.125 in bleed. Spine width comes from page count and paper.</li><li>Series: same layout, changing colour and number (Cover → colour change per volume).</li></ul>
<h3>6. Identifiers and legal</h3><ul><li>ISBNs, ISSN, barcodes: see ISBN &amp; IDs.</li><li><b>Copyright</b> exists as soon as you write it. In the US, registration (optional, a fee per work at copyright.gov) lets you sue for statutory damages. Text or art made entirely by AI is not protected by US copyright; your own selection and arrangement can be.</li><li><b>Legal deposit:</b> many countries require copies to the national library (US: two copies of printed books to the Library of Congress within three months of publication, when asked or as required; UK: the British Library; Canada: LAC). Check yours.</li><li><b>Disclosures:</b> stores ask whether content is AI-generated; answer honestly. Fiction disclaimers and medical/financial disclaimers where needed.</li><li><b>Public domain</b> sources: check the rules in every country you sell in, and add something of your own.</li><li><b>Business:</b> an imprint name, tax forms (W-9 or W-8BEN) with each platform, bookkeeping for royalties.</li></ul>
<h3>7. Metadata: how books get found</h3><ul><li>Title, subtitle, series and number, author, description, BISAC categories, keywords, audience, price, publication date, page count, language.</li><li>ONIX 3.0 is the trade’s standard feed; MARC21 is for libraries; both come out of Build.</li></ul>
<h3>8. Production and printing</h3><ul><li><b>Print on demand</b> (KDP, IngramSpark, Lulu): no stock, printed per order. Best for big series.</li><li><b>Offset printing:</b> cheaper per copy from about 500–1,000 copies, needs storage and shipping.</li><li>Always order a printed proof of each new design.</li></ul>
<h3>9. Distribution</h3><ul><li>See Metadata &amp; sales → Where books go. For thousands of titles, talk to the platform first: daily title limits and rules against mass, near-identical books apply.</li><li>Going wide (all stores) vs exclusive (Kindle Unlimited) is a business choice per series.</li></ul>
<h3>10. Launch and marketing</h3><ul><li>Advance reader copies (the EPUB and PDF from Build) for reviewers.</li><li>A newsletter, a website with the catalog page, series reading order, first-in-series price promotions.</li><li>Ads work best on series: the first book pays for itself through the rest.</li></ul>
<h3>11. Records and archiving</h3><ul><li>Keep the project file, the ISBN ledger, the built files and contracts in two places.</li><li>Free permanent archives: Internet Archive and Zenodo (with free DOIs).</li><li>Track editions: a corrected reprint keeps its ISBN; a new edition gets new ones.</li></ul>
<h3>Mass series: what actually matters</h3><ul><li><b>Every volume must be worth buying on its own.</b> Stores remove near-duplicate books and can close accounts for it. Vary real content, not just the number.</li><li><b>Build in batches</b> (say 500 at a time), check a sample, then continue. Resume picks up where a stopped build left off.</li><li><b>Time and space:</b> use Build → Estimate. A text book takes well under a second per format; puzzle books with checked-unique sudokus take longer.</li><li><b>Identifiers:</b> plan ISBN budget per format before building (ISBN &amp; IDs).</li><li><b>Disk:</b> build straight into a folder on a drive with room; zip only for small runs.</li></ul>`;
function secGuide() { return [h('div', { className: 'card guide', html: GUIDE })]; }
