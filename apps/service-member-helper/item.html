<html>
<head>
<meta charset="utf-8">
<title>Service Member Helper</title>

<style>
:root{--bg:#11140f;--bg2:#181c15;--bg3:#232a1e;--line:#36412e;--tx:#e9eddf;--mut:#9aa48a;--acc:#c9b458;--acc2:#7fae8a;--ok:#5fb37a;--warn:#e0a63a;--bad:#e06a5a;--card:#1a1f16}
body[data-theme=light]{--bg:#eef0e6;--bg2:#f8f9f2;--bg3:#e2e6d5;--line:#c4cbb0;--tx:#20261a;--mut:#5f6a4f;--acc:#86701a;--acc2:#2f7a4e;--card:#fbfcf6}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:15px;margin:2px 0 8px;color:var(--acc)}
h4{margin:12px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 7px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc)}
textarea{width:100%;resize:vertical;min-height:60px}
button{cursor:pointer;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#16180f;border-color:var(--acc);font-weight:600}
button.sm{padding:1px 7px;font-size:12px}
a,.lnk{color:var(--acc2);cursor:pointer;text-decoration:underline}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
header .t{font-weight:700;font-size:16px}
header .sub{color:var(--mut);font-size:12px}
.crisis{margin-left:auto;background:#5a1f1a;color:#ffe;border-radius:6px;padding:4px 10px;font-size:12px}
body[data-theme=light] .crisis{background:#f6d6d0;color:#5a1f1a}
main{flex:1;display:flex;min-height:0}
nav{width:190px;background:var(--bg2);border-right:1px solid var(--line);overflow:auto;padding:6px 0}
nav div{padding:6px 14px;cursor:pointer;color:var(--mut)}
nav div:hover{color:var(--tx)}
nav div.on{color:var(--tx);background:var(--bg3);border-left:3px solid var(--acc);padding-left:11px}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;cursor:default;padding-top:12px;color:var(--mut);opacity:.7}
#view{flex:1;overflow:auto;padding:16px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.grid .card{margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 14px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.form label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--tx);font-size:13px}
.mut{color:var(--mut)}.small{font-size:12px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin:0 3px 3px 0;color:var(--mut)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:2px 10px;margin:0 4px 4px 0;cursor:pointer;font-size:12px}
.chip.on{background:var(--acc);color:#16180f;border-color:var(--acc)}
ul{margin:4px 0;padding-left:20px}li{margin:2px 0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600}
td input,td select{width:100%}
.big{font-size:22px;font-weight:700}
.stat{display:inline-block;margin:0 18px 8px 0}
.stat .mut{font-size:12px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.note{border-left:3px solid var(--warn);padding:6px 10px;background:var(--bg3);border-radius:4px;margin:8px 0;font-size:13px}
.links{margin-top:6px}.links .lnk{margin-right:12px;font-size:13px;white-space:nowrap}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{position:relative;margin-bottom:10px}
.tl .it:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl .it.past:before{background:var(--mut)}
.tl .d{font-weight:600}
.ai{white-space:pre-wrap;background:var(--bg3);border-radius:6px;padding:8px;min-height:40px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--acc);color:#16180f;padding:7px 14px;border-radius:8px;display:none;max-width:80%;z-index:9}
.rack{display:flex;flex-wrap:wrap;gap:4px;max-width:330px}
.rib{flex:0 0 104px;height:30px;border:1px solid var(--line);border-radius:3px;font-size:10px;line-height:1.1;padding:2px 4px;overflow:hidden;background:var(--bg3)}
</style>
</head>
<body>
<header>
  <div><div class="t">🎖 Service Member Helper</div><div class="sub">Pay · TSP · VA · TRICARE · base life · records · transition</div></div>
  <div class="crisis">Need help now? Dial <b>988, press 1</b> · text <b>838255</b></div>
  <button class="sm" data-act="theme" title="Light / dark">◐</button>
</header>
<main><nav id="nav"></nav><div id="view"></div></main>
<div id="toast"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const inApp = window.parent !== window;
const tell = m => { try { window.parent.postMessage(m, "*"); } catch (e) {} };
const money = n => (n < 0 ? "-" : "") + "$" + Math.abs(Math.round(n)).toLocaleString();
const money2 = n => "$" + (Math.round(n * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let toastT; function toast(t, ms) { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => e.style.display = "none", ms || 3200); }

/* ---------- links ---------- */
let WEB_ON = false;
function openLink(url) {
  if (!inApp) { window.open(url, "_blank", "noopener"); return; }
  if (WEB_ON) { tell({ uds: "web-pop", url }); return; }
  try { navigator.clipboard.writeText(url); toast("Link copied – paste it into your browser. (Turn on web for this tab to open links straight from here.)", 5000); }
  catch (e) { prompt("Copy this link:", url); }
}
const L = (label, url) => `<span class="lnk" data-url="${esc(url)}">${esc(label)} ↗</span>`;

function inp(path, type, attrs) {
  const v = get(path);

}
function sel(path, opts) { const v = get(path); return `<select data-bind="${path}">${opts.map(o => { const [k, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(k)}" ${String(v) === String(k) ? "selected" : ""}>${esc(t)}</option>`; }).join("")}</select>`; }
function get(path) { return path.split(".").reduce((o, k) => o == null ? o : o[k], S); }
function set(path, val) { const ks = path.split("."); const last = ks.pop(); const o = ks.reduce((o, k) => o[k], S); o[last] = val; }
function daysUntil(d) { if (!d) return null; return Math.round((new Date(d + "T00:00") - new Date(new Date().toDateString())) / 864e5); }
function addDays(d, n) { const x = new Date(d + "T00:00"); x.setDate(x.getDate() + n); return x; }
function fmtD(x) { return x.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
function ymd(x) { return x.getFullYear() + String(x.getMonth() + 1).padStart(2, "0") + String(x.getDate()).padStart(2, "0"); }

function nextSteps() {
  const p = P(), out = [], d = daysUntil(p.sep), st = p.status;
  const go = (k, t) => `<span class="lnk" data-go="${k}">${t}</span>`;
  if (st === "AD" || st === "GR") {
    if (p.brs && S.tsp.trad + S.tsp.roth < 5) out.push(`You're putting ${S.tsp.trad + S.tsp.roth}% in TSP – put in at least 5% to get the full DoD match. ${go("tsp", "TSP calculator")}`);
    if (p.yos >= 6 && st === "AD") out.push(`With 6+ years you may be able to transfer your GI Bill to family – it must be done while serving (milConnect).`);
    if (d != null && d >= 0) {
      if (d <= (p.retiring ? 730 : 365)) out.push(`You're ${d} days from leaving – TAP should already be started. ${go("trans", "See your timeline")}`);
      if (d <= 180 && d >= 90) out.push(`You're in the BDD window (180–90 days out): file your VA disability claim now.`);
      if (d < 90) out.push(`Under 90 days out: file an Intent to File with VA if you haven't, and get copies of your medical records.`);
      if (d <= 180) out.push(`SkillBridge window is open (last 180 days) if your command approves.`);
    } else if (d == null) out.push(`Add your separation / ETS date to get a transition timeline.`);
  }
  if (d != null && d < 0) {
    const a = -d;
    if (a <= 240) out.push(`VGLI with no health questions: ${240 - a} days left.`);
    else if (a <= 485) out.push(`VGLI deadline (with health questions): ${485 - a} days left.`);
    if (a <= 180) out.push(`VA dental one-time benefit: apply within 180 days of discharge (${180 - a} days left) if you qualify.`);
    out.push(`Keep certified copies of your DD214. ${go("docs", "Documents checklist")}`);
  }
  if (st === "VET") out.push(`Check what you can use on base with a VHIC, and VA health care / PACT Act. ${go("guides", "Guides")}`);
  const soon = S.docs.filter(x => x.exp && daysUntil(x.exp) != null && daysUntil(x.exp) <= 60);
  soon.forEach(x => out.push(`<b>${esc(x.name)}</b> ${daysUntil(x.exp) < 0 ? "expired" : "expires in " + daysUntil(x.exp) + " days"}. ${go("docs", "Documents")}`));

  if (noMfa) out.push(`${noMfa} account(s) without two-step sign-in. ${go("accts", "Accounts")}`);
  return out;
}

/* TSP */
function tspCalc() {
  const t = S.tsp, rows = []; let bal = +t.bal || 0, pay = +t.pay || 0, yos = +t.yos || 0, mine = 0, dod = 0;
  const youPct = (+t.trad || 0) + (+t.roth || 0);
  const matchPct = y => !t.brs ? 0 : 1 + (y >= 2 && y < 26 ? Math.min(youPct, 3) + 0.5 * Math.min(Math.max(youPct - 3, 0), 2) : 0);
  for (let i = 0; i < (+t.years || 0); i++) {
    const annual = pay * 12, you = Math.min(annual * youPct / 100, +t.limit || 1e12), ag = annual * matchPct(yos) / 100;
    mine += you; dod += ag;
    for (let m = 0; m < 12; m++) bal = bal * (1 + (+t.ret || 0) / 1200) + (you + ag) / 12;
    rows.push({ y: i + 1, yos: yos + 1, bal, you, ag }); pay *= 1 + (+t.raise || 0) / 100; yos++;
  }
  return { rows, bal, mine, dod, youPct, nowMatch: matchPct(+t.yos || 0), annual: (+t.pay || 0) * 12 };
}
V.tsp = () => {

<label>Monthly base pay ($) ${inp("tsp.pay", "number", 'min="0"')}</label>

<p class="small mut">2026 limit: $24,500 (+$8,000 at 50+, or $11,250 at 60–63). Pay tables: ${L("DFAS", "https://www.dfas.mil/MilitaryMembers/payentitlements/Pay-Tables/")}</p></div>
<div class="card">
<div class="stat"><div class="mut">You put in now</div><div class="big">${money(yearYou / 12)}/mo</div></div>
<div class="stat"><div class="mut">DoD puts in now</div><div class="big">${money(r.annual * r.nowMatch / 1200)}/mo</div><div class="small mut">${r.nowMatch}% of base pay</div></div>
<div class="stat"><div class="mut">In ${t.years} years</div><div class="big ok">${money(r.bal)}</div></div>
<div class="stat"><div class="mut">Your money / DoD money</div><div class="big">${money(r.mine)} / ${money(r.dod)}</div></div>
${msgs.map(m => `<p>${m}</p>`).join("")}
${chart(r.rows)}
<p class="small mut">A guess, not a promise: returns vary, and this doesn't count inflation, fees or taxes. Matching runs from the start of year 3 through year 26; the automatic 1% is yours after 2 years.</p></div>`;

function chart(rows) {
  if (!rows.length) return "";
  const W = 640, H = 180, max = Math.max(...rows.map(r => r.bal), 1);
  const pts = rows.map((r, i) => `${30 + i * (W - 40) / Math.max(rows.length - 1, 1)},${H - 20 - r.bal / max * (H - 35)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto"><line x1="30" y1="${H - 20}" x2="${W - 10}" y2="${H - 20}" stroke="var(--line)"/>
<polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5"/><text x="32" y="14" fill="var(--mut)" font-size="11">${money(max)}</text>
<text x="30" y="${H - 4}" fill="var(--mut)" font-size="11">year 1</text><text x="${W - 60}" y="${H - 4}" fill="var(--mut)" font-size="11">year ${rows.length}</text></svg>`;
}

/* VA loan */
function feePct(l) {
  if (l.exempt) return 0;
  if (l.kind === "irrrl" || l.kind === "assume") return 0.5;
  if (l.kind === "cashout") return l.use === "first" ? 2.15 : 3.3;
  const d = +l.down || 0;
  if (d >= 10) return 1.25; if (d >= 5) return 1.5;
  return l.use === "first" ? 2.15 : 3.3;
}
V.loan = () => {
  const l = S.loan, price = +l.price || 0, downAmt = price * (+l.down || 0) / 100, base = price - downAmt, fp = feePct(l), fee = base * fp / 100;
  const loan = base + (l.finance ? fee : 0), n = (+l.term || 30) * 12, i = (+l.rate || 0) / 1200;
  const pi = i ? loan * i / (1 - Math.pow(1 + i, -n)) : loan / n, other = ((+l.tax || 0) + (+l.ins || 0)) / 12 + (+l.hoa || 0);
  return `<h2>VA loan calculator</h2>
<div class="card"><div class="form">
<label>${l.kind === "purchase" ? "Home price" : "Loan amount"} ($) ${inp("loan.price", "number")}</label>
<label>Down payment % ${inp("loan.down", "number", 'min="0" max="100"')}</label>
<label>Loan type ${sel("loan.kind", [["purchase", "Purchase / build"], ["cashout", "Cash-out refinance"], ["irrrl", "IRRRL (rate-lowering refi)"], ["assume", "Assumption"]])}</label>
<label>Use ${sel("loan.use", [["first", "First use"], ["later", "Used before"]])}</label>
<label>Interest rate % ${inp("loan.rate", "number", 'step="0.125"')}</label>
<label>Term (years) ${sel("loan.term", [30, 25, 20, 15])}</label>
<label>Property tax / year ($) ${inp("loan.tax", "number")}</label>
<label>Home insurance / year ($) ${inp("loan.ins", "number")}</label>
<label>HOA / month ($) ${inp("loan.hoa", "number")}</label>
<label class="ck">${inp("loan.exempt", "check")} Exempt from funding fee (VA disability pay, Purple Heart on active duty, etc.)</label>
<label class="ck">${inp("loan.finance", "check")} Roll the funding fee into the loan</label></div></div>
<div class="card">
<div class="stat"><div class="mut">Funding fee</div><div class="big">${fp}% = ${money(fee)}</div></div>
<div class="stat"><div class="mut">Loan amount</div><div class="big">${money(loan)}</div></div>
<div class="stat"><div class="mut">Principal & interest</div><div class="big">${money2(pi)}/mo</div></div>
<div class="stat"><div class="mut">Total with tax, insurance, HOA</div><div class="big ok">${money2(pi + other)}/mo</div></div>
<div class="stat"><div class="mut">Cash at closing (down${l.finance ? "" : " + fee"})</div><div class="big">${money(downAmt + (l.finance ? 0 : fee))}</div><div class="small mut">plus closing costs</div></div>
<p class="small mut">Fee rates are VA's current table (purchase: 2.15% first use / 3.3% after under 5% down, 1.5% at 5%+, 1.25% at 10%+; IRRRL 0.5%). Lenders also check debt-to-income and VA "residual income". ${L("VA funding fee", "https://www.va.gov/housing-assistance/home-loans/funding-fee-and-closing-costs/")}</p></div>`;
};

/* Transition timeline */
function milestones() {
  const p = P(); if (!p.sep) return [];
  const R = p.retiring;
  const M = [
    [R ? -730 : -365, "Start TAP: initial counseling & pre-separation counseling" + (R ? " (retirees can start 24 months out)" : " (no later than 365 days out)")],
    [-365, "Transfer GI Bill to family now if you want to (must still be serving; may add service time)"],
    [-300, "Start a résumé, translate your job (O*NET / COOL), get a JST"],
    [-180, "SkillBridge window opens (with command approval)"],
    [-180, "BDD window opens: file VA disability claim (needs 90+ days left)"],
    [-120, "Book separation physical (SHPE) and dental exam"],
    [-90, "TAP Capstone due · BDD window closes · file Intent to File if not filing BDD"],
    [-60, "Schedule household goods move (Move.mil), clear housing"],
    [-30, "Get copies of medical/dental records, last evals, orders, awards"],
    [-14, "Turn in CIF gear, final out with finance"],
    [-1, "Review your DD214 line by line before signing"],
    [0, "Separation date"],
    [0, "Check TRICARE: TAMP (180 days if you qualify), CHCBP, or VA care"],
    [180, "TAMP ends (if you had it) · last day to apply for one-time VA dental"],
    [240, "VGLI: last day with no health questions"],
    [485, "VGLI: final deadline (1 year 120 days)"],
    [R ? 365 : 180, "Usual limit to use your final move / ship household goods (" + (R ? "retirees: 1 year" : "separatees: about 180 days") + ") – confirm with transportation"],
    [3650, "Enhanced VA health care eligibility for combat veterans ends (10 years)"]
  ];
  return M.map(([d, t]) => ({ d, t, date: addDays(p.sep, d) })).sort((a, b) => a.d - b.d);
}

/* ---------- render & events ---------- */
function render() { nav(); document.body.dataset.theme = S.theme; const y = $("#view").scrollTop; $("#view").innerHTML = (V[view] || V.home)(); $("#view").scrollTop = y; }
function go(k) { view = k; render(); $("#view").scrollTop = 0; }
function download(name, text, type) {
  const blob = new Blob([text], { type: type || "application/json" });
  if (inApp) { tell({ uds: "export-file", name, data: blob }); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
document.addEventListener("click", e => {
  const t = e.target;
  const u = t.closest("[data-url]"); if (u) return openLink(u.dataset.url);
  const g = t.closest("[data-go]"); if (g) return go(g.dataset.go);
  const c = t.closest("[data-cat]"); if (c) { S.filter.cat = c.dataset.cat; save(); return render(); }
  const d = t.closest("[data-del]"); if (d) { S[d.dataset.del].splice(+d.dataset.i, 1); save(); return render(); }
  const dp = t.closest("[data-delp]"); if (dp) { S.bases[S.baseCur].places.splice(+dp.dataset.delp, 1); save(); return render(); }
  const a = t.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "theme") { S.theme = S.theme === "dark" ? "light" : "dark"; save(); render(); }
  if (act === "search") { S.filter.q = $("#homeQ").value; S.filter.cat = "all"; S.filter.mine = false; save(); go("guides"); }
  if (act === "addDoc") { const v = $("#newDoc").value.trim(); if (v) { S.docs.push({ id: uid(), name: v, tags: "", have: "", where: "", exp: "", notes: "" }); save(); render(); } }
  if (act === "addAcct") { const n = $("#newAcName").value.trim(), url = $("#newAcUrl").value.trim(); if (n) { if (url && !/^https:\/\//i.test(url)) return toast("Links must start with https://"); S.accts.push({ id: uid(), name: n, url, what: "", have: true, mfa: false, checked: "", notes: "" }); save(); render(); } }
  if (act === "addBase") { S.bases.push(newBase("Base " + (S.bases.length + 1))); S.baseCur = S.bases.length - 1; save(); render(); }
  if (act === "delBase") { if (confirm("Delete " + S.bases[S.baseCur].name + " and all its entries?")) { S.bases.splice(S.baseCur, 1); S.baseCur = 0; save(); render(); } }
  if (act === "addPlace") { S.bases[S.baseCur].places.push({ id: uid(), kind: "", bldg: "", phone: "", hours: "", notes: "" }); save(); render(); }
  if (act === "printBase") printBase();
  if (act === "addGear") { S.gear.push({ id: uid(), name: "", nsn: "", qty: 1, src: "Issued (CIF)", st: "Have it", val: "", notes: "" }); save(); render(); }
  if (act === "gearCsv") { const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; download("gear.csv", ["Item,NSN/size,Qty,Source,Status,Value,Notes", ...S.gear.map(g => [g.name, g.nsn, g.qty, g.src, g.st, g.val, g.notes].map(q).join(","))].join("\r\n"), "text/csv"); }
  if (act === "addAward") { S.myAwards.push({ name: "", date: "", notes: "" }); save(); render(); }
  if (act === "ics") exportIcs();
  if (act === "ai") askAI();
  if (act === "export") download("service-member-helper-backup.json", JSON.stringify(S, null, 1));
  if (act === "wipe") { if (confirm("Erase everything in this tab? Export a backup first if you want to keep it.")) { S = fresh(); save(); render(); } }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.bind) { set(t.dataset.bind, t.type === "checkbox" ? t.checked : t.type === "number" ? (t.value === "" ? "" : +t.value) : t.value); save(); render(); return; }
  if (t.dataset.done != null) { S.done[t.dataset.done] = t.checked; save(); return; }
  if (t.dataset.medal) { if (t.checked) S.medals[t.dataset.medal] = { dev: "" }; else delete S.medals[t.dataset.medal]; save(); render(); return; }
  if (t.dataset.medaldev) { if (S.medals[t.dataset.medaldev]) S.medals[t.dataset.medaldev].dev = t.value; save(); render(); return; }
  if (t.id === "baseSel") { S.baseCur = +t.value; save(); render(); }
  if (t.id === "imp" && t.files[0]) { t.files[0].text().then(x => { try { const d = JSON.parse(x); if (!d || !d.prof) throw 0; S = Object.assign(fresh(), d); save(); render(); toast("Backup loaded."); } catch (err) { toast("That isn't a backup from this tab."); } }); }
});
document.addEventListener("input", e => { if (e.target.id === "gq") { S.filter.q = e.target.value; save(); clearTimeout(window._gq); window._gq = setTimeout(() => { const pos = e.target.selectionStart; render(); const n = $("#gq"); n.focus(); n.setSelectionRange(pos, pos); }, 250); } });
document.addEventListener("keydown", e => { if (e.key === "Enter") { if (e.target.id === "homeQ") $("[data-act=search]").click(); if (e.target.id === "aiQ") askAI(); } });
function printBase() {
  const b = S.bases[S.baseCur], rows = b.places.filter(p => p.bldg || p.phone || p.hours || p.notes);
  const html = `<!doctype html><meta charset="utf-8"><title>${esc(b.name)}</title><style>body{font:13px Segoe UI,sans-serif}td,th{border-bottom:1px solid #ccc;padding:3px 6px;text-align:left}</style><h2>${esc(b.name)}</h2><table><tr><th>Place</th><th>Bldg</th><th>Phone</th><th>Hours</th><th>Notes</th></tr>${rows.map(p => `<tr><td>${esc(p.kind)}</td><td>${esc(p.bldg)}</td><td>${esc(p.phone)}</td><td>${esc(p.hours)}</td><td>${esc(p.notes)}</td></tr>`).join("")}</table><p style="font-size:10px;color:#777">Randis UDS™ by Randy Moore</p>`;
  download(b.name.replace(/[^\w -]/g, "") + " directory.html", html, "text/html");
}
function askAI() {
  const q = ($("#aiQ") || {}).value || ""; if (!q.trim()) return toast("Type a question first.");
  if (!inApp) return toast("The AI helper works inside Randis UDS.");
  AI.id = "mil-" + uid(); AI.status = "Asking…"; AI.text = ""; render();
  tell({ uds: "planner-ask", id: AI.id, history: [{ role: "user", content: q }], context: profileSummary() });
}
window.addEventListener("message", e => {
  const m = e.data || {};
  if (m.uds === "web-state") WEB_ON = !!m.on;
  if (m.uds === "exported") toast(m.note || (m.ok ? "Saved." : "Not saved."));
  if (m.uds === "planner" && m.id === AI.id) {
    if (m.done) { AI.status = m.error ? "⚠ " + m.error : ""; AI.text = m.text || AI.text; } else { AI.status = m.status || ""; if (m.text) AI.text = m.text; }
    const st = $("#aiSt"), tx = $("#aiTx"); if (st) st.textContent = AI.status; if (tx) tx.textContent = AI.text || "—";
  }
});
if (inApp) tell({ uds: "web-hello" });
render();
</script>
</body>
</html>
