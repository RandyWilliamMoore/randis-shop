<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const inApp = window.parent !== window;
const tell = m => { try { window.parent.postMessage(m, "*"); } catch (e) {} };
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("on"), 2600); }
window.addEventListener("message", e => { if (e.data && e.data.uds === "exported") toast(e.data.note || (e.data.ok ? "Saved." : "Not saved.")); });
function exportFile(name, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain" });
  if (inApp) { tell({ uds: "export-file", name, data: blob }); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const stamp = () => new Date().toISOString().slice(0, 10);

// ============================================================ reference data
// Densities lb/ft³ at ~12% moisture, Janka hardness lbf, rough US retail $/board foot (edit in Woods page).
const WOODS = {
  maple: { n: "Hard maple", dens: 44, janka: 1450, price: 7, kid: 1, acid: "low", note: "The classic toy wood: hard, closed grain, light colour, no smell. Dents least." },
  cherry: { n: "Cherry", dens: 35, janka: 950, price: 9, kid: 1, acid: "medium", note: "Darkens to deep red over the years, so the box ages with the family. Easy to work." },
  walnut: { n: "Black walnut", dens: 38, janka: 1010, price: 12, kid: 1, acid: "medium", note: "Rich brown heirloom look. Dust can irritate skin and airways while cutting; fine once finished." },
  beech: { n: "European beech", dens: 45, janka: 1300, price: 8, kid: 1, acid: "medium", note: "Traditional European toy wood. Hard, smooth, takes wear. Moves a lot with humidity." },
  ash: { n: "White ash", dens: 42, janka: 1320, price: 6, kid: 1, acid: "medium", note: "Tough and springy (tool handles). Open grain; fill or accept texture." },
  woak: { n: "White oak", dens: 47, janka: 1360, price: 8, kid: 1, acid: "high", note: "Strong and classic, but oak gives off acetic/formic acid vapour: keep it out of closed curio boxes holding metals, coins, silver, shells or paper." },
  roak: { n: "Red oak", dens: 44, janka: 1220, price: 5, kid: 1, acid: "high", note: "Cheap and strong. Same acid-vapour problem as white oak, and very open grain." },
  poplar: { n: "Poplar", dens: 29, janka: 540, price: 4, kid: 1, acid: "low", note: "Budget, light, paint-grade. Lower acid than most: decent for curio interiors when sealed." },
  bass: { n: "Basswood (lime)", dens: 26, janka: 410, price: 5, kid: 1, acid: "low", note: "Very light, carves beautifully, low acid. Soft: dents easily on a toy chest." },
  pine: { n: "Eastern white pine", dens: 25, janka: 380, price: 3, kid: 1, acid: "medium", note: "Light and cheap; good for kids' first totes. Knots can weep resin; soft." },
  mahog: { n: "Genuine mahogany", dens: 37, janka: 800, price: 12, kid: 1, acid: "low", note: "Stable, low-acid, traditional cabinet wood. Buy from a legal/certified source (FSC)." },
  cedar: { n: "Aromatic red cedar", dens: 33, janka: 900, price: 6, kid: 0, acid: "high", note: "Hope-chest lining for textiles (moths). Strong oils and acids: bad for metals, photos and paper. Dust is a known sensitizer." },
  birchply: { n: "Baltic birch plywood", dens: 42, janka: 1260, price: 0, kid: 1, acid: "medium", ply: 1, note: "Void-free, stable, strong. Great for bottoms, trays and kids' totes. Check the label says TSCA Title VI / CARB2 (low formaldehyde)." },
  padauk: { n: "Padauk / rosewoods (exotic)", dens: 47, janka: 1970, price: 14, kid: 0, acid: "medium", note: "Striking colour, but many exotics (padauk, cocobolo, rosewoods, wenge) are skin and lung sensitizers. Not for things kids handle daily." }
};
const FINISHES = {
  wbpoly: { n: "Water-based polyurethane / acrylic", kid: 1, curio: 1, cure: "2–3 weeks", note: "Low smell, clear, good barrier. Best choice inside curio boxes. Let it cure fully before closing anything in." },
  shellac: { n: "Dewaxed shellac", kid: 1, curio: 1, cure: "about 1 week", note: "Food-safe once dry (used on candy). Quick, repairable, warm look. Softens with alcohol and heat." },
  hardwax: { n: "Hardwax oil (EN 71-3 labelled)", kid: 1, curio: 0, cure: "2–3 weeks", note: "Natural feel, easy spot repair. Pick one labelled toy-safe (EN 71-3). Oils keep giving off vapour a long time: not inside curio boxes." },
  tung: { n: "Pure tung oil", kid: 1, curio: 0, cure: "3–4 weeks", note: "Safe when cured; slow. Oily rags can catch fire on their own: lay flat to dry or soak in water." },
  mineral: { n: "Mineral oil + beeswax", kid: 1, curio: 0, cure: "none", note: "Toddler-safe and easy, but little protection. Re-apply yearly. Fine for toy totes and blocks." },
  milk: { n: "Milk paint + clear coat", kid: 1, curio: 0, cure: "1–2 weeks", note: "Low-VOC colour with an old-fashioned look. Seal it with water-based poly or wax." },
  toypaint: { n: "Toy-safe acrylic paint", kid: 1, curio: 0, cure: "1–2 weeks", note: "Look for a label saying it meets ASTM F963 or EN 71-3 (heavy-metal limits). Paint on children's products in the US must be under 90 ppm lead." },
  oilpoly: { n: "Oil-based polyurethane", kid: 1, curio: 0, cure: "about 30 days", note: "Very tough. Safe once fully cured, but off-gasses for weeks: never inside a closed curio box." },
  blo: { n: "Boiled linseed oil", kid: 0, curio: 0, cure: "weeks to months", note: "Has metal driers; slow and stays soft. Rag fire risk. Choose something else for kids' things." },
  none: { n: "No finish", kid: 1, curio: 0, cure: "–", note: "Bare wood gets grimy and isn't sealed; curio woods must be sealed." }
};
const JOINTS = {
  butt: { n: "Butt joints, glue + screws", lvl: 1, note: "Fastest. Plug the screw holes with wood plugs for a finished look." },
  rabbet: { n: "Rabbets, glue + pins", lvl: 2, note: "Strong and simple on a table saw or router." },
  box: { n: "Box (finger) joints", lvl: 3, note: "Strong, decorative; a jig on the table saw or router table." },
  miter: { n: "Mitres with splines", lvl: 3, note: "Grain wraps around the corners; splines add strength and a contrast accent." },
  dovetail: { n: "Dovetails", lvl: 4, note: "The heirloom joint. Hand-cut dovetails are a maker's signature." }
};
const LIDS = { none: "No lid (open)", hinged: "Hinged lid", liftoff: "Lift-off lid", sliding: "Sliding lid", glassdoor: "Glazed door" };
const STAYS = { torsion: "Torsion hinges (hold at any angle)", support: "Soft-down lid supports", chain: "Lid stay / chain (stops at full open only)", none: "None" };
const AGES = { u3: "Under 3", a3: "3–5", a6: "6–8", a9: "9–12", teen: "13+", adult: "Adult keepsake" };
const GLAZE = { uvacrylic: "UV-filtering acrylic", acrylic: "Plain acrylic", glass: "Glass", uvglass: "UV-filtering glass" };

const TYPES = {
  toychest: { n: "Toy chest", ic: "🧸", blurb: "Lidded chest a child can open. Lid support, vents, no latch.",
    d: { W: 34, D: 17, H: 20, t: 0.75, bt: 0.5, wood: "maple", joint: "rabbet", lid: "hinged", stay: "torsion", feet: 1, handholes: 1, vent: 1, dividers: 0, tray: 0, trayH: 4, casters: 0, lock: 0, plate: 1, secret: 0, finish: "wbpoly", kids: 1, age: "a3" } },
  toybin: { n: "Open toy box / crate", ic: "📦", blurb: "No lid at all: the safest toy storage for toddlers.",
    d: { W: 24, D: 14, H: 12, t: 0.75, bt: 0.5, wood: "maple", joint: "box", lid: "none", stay: "none", feet: 0, handholes: 1, vent: 0, dividers: 0, tray: 0, casters: 0, lock: 0, plate: 1, secret: 0, finish: "hardwax", kids: 1, age: "u3" } },
  rollbox: { n: "Rolling under-bed box", ic: "🛏️", blurb: "Low open box on locking casters; slides under a bed.",
    d: { W: 30, D: 20, H: 7, t: 0.75, bt: 0.5, wood: "birchply", joint: "rabbet", lid: "none", stay: "none", feet: 0, handholes: 1, vent: 0, dividers: 1, tray: 0, casters: 1, lock: 0, plate: 0, secret: 0, finish: "wbpoly", kids: 1, age: "a3" } },
  curio: { n: "Curio / shadow box", ic: "🏺", blurb: "Wall cabinet with shelves and a glazed door for treasures.",
    d: { W: 16, D: 5, H: 24, t: 0.75, bt: 0.25, wood: "cherry", joint: "dovetail", lid: "glassdoor", stay: "none", shelves: 3, glaze: "uvacrylic", feet: 0, handholes: 0, vent: 0, dividers: 0, casters: 0, lock: 0, plate: 1, secret: 0, finish: "wbpoly", kids: 0, age: "adult" } },
  keepsake: { n: "Keepsake / specimen box", ic: "💎", blurb: "Lidded box with a grid of compartments for small treasures.",
    d: { W: 12, D: 9, H: 4.5, t: 0.5, bt: 0.25, wood: "walnut", joint: "miter", lid: "hinged", stay: "chain", rows: 2, cols: 3, feet: 0, handholes: 0, vent: 0, dividers: 0, tray: 0, casters: 0, lock: 0, plate: 1, secret: 1, finish: "shellac", kids: 0, age: "adult" } },
  tote: { n: "Kids' tool tote", ic: "🧰", blurb: "Open carry box with a dowel handle: the first toolbox.",
    d: { W: 16, D: 7, H: 5, t: 0.5, bt: 0.25, wood: "pine", joint: "butt", lid: "none", stay: "none", endH: 10, dowel: 0.875, feet: 0, handholes: 0, vent: 0, dividers: 0, casters: 0, lock: 0, plate: 1, secret: 0, finish: "mineral", kids: 1, age: "a6" } },
  kidchest: { n: "Kids' tool chest", ic: "🛠", blurb: "Small lidded chest with a lift-out tray that grows with them.",
    d: { W: 18, D: 8, H: 9, t: 0.5, bt: 0.25, wood: "ash", joint: "box", lid: "hinged", stay: "torsion", feet: 0, handholes: 1, vent: 1, dividers: 0, tray: 1, trayH: 2.5, casters: 0, lock: 0, plate: 1, secret: 0, finish: "hardwax", kids: 1, age: "a9" } }
};

// Rough US hardware prices; good enough for an estimate.
const HW = {
  torsion: ["Torsion lid hinges, pair (match the rating to the lid)", 45], support: ["Soft-down lid support", 15], chain: ["Brass lid stay", 9],
  piano: ["Continuous (piano) hinge", 16], butt: ["Brass butt hinges, pair", 14], knife: ["Knife hinges, pair (for the door)", 18],
  caster: ["Low-profile caster", 6], plate: ["Engraved brass name plate", 18], hasp: ["Hasp / lock", 12], catch: ["Magnetic catch", 4], knob: ["Small knob", 6],
  bumper: ["Lid bumpers (hold a vent gap)", 4], screws: ["Screws, pins, glue, sandpaper", 14], cleat: ["Wall anchors / screws for cleat", 6], felt: ["Polyester felt or Volara foam liner", 12]
};

// ============================================================ state
const LKEY = "udsHeirBoxes1";
const blankDesign = type => Object.assign({ id: uid(), type, title: TYPES[type].n, shelves: 0, rows: 1, cols: 1, endH: 10, dowel: 0.875, trayH: 2.5, glaze: "uvacrylic", priceBf: "" }, JSON.parse(JSON.stringify(TYPES[type].d)));
let S = { theme: "dark", units: "in", cur: blankDesign("toychest"), designs: [], items: [], ideas: null, prices: {}, kitsHave: {} };
try { const v = JSON.parse(localStorage.getItem(LKEY) || "null"); if (v) S = Object.assign(S, v); } catch (e) {}
const save = () => { try { localStorage.setItem(LKEY, JSON.stringify(S)); } catch (e) { toast("Couldn't save (storage full? remove some photos)."); } };
const woodPrice = k => (S.prices[k] != null && S.prices[k] !== "" ? +S.prices[k] : WOODS[k].price);

// ============================================================ measuring helpers
function frac(x) {
  if (S.units === "mm") return Math.round(x * 25.4) + " mm";
  const neg = x < 0; x = Math.abs(x);
  let w = Math.floor(x), n = Math.round((x - w) * 16);
  if (n === 16) { w++; n = 0; }
  let d = 16; while (n && n % 2 === 0) { n /= 2; d /= 2; }
  return (neg ? "-" : "") + (n ? (w ? w + " " : "") + n + "/" + d : w) + '"';
}
const r2 = x => Math.round(x * 100) / 100;

// ============================================================ the design engine
function calc(d) {
  const P = [], H = [], notes = [];
  const t = +d.t, bt = +d.bt, W = +d.W, D = +d.D, Ht = +d.H;
  const solid = WOODS[d.wood] && WOODS[d.wood].ply ? "ply" : "solid";
  const add = (name, qty, L, Wd, T, mat, note) => { if (qty > 0 && L > 0 && Wd > 0) P.push({ name, qty, L, W: Wd, T, mat: mat || solid, note: note || "" }); };
  const hw = (k, qty, label) => { if (qty > 0) H.push({ k, n: label || HW[k][0], qty, cost: HW[k][1] * qty }); };
  let Hc = Ht, lidT = 0, lidW = 0, lidD = 0, baseH = 0, inside = { w: 0, d: 0, h: 0 };

  if (d.type === "curio") {
    add("Sides", 2, Ht, D, t);
    add("Top & bottom (in ¼\" dados)", 2, W - 2 * t + 0.5, D, t);
    const n = +d.shelves || 0;
    const shD = D - 0.375 - (d.lid === "glassdoor" ? 0.875 : 0.125);
    add("Shelves (in stopped dados)", n, W - 2 * t + 0.5, shD, 0.5);
    add("Back panel (in ⅜\" rabbet)", 1, H_back(Ht, t), W - 2 * t + 0.75, 0.25, "ply");
    if (d.lid === "glassdoor") {
      const Wo = W - 2 * t, Ho = Ht - 2 * t;
      add("Door stiles", 2, Ho - 0.0625, 1.5, 0.75);
      add("Door rails (incl. ½\" tenons)", 2, Wo - 0.0625 - 3 + 1, 1.5, 0.75);
      add("Glazing", 1, Ho - 3 + 0.75 - 0.0625, Wo - 3 + 0.75 - 0.0625, 0.125, "glaze", GLAZE[d.glaze]);
      add("Glazing strips", 4, Ho - 3, 0.375, 0.25, solid, "two long, two cut to fit");
      hw("knife", 1); hw("catch", 1); hw("knob", 1);
      if (d.lock) hw("hasp", 1, "Small cabinet lock");
    }
    add("French cleat (bevel 45° lengthwise, one on box one on wall)", 2, W - 2 * t, 2.5, 0.75);
    hw("cleat", 1);
    inside = { w: W - 2 * t, d: D - 0.375, h: Ht - 2 * t };
    if (d.plate) hw("plate", 1);
    hw("screws", 1); hw("felt", 1, "Archival liner: Volara foam / polyester felt for shelf tops");
  } else if (d.type === "tote") {
    const eH = Math.max(+d.endH || Ht, Ht);
    add("Sides (full length)", 2, W, Ht, t);
    add("Ends (taper the top, bore for handle)", 2, eH, D - 2 * t, t);
    add("Bottom (between ends & sides)", 1, W - 2 * t, D - 2 * t, bt, "ply");
    add("Handle dowel", 1, W, +d.dowel, +d.dowel, "dowel", "through both ends, pinned");
    add("Cross dividers", +d.dividers || 0, D - 2 * t, Ht - bt - 0.75, 0.375);
    inside = { w: W - 2 * t, d: D - 2 * t, h: Ht - bt };
    if (d.plate) hw("plate", 1, "Name plate or branded initials on one end");
    hw("screws", 1);
  } else {
    // generic box carcass: toychest, toybin, rollbox, keepsake, kidchest
    if (d.lid === "hinged" || d.lid === "liftoff") lidT = d.type === "keepsake" ? Math.max(0.375, t) : t;
    if (d.feet) baseH = d.type === "toychest" ? 3 : 1.5;
    const casterH = d.casters ? 2 : 0;
    Hc = Ht - lidT - baseH - casterH;
    const sideL = d.joint === "butt" ? D - 2 * t : d.joint === "rabbet" ? D - t : D;
    add("Front & back", 2, W, Hc, t);
    add("Sides / ends" + (d.handholes ? " (1×4\" hand holes)" : ""), 2, sideL, Hc, t);
    add("Bottom (in ¼\" groove, ¼\" up)", 1, W - 2 * t + 0.5 - 0.0625, D - 2 * t + 0.5 - 0.0625, bt, bt <= 0.5 ? "ply" : solid);
    inside = { w: W - 2 * t, d: D - 2 * t, h: Hc - bt - 0.25 };
    if (d.lid === "hinged") {

    if (d.vent && d.lid !== "none") for (const zz of [D / 2 - 1.5, D / 2 + 1.5]) { const [cx, cy] = P3(W + 0.02, top - 2, zz); lines.push(`<circle cx="${cx}" cy="${cy}" r="0.4" fill="#000" opacity=".6"/>`); }
    if (d.type === "tote") {
      poly([[W - t, y0, D - t], [W, y0, D - t], [W, y0 + eH * 0.75, D - t], [W - t, y0 + eH * 0.75, D - t]], WF[0]);
      poly([[W, y0, t], [W, y0, D - t], [W, y0 + eH * 0.75, D - t], [W, y0 + eH, D / 2 + 1.25], [W, y0 + eH, D / 2 - 1.25], [W, y0 + eH * 0.75, t]], WF[1]);
      const a = P3(t, y0 + eH - 1.25, D / 2), b = P3(W, y0 + eH - 1.25, D / 2);
      lines.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--wood1)" stroke-width="${+d.dowel * 0.9}" stroke-linecap="round"/>`);
      lines.push(`<circle cx="${b[0]}" cy="${b[1]}" r="${+d.dowel / 2}" fill="var(--wood3)"/>`);
    }
  }

  const fs = Math.max(W, D, H) / 13;
  const lab = (x, y, z, txt, anchor) => { const [a, b] = P3(x, y, z); labels.push(`<text x="${a}" y="${b}" font-size="${fs}" fill="var(--acc)" text-anchor="${anchor || "middle"}" font-family="Segoe UI">${esc(txt)}</text>`); };
  lab(W / 2, -fs * 1.8, D + fs * 0.5, "W " + frac(W));
  lab(W + fs * 0.6, -fs * 1.4, D / 2, "D " + frac(D), "start");
  lab(-fs * 1.6, H / 2, D, "H " + frac(H), "end");
  const all = polys.flatMap(p => p.pts);
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0])), y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  const m = Math.max(x1 - x0, y1 - y0) * 0.16;
  x0 -= m * 1.4; x1 += m * 1.2; y0 -= m * 0.6; y1 += m;
  return `<svg class="iso" viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" preserveAspectRatio="xMidYMid meet">${polys.map(p => `<polygon points="${p.pts.map(q => q[0].toFixed(2) + "," + q[1].toFixed(2)).join(" ")}" fill="${p.fill}" fill-opacity="${p.op}" stroke="#1a1209" stroke-opacity=".55" stroke-width="${Math.max(W, D, H) / 320}" stroke-linejoin="round"/>`).join("")}${lines.join("")}${labels.join("")}</svg>`;
}

V.safety = () => `<h2>⚠️ Safety & selling</h2>
<div class="grid3">
 <div class="card"><h3>Lidded chests (the big one)</h3><ul>
  <li>Toy-chest lids falling on children's heads and necks have caused deaths and brain injuries. A lid must stay open at <b>any</b> position and not slam.</li>
  <li>Use torsion hinges or spring/gas lid supports rated for the lid: <b>torque (in-lb) = lid weight (lb) × front-to-back depth (in) ÷ 2</b>. The Designer does this sum.</li>
  <li>Ventilation in case a child climbs in: vent holes and/or bumpers keeping a gap under the closed lid.</li>
  <li>No latches or locks that can trap a child; the lid must open easily from inside.</li>
  <li>Old chests (including heirlooms you're passing down) often lack these: retrofit a lid support before a child uses one, or remove the lid.</li></ul></div>
 <div class="card"><h3>Everything for kids</h3><ul>
  <li>Round every edge; no splinters, sharp points, protruding screws or nails.</li>
  <li>Finger traps: avoid holes and gaps that can trap a finger (roughly 5–12 mm / ⅕–½") at hinges and moving parts.</li>
  <li>Under 3: nothing that comes off may fit in a small-parts tester (1¼" wide cylinder). Screw on knobs, plates and bumpers.</li>

 <div class="card"><h3>Kids' toolboxes</h3><ul>

  <li>Teach "two hands on the tool, or one hand on the tool and the work clamped".</li>
  <li>Store chisels and saws guarded (blade covers, a saw till slot) so a hand reaching into the box can't hit an edge.</li>

 <p class="mut">Not legal advice; check cpsc.gov (US) or your country's regulator before selling. These are the usual starting points:</p><ul>
  <li><b>US, children's products (for 12 and under):</b> the CPSIA applies. Toy chests fall under the US toy safety standard (ASTM F963, made mandatory by the CPSC), which includes toy-chest lid and ventilation rules. You need a Children's Product Certificate based on third-party testing at a CPSC-accepted lab, permanent tracking labels (maker, date, batch) on the product and packaging, and lead/paint limits met.</li>

function markSVG(m) {
  const motifs = {
    tree: `<path d="M100 66 l-14 20 h8 l-12 16 h10 l-12 16 h40 l-12-16 h10 l-12-16 h8z" fill="#2a1d10"/><rect x="96" y="118" width="8" height="10" fill="#2a1d10"/>`,
    hammer: `<rect x="96" y="80" width="8" height="48" rx="2" fill="#2a1d10"/><path d="M80 72 h40 v12 h-40z M80 72 q-8 6 0 12" fill="#2a1d10"/>`,
    heart: `<path d="M100 124 C70 104 74 78 90 78 c6 0 10 4 10 10 c0-6 4-10 10-10 c16 0 20 26 -10 46z" fill="#2a1d10"/>`,
    star: `<path d="M100 70 l9 19 21 3 -15 15 4 21 -19-10 -19 10 4-21 -15-15 21-3z" fill="#2a1d10"/>`,
    acorn: `<path d="M84 90 q16-16 32 0 z" fill="#2a1d10"/><path d="M86 92 h28 q0 30 -14 36 q-14-6 -14-36z" fill="#2a1d10"/><rect x="98" y="76" width="4" height="8" fill="#2a1d10"/>`,
    none: ""
  };
  const sh = m.shape === "shield" ? `<path d="M30 30 h140 v70 q0 60 -70 80 q-70 -20 -70 -80z" fill="none" stroke="#2a1d10" stroke-width="5"/>` : m.shape === "rect" ? `<rect x="14" y="40" width="172" height="120" rx="12" fill="none" stroke="#2a1d10" stroke-width="5"/>` : `<circle cx="100" cy="100" r="88" fill="none" stroke="#2a1d10" stroke-width="5"/><circle cx="100" cy="100" r="66" fill="none" stroke="#2a1d10" stroke-width="2"/>`;
  const ring = m.shape === "circle" ? `<defs><path id="rp" d="M100 100 m-77 0 a77 77 0 1 1 154 0 a77 77 0 1 1 -154 0"/></defs><text font-family="Georgia" font-size="13" letter-spacing="2" fill="#2a1d10"><textPath href="#rp" startOffset="50%" text-anchor="middle">${esc(m.ring.toUpperCase())}</textPath></text>` : `<text x="100" y="${m.shape === "rect" ? 60 : 52}" text-anchor="middle" font-family="Georgia" font-size="11" letter-spacing="1.5" fill="#2a1d10">${esc(m.ring.toUpperCase())}</text>`;
  const hasMotif = m.motif !== "none";
  const body = `${sh}${ring}${hasMotif ? motifs[m.motif].replace(/(\d+(\.\d+)?)/g, n => n) : ""}<text x="100" y="${hasMotif ? 150 : 112}" text-anchor="middle" font-family="Georgia" font-weight="700" font-size="${hasMotif ? 24 : 40}" fill="#2a1d10">${esc(m.ini)}</text><text x="100" y="${hasMotif ? 166 : 136}" text-anchor="middle" font-family="Georgia" font-size="12" fill="#2a1d10">${esc(m.year)}</text>`;
  const g = hasMotif ? `<g transform="translate(0,-8)">${body}</g>` : body;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">${m.mirror ? `<g transform="translate(200,0) scale(-1,1)">${g}</g>` : g}</svg>`;
}

  else if (a === "saveDesign") { const i = S.designs.findIndex(x => x.id === d.id); const copy = JSON.parse(JSON.stringify(d)); if (i >= 0) S.designs[i] = copy; else S.designs.unshift(copy); save(); render(); toast("Design saved."); }
  else if (a === "load") { const x = S.designs.find(x => x.id === b.dataset.id); if (x) { S.cur = JSON.parse(JSON.stringify(x)); save(); render(); } }
  else if (a === "delDesign") { if (confirm("Delete this saved design?")) { S.designs = S.designs.filter(x => x.id !== b.dataset.id); save(); render(); } }
  else if (a === "toRegister") { const c = calc(d); newItem({ name: d.title, type: d.type, wood: WOODS[d.wood].n, finish: FINISHES[d.finish].n, size: `${frac(+d.W)} × ${frac(+d.D)} × ${frac(+d.H)}`, design: JSON.parse(JSON.stringify(d)), care: careText({ design: d }) }); go("register"); toast("Added to the register."); }
  else if (a === "plan") planOut();
  else if (a === "mkSave") exportFile(`makers-mark-${mk.ini || "mark"}.svg`, markSVG(mk), "image/svg+xml");
  else if (a === "letterSave") exportFile("letter-to-the-next-keeper.txt", $("#letter").value, "text/plain");
  else if (a === "regSel") { regSel = b.dataset.id; render(); }
  else if (a === "regNew") { newItem(); render(); }
  else if (a === "regDel") { const it = S.items.find(x => x.id === regSel); if (it && confirm(`Delete "${it.name || "Untitled"}" from the register?`)) { S.items = S.items.filter(x => x !== it); regSel = null; save(); render(); } }
  else if (a === "keepAdd") { const it = S.items.find(x => x.id === regSel); it.keepers = it.keepers || []; it.keepers.push({ name: "", from: "", to: "", note: "" }); save(); render(); }
  else if (a === "keepDel") { const it = S.items.find(x => x.id === regSel); it.keepers.splice(+b.dataset.i, 1); save(); render(); }
  else if (a === "photoDel") { const it = S.items.find(x => x.id === regSel); it.photos.splice(+b.dataset.i, 1); save(); render(); }
  else if (a === "regCert") { const it = S.items.find(x => x.id === regSel); exportFile(`${(it.name || "heirloom").replace(/[^\w\- ]+/g, "")} - provenance.html`, certHTML(it), "text/html"); toast("Open the saved card in a browser and print it."); }
  else if (a === "regOpenDesign") { const it = S.items.find(x => x.id === regSel); S.cur = JSON.parse(JSON.stringify(it.design)); save(); go("design"); }
  else if (a === "regExportHeritage") {
    const out = S.items.map(it => ({ id: "hb_" + it.id, name: it.name, origin: [it.date, it.place, it.maker ? "made by " + it.maker : "", it.wood ? it.wood + (it.woodSource ? " (" + it.woodSource + ")" : "") : ""].filter(Boolean).join(", "), keeper: (it.keepers || []).length ? it.keepers[it.keepers.length - 1].name : it.forWho, chain: [it.maker, ...(it.keepers || []).map(k => k.name)].filter(Boolean).join(" → "), wish: it.wish, text: it.story, photo: (it.photos || [])[0] || "", people: [] }));
    exportFile(`heirlooms-${stamp()}.json`, JSON.stringify({ source: "Heirloom Boxes (Randis UDS)", heirlooms: out }, null, 1), "application/json");
  }
  else if (a === "regExportCsv") {
    const cols = ["name", "type", "status", "maker", "forWho", "date", "place", "wood", "woodSource", "finish", "size", "story", "wish"];
    const q = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    exportFile(`heirloom-register-${stamp()}.csv`, [cols.concat("keepers").join(","), ...S.items.map(it => cols.map(c => q(it[c])).concat(q((it.keepers || []).map(k => `${k.name} ${k.from}-${k.to}`).join("; "))).join(","))].join("\r\n"), "text/csv");
  }
  else if (a === "ideaNew") { S.ideas.unshift({ id: uid(), name: "New idea", desc: "", s: { appeal: 3, heirloom: 3, build: 3, value: 3, cost: 3 }, status: "idea", notes: "" }); save(); render(); }
  else if (a === "ideaDel") { if (confirm("Delete this idea?")) { S.ideas = S.ideas.filter(x => x.id !== b.dataset.id); save(); render(); } }
  else if (a === "ideaReset") { const have = new Set(S.ideas.map(i => i.name)); SEED_IDEAS.forEach(i => { if (!have.has(i.name)) S.ideas.push(i); }); save(); render(); }
  else if (a === "backup") exportFile(`heirloom-boxes-backup-${stamp()}.json`, JSON.stringify(S), "application/json");
});
document.addEventListener("input", e => {
  const el = e.target, d = S.cur;
  if (el.dataset.f) {
    const k = el.dataset.f;
    d[k] = el.type === "checkbox" ? (el.checked ? 1 : 0) : el.type === "number" ? (el.value === "" ? 0 : +el.value) : el.value;
    if (k === "lid" && d.type === "curio" && d.lid === "glassdoor" && !d.glaze) d.glaze = "uvacrylic";
    save();
    if (el.type === "text" || el.tagName === "INPUT" && el.type !== "checkbox") { clearTimeout(render.h); render.h = setTimeout(() => { const id = el.dataset.f; render(); const n = document.querySelector(`[data-f="${id}"]`); if (n) { n.focus(); try { const L = n.value.length; n.setSelectionRange && n.type === "text" && n.setSelectionRange(L, L); } catch (_) {} } }, 450); }
    else render();
  } else if (el.dataset.price) { S.prices[el.dataset.price] = el.value; save(); }
  else if (el.dataset.kit) { S.kitsHave[el.dataset.kit] = el.checked; save(); }
  else if (el.dataset.mk) { mk[el.dataset.mk] = el.type === "checkbox" ? el.checked : el.value; $("#mkOut").innerHTML = markSVG(mk); }
  else if (el.dataset.r) { const it = S.items.find(x => x.id === regSel); if (it) { it[el.dataset.r] = el.value; save(); if (el.tagName === "SELECT") render(); } }
  else if (el.dataset.k) { const it = S.items.find(x => x.id === regSel); const [i, f] = el.dataset.k.split("."); it.keepers[+i][f] = el.value; save(); }
  else if (el.dataset.idea) { const [id, ...path] = el.dataset.idea.split("."); const i = S.ideas.find(x => x.id === id); if (!i) return; if (path[0] === "s") i.s[path[1]] = Math.max(1, Math.min(5, +el.value || 1)); else i[path[0]] = el.value; save(); if (path[0] === "s" || path[0] === "status") { clearTimeout(render.i); render.i = setTimeout(render, 900); } }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "photoIn" && el.files[0]) {
    const it = S.items.find(x => x.id === regSel), fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 900 / Math.max(img.width, img.height)), cv = document.createElement("canvas"); cv.width = img.width * s; cv.height = img.height * s; cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); it.photos = it.photos || []; it.photos.push(cv.toDataURL("image/jpeg", 0.8)); save(); render(); }; img.src = fr.result; };
    fr.readAsDataURL(el.files[0]);
  }
  if (el.id === "restoreIn" && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { try { const v = JSON.parse(fr.result); if (!v || !Array.isArray(v.items)) throw 0; if (!confirm("Replace everything here with this backup?")) return; S = Object.assign(S, v); save(); render(); toast("Restored."); } catch (_) { toast("That isn't a Heirloom Boxes backup."); } };
    fr.readAsText(el.files[0]);
  }
});
$("#themeBtn").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; save(); render(); };

function planOut() {
  const d = S.cur, c = calc(d), sf = safety(d, c);
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(d.title)} plan</title><!-- Randis UDS™ by Randy Moore. Original: https://github.com/RandyWilliamMoore/randis-uds · Support: https://ko-fi.com/moorescombinatoricsmatrix --><style>:root{--bg3:#f4efe6;--wood1:#d9a36a;--wood2:#b57a42;--wood3:#8a5a2c;--in:#6b4a2a;--acc:#7a5212}body{font:13px/1.45 "Segoe UI",sans-serif;max-width:900px;margin:20px auto;color:#222}h1,h2{font-family:Georgia,serif}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:3px 6px;text-align:left}svg{width:100%;max-height:360px;background:#f4efe6}.bad{color:#b33}.warn{color:#a66b00}.ok{color:#2a7a3a}</style></head><body>
<h1>${esc(d.title)}</h1><p>${TYPES[d.type].n} · ${frac(+d.W)} W × ${frac(+d.D)} D × ${frac(+d.H)} H · ${WOODS[d.wood].n} · ${JOINTS[d.joint].n} · ${FINISHES[d.finish].n} · est. $${Math.round(c.cost.total)}, ${Math.ceil(c.bf)} bf, ${r2(c.weight)} lb</p>${isoSVG(d, c)}
<h2>Cut list</h2><table><tr><th>Part</th><th>Qty</th><th>L</th><th>W</th><th>T</th></tr>${c.P.map(p => `<tr><td>${esc(p.name)}</td><td>${p.qty}</td><td>${frac(p.L)}</td><td>${frac(p.W)}</td><td>${p.mat === "dowel" ? "dowel" : frac(p.T)}</td></tr>`).join("")}</table>
<h2>Hardware</h2><ul>${c.H.map(h => `<li>${h.qty} × ${esc(h.n)}</li>`).join("")}</ul>
<h2>Safety</h2><ul>${sf.map(([l, t]) => `<li class="${l}">${t}</li>`).join("")}</ul>
<h2>Steps</h2><ol>${steps(d, c).map(s => `<li>${s}</li>`).join("")}</ol><p style="color:#888;font-size:11px">Heirloom Boxes · Randis UDS™ by Randy Moore</p></body></html>`;
  exportFile(`${d.title.replace(/[^\w\- ]+/g, "") || "plan"} - plan.html`, html, "text/html");
  toast("Open the saved plan in a browser to print it.");
}

render();
</script>
</body>
