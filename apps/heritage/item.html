<style>

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}

h2{font-size:21px;margin:0 0 12px}
h3{font-size:15px;margin:2px 0 10px;color:var(--acc)}
h4{margin:12px 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:5px 8px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
textarea{width:100%;resize:vertical;min-height:70px;line-height:1.5}
button{cursor:pointer;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:5px 10px;white-space:nowrap}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#1a1408;border-color:var(--acc);font-weight:600}
button.sm{padding:2px 7px;font-size:12px}
button.ghost{background:none;border-color:transparent}
button.ghost:hover{border-color:var(--line)}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
button[data-armed]{border-color:var(--bad);color:var(--bad)}
header{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap;position:relative;z-index:5}
.brand{font:700 19px Georgia,serif;color:var(--acc);white-space:nowrap}
.tag{color:var(--mut);font:italic 12px Georgia,serif}
#gsearch{width:230px}
#gres{position:absolute;top:44px;left:220px;width:340px;max-height:360px;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0006;display:none}

#gres div{padding:6px 10px;cursor:pointer}#gres div:hover{background:var(--bg3)}
.sp{flex:1}
#saved{color:var(--mut);font-size:12px;white-space:nowrap}
#wrap{flex:1;display:flex;min-height:0}

.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}.small{font-size:12px}.nowrap{white-space:nowrap}

.hbar{display:grid;grid-template-columns:150px 1fr 50px;gap:8px;align-items:center;margin:3px 0;font-size:13px}

.nd{cursor:pointer}
.nd rect.bx,.nd circle{fill:var(--card);stroke:var(--line);stroke-width:1.3}

#addr{flex:1;min-width:200px}
.site{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;margin:3px 0;cursor:pointer;background:var(--bg2)}

.iss{padding:3px 0}
.list .it{padding:7px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent}

.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.report{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 30px;font-family:Georgia,serif;line-height:1.65;max-width:900px}

.report ol.kids{list-style:lower-roman}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}

.gallery img{width:100%;height:150px;object-fit:cover;display:block}
.gallery figcaption{padding:6px 8px;font-size:12px}
.hero{max-width:760px;margin:30px auto;text-align:center}

.hero p{color:var(--mut);font-size:15px}
.hero .row{justify-content:center;margin-top:18px}
.hero button{padding:9px 16px;font-size:15px}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:30px;text-align:left}
.feat div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.feat b{display:block;color:var(--acc);font-family:Georgia,serif}
.kbd{font:12px Consolas,monospace;background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.out{margin-top:8px;font-size:13px}
.out .big{font:700 20px Georgia,serif;color:var(--acc)}
.tools label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);margin-bottom:6px}
.tools label input,.tools label select{color:var(--tx);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gl{max-height:300px;overflow:auto}
.gl div{padding:3px 0;border-bottom:1px dashed var(--line)}
.ethbar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:8px 0}
.ethbar i{display:block;height:100%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid var(--acc);color:var(--tx);padding:8px 16px;border-radius:9px;box-shadow:0 8px 30px #0008;transition:transform .2s;z-index:99;max-width:80%}
#toast.on{transform:translateX(-50%) translateY(0)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.mapsvg{width:100%;height:auto;background:var(--bg2);border-radius:8px;border:1px solid var(--line)}
.mapsvg text{font-family:"Segoe UI",sans-serif}
.empty-note{padding:40px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<header>
  <span class="brand">🌳 Heritage</span><span class="tag">ancestry · lineage · legacy</span>
  <input id="gsearch" placeholder="Find a person…   ( / )" autocomplete="off">
  <div id="gres"></div>
  <button data-act="newPerson" title="Add a person who isn't linked to anyone yet">＋ Person</button>
  <span class="sp"></span>
  <span id="webst" class="pill" title="This tab's Web view switch (above the page in Randis UDS) lets the Research Browser show websites."></span>
  <button class="ghost" data-act="undo" title="Undo (Ctrl+Z)">↶</button>
  <button class="ghost" data-act="redo" title="Redo (Ctrl+Y)">↷</button>
  <button class="ghost" data-act="theme" title="Light / dark">◐</button>
  <span id="saved"></span>
</header>
<div id="wrap"><nav id="side"></nav><main id="view"></main></div>
<div id="toast"></div>
<input type="file" id="fileIn" hidden>
<input type="file" id="photoIn" accept="image/*" hidden>
<datalist id="placeList"></datalist>
<script>

  s = String(s || "").trim(); const o = { y: null, m: null, d: null, q: "", raw: s }; if (!s) return o; const l = s.toLowerCase();

function fmtDate(s) { const d = pd(s); if (d.y && d.m && d.d && !d.q) return `${d.d} ${MONTHN[d.m - 1]} ${d.y}`; return s; }

function spansChart() {
  const ids = new Set([...ahnen(S.focus, 6).values()]); for (const [id] of descendants(S.focus, 3)) ids.add(id);

  const W = 1000, L = 210, RH = 24, H = rows.length * RH + 40, x = y => L + (y - y0) / (y1 - y0) * (W - L - 10);
  let s = ""; for (let y = y0; y <= y1; y += (y1 - y0 > 200 ? 25 : 10)) s += `<line x1="${x(y)}" x2="${x(y)}" y1="20" y2="${H}" stroke="var(--line)"/><text x="${x(y)}" y="14" text-anchor="middle" font-size="11" fill="var(--mut)">${y}</text>`;
  for (const [h0, h1, t] of HIST) if (h1 && h1 - h0 <= 12 && h0 >= y0 && h1 <= y1 && /War|Famine|Depression|pandemic/i.test(t)) s += `<rect x="${x(h0)}" y="20" width="${x(h1) - x(h0)}" height="${H - 20}" fill="var(--bad)" opacity=".08"><title>${esc(t)}</title></rect>`;
  rows.forEach((r, i) => { const yy = 28 + i * RH, end = r.d ?? (r.p.living ? CY : null); const col = r.p.sex === "F" ? "var(--f)" : r.p.sex === "M" ? "var(--m)" : "var(--mut)";
    s += `<g data-act="open" data-id="${r.p.id}" style="cursor:pointer"><text x="${L - 8}" y="${yy + 12}" text-anchor="end" font-size="12" fill="var(--tx)">${esc(trunc(nm(r.p), 30))}</text><rect x="${x(r.b)}" y="${yy + 2}" width="${Math.max(3, x(end ?? r.b + 60) - x(r.b))}" height="14" rx="4" fill="${col}" opacity="${end ? .75 : .3}"${end ? "" : ` stroke="${col}" stroke-dasharray="4 3"`}/><text x="${x(r.b) + 5}" y="${yy + 13}" font-size="10" fill="#fff">${r.b}–${r.d ?? (r.p.living ? "" : "?")}${end && r.d ? ` (${r.d - r.b})` : ""}</text></g>`; });
  return `<div class="card"><h3>Lifespans of ${esc(short(P(S.focus)))}'s ancestors and descendants</h3><div class="small mut">Faded bands mark wars, famines and pandemics. Dashed bars have no death date. Click a bar to open the person.</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${s}</svg></div>`;
}

function peopleAt(place) { const out = new Set(); for (const x of allEvents()) if (x.e.place && x.e.place.trim() === place) { if (x.p) out.add(x.p.id); else { if (x.f.p1) out.add(x.f.p1); if (x.f.p2) out.add(x.f.p2); } } return [...out].filter(P); }
function autoLocate(quiet) { let n = 0; for (const name of placesAll().keys()) { if (S.places[name] && S.places[name].lat != null) continue; const g = geoGuess(name); if (g) { S.places[name] = Object.assign(S.places[name] || {}, { lat: g.lat, lon: g.lon, approx: g.approx }); n++; } } if (!quiet) toast(n ? `Placed ${n} place${n > 1 ? "s" : ""} on the map. Approximate ones sit at the state or country centre; type exact coordinates to refine.` : "No new places could be matched. Type coordinates (from OpenStreetMap) to add them."); return n; }
VIEW.places = () => {

  const W = 1000, H = 520; let svg = "";
  if (pts.size) {
    const cs = [...pts.keys()].map(k => S.places[k]); let la0 = Math.min(...cs.map(c => c.lat)), la1 = Math.max(...cs.map(c => c.lat)), lo0 = Math.min(...cs.map(c => c.lon)), lo1 = Math.max(...cs.map(c => c.lon));
    const padLo = Math.max(4, (lo1 - lo0) * .12), padLa = Math.max(3, (la1 - la0) * .15); lo0 -= padLo; lo1 += padLo; la0 -= padLa; la1 += padLa;
    const sc = Math.min(W / (lo1 - lo0), H / (la1 - la0)); const ox = (W - (lo1 - lo0) * sc) / 2, oy = (H - (la1 - la0) * sc) / 2; const X = lo => ox + (lo - lo0) * sc, Y = la => oy + (la1 - la) * sc;
    const span = Math.max(lo1 - lo0, la1 - la0), step = span > 120 ? 30 : span > 50 ? 10 : span > 20 ? 5 : 2;
    for (let lo = Math.ceil(lo0 / step) * step; lo <= lo1; lo += step) svg += `<line x1="${X(lo)}" x2="${X(lo)}" y1="0" y2="${H}" stroke="var(--line)" stroke-width=".6"/><text x="${X(lo) + 2}" y="${H - 4}" font-size="9" fill="var(--mut)">${lo}°</text>`;
    for (let la = Math.ceil(la0 / step) * step; la <= la1; la += step) svg += `<line y1="${Y(la)}" y2="${Y(la)}" x1="0" x2="${W}" stroke="var(--line)" stroke-width=".6"/><text y="${Y(la) - 2}" x="3" font-size="9" fill="var(--mut)">${la}°</text>`;
    for (const [n, g] of GAZ) if ((g.kind === "country" || (g.kind === "state" && span < 60)) && g.lat > la0 && g.lat < la1 && g.lon > lo0 && g.lon < lo1 && !/^(usa|united states|united states of america|united kingdom)$/.test(n)) svg += `<text x="${X(g.lon)}" y="${Y(g.lat)}" text-anchor="middle" font-size="${g.kind === "country" ? 13 : 10}" fill="var(--mut)" opacity=".45" style="text-transform:uppercase;letter-spacing:.1em">${esc(n)}</text>`;
    svg += `<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--acc)"/></marker></defs>`;
    for (const t of tracks) { const h = hashHue(t.p.id); for (let i = 1; i < t.seq.length; i++) { const a = t.seq[i - 1].c, b = t.seq[i].c; const x1 = X(a.lon), y1 = Y(a.lat), x2 = X(b.lon), y2 = Y(b.lat); const mx = (x1 + x2) / 2 - (y2 - y1) * .18, my = (y1 + y2) / 2 + (x2 - x1) * .18; svg += `<path d="M${x1},${y1}Q${mx},${my} ${x2},${y2}" fill="none" stroke="hsl(${h},60%,60%)" stroke-width="1.6" opacity=".7" marker-end="url(#arw)"><title>${esc(nm(t.p))}: ${esc(t.seq[i - 1].k)} → ${esc(t.seq[i].k)}</title></path>`; } }

// ======================================================================= REPORTS & BOOK
function bio(p, opts = {}) {
  const [He, his] = pron(p); const he = He.toLowerCase(); const b = birthEv(p), d = deathEv(p); const out = []; const nameS = nm(p);
  const pa = parentsOf(p.id).map(P); const fa = pa.find(x => x.sex === "M") || pa[0], mo = pa.find(x => x !== fa);
  if (b) out.push(`${nameS} was ${b.type === "baptism" ? "baptized" : "born"}${datePh(b)}${placePh(b)}${pa.length ? `, the ${kidWord(p)} of ${[fa, mo].filter(Boolean).map(nm).join(" and ")}` : ""}.`);
  else out.push(`${nameS}${pa.length ? `, the ${kidWord(p)} of ${[fa, mo].filter(Boolean).map(nm).join(" and ")},` : ""} is remembered here${p.living ? "" : ", though no record of birth has yet been found"}.`);
  const sibs = siblingsOf(p.id); if (sibs.length && opts.sibs !== false) out.push(`${He} grew up with ${sibs.length} sibling${sibs.length > 1 ? "s" : ""}: ${sibs.map(s => short(P(s))).join(", ")}.`);
  const evs = sortEv(p.events).filter(e => !["birth", "baptism", "death", "burial"].includes(e.type));
  const sent = e => { const dp = datePh(e), pl = placePh(e), ds = e.desc;
    switch (e.type) {
      case "occupation": return ds ? `${dp ? dp.trim().replace(/^\w/, c => c.toUpperCase()) + ", " + he : He} worked as ${/^[aeiou]/i.test(ds) ? "an" : "a"} ${ds.toLowerCase()}${pl}.` : null;
      case "residence": return pl ? `${dp ? dp.trim().replace(/^\w/, c => c.toUpperCase()) + ", " + he : He} lived${pl}${ds ? ` (${ds})` : ""}.` : null;
      case "census": return `${He} appears in the ${pd(e.date).y || ""} census${pl}${ds ? `: ${ds}` : ""}.`;
      case "immigration": return `${He} immigrated${dp}${pl ? " to" + pl.slice(3) : ""}${ds ? `; ${ds.charAt(0).toLowerCase() + ds.slice(1)}` : ""}.`;
      case "emigration": return `${He} emigrated${dp}${pl ? " from" + pl.slice(3) : ""}${ds ? ` (${ds})` : ""}.`;
      case "naturalization": return `${He} became a naturalized citizen${dp}${pl}.`;
      case "military": return `${He} served in the military${dp}${ds ? `: ${ds}` : ""}.`;
      case "education": return `${He} studied${pl}${dp}${ds ? `, earning ${ds}` : ""}.`;
      default: return `${lbl(e.type)}${ds ? ": " + ds : ""}${dp}${pl}.`;
    } };
  for (const f of spouseFams(p.id)) { const sp = spouseOf(f, p.id); const m = evOf(f, "marriage"); const kids = f.kids.filter(P);
    if (sp && P(sp)) out.push(`${He} ${m ? "married" : "partnered with"} ${nm(P(sp))}${life(P(sp)) ? ` (${life(P(sp))})` : ""}${datePh(m)}${placePh(m)}.`);
    if (kids.length) out.push(`${kids.length === 1 ? "They had one child" : `Together they had ${kids.length} children`}: ${kids.map(k => nm(P(k)) + (by(P(k)) ? ` (b. ${by(P(k))})` : "")).join(", ")}.`);
    const dv = evOf(f, "divorce"); if (dv) out.push(`They separated${datePh(dv)}${placePh(dv)}.`); }
  for (const e of evs) { const s = sent(e); if (s) out.push(s); }
  if (d) { const de = evOf(p, "death"), bu = evOf(p, "burial"); const age = de && de.date ? ageAt(p, de.date) : null;
    if (de) out.push(`${He} died${datePh(de)}${placePh(de)}${age != null && age >= 0 ? `, aged about ${age}` : ""}${bu && bu.place ? `, and was laid to rest${placePh(bu)}${bu.desc ? ` (${bu.desc})` : ""}` : ""}.`);
    else if (bu) out.push(`${He} was buried${datePh(bu)}${placePh(bu)}${bu.desc ? ` (${bu.desc})` : ""}.`); }
  return out.join(" ");
}
function srcNotes(p, notes) { const ids = []; for (const e of p.events) for (const c of e.cites || []) { const s = S.sources[c.s]; if (s) { const txt = (s.citation || buildCitation(s)) + (c.page ? ` ${c.page}.` : ""); let i = notes.indexOf(txt); if (i < 0) { notes.push(txt); i = notes.length - 1; } if (!ids.includes(i + 1)) ids.push(i + 1); } } return ids.length ? `<sup>${ids.join(",")}</sup>` : ""; }

const GEN_NAMES = ["", "Parents", "Grandparents", "Great-grandparents"];
const genName = g => g < 4 ? GEN_NAMES[g] : `${g - 2}× great-grandparents`;
function reportAhnen(root, gens, o) {

  for (let g = 0; g < gens; g++) { const ks = [...an.keys()].filter(k => k >= 2 ** g && k < 2 ** (g + 1)).sort((a, b) => a - b); if (!ks.length) continue; h += `<h2>${g === 0 ? "Generation 1" : `Generation ${g + 1}: ${genName(g)}`}</h2>`; for (const k of ks) h += personEntry(P(an.get(k)), k, o, notes); }

}
function reportDesc(root, gens, o) {
  const notes = []; const num = new Map(); let n = 0; const order = []; const q = [[root, 1]]; const seen = new Set();
  while (q.length) { const [id, g] = q.shift(); if (seen.has(id) || g > gens) continue; seen.add(id); num.set(id, ++n); order.push([id, g]); for (const c of childrenOf(id)) if (childrenOf(c).length || spousesOf(c).length) q.push([c, g + 1]); }
  let h = "", lastG = 0;
  for (const [id, g] of order) { if (g !== lastG) { h += `<h2>Generation ${g}</h2>`; lastG = g; } const p = P(id); h += personEntry(p, num.get(id), o, notes);
    const kids = childrenOf(id); if (kids.length && !priv(p, o)) h += `<p style="margin:0 0 4px">Children of ${esc(short(p))}:</p><ol class="kids">${kids.map(k => { const c = P(k); return `<li>${num.has(k) && g < gens ? `<b>+ ${num.get(k)}</b> ` : ""}${priv(c, o) ? "Living " + esc(c.surname || "") : `${esc(nm(c))} ${esc(life(c))}`}</li>`; }).join("")}</ol>`; }
  return h + endnotes(notes, o);
}

const TAGOUT = { birth: "BIRT", baptism: "CHR", death: "DEAT", burial: "BURI", residence: "RESI", census: "CENS", occupation: "OCCU", education: "EDUC", military: "_MILT", immigration: "IMMI", emigration: "EMIG", naturalization: "NATU", religion: "RELI", probate: "PROB", land: "PROP", physical: "DSCR" };
const FTAGOUT = { marriage: "MARR", engagement: "ENGA", banns: "MARB", divorce: "DIV", residence: "RESI" };

}
function toGed() {

function shrinkPhoto(file, cb) { const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => { const M = 220; const k = Math.min(1, M / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL("image/jpeg", .72)); }; img.onerror = () => toast("That image couldn't be read."); img.src = r.result; }; r.readAsDataURL(file); }

// ======================================================================= AI
function ctxPerson(id) {
  const p = P(id); const L = [];
  L.push("You are an expert professional genealogist helping inside a family-history app (Heritage). Give specific, practical research advice: exact record sets, archives, websites, date ranges and what to look for in each record. Respect the Genealogical Proof Standard. Clearly mark guesses and general historical context; never invent facts about real people. When suggesting research steps, put each on its own line starting with '- [ ] '.");
  L.push(`\nPERSON: ${nm(p)} (${p.sex === "M" ? "male" : p.sex === "F" ? "female" : "sex unknown"})${p.aka ? `; also known as ${p.aka}` : ""}${p.living ? "; living" : ""}`);
  for (const e of sortEv(p.events)) L.push(`- ${lbl(e.type)}: ${[e.date, e.place, e.desc].filter(Boolean).join(", ")}${(e.cites || []).length ? ` [sources: ${e.cites.map(c => (S.sources[c.s] || {}).title).filter(Boolean).join("; ")}]` : " [unsourced]"}`);
  const pa = parentsOf(id); L.push(`Parents: ${pa.length ? pa.map(x => `${nm(P(x))} (${life(P(x))}${(birthEv(P(x)) || {}).place ? ", b. " + birthEv(P(x)).place : ""})`).join("; ") : "unknown"}`);
  for (const f of spouseFams(id)) { const sp = spouseOf(f, id); const m = evOf(f, "marriage"); L.push(`Partner: ${sp && P(sp) ? nm(P(sp)) + " (" + life(P(sp)) + ")" : "unknown"}${m ? `; married ${[m.date, m.place].filter(Boolean).join(", ")}` : ""}; children: ${f.kids.filter(P).map(k => `${nm(P(k))} (${life(P(k))})`).join("; ") || "none recorded"}`); }
  const sib = siblingsOf(id); if (sib.length) L.push(`Siblings: ${sib.map(s => `${nm(P(s))} (${life(P(s))})`).join("; ")}`);
  if (p.notes) L.push(`Research notes: ${p.notes.slice(0, 1500)}`);
  const iss = checks(p); if (iss.length) L.push(`Known gaps/issues: ${iss.map(i => i.msg).join("; ")}`);
  const logs = S.log.filter(l => l.pid === id).slice(-12); if (logs.length) L.push(`Already searched: ${logs.map(l => `${l.where} (${l.result}${l.notes ? ": " + l.notes : ""})`).join("; ")}`);
  return L.join("\n");
}
function aiAsk(key, history, context) {
  if (!inApp) { toast("The AI helper works when this tab runs inside Randis UDS."); return false; }
  if (Object.keys(pending).length) { toast("Wait for the current AI answer to finish."); return false; }
  pending[key] = { content: "", status: "Asking…", heard: false }; tell({ uds: "planner-ask", id: key, history, context });
  setTimeout(() => { if (pending[key] && !pending[key].heard) { delete pending[key]; toast("No reply from Randis UDS. Restart the app if this keeps happening."); render(); } }, 12000);
  return true;
}
function finish(key, d) {
  delete pending[key]; const kind = key.slice(0, 1), id = key.slice(2); const txt = d.error ? "" : String(d.text || "").trim();
  if (kind === "p") { (S.ai[id] = S.ai[id] || []).push({ role: "assistant", content: txt || "⚠ " + (d.error || "No answer.") }); if (S.ai[id].length > 30) S.ai[id] = S.ai[id].slice(-30); }
  else if (kind === "s") { const st = S.stories.find(x => x.id === id); if (st && txt) { snap(); st.text = (st.text ? st.text + "\n\n— AI draft —\n\n" : "") + txt; } else if (!txt) toast("AI: " + (d.error || "no answer")); }
  else if (kind === "b") { const p = P(id); if (p && txt) { snap(); p.bio = txt; } else if (!txt) toast("AI: " + (d.error || "no answer")); }
  save(); render();
}

  text = String(text || "").trim(); if (!text) return; const hist = (S.ai[pid] = S.ai[pid] || []);
  const h = [...hist.filter(m => !m.content.startsWith("⚠ ")), { role: "user", content: text }].slice(-12); while (h.length && h[0].role !== "user") h.shift();
  if (!aiAsk("p:" + pid, h, ctxPerson(pid))) return; hist.push({ role: "user", content: text }); save(); render();
}

  else if (d.uds === "exporting" || d.uds === "exported") toast(d.note || (d.ok ? "Saved" : "Not saved"));
  else if (d.uds === "planner") {
    const m = pending[d.id]; if (!m) return; m.heard = true;
    if (d.done) return finish(d.id, d);
    if (d.status) m.status = d.status; if (d.text) m.content = d.text;
    const el = $("#aiStream"); if (el && d.id.startsWith("p:")) el.textContent = m.content || m.status;
  }
});
if (inApp) { tell({ uds: "store-get" }); tell({ uds: "web-hello" }); setTimeout(() => { if (!loaded) { useLocal = true; boot(readLocal()); } }, 1500); }
else { useLocal = true; boot(readLocal()); }
</script>
