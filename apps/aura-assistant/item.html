<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aura — AI Assistant Suite</title>
<!-- Randis UDS™ by Randy Moore. Original: https://github.com/RandyWilliamMoore/randis-uds · Support: https://ko-fi.com/moorescombinatoricsmatrix -->
<style>
:root{--bg:#0f1117;--bg2:#161a23;--bg3:#1f2430;--line:#2c3342;--tx:#e8ecf4;--mut:#8f9ab0;--acc:#7c9cff;--acc2:#4fd1c5;--hot:#ff7ab6;--ok:#5fd38d;--warn:#f5b84a;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 7px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{width:100%;resize:vertical;line-height:1.5}
button{cursor:pointer;background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:5px 11px;white-space:nowrap}
button:hover{border-color:var(--acc)}
button.pri{background:linear-gradient(135deg,#5b7cff,#8a5cff);border-color:transparent;color:#fff;font-weight:600}
button.go{background:linear-gradient(135deg,#16b38a,#4fd1c5);border-color:transparent;color:#04201a;font-weight:700}
button.sm{padding:2px 8px;font-size:12px}
button.bad{color:var(--bad)}
button.on{border-color:var(--acc);background:#27305a}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc);width:100%}
input[type=checkbox]{accent-color:var(--acc)}
input[type=color]{padding:0;width:34px;height:24px;border-radius:5px;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .logo{font-weight:800;font-size:16px;background:linear-gradient(90deg,#7c9cff,#ff7ab6,#4fd1c5);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:6px}
header .credit{font-size:11px;color:var(--mut)}
header .credit a{color:var(--mut)}
#status{color:var(--mut);margin-left:auto;font-size:12px}
nav.tabs{display:flex;gap:2px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mut);padding:8px 12px}
nav.tabs button.on{color:var(--tx);border-bottom-color:var(--acc);background:none}
#main{flex:1;min-height:0;display:flex}
.scroll{overflow:auto}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--acc2);text-transform:uppercase;letter-spacing:.06em}
.sl{display:grid;grid-template-columns:110px 1fr 42px;align-items:center;gap:8px;margin:3px 0}
.sk{color:var(--mut);font-size:12px}
.sv{font-size:11px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.si{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;margin:3px 0}
.ci{display:inline-flex;align-items:center;gap:6px;margin:3px 10px 3px 0;font-size:12px;color:var(--mut)}
.cb{display:inline-flex;align-items:center;gap:4px;margin:3px 12px 3px 0;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 9px;border-radius:14px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}
.small{font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#263052;border:1px solid var(--acc);padding:8px 14px;border-radius:9px;display:none;z-index:99;max-width:80%;box-shadow:0 8px 30px #0008}
.vpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vpick select{max-width:340px}
kbd{background:var(--bg3);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
.list .it{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;border:1px solid transparent}
.list .it:hover{background:var(--bg3)}
.list .it.on{border-color:var(--acc);background:#1d2440}
h2{font-size:15px;margin:4px 0 10px}
p{margin:4px 0 8px}
a{color:var(--acc)}

#main{display:flex}
#stagebox{flex:1;position:relative;min-width:0;background:#05070f}
#stage{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
#sub{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:86%;background:rgba(5,8,20,.72);border:1px solid rgba(124,156,255,.35);padding:8px 14px;border-radius:12px;font-size:16px;text-align:center;transition:opacity .4s;pointer-events:none;backdrop-filter:blur(4px)}
#panel{width:470px;max-width:52%;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--bg)}
#side-nav{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--bg2)}
#side-nav button{border:0;background:none;color:var(--mut);padding:5px 8px;font-size:12px}
#side-nav button.on{background:var(--bg3);color:var(--tx)}
#side{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column}
.chatlog{flex:1;overflow:auto;min-height:120px;padding:4px}
.msg{margin:6px 0;max-width:92%}
.msg .who{font-size:11px;color:var(--mut);margin:0 4px 2px}
.msg .tx{background:var(--bg2);border:1px solid var(--line);padding:7px 10px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{margin-left:auto}
.msg.user .who{text-align:right}
.msg.user .tx{background:#26305a;border-color:#3a4a8a}
.chatbar{display:flex;gap:6px;align-items:flex-end;margin-top:6px}
.chatbar textarea{flex:1}
.tmr{display:inline-block;background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:2px 10px;margin:2px;font-size:12px}
.pre{white-space:pre-wrap;font-size:11px;background:var(--bg3);padding:8px;border-radius:7px;max-height:260px;overflow:auto}
#who{display:flex;flex-direction:column;line-height:1.15}
#aname{font-weight:700}
#arole{font-size:11px;color:var(--mut)}
</style>
</head>
<body>
<header><span class="logo">✦ Aura</span><span class="mut">AI Assistant Suite</span><span id="who" style="margin-left:14px"><span id="aname"></span><span id="arole"></span></span>

<div id="main"><div id="stagebox"><canvas id="stage"></canvas><div id="sub"></div></div>
<div id="panel"><div id="side-nav"></div><div id="side"></div></div></div>
<div id="toast"></div>

    h('div', { class: 'row' }, h('button', { class: 'pri', onclick: () => { const n = newAssistant(pick(['Nova', 'Echo', 'Vega', 'Iris', 'Pixel', 'Juno', 'Atlas', 'Sol'])); n.char = Char2D.random(n.name); n.look.tint = n.char.iris; n.look.tint2 = n.char.hair2; S.d.list.push(n); S.d.cur = n.id; save(); header(); drawSide(); greet(); } }, '+ New assistant'), h('button', { onclick: async () => { const f = await pickFile('.json'); if (!f) return; try { const j = JSON.parse(f.data); if (j.format !== VERSION) throw 0; const n = Object.assign(newAssistant(), j.assistant); n.id = uid(); S.d.list.push(n); S.d.cur = n.id; save(); header(); drawSide(); toast('Imported ' + n.name); } catch (e) { toast('That is not an Aura assistant file.'); } } }, 'Import assistant…'))));
  const a = A();
  p.append(card('Export ' + a.name, h('div', { class: 'row' },
    h('button', { onclick: () => saveFile(a.name + '.assistant.json', JSON.stringify({ format: VERSION, credit: CREDIT, assistant: Object.assign(clone(a), { chat: [] }) }, null, 1), 'application/json') }, 'Assistant file (.json)'),
    h('button', { onclick: () => exportStandalone(a) }, 'Standalone assistant page (.html)'),
    h('button', { onclick: () => saveCanvas($('#stage'), a.name + '.png') }, 'Picture (.png)'),
    h('button', { onclick: recordClip }, '⏺ Record 10s clip (.webm)')),
    h('p', { class: 'mut small' }, 'The standalone page runs the avatar, voice, timers, reminders, notes, to-dos and routines in any browser, offline. Open-ended chat needs Randis UDS with a linked AI.')));
  p.append(card('Ideas', h('ul', { class: 'small' }, ['Make a study buddy with the "Study buddy & tutor" role and a pomodoro routine.', 'Give a Starship AI persona a hologram look with heavy scanlines and the Android voice.', 'Design a character in VTuber Studio, export it, then import it here as your assistant\'s body.', 'Make a voice in Voice Forge, export .rvoice.json, then import it in the Voice page.', 'Set the backdrop to Green screen and record clips for videos.'].map(x => h('li', {}, x)))));
};
const CREDIT = 'Randis UDS™ by Randy Moore. Original: https://github.com/RandyWilliamMoore/randis-uds · Support: https://ko-fi.com/moorescombinatoricsmatrix';
function exportStandalone(a) {
  const data = { cur: a.id, list: [Object.assign(clone(a), { chat: [] })] };
  let html = '<!doctype html>\n' + document.documentElement.outerHTML;
  html = html.replace(/<script>\(function\(\)\{[\s\S]*?SOUND[\s\S]*?<\/script>/, '');
  html = html.replace('<head>', '<head><script>window.EMBED=' + JSON.stringify(data).replace(/</g, '\\u003c') + '<\/script>');
  saveFile(a.name.replace(/[^\w-]+/g, '_') + '-assistant.html', html, 'text/html');
}
async function recordClip() {
  const r = recorder($('#stage')); if (!r) return toast('Recording is not supported here.');
  r.start(); toast('Recording 10 seconds…', 10000); setMood('happy', 3); bubble(fill(A().greeting, A()), true);
  setTimeout(async () => { const b = await r.stop(); saveFile(A().name + '-clip.webm', b, 'video/webm'); }, 10000);
}
function header() { const a = A(); $('#aname').textContent = a.name; $('#arole').textContent = a.role; }
function greet() { setTimeout(() => { const a = A(); setMood('happy', 4); S.sub = fill(a.greeting, a); S.subT = performance.now(); }, 300); }

/* ---------------- Start ---------------- */
Store.load(() => window.EMBED ? clone(window.EMBED) : { cur: null, list: [] }).then(d => {
  S.d = d; if (!d.list.length) { const a = newAssistant('Aura'); d.list.push(a); d.cur = a.id; }
  d.list = d.list.map(x => { const n = Object.assign(newAssistant(), x); n.char = Char2D.clean(x.char); n.look = Object.assign(newAssistant().look, x.look); n.traits = Object.assign(newAssistant().traits, x.traits); return n; });
  if (!d.list.find(x => x.id === d.cur)) d.cur = d.list[0].id;
  header(); drawNav(); drawSide(); stageInit(); greet();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') Speech.stop(); });
</script>
</body>
