<style>
:root{--bg:#0a0f1c;--pn:#111a2e;--pn2:#16223b;--ln:#26365a;--tx:#e4ecff;--tx2:#9fb0d4;--ac:#5ee6ff;--ac2:#a98bff;--ok:#5fd38a;--warn:#ffb454;--bad:#ff6b6b;--yt:#ff3d3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--ln);background:linear-gradient(90deg,#120b22,#0a1428)}
header h1{font-size:17px;margin:0;letter-spacing:2px}header h1 b{color:var(--yt)}header .sp{flex:1}
nav{display:flex;gap:4px}nav button,.btn{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on,.btn.pri{background:linear-gradient(90deg,#7a5cff,#3fb7ff);border-color:transparent;color:#fff;font-weight:600}.btn:hover{border-color:var(--ac)}.btn.sm{padding:3px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 86px)}main.one{display:block;overflow:auto;padding:18px}
#list{border-right:1px solid var(--ln);overflow:auto;padding:10px}#work{overflow:auto;padding:16px 20px}
.it{padding:7px 9px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center;border:1px solid transparent}.it:hover{background:var(--pn)}.it.on{background:var(--pn2);border-color:var(--ac)}
.it .k{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:1px}.dot{width:9px;height:9px;border-radius:50%;flex:none;background:#3a4766}.dot.d{background:var(--warn)}.dot.p{background:var(--ok)}
input,select,textarea{background:#0c1426;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;font:inherit}textarea{width:100%;min-height:90px;resize:vertical}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px 14px;margin:0 0 12px}.card h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}.card h3 .sp{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:var(--tx2)}.small{font-size:12.5px}.tiny{font-size:11px}
.cnt{font:11px Consolas,monospace;color:var(--tx2)}.cnt.over{color:var(--bad)}
.opt{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed #22314f}.opt span{flex:1}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--ln);padding:5px 6px;text-align:left;vertical-align:top}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:#1c2a49;font-size:11.5px;margin:1px}
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#1e2c4c;border:1px solid var(--ac);padding:7px 16px;border-radius:6px;opacity:0;transition:.25s;pointer-events:none}#toast.on{opacity:1}
footer{height:26px;line-height:26px;font-size:11px;color:var(--tx2);padding:0 14px;border-top:1px solid var(--ln);white-space:nowrap;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.warn{color:var(--warn)}

<script>
"use strict";
const CATALOG = {"software":[{"key":"software:randis-uds","kind":"software","slug":"randis-uds","name":"Randis UDS","blurb":"The app everything in this shop was made with. A universal software with no fixed purpose: describe what you need, and the LLM inside it builds that into the app while you're using it.","version":"0.1.17","download":"https://github.com/RandyWilliamMoore/randis-uds/releases/tag/v0.1.17"}],"items":[{"key":"games:battle-tanks-royale","kind":"games","slug":"battle-tanks-royale","name":"Battle Tanks Royale","blurb":"Drive a tank, defend your base and play the story, A Tanker's War. Earn coins for upgrades and gear, paint your tank in the garage, or fight a friend on the same keyboard. Online play needs the Randis UDS app."},{"key":"games:bindy-and-louis","kind":"games","slug":"bindy-and-louis","name":"Bindy & Louis","blurb":"Bindy the binder clip helps you fix your own stuff with 320 repair tips, then teams up with Louis, the repair guy, to fight Mega Corp for the right to repair."},{"key":"games:blockwild","kind":"games","slug":"blockwild","name":"Blockwild","blurb":"An original voxel sandbox: an endless generated world of plains, forests, deserts, snow, mountains, oceans and caves. Break and place 22 block types in Survival (health, crafting) or Creative (all blocks, flying), with day and night, glow lamps and several saved worlds."},{"key":"games:card-master","kind":"games","slug":"card-master","name":"Card Master","blurb":"A table of 57 standard card games with the rules for each, 27 of them playable now: solitaires, rummies, blackjack and more. Links to custom and real playing cards."},{"key":"games:castle-mnemosyne","kind":"games","slug":"castle-mnemosyne","name":"Castle Mnemosyne","blurb":"Walk a castle in old-school pixel art, first-person. Write what you learn in books at the scribes' wing and shelve them in a real memory palace, or play the treasure hunt with Myst-style puzzles."},{"key":"games:coin-flipper","kind":"games","slug":"coin-flipper","name":"Coin Flipper","blurb":"Flip a coin, or a handful. Vanilla, Multi Coin, Call It, Double or Nothing, Race and Streak Hunt, with stats for every flip."},{"key":"games:dice-master","kind":"games","slug":"dice-master","name":"Dice Master","blurb":"Roll any dice from d4 to d100, or play Pig, Ship, Captain & Crew and High Roll against the computer. Links to custom dice makers and dice shops."},{"key":"games:diesel-gen-mechanic-simulator","kind":"games","slug":"diesel-gen-mechanic-simulator","name":"Diesel Gen Mechanic Simulator","blurb":"Start as a greenhorn under a scruffy foreman and work up to master repairman. Walk around the generator, open panels, find the worn and broken parts, and fix them, with real manuals, trade schools and training links along the way."},{"key":"games:fossil-collector","kind":"games","slug":"fossil-collector","name":"Fossil Collector","blurb":"Dig for fossils at real sites, clean them in the prep lab with the right tools, conserve and identify them, then file them in the archive and show your best finds in a walkable museum with gardens and vistas."},{"key":"games:gem-collector","kind":"games","slug":"gem-collector","name":"Gem Collector","blurb":"Mine for gems, cut them on a virtual lapping machine in real known cuts, and keep them in a wooden drawer cabinet."},{"key":"games:gilded-hands","kind":"games","slug":"gilded-hands","name":"Gilded Hands","blurb":"An original poker-hand roguelike. Play hands for Chips x Mult, beat Bronze, Silver and Gold tables over 8 tiers (Gold tables have boss rules), and shop for 32 Charms, Star Charts and Tinctures. Saves your run, with an endless mode after."},{"key":"games:hotdog-tycoon","kind":"games","slug":"hotdog-tycoon","name":"Hotdog Tycoon","blurb":"Start with one hotdog stand and grow to a national hotdog empire. Serve the line, buy upgrades from a condiment bar to your own sausage factory, and move from the beach boardwalk to the big league ballpark."},{"key":"games:lanternfall","kind":"games","slug":"lanternfall","name":"Lanternfall","blurb":"An original card-building roguelike. Pick the Lamplighter or the Tidecaller, build a deck from 60+ upgradable cards, 27 trinkets and 11 tonics, and climb 3 depths of branching maps past elites, events, shops and 6 bosses. Runs are saved."},{"key":"games:lhc-simulator","kind":"games","slug":"lhc-simulator","name":"LHC Simulator","blurb":"Run the Large Hadron Collider from Run 1 (2012) to the High-Luminosity era: fill the beams, collide, dump. Links to CERN, its experiments and open data. 1 run in 100 opens a portal to hell, or tempt fate and open one yourself."},{"key":"games:mail-sorter","kind":"games","slug":"mail-sorter","name":"Mail Sorter","blurb":"The mail just keeps coming. Can you keep up? Sort it, score points for tricks, find free snacks in the break room and win coworker clout in break-time mini games."},{"key":"games:marble-collector","kind":"games","slug":"marble-collector","name":"Marble Collector","blurb":"Play marbles in an arena, keep the cool ones you win, and build a prized set."},{"key":"games:matching-master","kind":"games","slug":"matching-master","name":"Matching Master","blurb":"Flip cards and match pairs, stage after stage. Earn coins and XP, collect prizes and items, and spend coins on hints, reveals and wild cards."},{"key":"games:milk-cap-champ","kind":"games","slug":"milk-cap-champ","name":"Milk Cap Champ","blurb":"Stack 'em, slam 'em, flip 'em. Win milk caps, earn coins, collect rare ones and level up from Rookie to Cap Master."},{"key":"games:pachinko-player","kind":"games","slug":"pachinko-player","name":"Pachinko Player","blurb":"Shoot balls into a Tokyo pachinko machine and hit the START pocket to spin for FEVER. Trade balls for prize tokens at the counter, then find your way through the back alleys to the little window that buys them."},{"key":"games:pong","kind":"games","slug":"pong","name":"Pong","blurb":"Classic Pong. Play the computer with W/S, the arrow keys or your mouse, or two players on one keyboard. First to 7 wins."},{"key":"games:rev-the-frog","kind":"games","slug":"rev-the-frog","name":"REV! The Frog Who Saved the World","blurb":"An original 3D platformer. Rev, a rocket-booted frog, frees 25 Beat Cores across 5 lands and beats 5 bosses, with a full story, lore tapes, synth music, gamepad support and saved progress."},{"key":"games:sandwich-master","kind":"games","slug":"sandwich-master","name":"Sandwich Master","blurb":"Run a sandwich shop: take each order, build it bread first in the ticket's order, wrap it and serve it before the customer runs out of patience. Earn fame and coins to unlock ingredients and upgrades."},{"key":"games:skateboard-collector","kind":"games","slug":"skateboard-collector","name":"Skateboard Collector","blurb":"Skate, land tricks for points, open crates for new decks, wheels and gear, and build your collection."},{"key":"games:slot-player","kind":"games","slug":"slot-player","name":"Slot Player","blurb":"Spin four machines: Classic Bandit, Fruit Frenzy, Cosmic Spins and Multiplier Mania. Hold reels, set your bet, spin on auto, with sound. Find a real one-arm bandit on eBay."},{"key":"games:topiary-master","kind":"games","slug":"topiary-master","name":"Topiary Master","blurb":"Get hired to shape people's hedges for money. Learn what sells in your area, build your skills, buy better tools, unlock new styles and win gardening awards."},{"key":"apps:ad-dev-suite","kind":"apps","slug":"ad-dev-suite","name":"Ad Dev Suite","blurb":"Write ads for 8 platforms that fit each field's character limit, using the AIDA, PAS, BAB and 4U formulas, with live counters and variations. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:atelier-fashion-suite","kind":"apps","slug":"atelier-fashion-suite","name":"Atelier: Fashion Suite","blurb":"Clothing design from idea to shelves: 30 aesthetics, inspiration boards, colour studio, sketchbook, parametric flats, print and repeat studio, knit charts, an 86-fabric library, size charts, pattern drafting with allowances and grading, and a tiled home-print pattern."},{"key":"apps:aura-assistant","kind":"apps","slug":"aura-assistant","name":"Aura Assistant","blurb":"An assistant with an animated avatar (hologram, anime character, orb, bot or waveform) that blinks, follows the mouse and changes moods. Timers, pomodoro, reminders, notes, to-dos and math work right here; chatting in character and voices need Randis UDS."},{"key":"apps:bot-farm","kind":"apps","slug":"bot-farm","name":"Bot Farm","blurb":"A cozy 3D farm where every bot is a cute animal. Play with 7 sample bots: shiny collectible cards, pet and play in the farm places, dress them in the wardrobe, design their looks, go on adventures, earn items and hear each animal's own tune. Farming your own real bots and AI chats needs Randis UDS."},{"key":"apps:chip-design-suite","kind":"apps","slug":"chip-design-suite","name":"Chip Design Suite","blurb":"Design a chip from concept to spec, RTL, simulation, synthesis, layout and checks, across 8 chip types, with its own engines. Fab orders stay drafts. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:circuit-pcb-studio","kind":"apps","slug":"circuit-pcb-studio","name":"Circuit & PCB Studio","blurb":"Draw a schematic with an electrical rules check, simulate it, get a parts list, auto-place, route a 2-layer board with vias, run design checks and export Gerbers. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:club-wiki","kind":"apps","slug":"club-wiki","name":"Club Wiki","blurb":"A sample wiki for a club or makerspace: pages, links and how-tos, ready to fill in and make your own."},{"key":"apps:code-editor","kind":"apps","slug":"code-editor","name":"Code Editor","blurb":"Write HTML, CSS and JavaScript and watch your page run next to it, with a console for console.log and errors. Save your project as a .json file and open it again later. The full IDE with Claude Code is in Randis UDS."},{"key":"apps:codex-academy","kind":"apps","slug":"codex-academy","name":"Codex Academy","blurb":"Learn to code, any language: an atlas of 15 realms and about 200 topics, 87 hand-made exercises, 20 arena challenges, 6 guided projects, 8 labs (sorting, Big-O, regex, neural net, pathfinding and more), XP, streaks and certificates. JavaScript runs right here; other languages and the Sage tutor need Randis UDS."},{"key":"apps:dig-lab","kind":"apps","slug":"dig-lab","name":"Dig Lab","blurb":"An archaeology suite: site record and datum, excavation grid, context register with Munsell colours, finds and reports. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:discord-bot-design-suite","kind":"apps","slug":"discord-bot-design-suite","name":"Discord Bot Design Suite","blurb":"Design Discord bots: a wizard to help decide what to build, slash commands and embeds, a large samples section with simple bots to try right away, and export to discord.js or discord.py."},{"key":"apps:distro-studio","kind":"apps","slug":"distro-studio","name":"Distro Studio","blurb":"Design your own Linux system: an Alpine designer that checks every setting, a from-scratch layer stack checker (firmware to desktop), a real 512-byte boot sector and bootable ISO you can download, a driver starter kit, a patch maker and the Randis UDOS phone design. Building and booting the ISO needs Randis UDS."},{"key":"apps:email-terminal","kind":"apps","slug":"email-terminal","name":"Email Terminal","blurb":"A cheerful retro green-screen email terminal. Type commands to list, read, search, flag, delete, reply and compose mail in a sample inbox, or import your own .eml or .mbox file. New messages save as .eml files or open in your mail app. Connecting a live mail account (IMAP/SMTP) needs Randis UDS."},{"key":"apps:emoji-forge","kind":"apps","slug":"emoji-forge","name":"Emoji Forge","blurb":"A bright gallery of hand-drawn Randis Emoji. Search, copy codes, try them in a sentence, download any one or all as PNG, an emoji sheet or a pack, and draw your own on a 64 x 64 grid. Showing them in every page at once needs Randis UDS."},{"key":"apps:forge-cad","kind":"apps","slug":"forge-cad","name":"Forge CAD","blurb":"Parametric plate parts (rounded rectangles, circles, polygons with holes, 9 materials), a 3D extrude view and mass properties. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:forge-rd-suite","kind":"apps","slug":"forge-rd-suite","name":"Forge R&D Suite","blurb":"Take an idea all the way to production in any field: a project wizard with stage gates, starter requirements, risks and standards, plus 25 field suites (mechanical, medical, electronics, firmware, chemistry, construction and more), each with steps, tools and vendors to look at."},{"key":"apps:free-money-finder","kind":"apps","slug":"free-money-finder","name":"Free Money Finder","blurb":"Find money you may be owed or can claim: unclaimed property, old refunds and pensions, credits and deductions, grants and incentives for businesses, a tracker with totals, calendar and CSV export, and a scam shield. Not tax or legal advice. The AI grant writer and Ask the AI need Randis UDS."},{"key":"apps:funnel-suite","kind":"apps","slug":"funnel-suite","name":"Funnel Suite","blurb":"Build a sales funnel from 5 templates: counts, % moving on, people per stage, a drawn funnel, and the money side (customers, revenue, profit). Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:game-emulator-suite","kind":"apps","slug":"game-emulator-suite","name":"Game Emulator Suite","blurb":"Play retro games you own: an offline emulator for 13 systems that runs inside the app, a built-in CHIP-8 emulator, links to the best web emulators (EmulatorJS, v86, PCjs, Infinite Mac, DOS Zone, Internet Archive) and tips per system. No games included; bring your own files."},{"key":"apps:hearthly","kind":"apps","slug":"hearthly","name":"Hearthly","blurb":"A warm community chat app with halls, channels, roles, reactions, replies, pins, search and direct messages. In the browser you get a lively demo hall with friendly made-up members, all on this page. Chatting with real people needs Randis UDS, which runs the Hearthly server."},{"key":"apps:heirloom-boxes","kind":"apps","slug":"heirloom-boxes","name":"Heirloom Boxes","blurb":"R&D for curio boxes, toy boxes and kids' toolboxes made to be handed down. Design 7 types with a 3D drawing, cut list, board feet, cost, weight, hardware, build steps and a live safety check, plus safety and selling basics (CPSIA, ASTM F963)."},{"key":"apps:heirloom-design-lab","kind":"apps","slug":"heirloom-design-lab","name":"Heirloom Design Lab","blurb":"Design things built to be handed down: parts, materials, joints, repairability, a live score with a fix list, a wear-over-generations model with a care plan, a hand-down kit, and a benchmark designer to score your designs."},{"key":"apps:heritage","kind":"apps","slug":"heritage","name":"Heritage","blurb":"Ancestry and legacy: pedigree, fan, descendant and hourglass trees, profiles with sourced facts, research checks, timelines, a places map with migrations, DNA match estimates, stories and heirlooms. Web research and the AI genealogist need Randis UDS."},{"key":"apps:home-designer","kind":"apps","slug":"home-designer","name":"Home Designer","blurb":"Plan a house: floors, rooms on a 10 cm grid, shared walls, doors and windows in metric or imperial, then design each room. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:hyperspace-portal-studio","kind":"apps","slug":"hyperspace-portal-studio","name":"Hyperspace Portal Studio","blurb":"How to open, run and travel through a portal: what physics allows on paper, what it costs, and which proven limits stop it."},{"key":"apps:intelligence-hijacking","kind":"apps","slug":"intelligence-hijacking","name":"Intelligence Hijacking","blurb":"Train 8 thinking skills (speed, memory, attention, reasoning and more) with adaptive tasks, track progress with charts and sealed progress certificates, and learn how learning works. Commander Randis guides you as a hologram with his own recorded voice. Test Center, Gyms, Autism suite, tours and a setup wizard. Nothing to install; Mentor AI and voice cloning come with Randis UDS."},{"key":"apps:iot-command","kind":"apps","slug":"iot-command","name":"IoT Command","blurb":"An IoT suite with 16 device templates, a live simulator with faults, and a rules engine to try ideas before real hardware. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:kettle-and-column","kind":"apps","slug":"kettle-and-column","name":"Kettle & Column","blurb":"Design brews and distilled drinks: 38 drink types in 10 families with law notes and non-alcoholic versions, recipes with live ABV, bitterness and colour, and process sheets. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:kitwright-edc-studio","kind":"apps","slug":"kitwright-edc-studio","name":"Kitwright EDC Studio","blurb":"Everyday-carry design: a catalog, 13 design tools, kits, make-or-buy and idea-to-real drafts. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:larder-lab","kind":"apps","slug":"larder-lab","name":"Larder Lab","blurb":"A food lab: recipe scaling, cost and batch sheets, an ingredient database, nutrition labels with allergens, pH and water activity, drinks, and cottage food rules for every US state. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:life-tree","kind":"apps","slug":"life-tree","name":"Life Tree","blurb":"A life-planning to-do tree: endless nested checkboxes, folding, zoom, drag to move, status, priority, due dates, repeats with streaks, tags, metrics, wiki notes with [[links]], Today, Cards, Wiki and Done views, undo, export and import. The per-item AI chat needs Randis UDS."},{"key":"apps:loomwork-automations","kind":"apps","slug":"loomwork-automations","name":"Loomwork Automations","blurb":"Build workflow automations as a graph: branches, merges, loops, error branches, retries and time limits, with 14 templates. Running them on a schedule needs the Loomwork engine in Randis UDS."},{"key":"apps:machine-shop","kind":"apps","slug":"machine-shop","name":"Machine Shop","blurb":"A CNC G-code simulator (G0-G3 arcs, drilling cycles, spindle) with top, front and 3D backplot and a progress slider, plus shop tools. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:mcm-software","kind":"apps","slug":"mcm-software","name":"MCM Software","blurb":"Moore's Combinatorics Matrix: cross two words to spark new ideas. Coverage grid, production navigator, matrix maths, a prompt builder you can copy, live idea checks, hand grading and a library you can export. AI writing needs Randis UDS."},{"key":"apps:media-network","kind":"apps","slug":"media-network","name":"Media Network","blurb":"Run your own AI media network: a news wire and assignment desk, an AI newsroom for articles, newsletters and threads, a podcast studio, a video and newscast studio with captions, fact-checking against sources, and publishing to Discord, Mastodon, Bluesky, WordPress and more. AI and publishing parts need Randis UDS."},{"key":"apps:miner-design-suite","kind":"apps","slug":"miner-design-suite","name":"Miner Design Suite","blurb":"Design miners from the ground up and learn how crowd computing works. Local only: no pools, no wallets, no network."},{"key":"apps:mintworks-exchange","kind":"apps","slug":"mintworks-exchange","name":"Mintworks Exchange","blurb":"A play-money exchange simulation: about 45 markets (coins, bullion, gems, tokens, your own coins) with an order book, file NFTs that hold the real file, a DAO market, a creation suite and a trading-card exchange with packs, singles and a binder. No real money."},{"key":"apps:money-lab","kind":"apps","slug":"money-lab","name":"Money Lab","blurb":"Paper trading and money skills in one place: about 170 simulated markets (stocks, ETFs, bonds, forex, crypto, futures, metals, real estate, collectibles, options), 93 calculators, budgeting, home buying, an 18-course academy, an encyclopedia and a scam center. No real money."},{"key":"apps:music-studio","kind":"apps","slug":"music-studio","name":"Music Studio","blurb":"Record tracks with built-in synths and drums, and learn piano with lessons that read a real MIDI keyboard if you plug one in. Computer keys work too."},{"key":"apps:my-wiki","kind":"apps","slug":"my-wiki","name":"My Wiki","blurb":"Your own little wiki: write pages, link them with [[double brackets]], search every word and edit with a live preview. Export and import your wiki as a file."},{"key":"apps:notepad","kind":"apps","slug":"notepad","name":"Notepad","blurb":"A plain, fast notepad: type, find, wrap or unwrap lines, change the text size, see words and characters. Open a text file from your computer and Save it back as a .txt in your downloads."},{"key":"apps:open-hardware-studio","kind":"apps","slug":"open-hardware-studio","name":"Open Hardware Studio","blurb":"Mark parts on circuit board photos and identify them: resistor colour bands, SMD and capacitor codes, reference letters, then a parts list. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:pdf-maker","kind":"apps","slug":"pdf-maker","name":"PDF Maker","blurb":"Make a PDF from your own text and pictures: type or paste, add photos (any picture your browser shows), pick Letter or A4 and a text size, then Make PDF saves it to your downloads. Works with no internet; nothing leaves your computer."},{"key":"apps:promo-studio","kind":"apps","slug":"promo-studio","name":"Promo Studio","blurb":"Writes video titles, descriptions, tags, hashtags, a pinned comment, posts for every social and a thumbnail prompt for any Randis Shop item or your own (add one or import a JSON/CSV list). Fill in your own channel links and save your setup as a file. The AI rewrite needs Randis UDS."},{"key":"apps:publishing-suite","kind":"apps","slug":"publishing-suite","name":"Publishing Suite","blurb":"Make one book or thousands: templates, data and puzzle generators, interior layout with embedded fonts, covers with spine and barcode, ISBN blocks, and export to PDF, EPUB, DOCX, ODT, TXT, Markdown, HTML, RTF, FB2, LaTeX and more. Building straight into a folder needs Randis UDS."},{"key":"apps:quak-quak","kind":"apps","slug":"quak-quak","name":"Quak Quak","blurb":"Quak Quak is a rubber duck for talking your problems out. Explain what you're stuck on and he listens and asks the next small question, like a real duck on your desk. Spin him, make him quack, breathe fire, and look for the secrets."},{"key":"apps:questloom-game-studio","kind":"apps","slug":"questloom-game-studio","name":"Questloom Game Studio","blurb":"Design games: a game design core, the Questloom engine (platformer, top-down, first-person), board games, tabletop RPGs, card games and a card-crawl deck builder. Some parts (the linked AI, saving files, opening web pages) need Randis UDS."},{"key":"apps:randis-academy","kind":"apps","slug":"randis-academy","name":"Randis Academy","blurb":"Every subject from 0 to infinity: 25 realms with ladders that go deeper, kids' sets, K-12 by grade, 30 exam-practice sets, flashcards with spaced repetition, a personal assistant, Randis Lab (a matrix-style math language with plots and a block-diagram Wire Lab), 50+ calculators and proof certificates. Works offline. The AI Mentor and Tutor need Randis UDS and say so."},{"key":"apps:randis-antivirus","kind":"apps","slug":"randis-antivirus","name":"Randis Antivirus","blurb":"A plain-language antivirus with its own engine: 40 editable rules, heuristic levels, known-malware hashes, archive and   }
}
function pLinks(el) {

function pBoard(el) {

  <div class="card"><table><tr><th>Item</th><th>Kind</th><th>Status</th><th>YouTube</th><th></th></tr>${all.map(it => { const r = S.items[it.key] || {}; return `<tr><td>${esc(it.name)}</td><td class="small">${KIND[it.kind] || ""}</td><td class="small">${({ "": "—", draft: "Copy written", filmed: "Video made", posted: "✔ Posted" })[r.status || (r.out ? "draft" : "")] || "—"}</td><td class="small">${r.video ? esc(r.video) : ""}</td><td><button class="btn sm" data-k="${esc(it.key)}">Open</button></td></tr>`; }).join("")}</table>

function pickFiles(accept, done) { const i = document.createElement("input"); i.type = "file"; i.multiple = true; i.accept = accept; i.onchange = () => i.files.length && done([...i.files]); i.click(); }
function parseCsv(t) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(cell); cell = ""; } else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; } else cell += c; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const good = rows.filter(r => r.some(x => x.trim())); if (!good.length) return [];
  const head = good[0].map(h => h.trim().toLowerCase()), known = head.some(h => /^(name|title|description|blurb|link|url|kind|type)$/.test(h));
  return (known ? good.slice(1) : good).map(r => known ? Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])) : { name: (r[0] || "").trim(), description: (r[1] || "").trim(), link: (r[2] || "").trim() });
}
function ownItem(x) {
  if (!x || typeof x !== "object") return null; const name = String(x.name || x.title || "").trim(); if (!name) return null;
  const kk = String(x.kind || x.type || "").toLowerCase(), kind = /game/.test(kk) ? "games" : /song|music|track/.test(kk) ? "music" : /software|program/.test(kk) ? "software" : "apps";
  return { key: "x:" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), kind, extra: true, name: name.slice(0, 80), blurb: String(x.description || x.blurb || x.about || "").slice(0, 1200), url: String(x.link || x.url || "").trim() };
}
function importFiles() {
  pickFiles(".json,.csv,.txt,.js", async files => {
    const c = JSON.parse(JSON.stringify(S.catalog || CATALOG)); let n = 0, shop = 0;
    for (const f of files) { const t = await f.text();
      if (/window\.(ITEMS|SOFTWARE|MUSIC|SONGS)\s*=/.test(t)) { let arr = null; try { arr = JSON.parse(t.slice(t.indexOf("["), t.lastIndexOf("]") + 1)); } catch (e) {} if (!Array.isArray(arr)) continue;
        const kind = /window.SOFTWARE/.test(t) ? "software" : /window.(MUSIC|SONGS)/.test(t) ? "music" : "items";
        const list = arr.map(x => normItem(x, kind)).filter(Boolean); if (kind === "software") c.software = list; else if (kind === "music") c.songs = list; else c.items = list; n += list.length; shop++; continue; }
      let rows = null;
      if (/^\s*[\[{]/.test(t)) { try { const j = JSON.parse(t); rows = Array.isArray(j) ? j : Array.isArray(j.items) ? j.items : [j]; } catch (e) {} }
      if (!rows) rows = parseCsv(t);
      rows.map(ownItem).filter(Boolean).forEach(it => { S.extra.push(it); n++; if (!S.sel || !S.extra.some(x => x.key === S.sel)) S.sel = it.key; }); }
    if (!n) { toast("No items found. Use a JSON list or a CSV with name, description, link."); return; }
    if (shop) S.catalog = c; save(); render(); toast(n + " item" + (n === 1 ? "" : "s") + " imported");
  });
}
function normItem(x, kind) {
  if (!x || typeof x !== "object" || !x.name) return null;
  const k = kind === "software" ? "software" : kind === "music" ? "music" : x.kind;
  return { key: k + ":" + (x.slug || x.name), kind: k, slug: x.slug || "", name: String(x.name).slice(0, 80), blurb: String(x.blurb || x.description || "").slice(0, 1200), version: x.version || "", download: x.download || "" };
}
function boot(d) {
  if (loaded) return; loaded = true; S = Object.assign(fresh(), d && typeof d === "object" ? d : {}); if (!Array.isArray(S.extra)) S.extra = []; if (!S.items || typeof S.items !== "object") S.items = {};
  const have = new Set(S.links.map(l => l.id)); LINKS0.forEach(([id, name, url]) => { if (!have.has(id)) S.links.push({ id, name, url }); });
  render();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { page = b.dataset.p; render(); });
if (inApp) { tell({ uds: "store-get" }); setTimeout(() => { if (!loaded) { useLocal = true; boot(readLocal()); } }, 1500); }
else boot(readLocal());
