<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Voice Forge</title>
<!-- Randis UDS™ by Randy Moore. Original: https://github.com/RandyWilliamMoore/randis-uds · Support: https://ko-fi.com/moorescombinatoricsmatrix -->
<style>
:root{--bg:#0f1117;--bg2:#161a23;--bg3:#1f2430;--line:#2c3342;--tx:#e8ecf4;--mut:#8f9ab0;--acc:#7c9cff;--acc2:#4fd1c5;--hot:#ff7ab6;--ok:#5fd38d;--warn:#f5b84a;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 7px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{width:100%;resize:vertical;line-height:1.5}
button{cursor:pointer;background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:5px 11px;white-space:nowrap}
button:hover{border-color:var(--acc)}
button.pri{background:linear-gradient(135deg,#5b7cff,#8a5cff);border-color:transparent;color:#fff;font-weight:600}
button.go{background:linear-gradient(135deg,#16b38a,#4fd1c5);border-color:transparent;color:#04201a;font-weight:700}
button.sm{padding:2px 8px;font-size:12px}
button.bad{color:var(--bad)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc);width:100%}
input[type=checkbox]{accent-color:var(--acc)}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .logo{font-weight:800;font-size:16px;background:linear-gradient(90deg,#7c9cff,#ff7ab6,#4fd1c5);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:6px}
header #vname{width:200px;font-weight:600}
#status{color:var(--mut);margin-left:auto;font-size:12px}
#main{flex:1;display:flex;min-height:0}
nav{width:178px;background:var(--bg2);border-right:1px solid var(--line);overflow:auto;padding:6px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 9px;margin:1px 0;border-radius:6px;color:var(--mut)}
nav button.on{background:var(--bg3);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
nav .sec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#5d6780;margin:10px 9px 2px}
#page{flex:1;overflow:auto;padding:14px 16px 40px}
h2{margin:0 0 4px;font-size:19px}
.sub{color:var(--mut);margin:0 0 12px}
h3{margin:0 0 8px;font-size:13px;color:var(--acc2);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.grid .card{margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prm{display:grid;grid-template-columns:128px 1fr 56px 18px;gap:6px;align-items:center;margin:3px 0}
.prm label{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help}
.prm .val{font-variant-numeric:tabular-nums;text-align:right;font-size:12px}
.prm .rst{border:0;background:none;padding:0;color:#5d6780;font-size:12px}
.prm .rst:hover{color:var(--hot)}
.prm.changed label{color:var(--tx)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg3);border:1px solid var(--line);cursor:pointer}
.chip:hover{border-color:var(--hot)}
.mut{color:var(--mut)}
.small{font-size:11px}
#viz{width:100%;height:230px;display:block;border-radius:8px;background:#090b10;border:1px solid var(--line)}
.vizwrap{position:relative}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--hot);display:none;pointer-events:none}
.preset{display:flex;flex-direction:column;gap:6px}
.preset .nm{font-weight:700}
.preset .ds{color:var(--mut);font-size:12px;flex:1}
.fx{border-left:3px solid var(--acc)}
.fx.off{opacity:.55;border-left-color:#444}
.fxhead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.fxhead b{flex:1}
table{border-collapse:collapse;width:100%}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
code,.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px}
pre{background:#090b10;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px;margin:6px 0}
.phw{display:inline-block;margin:3px 4px 3px 0;padding:3px 6px;background:var(--bg3);border-radius:6px}
.phw b{display:block;font-size:12px}
.phw span{font-family:Consolas,monospace;font-size:11px;color:var(--acc2)}
.idea{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.idea .st{width:62px;flex:none;font-size:11px;font-weight:700}
.st.done{color:var(--ok)}.st.next{color:var(--warn)}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#232a3a;border:1px solid var(--acc);padding:7px 14px;border-radius:8px;display:none;z-index:9;max-width:80%}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;background:#283048;color:var(--acc);margin-right:3px}
.libitem{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.libitem .nm{flex:1}
.fav{color:var(--warn)}
.meter{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <span class="logo">🎙️ Voice Forge</span>
  <input id="vname" title="This voice's name">
  <button class="go" id="bSpeak" title="Speak the text (Ctrl+Enter)">▶ Speak</button>
  <button id="bStop" title="Stop (Esc)">■</button>
  <button id="bUndo" title="Undo (Ctrl+Z)">↶</button>
  <button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
  <button class="pri" id="bSave" title="Save this voice to your library">💾 Save voice</button>
  <button id="bNew" title="Start a new voice from scratch">＋ New</button>
  <span id="status"></span>
</header>
<div id="main"><nav id="nav"></nav><section id="page"></section></div>
<div id="toast"></div>

PAGE.ship=p=>{const v=S.cur;p.append(h('h2',{},'Ship & export'),h('p',{class:'sub'},'Package this voice so anyone can use it anywhere: web pages, games, apps, Node.js, other Randis UDS tabs.'));
  const f=(l,el)=>h('div',{class:'prm',style:{gridTemplateColumns:'120px 1fr'}},h('label',{},l),el);
  p.append(card('About this voice',f('Name',h('input',{value:v.name,onchange:e=>{v.name=e.target.value.trim()||v.name;syncHeader();touch()}})),f('Author',h('input',{value:v.author,placeholder:'your name or handle',onchange:e=>{v.author=e.target.value;touch()}})),
    f('Version',h('input',{value:v.version,onchange:e=>{v.version=e.target.value;touch()}})),f('Description',h('input',{value:v.description,onchange:e=>{v.description=e.target.value;touch()}})),
    f('Tags',h('input',{value:(v.tags||[]).join(', '),placeholder:'robot, narrator, game',onchange:e=>{v.tags=e.target.value.split(',').map(s=>s.trim()).filter(Boolean);touch()}})),
    f('License',h('select',{onchange:e=>{v.license=e.target.value;touch();render()}},Object.keys(LICENSES).map(k=>h('option',{value:k,selected:v.license===k},k)))),h('p',{class:'mut small'},LICENSES[v.license]||'')));
  p.append(card('Export',h('div',{class:'grid',style:{gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))'}},
    [['📦 Voice pack (.zip)','Everything below in one zip: voice file, player script, demo page, sample, readme, license.',async()=>saveFile(safeName(v.name)+'-voicepack.zip',await packZip(v))],
     ['🧬 Voice file (.rvoice.json)','The voice’s settings. Small. Opens in Voice Forge anywhere.',()=>saveFile(safeName(v.name)+'.rvoice.json',JSON.stringify(exportVoice(v),null,1),'application/json')],
     ['⚙️ Player script (.voice.js)','Engine + voice, one file, no internet. Browsers and Node.js.',()=>saveFile(safeName(v.name)+'.voice.js',buildJS(v),'text/javascript')],
     ['🌐 Demo page (.html)','A web page that speaks with this voice. Double-click to open.',()=>saveFile(safeName(v.name)+'-demo.html',buildDemo(v),'text/html')],
     ['🔊 Speech (.wav)','The Studio text spoken by this voice.',()=>exportWav()],
     ['👄 Lip-sync (.json)','Phoneme and mouth-shape timing for the Studio text.',()=>saveFile(safeName(v.name)+'-lipsync.json',JSON.stringify(RV.timeline(S.text,v),null,1),'application/json')],
     ['🗣️ SSML (.ssml)','Rate and pitch for speech services that read SSML.',()=>saveFile(safeName(v.name)+'.ssml',ssml(),'application/ssml+xml')],
     ['📝 Readme (.md)','How to use the voice.',()=>saveFile('README.md',readme(v),'text/markdown')]]
    .map(([t,d,fn])=>h('div',{class:'card preset'},h('div',{class:'nm'},t),h('div',{class:'ds'},d),btn('Save',fn,'sm pri'))))));
  const snip=`<script src="${safeName(v.name)}.voice.js"><\/script>\n<script>\n  RandisVoices[${JSON.stringify(v.name)}].speak("Hello there!");\n<\/script>`;
  p.append(card('Embed in a web page',h('pre',{},snip),btn('Copy',()=>copy(snip),'sm')),
    card('Use in Randis UDS',h('p',{},'Any built tab can talk with this voice. Save the Player script, then ask the app’s AI something like:'),
      h('pre',{},`Make my game tab talk using the voice in ${safeName(v.name)}.voice.js (paste its text into a script in the tab and call RandisVoices["${v.name}"].speak(...)).`),
      h('p',{class:'mut small'},'Tabs are offline and walled off, which is fine: the voice needs no internet and no files.')))};

PAGE.spec=p=>{p.append(h('h2',{},'Format & API'),h('p',{class:'sub'},'An open, plain-JSON voice format that any program can read or write.'));
  p.append(card('randis-voice/1 (the .rvoice.json file)',h('pre',{},JSON.stringify(exportVoice(S.cur),null,2).slice(0,2200)+'\n…'),
    h('table',{},h('tr',{},h('th',{},'Field'),h('th',{},'Meaning')),[['format','Always "randis-voice/1"'],['name, version, author, description, tags','About the voice'],['license','CC0-1.0, CC-BY-4.0, CC-BY-SA-4.0, CC-BY-NC-4.0 or Proprietary'],
      ['synthetic','true: made from numbers, not a recording of a person'],['engine','"forge" (portable) or "system" (a Windows voice live, with Forge as the fallback)'],['params','The sound controls below'],['fx','Effects in order: {type, on, …settings}'],
      ['dict','Custom words: {"word": "ARPABET PHONEMES"}'],['system','{voice, rate, pitch, volume} for the system engine']].map(r=>h('tr',{},h('td',{class:'mono'},r[0]),h('td',{},r[1]))))));
  p.append(card('params',h('table',{},h('tr',{},h('th',{},'Key'),h('th',{},'Default'),h('th',{},'Range'),h('th',{},'What it does')),Object.keys(RV.PARAMS).map(k=>{const d=RV.PARAMS[k];
    return h('tr',{},h('td',{class:'mono'},k),h('td',{},String(d.d)),h('td',{class:'small'},d.opts?d.opts.join(' | '):d.min+' … '+d.max+(d.u?' '+d.u:'')),h('td',{class:'small'},d.l+'. '+(d.h||'')))}))));
  p.append(card('fx types',h('table',{},Object.keys(RV.FX).map(t=>h('tr',{},h('td',{class:'mono'},t),h('td',{},RV.FX[t].l),h('td',{class:'small mono'},Object.keys(RV.FX[t].p).join(', ')))))));
  p.append(card('JavaScript API (in every .voice.js)',h('pre',{},`RandisVoices[name].speak(text)      // play in a browser; returns {ended: Promise}
RandisVoices[name].stop()
RandisVoices[name].render(text)     // {samples: Float32Array, sr, duration, segs, f0}
RandisVoices[name].wav(text)        // Uint8Array: 16-bit mono WAV file
RandisVoices[name].timeline(text)   // [{ph, start, end, viseme, word}] lip-sync
RandisVoices[name].phonemes(text)   // [{word, ph}]
RandisVoiceEngine.render(text, anyVoiceJson)   // speak with any .rvoice.json
// Node.js: const v = require('./name.voice.js'); fs.writeFileSync('a.wav', v.wav('Hi'))`)));
  p.append(card('Phonemes',h('p',{class:'small'},Object.keys(RV.PHONEMES).map(k=>k+' ('+RV.PH_EXAMPLES[k]+')').join(' · '))))};

const IDEAS=[['done','Formant voice engine you can ship: no internet, no recordings, runs anywhere'],['done','40 sound controls: pitch, throat, tension, breath, jitter, shimmer, fry, vibrato, formants, nasality, articulation, prosody'],
 ['done','14-effect rack: EQ, filter, pitch shift, ring-mod robot, bit crusher, distortion, chorus, flanger, tremolo, echo, reverb, radio, compressor, gain'],['done','Unison choir and two harmony voices'],
 ['done','32 character presets'],['done','Describe a voice in words'],['done','Random, wild random and mutate'],['done','Morph between two voices and quick A/B'],['done','Text tags: emphasis, pauses, pitch, speed, whisper, laughs, sighs, singing, spelling, raw phonemes'],
 ['done','Pronunciation dictionary that ships with the voice'],['done','Phoneme chart and lip-sync visemes'],['done','Scene / cast scripts rendered to one file'],['done','Sing mode with melodies and robo-tune'],
 ['done','Voice changer for recordings'],['done','Windows system voices and SSML'],['done','Library with favorites, import and export'],['done','Voice pack zip, player script, demo page, WAV, lip-sync, SSML exports'],
 ['done','Open format spec and API'],['done','Undo / redo for every change'],
 ['next','Let the rubber duck and the app’s chat read replies aloud in a voice you pick'],['next','Live microphone voice changer (needs the app to allow the mic for this tab)'],
 ['next','Emotion timeline: draw happy / sad / angry over a script'],['next','Draw your own pitch curve with the mouse'],['next','Breath and mouth-click sounds between phrases'],
 ['next','More languages: Spanish, French, German letter-to-sound rules'],['next','Stereo placement and room position for scene speakers'],['next','Batch export: one WAV per line of a script'],
 ['next','A Python player so Python programs can use .rvoice.json'],['next','Voice “DNA” cards: a picture that encodes the voice'],['next','Publish voices to your Shop through Shop Studio'],
 ['next','Neural voice option (bigger downloads, more natural sound) behind a switch'],['next','Accent sliders (vowel shifts) and regional presets'],['next','MIDI keyboard to play the singing voice']];
PAGE.ideas=p=>{p.append(h('h2',{},'Ideas'),h('p',{class:'sub'},'What’s in Voice Forge now, and what could come next. Ask the app’s AI for any “next” item.'));
  p.append(card(null,IDEAS.map(([s,t])=>h('div',{class:'idea'},h('span',{class:'st '+s},s==='done'?'✓ built':'→ next'),h('span',{},t)))));
  p.append(card('Character idea generator',h('p',{class:'mut small'},'Need inspiration? Roll a character and Voice Forge will build its voice.'),
    btn('🎲 Roll a character',()=>{const pk=a=>a[Math.floor(Math.random()*a.length)];const d=`${pk(['an old','a tiny','a giant','a young','a sad','an excited','a calm','a scary','a sleepy','a nervous'])} ${pk(['robot','wizard','ghost','pirate','alien','fairy','announcer','android','monster','elf'])} ${pk(['in a cave','on the radio','in space','underwater','in a big hall','',''])}`.trim();
      const r=describe(d);r.v.name=d.replace(/^(an?|the)\s/,'');r.v.name=r.v.name[0].toUpperCase()+r.v.name.slice(1);setCur(r.v);toast(d);speak()},'pri')))};

/* ---------- Header and start ---------- */
$('#bSpeak').onclick=()=>speak();$('#bStop').onclick=stop;$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bSave').onclick=saveCur;
$('#bNew').onclick=()=>{const v=RV.newVoice('New voice');v.id=uid();setCur(v);toast('Fresh voice')};
$('#vname').onchange=e=>{S.cur.name=e.target.value.trim()||S.cur.name;touch()};
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();speak()}else if(e.key==='Escape')stop();
  else if(e.ctrlKey&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){if(e.key==='z'){e.preventDefault();undo()}else if(e.key==='y'){e.preventDefault();redo()}}});
window.addEventListener('resize',()=>{if(lastRender&&S.page==='studio')drawViz(lastRender)});
S.cur=presetVoice(PRESETS[0]);S.cur.id=uid();S.cur.name='My first voice';
pushHist(true);syncHeader();render();
if(HOST){parent.postMessage({uds:'store-get'},'*');gotStore.t=0}else storeLoaded=true;
</script>
