<title>Mintworks Exchange</title>
<style>
:root{--bg:#0b0c10;--s1:#14161c;--s2:#1c1f27;--s3:#262a34;--ln:#343947;--tx:#eef0f5;--tx2:#bfc4d1;--tx3:#868c9c;--ac:#7c6cf0;--ac2:#33c3d6;--up:#2fbf6a;--dn:#ec5f67;--warn:#f2b632;--gold:#e8b84a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--s3);border:1px solid var(--ln);border-radius:7px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.buy{background:#1d7d47;border-color:#1d7d47;color:#fff}button.sell{background:#a8343b;border-color:#a8343b;color:#fff}
button.sm{padding:2px 8px;font-size:12px}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--s2);border:1px solid var(--ln);border-radius:7px;padding:5px 8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
textarea{width:100%;min-height:90px;resize:vertical}
#app{display:grid;grid-template-columns:200px 1fr;grid-template-rows:auto 1fr;height:100vh}
#top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:7px 14px;background:var(--s1);border-bottom:1px solid var(--ln);flex-wrap:wrap}
#top .brand{font-weight:700;font-size:16px;letter-spacing:.3px}#top .brand span{color:var(--ac2)}
#top .credit{font-size:11px;color:var(--tx3)}#top .credit a{color:var(--tx3)}
#top .sp{flex:1}
#nav{background:var(--s1);border-right:1px solid var(--ln);overflow:auto;padding:8px 6px}
#nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;margin:1px 0;border-radius:7px;color:var(--tx2)}
#nav button:hover{background:var(--s2)}#nav button.on{background:var(--s3);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
#nav .grp{font-size:11px;text-transform:uppercase;color:var(--tx3);padding:10px 10px 3px;letter-spacing:.6px}
#main{overflow:auto;padding:14px 18px 40px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:16px 0 8px}h3{font-size:14px;margin:12px 0 6px}
.sub{color:var(--tx3);margin:0 0 12px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}
.col{display:flex;flex-direction:column;gap:6px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--tx3)}label.f>*{font-size:14px;color:var(--tx)}
label.ck{display:flex;gap:6px;align-items:center}
.muted{color:var(--tx3)}.small{font-size:12px}.up{color:var(--up)}.dn{color:var(--dn)}.warn{color:var(--warn)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:var(--s3);color:var(--tx2);border:1px solid var(--ln)}
.pill.g{background:#173d29;color:#7fe0a6;border-color:#24603f}.pill.r{background:#4a1d22;color:#ff9aa1;border-color:#6e2a31}.pill.y{background:#4a3a12;color:#ffd77a;border-color:#6b551c}.pill.b{background:#1f2754;color:#aab4ff;border-color:#33408a}
table{border-collapse:collapse;width:100%}th,td{padding:5px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--tx3);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--s2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}.tabs button{border-radius:99px}
.stat{background:var(--s2);border-radius:9px;padding:9px 11px}.stat .k{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px}.stat .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--s3);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac)}
.mono{font-family:Consolas,monospace;font-size:12px}
.code{background:#08090c;border:1px solid var(--ln);border-radius:8px;padding:10px;white-space:pre;overflow:auto;max-height:420px;font-family:Consolas,monospace;font-size:12px}
.note{background:#1d2133;border:1px solid #333b5c;border-radius:9px;padding:9px 12px;margin:8px 0;color:var(--tx2)}
.note.warn{background:#2e2611;border-color:#5c4b1c;color:#ffe2a0}.note.bad{background:#341a1d;border-color:#69313a;color:#ffc2c7}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;pointer-events:none}
#toast div{background:#2a2f3d;border:1px solid var(--ln);padding:8px 14px;border-radius:9px;box-shadow:0 6px 20px #0008}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:40}
#modal.on{display:flex}#modal .box{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:16px;max-width:min(720px,94vw);max-height:90vh;overflow:auto;min-width:340px}
.book td{padding:1px 6px;font-size:12px;border:0}.book tr{position:relative}
.ob-ask{color:var(--dn)}.ob-bid{color:var(--up)}
.nftgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.nft{background:var(--s2);border:1px solid var(--ln);border-radius:10px;overflow:hidden;cursor:pointer}.nft:hover{border-color:var(--ac)}
.nft .pv{height:140px;display:flex;align-items:center;justify-content:center;background:#0d0f14;overflow:hidden}
.nft .pv img,.nft .pv video{max-width:100%;max-height:100%}.nft .pv .ic{font-size:44px}
.nft .in{padding:8px 10px}
.logo{display:inline-block;vertical-align:middle}
svg text{font-family:"Segoe UI",sans-serif}
.kbd{border:1px solid var(--ln);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px}
.swatches{display:flex;gap:4px;flex-wrap:wrap}.swatches i{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent}.swatches i.on{border-color:#fff}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.flow .nd{background:var(--s2);border:1px solid var(--ln);border-radius:8px;padding:4px 8px;font-size:12px}
@media (max-width:760px){#app{grid-template-columns:1fr}#nav{display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--ln)}#nav button{width:auto}#nav .grp{display:none}}

<script>
'use strict';
/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a=0,b=1)=>a+Math.random()*(b-a);const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const uid=(n=10)=>{let s='';const c='abcdefghijklmnopqrstuvwxyz0123456789';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*36)];return s};
const hex=n=>{let s='';for(let i=0;i<n;i++)s+='0123456789abcdef'[Math.floor(Math.random()*16)];return s};
function fmt(v,d){if(v==null||isNaN(v))return '–';const a=Math.abs(v);if(d==null)d=a>=1000?2:a>=1?2:a>=0.01?4:a>0?8:2;return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
const usd=v=>(v<0?'-$':'$')+fmt(Math.abs(v),Math.abs(v)>=1e6?0:undefined);
function big(v){const a=Math.abs(v);if(a>=1e12)return (v/1e12).toFixed(2)+'T';if(a>=1e9)return (v/1e9).toFixed(2)+'B';if(a>=1e6)return (v/1e6).toFixed(2)+'M';if(a>=1e3)return (v/1e3).toFixed(1)+'K';return fmt(v,a<1?4:0)}
const pct=v=>(v>=0?'+':'')+(v*100).toFixed(2)+'%';
const cls=v=>v>0?'up':v<0?'dn':'';
function toast(t,ms=3000){const d=document.createElement('div');d.textContent=t;$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms)}
function modal(html,onMount){$('#modalBox').innerHTML=html+'<div class="row end" style="margin-top:12px"><button onclick="closeModal()">Close</button></div>';$('#modal').classList.add('on');if(onMount)onMount($('#modalBox'))}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
const num=id=>{const v=parseFloat(val(id));return isNaN(v)?0:v};
const dt=t=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const dday=t=>new Date(t).toLocaleDateString([], {year:'numeric',month:'short',day:'numeric'});
const fsize=b=>b>=1048576?(b/1048576).toFixed(2)+' MB':b>=1024?(b/1024).toFixed(1)+' KB':b+' B';

/* ---------- SHA-256 (works without a secure context) ---------- */
function sha256(bytes){
 const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
 if(typeof bytes==='string')bytes=new TextEncoder().encode(bytes);
 const l=bytes.length,nb=((l+9+63)>>6)<<6,m=new Uint8Array(nb);m.set(bytes);m[l]=0x80;
 const bl=l*8;const dv=new DataView(m.buffer);dv.setUint32(nb-4,bl>>>0);dv.setUint32(nb-8,Math.floor(bl/4294967296));
 const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),W=new Uint32Array(64);
 const r=(x,n)=>(x>>>n)|(x<<(32-n));
 for(let o=0;o<nb;o+=64){for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3),s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0}
  let[a,b,c,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+W[i])>>>0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
  H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h}
 return [...H].map(x=>x.toString(16).padStart(8,'0')).join('')}

/* ---------- host bridge: save, load, export ---------- */
const HOST=window.parent!==window;let loaded=false,fallback=false,saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,700)}
function saveNow(){if(!loaded)return;S.saved=Date.now();const txt=JSON.stringify(S);S._size=txt.length;
 if(HOST&&!fallback)parent.postMessage({uds:'store-set',data:JSON.parse(txt)},'*');else try{localStorage.setItem('mintworks',txt)}catch(e){}}
function download(name,data,mime='text/plain'){const blob=data instanceof Blob?data:new Blob([data],{type:mime});
 if(HOST){parent.postMessage({uds:'export-file',name,data:blob},'*');toast('Saving '+name+'…')}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}}
function dataUrlToBlob(u){const [h,b]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
function pickFile(accept,cb){const f=$('#filePick');f.accept=accept||'';f.value='';f.onchange=()=>{if(f.files[0])cb(f.files[0])};f.click()}

/* ---------- procedural art: coins, gems, pearls, bars, tokens ---------- */
const PALETTES={gold:['#f7d774','#c9962b','#7a5512'],silver:['#f2f4f7','#aab0bb','#5c6370'],platinum:['#eef3f6','#b7c4cc','#6b7c86'],copper:['#f2a86b','#b8642e','#6b3315'],
 ruby:['#ff8a9a','#d3123a','#5c0618'],sapphire:['#8fb2ff','#2549d6','#0c1a63'],emerald:['#8ff0b5','#14a457','#064d26'],amethyst:['#d7a8ff','#8a3ad6','#3d0f6b'],diamond:['#ffffff','#bfe8ff','#6aa6c9'],topaz:['#ffe08a','#f09a1a','#7a4300'],onyx:['#7d8590','#2a2e36','#0b0c0f'],
 pearl:['#ffffff','#f1e8f4','#b9a9c4'],blackpearl:['#a7b3c2','#3c4452','#11151c'],rose:['#ffe7ec','#f4b8c6','#b5708a'],neon:['#9ef7ff','#33c3d6','#105a66'],violet:['#c6bdff','#7c6cf0','#2e2477'],lime:['#e6ff9e','#8ad61f','#3a6608']};
function artSVG(spec,size=64){spec=spec||{};const sh=spec.shape||'coin',p=PALETTES[spec.pal]||PALETTES.gold,sym=esc((spec.sym||'?').slice(0,4)),id='g'+uid(6),fs=sym.length>3?size*.22:sym.length>2?size*.27:size*.32;
 let body='';const s=size,c=s/2;
 const defs=`<defs><radialGradient id="${id}r" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${p[0]}"/><stop offset=".55" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[2]}"/></radialGradient><linearGradient id="${id}l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset=".5" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[2]}"/></linearGradient></defs>`;
 const label=(y=c,col='#0008')=>`<text x="${c}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="800" fill="${col}">${sym}</text>`;
 if(sh==='coin'){body=`<circle cx="${c}" cy="${c}" r="${s*.46}" fill="url(#${id}l)" stroke="${p[2]}" stroke-width="${s*.03}"/><circle cx="${c}" cy="${c}" r="${s*.36}" fill="none" stroke="${p[0]}" stroke-opacity=".7" stroke-width="${s*.025}" stroke-dasharray="${s*.03} ${s*.03}"/>`+label()}
 else if(sh==='token'){const pts=[...Array(6)].map((_,i)=>{const a=Math.PI/3*i-Math.PI/2;return (c+s*.46*Math.cos(a))+','+(c+s*.46*Math.sin(a))}).join(' ');body=`<polygon points="${pts}" fill="url(#${id}l)" stroke="${p[2]}" stroke-width="${s*.03}"/>`+label()}
 else if(sh==='gem'){const t=s*.12,m=s*.34,b=s*.92;body=`<polygon points="${s*.22},${t} ${s*.78},${t} ${s*.95},${m} ${c},${b} ${s*.05},${m}" fill="url(#${id}l)" stroke="${p[2]}" stroke-width="${s*.02}"/>
  <polyline points="${s*.05},${m} ${s*.95},${m}" stroke="${p[0]}" stroke-opacity=".8" stroke-width="${s*.015}" fill="none"/><polyline points="${s*.22},${t} ${s*.36},${m} ${c},${t} ${s*.64},${m} ${s*.78},${t}" stroke="${p[0]}" stroke-opacity=".7" stroke-width="${s*.015}" fill="none"/>
  <polyline points="${s*.36},${m} ${c},${b} ${s*.64},${m}" stroke="${p[2]}" stroke-opacity=".6" stroke-width="${s*.015}" fill="none"/>`+label(s*.5,'#fffd')}
 else if(sh==='pearl'){body=`<circle cx="${c}" cy="${c}" r="${s*.44}" fill="url(#${id}r)"/><ellipse cx="${s*.36}" cy="${s*.32}" rx="${s*.12}" ry="${s*.07}" fill="#fff" opacity=".75"/><circle cx="${c}" cy="${c}" r="${s*.44}" fill="none" stroke="${p[2]}" stroke-opacity=".5"/>`+label(c,'#0007')}
 else if(sh==='bar'){body=`<polygon points="${s*.18},${s*.3} ${s*.82},${s*.3} ${s*.96},${s*.74} ${s*.04},${s*.74}" fill="url(#${id}l)" stroke="${p[2]}" stroke-width="${s*.025}"/><polygon points="${s*.18},${s*.3} ${s*.82},${s*.3} ${s*.76},${s*.4} ${s*.24},${s*.4}" fill="${p[0]}" opacity=".55"/>`+label(s*.57,'#0009')}
 else if(sh==='stable'){body=`<rect x="${s*.06}" y="${s*.06}" width="${s*.88}" height="${s*.88}" rx="${s*.24}" fill="url(#${id}l)" stroke="${p[2]}" stroke-width="${s*.03}"/>`+label()}
 else if(sh==='dao'){body=`<circle cx="${c}" cy="${c}" r="${s*.46}" fill="url(#${id}l)"/>`+[0,1,2].map(i=>{const a=Math.PI*2/3*i-Math.PI/2;return `<circle cx="${c+s*.25*Math.cos(a)}" cy="${c+s*.25*Math.sin(a)}" r="${s*.09}" fill="${p[0]}" stroke="${p[2]}"/>`}).join('')+`<circle cx="${c}" cy="${c}" r="${s*.1}" fill="${p[2]}"/>`}
 else if(sh==='nft'){body=`<rect x="${s*.08}" y="${s*.08}" width="${s*.84}" height="${s*.84}" rx="${s*.12}" fill="url(#${id}l)"/><rect x="${s*.2}" y="${s*.2}" width="${s*.6}" height="${s*.6}" rx="${s*.06}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="${s*.03}"/>`+label(c,'#fffd')}
 return `<svg class="logo" width="${size}" height="${size}" viewBox="0 0 ${s} ${s}">${defs}${body}</svg>`}
function svgToPngBlob(svg,size,cb){const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=size;cv.getContext('2d').drawImage(img,0,0,size,size);cv.toBlob(cb,'image/png')};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('class="logo"','xmlns="http://www.w3.org/2000/svg"'))}

/* ---------- charts ---------- */
function lineChart(vals,w=640,h=200,opt={}){if(!vals||vals.length<2)return '<div class="muted small">Not enough data yet.</div>';
 let mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn){mx+=1;mn-=1}const pad=4,X=i=>pad+i*(w-pad*2)/(vals.length-1),Y=v=>h-pad-(v-mn)/(mx-mn)*(h-pad*2);

   p=p*Math.exp(drift-sig*sig/2+sig*z);
   for(let i=0;i<3;i++){const q=p*(1+gauss()*sig*.35);hi=Math.max(hi,q);lo=Math.min(lo,q)}}
  hi=Math.max(hi,p,o);lo=Math.max(1e-12,Math.min(lo,p,o));a.p=Math.max(1e-12,p);

function send(w,toAddr,assetId,q,memo){if(!toAddr)return toast('Enter an address.');if(!(q>0))return toast('Enter an amount.');
 if(assetId==='USD'){if(w.cash<q)return toast('Not enough cash.');w.cash-=q}else{if((w.h[assetId]||0)<q)return toast('Not enough '+assetId+'.');const avg=(w.cost[assetId]||0)/w.h[assetId];w.h[assetId]-=q;w.cost[assetId]-=avg*q;if(w.h[assetId]<1e-12){delete w.h[assetId];delete w.cost[assetId]}}
 const to=S.wallets.find(x=>x.addr===toAddr);if(to){if(assetId==='USD')to.cash+=q;else{to.h[assetId]=(to.h[assetId]||0)+q;to.cost[assetId]=(to.cost[assetId]||0)+q*(A(assetId)?A(assetId).p:0)}}
 addTx(w.addr,toAddr,assetId,q,'transfer',memo);save();toast('Sent.');return true}

 return `<table class="book"><tr><th>Price</th><th class="n">Size</th></tr>${lv.join('')}</table>`}

function nftPreview(n,big){if(!n.data)return `<div class="ic">${nftIcon(n.mime)}</div>`;
 if(n.mime.startsWith('image'))return `<img src="${n.data}" alt="">`;
 if(n.mime.startsWith('audio'))return big?`<audio controls src="${n.data}"></audio>`:`<div class="ic">🎵</div>`;
 if(n.mime.startsWith('video'))return `<video ${big?'controls':'muted'} src="${n.data}"></video>`;
 if(n.mime.startsWith('text')&&big){try{return `<pre class="code" style="width:100%;max-height:300px;white-space:pre-wrap">${esc(atob(n.data.split(',')[1]).slice(0,4000))}</pre>`}catch(e){}}
 return `<div class="ic">${nftIcon(n.mime)}</div>`}
function genArtSVG(seed){let s=seed;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};const hue=Math.floor(r()*360);let b=`<rect width="400" height="400" fill="hsl(${hue},40%,12%)"/>`;
 const kind=Math.floor(r()*3);for(let i=0;i<26;i++){const h=(hue+r()*120-60+360)%360,o=(.25+r()*.6).toFixed(2);
  if(kind===0)b+=`<circle cx="${r()*400}" cy="${r()*400}" r="${10+r()*90}" fill="hsl(${h},75%,60%)" opacity="${o}"/>`;
  else if(kind===1)b+=`<rect x="${r()*400}" y="${r()*400}" width="${20+r()*140}" height="${20+r()*140}" fill="hsl(${h},70%,55%)" opacity="${o}" transform="rotate(${r()*90} 200 200)"/>`;
  else b+=`<path d="M${r()*400} ${r()*400} Q${r()*400} ${r()*400} ${r()*400} ${r()*400}" stroke="hsl(${h},80%,62%)" stroke-width="${2+r()*14}" fill="none" opacity="${o}" stroke-linecap="round"/>`}
 return `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">${b}</svg>`}
const svgDataUrl=svg=>'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));

 names.forEach((nm,i)=>{const svg=genArtSVG(1000+i*7919);const data=svgDataUrl(svg);const ed=[1,10,1,25,5,1][i],px=[1800,120,950,40,260,1400][i];
  S.nfts.push({id:'nft'+uid(8),name:nm,desc:'Generative artwork. The token is the real SVG file itself.',mime:'image/svg+xml',size:svg.length,hash:sha256(svg),data,editions:ed,own:{ext:ed-Math.min(ed,ed>1?3:1)},creator:'ext',creatorName:who[i],royalty:5,price:px,last:px,
   listings:[{id:uid(6),w:'ext',qty:Math.min(ed,ed>1?3:1),price:px}],offers:[],hist:[{t:S.t,k:'mint',from:'mint',to:who[i],q:ed}],license:LICENSES[0],t:S.t,tokenId:hex(16)})})}

function nftMintForm(){const used=storeBytes();return `<div class="card" style="max-width:640px"><h3>Mint a file as an NFT</h3>

function nftLoadFile(f){const rd=new FileReader();rd.onload=()=>{const bytes=new Uint8Array(rd.result);const hash=sha256(bytes);MEM.nfFile={name:f.name,size:f.size,mime:f.type||'application/octet-stream',hash};
 if(f.size<=NFT_KEEP){const r2=new FileReader();r2.onload=()=>{MEM.nfFile.data=r2.result;render()};r2.readAsDataURL(f)}else render()};rd.readAsArrayBuffer(f)}
function nftMint(){const f=MEM.nfFile,w=W();if(!f)return;if(w.cash<2)return toast('You need $2 cash for the mint fee.');
 if(S.nfts.some(n=>n.hash===f.hash))return toast('That exact file is already minted here (same fingerprint).');

 const n={id:'nft'+uid(8),tokenId:f.hash.slice(0,16),name:val('nfName')||f.name,desc:val('nfDesc'),unlock:val('nfUnl'),mime:f.mime,size:f.size,hash:f.hash,data:f.data||null,fname:f.name,editions:ed,own:{[w.id]:ed},creator:w.id,creatorName:w.name,royalty:clamp(num('nfRoy'),0,25),price:px,last:px,listings:[],offers:[],hist:[],license:val('nfLic'),t:S.t};

function nftDetail(n){const w=W(),mine=n.own[w.id]||0,allMine=S.wallets.reduce((s,x)=>s+(n.own[x.id]||0)+n.listings.filter(l=>l.w===x.id).reduce((t,l)=>t+l.qty,0),0);
 return `<button class="sm" onclick="MEM.nft=null;render()">← All NFTs</button>

  <h3>Ownership</h3><table>${Object.entries(n.own).filter(([k,q])=>q>0).map(([k,q])=>`<tr><td>${k==='ext'?'Other collectors':'You: '+esc((S.wallets.find(x=>x.id===k)||{}).name||'?')}</td><td class="n">${q}</td></tr>`).join('')}${n.listings.map(l=>`<tr><td class="muted">Listed by ${l.w==='ext'?'a collector':'you'}</td><td class="n">${l.qty}</td></tr>`).join('')}</table>

function nftDownload(id){const n=nftById(id);if(!n.data)return;download(n.fname||(n.name+(n.mime.includes('svg')?'.svg':'')),dataUrlToBlob(n.data))}
function nftAttach(id,f){const n=nftById(id);const rd=new FileReader();rd.onload=()=>{if(sha256(new Uint8Array(rd.result))!==n.hash)return toast('That is not the same file: its fingerprint is different.',5000);download(f.name,f);toast('Fingerprint matches. Saving a copy.')};rd.readAsArrayBuffer(f)}
function nftVerify(id,f){const n=nftById(id);const rd=new FileReader();rd.onload=()=>{const h=sha256(new Uint8Array(rd.result));modal(h===n.hash?`<h3 class="up">✔ Authentic</h3><p>“${esc(f.name)}” is byte-for-byte the file in this NFT.</p><div class="mono small">${h}</div>`:`<h3 class="dn">✘ Not this NFT's file</h3><p>Even a one-byte change gives a completely different fingerprint.</p><div class="mono small">file: ${h}<br>nft:  ${n.hash}</div>`)};rd.readAsArrayBuffer(f)}
function nftCert(id){const n=nftById(id);const meta={name:n.name,description:n.desc,token_id:n.tokenId,standard:'ERC-1155-style (simulated)',editions:n.editions,file:{name:n.fname||n.name,mime:n.mime,bytes:n.size,sha256:n.hash,stored:n.data?'inside token':'fingerprint only'},creator:n.creator==='ext'?n.creatorName:n.creatorName,royalty_percent:n.royalty,license:n.license,minted:new Date(n.t).toISOString(),provenance:n.hist.map(h=>({time:new Date(h.t).toISOString(),event:h.k,from:h.from,to:h.to,qty:h.q,price_usd:h.px||null})),made_with:'Mintworks Exchange in Randis UDS by Randy Moore'};

function nftList(id,q,p){const n=nftById(id),w=W();q=Math.floor(q);if(!(q>0)||q>(n.own[w.id]||0)||!(p>0))return toast('Check the amount and price.');n.own[w.id]-=q;n.listings.push({id:uid(6),w:w.id,qty:q,price:p});n.hist.push({t:S.t,k:'listed',from:w.name,to:'market',q,px:p});save();render()}

 w.cash-=cost;l.qty-=q;if(!l.qty)n.listings=n.listings.filter(x=>x!==l);n.own[w.id]=(n.own[w.id]||0)+q;n.last=l.price;n.hist.push({t:S.t,k:'sale',from:l.w==='ext'?'collector':'you',to:w.name,q,px:l.price});

function nftSend(id,q,to){const n=nftById(id),w=W();q=Math.floor(q);if(!(q>0)||q>(n.own[w.id]||0))return toast('Check the amount.');n.own[w.id]-=q;n.own[to]=(n.own[to]||0)+q;
 const tn=to==='ext'?'a friend':(S.wallets.find(x=>x.id===to)||{}).name;n.hist.push({t:S.t,k:'transfer',from:w.name,to:tn,q});addTx(w.addr,to==='ext'?EXT[3].a:S.wallets.find(x=>x.id===to).addr,n.id,q,'nft-transfer',n.name);save();render()}
function nftAccept(id,oid){const n=nftById(id),o=n.offers.find(x=>x.id===oid),w=W();if((n.own[w.id]||0)<o.qty)return;n.own[w.id]-=o.qty;n.own.ext=(n.own.ext||0)+o.qty;
 const roy=n.creator!==w.id?o.qty*o.price*n.royalty/100:0;w.cash+=o.qty*o.price-roy;const cw=S.wallets.find(x=>x.id===n.creator);if(cw&&roy)cw.cash+=roy;
 n.last=o.price;n.hist.push({t:S.t,k:'sale',from:w.name,to:o.who,q:o.qty,px:o.price});n.offers=n.offers.filter(x=>x!==o);addTx(w.addr,EXT[5].a,n.id,o.qty,'nft-sale','Offer accepted');save();toast('Sold.');render()}
function nftDecline(id,oid){const n=nftById(id);n.offers=n.offers.filter(x=>x.id!==oid);save();render()}
function nftBurn(id){const n=nftById(id),w=W();const q=n.own[w.id]||0;if(!q)return;if(!confirm('Burn your '+q+' edition(s)? This cannot be undone.'))return;n.own[w.id]=0;n.editions-=q;n.hist.push({t:S.t,k:'burn',from:w.name,to:'burn',q});addTx(w.addr,'burn',n.id,q,'nft-burn',n.name);
 if(n.editions<=0){S.nfts=S.nfts.filter(x=>x!==n);MEM.nft=null}save();render()}
function nftFractionalize(id){const n=nftById(id),w=W();modal(`<h3>Fractionalise “${esc(n.name)}”</h3><p class="small">Locks the NFT in a vault and makes a coin; each coin is a share of the file. The coin trades on the Exchange.</p>
 <div class="grid g2"><label class="f">Coin symbol<input id="frS" value="${esc(n.name.replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase()||'FRAC')}"></label><label class="f">Shares<input id="frN" type="number" value="1000"></label><label class="f">Value of the whole file (USD)<input id="frV" type="number" value="${n.last||n.price}"></label></div>
 <div class="row end" style="margin-top:8px"><button class="pri" onclick="nftFracGo('${id}')">Lock & make coin</button></div>`)}
function nftFracGo(id){const n=nftById(id),w=W(),sym=val('frS').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);if(!sym||A(sym))return toast('Pick a symbol that is not in use.');const N=Math.max(1,num('frN')),V=Math.max(1,num('frV'));
 n.own[w.id]-=1;n.own['vault:'+sym]=1;n.hist.push({t:S.t,k:'vaulted',from:w.name,to:'vault '+sym,q:1});
 S.assets.push({id:sym,sym,name:n.name+' shares',cls:'mine',p:V/N,vol:.05,sup:N,shape:'nft',pal:'violet',desc:'Each coin is 1/'+N+' of the file NFT “'+n.name+'”.',open:V/N,closes:[V/N,V/N],liq:V,nft:n.id});
 w.h[sym]=N;w.cost[sym]=V;addTx('mint',w.addr,sym,N,'mint','Fractional shares of '+n.name);closeModal();save();MEM.sel=sym;go('ex')}
function nftTick(dt){for(const n of S.nfts){
 for(const l of [...n.listings]){if(l.w==='ext')continue;const fair=n.last||n.price;const pBuy=dt*.6*Math.exp(-(l.price/fair-1)*3)*(1+S.hype*.2);if(Math.random()<pBuy){const w=S.wallets.find(x=>x.id===l.w);const q=1;l.qty-=q;if(!l.qty)n.listings=n.listings.filter(x=>x!==l);n.own.ext=(n.own.ext||0)+q;
   const roy=n.creator!==l.w?l.price*n.royalty/100:0;if(w)w.cash+=l.price-roy;const cw=S.wallets.find(x=>x.id===n.creator);if(cw&&roy)cw.cash+=roy;n.last=l.price;n.hist.push({t:S.t,k:'sale',from:w?w.name:'you',to:'collector',q,px:l.price});addTx(w?w.addr:'',EXT[5].a,n.id,q,'nft-sale',n.name);alertMsg(`Sold 1 × “${n.name}” for ${usd(l.price)}`)}}
 const owned=S.wallets.reduce((s,x)=>s+(n.own[x.id]||0),0);if(owned&&Math.random()<dt*.15&&n.offers.length<4){n.offers.push({id:uid(6),who:pick(['collector.eth','whale_77','gallery.dao','nina.art','anon']),qty:1,price:+((n.last||n.price)*rnd(.7,1.15)).toPrecision(4)})}
 if(n.creator!=='ext'&&(n.own.ext||0)>0&&Math.random()<dt*.1){const px=(n.last||n.price)*rnd(.85,1.3);n.last=px;const cw=S.wallets.find(x=>x.id===n.creator);if(cw){cw.cash+=px*n.royalty/100}n.hist.push({t:S.t,k:'resale',from:'collector',to:'collector',q:1,px});}
 if(n.creator==='ext'&&Math.random()<dt*.08){n.last=(n.last||n.price)*rnd(.9,1.12);if((n.own.ext||0)>0&&!n.listings.some(l=>l.w==='ext'))n.listings.push({id:uid(6),w:'ext',qty:1,price:+(n.last*rnd(1,1.2)).toPrecision(4)})}}}

function mkDAO(o){const sym=o.sym;const a={id:sym,sym,name:o.name+' governance',cls:'dao',p:o.price,vol:.05,sup:o.supply,shape:'dao',pal:o.pal||'violet',desc:o.desc,open:o.price,closes:[],liq:o.cash};
 let x=o.price;for(let i=0;i<120;i++){x*=Math.exp(.05/Math.sqrt(24)*gauss());a.closes.unshift(x)}const k=o.price/a.closes[a.closes.length-1];a.closes=a.closes.map(v=>v*k);S.assets.push(a);
 const d={id:uid(8),name:o.name,sym,desc:o.desc,cash:o.cash,h:o.h||{},quorum:o.quorum||.1,members:o.members||ri(80,900),proposals:[],t:S.t,mine:!!o.mine,focus:o.focus||'any'};S.daos.push(d);return d}

 mkDAO({name:'Archive Art Collective',sym:'ARCH',price:.8,supply:2e7,cash:6e6,h:{ETH:900},desc:'Collects file NFTs and pays artists grants.',pal:'amethyst',focus:'nft'});
 mkDAO({name:'Grid Energy DAO',sym:'GRID',price:1.4,supply:1e7,cash:8e6,h:{KWH:3e7,CO2:80000},desc:'Funds community solar; holds energy and carbon tokens.',pal:'lime',focus:'novel'});
 S.daos.forEach(d=>{d.proposals.push({id:uid(6),title:'Raise the grants budget by 5%',kind:'text',amt:0,yes:ri(1e5,4e5),no:ri(5e4,2e5),uv:{},end:S.t+86400e3*2,status:'open',by:'member'})})}
function daoNAV(d){let v=d.cash;for(const k in d.h){const a=A(k);if(a)v+=d.h[k]*a.p}return v}
function daoGovHeld(d){return S.wallets.reduce((s,w)=>s+(w.h[d.sym]||0),0)}
PAGES.dao=()=>{if(MEM.dao&&S.daos.find(d=>d.id===MEM.dao))return daoDetail(S.daos.find(d=>d.id===MEM.dao));MEM.dao=null;const sub=subOf('dao','list');
 return `<h1>DAO Market</h1><p class="sub">DAOs are groups run by token votes. Buy governance tokens to get votes, propose how the treasury trades, and compare each token's price with what the treasury holds (NAV).</p>
 ${subTabs('dao',[['list','All DAOs'],['new','+ Start a DAO']])}
 ${sub==='new'?daoNewForm():`<div class="card"><table><tr><th>DAO</th><th>Token</th><th class="n">Token price</th><th class="n">Treasury (NAV)</th><th class="n">NAV / token</th><th class="n">Premium</th><th class="n">Members</th><th class="n">Open votes</th><th class="n">Your votes</th></tr>
 ${S.daos.map(d=>{const a=A(d.sym),nav=daoNAV(d),pt=nav/a.sup,prem=a.p/pt-1;return `<tr class="click" onclick="MEM.dao='${d.id}';render()"><td>${logoOf(a,22)} <b>${esc(d.name)}</b> ${d.mine?'<span class="pill b">yours</span>':''}</td><td>${esc(d.sym)}</td><td class="n">${usd(a.p)}</td><td class="n">$${big(nav)}</td><td class="n">${usd(pt)}</td><td class="n ${cls(-prem)}">${pct(prem)}</td><td class="n">${d.members}</td><td class="n">${d.proposals.filter(p=>p.status==='open').length}</td><td class="n">${big(daoGovHeld(d))}</td></tr>`}).join('')}</table></div>`}`};
function daoNewForm(){return `<div class="card" style="max-width:640px"><h3>Start a DAO</h3><div class="grid g2"><label class="f">Name<input id="dnN" placeholder="e.g. Pearl Divers DAO"></label><label class="f">Token symbol<input id="dnS" placeholder="PEARL"></label>
 <label class="f">Token supply<input id="dnSup" type="number" value="1000000"></label><label class="f">Your share of tokens (%)<input id="dnMy" type="number" value="20"></label>
 <label class="f">Starting treasury from your cash (USD)<input id="dnCash" type="number" value="20000"></label><label class="f">Quorum (% of supply that must vote)<input id="dnQ" type="number" value="10"></label>
 <label class="f">Focus<select id="dnF"><option value="any">Anything</option><option value="coin">Coins</option><option value="gem">Gems & pearls</option><option value="bar">Bullion</option><option value="nft">File NFTs</option><option value="novel">New crypto types</option></select></label><label class="f">Colour<select id="dnP">${Object.keys(PALETTES).map(p=>`<option>${p}</option>`).join('')}</select></label></div>
 <label class="f" style="margin-top:6px">Mission<textarea id="dnD"></textarea></label><div class="row end"><button class="pri" onclick="daoCreate()">Create DAO</button></div></div>`}
function daoCreate(){const w=W(),sym=val('dnS').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6),sup=Math.max(1000,num('dnSup')),cash=Math.max(0,num('dnCash')),my=clamp(num('dnMy'),0,100)/100;
 if(!val('dnN')||!sym)return toast('Give it a name and symbol.');if(A(sym))return toast('That symbol is taken.');if(cash>w.cash)return toast('Not enough cash.');
 w.cash-=cash;const price=Math.max(.0001,cash/sup*1.0);const d=mkDAO({name:val('dnN'),sym,price,supply:sup,cash,desc:val('dnD'),pal:val('dnP'),quorum:num('dnQ')/100,members:1,mine:true,focus:val('dnF')});
 w.h[sym]=sup*my;w.cost[sym]=cash;addTx(w.addr,'dao:'+d.id,'USD',cash,'dao-fund','Funded '+d.name);addTx('mint',w.addr,sym,sup*my,'mint','Founder tokens');MEM.dao=d.id;MEM.sub.dao='list';save();render()}
const PROP_KINDS={buy:'Buy an asset with treasury cash',sell:'Sell a treasury asset',grant:'Send a grant to an address',buyback:'Buy back & burn tokens',dividend:'Pay a dividend to token holders',buynft:'Buy a listed file NFT',text:'Text / signal vote'};
function daoDetail(d){const a=A(d.sym),nav=daoNAV(d),w=W(),my=w.h[d.sym]||0;
 return `<button class="sm" onclick="MEM.dao=null;render()">← All DAOs</button><div class="row" style="margin:8px 0">${logoOf(a,44)}<div><h1 style="margin:0">${esc(d.name)}</h1><div class="small muted">${esc(d.desc)}</div></div></div>
 <div class="grid g4"><div class="stat"><div class="k">Treasury NAV</div><div class="v">${usd(nav)}</div></div><div class="stat"><div class="k">${esc(d.sym)} price</div><div class="v">${usd(a.p)}</div><div class="small muted">NAV/token ${usd(nav/a.sup)}</div></div><div class="stat"><div class="k">Your votes (this wallet)</div><div class="v">${big(my)}</div><div class="small muted">${(my/a.sup*100).toFixed(2)}% of supply</div></div><div class="stat"><div class="k">Quorum</div><div class="v">${(d.quorum*100).toFixed(0)}%</div></div></div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><h3>Treasury</h3><table><tr><td>Cash</td><td class="n">${usd(d.cash)}</td></tr>${Object.keys(d.h).map(k=>{const x=A(k);return x?`<tr><td>${logoOf(x,18)} ${esc(k)}</td><td class="n">${fmt(d.h[k])} · ${usd(d.h[k]*x.p)}</td></tr>`:''}).join('')}
  ${S.nfts.filter(n=>n.own['dao:'+d.id]).map(n=>`<tr><td>🖼 ${esc(n.name)}</td><td class="n">${n.own['dao:'+d.id]}</td></tr>`).join('')}</table>
  <div class="row" style="margin-top:8px"><button class="sm" onclick="MEM.sel='${d.sym}';go('ex')">Trade ${esc(d.sym)}</button><input id="dDep" type="number" placeholder="USD" style="width:90px"><button class="sm" onclick="daoDonate('${d.id}',num('dDep'))">Donate to treasury</button></div></div>
 <div class="card"><h3>New proposal</h3>${my>0?`<div class="col"><select id="ppK" onchange="MEM.ppk=this.value;render()">${Object.entries(PROP_KINDS).map(([k,l])=>`<option value="${k}" ${MEM.ppk===k?'selected':''}>${l}</option>`).join('')}</select>${propFields(d)}
  <input id="ppT" placeholder="Title (why should members vote yes?)"><div class="row"><label class="f">Voting days<input id="ppD" type="number" value="2" style="width:80px"></label><button class="pri" onclick="daoPropose('${d.id}')">Submit</button></div></div>`:`<p class="small muted">Hold ${esc(d.sym)} in this wallet to propose and vote.</p>`}</div></div>
 <div class="card"><h3>Proposals</h3>${d.proposals.slice().reverse().map(p=>{const tot=p.yes+p.no,tq=tot/a.sup;return `<div style="border-bottom:1px solid var(--ln);padding:8px 0"><div class="row" style="justify-content:space-between"><b>${esc(p.title)}</b><span class="pill ${p.status==='passed'?'g':p.status==='failed'?'r':'y'}">${p.status}</span></div>
  <div class="small muted">${esc(PROP_KINDS[p.kind])}${p.amt?' · '+usd(p.amt):''}${p.asset?' · '+esc(p.asset):''} · by ${esc(p.by)} · ${p.status==='open'?'ends '+dt(p.end):'ended'}</div>
  <div class="bar" style="margin:4px 0"><i style="width:${tot?p.yes/tot*100:0}%;background:var(--up)"></i></div><div class="small">Yes ${big(p.yes)} · No ${big(p.no)} · turnout ${(tq*100).toFixed(1)}% (needs ${(d.quorum*100).toFixed(0)}%)</div>
  ${p.status==='open'&&my>0&&!p.uv[w.id]?`<div class="row" style="margin-top:4px"><button class="sm buy" onclick="daoVote('${d.id}','${p.id}',1)">Vote yes (${big(my)})</button><button class="sm sell" onclick="daoVote('${d.id}','${p.id}',0)">Vote no</button></div>`:p.uv[w.id]?`<div class="small">You voted ${p.uv[w.id]}.</div>`:''}${p.result?`<div class="small">${esc(p.result)}</div>`:''}</div>`}).join('')||'<div class="muted small">No proposals yet.</div>'}</div>`}
function propFields(d){const k=MEM.ppk||'buy';if(k==='buy')return `<div class="row"><select id="ppA">${S.assets.filter(a=>a.sym!==d.sym).map(a=>`<option>${a.id}</option>`).join('')}</select><input id="ppAmt" type="number" placeholder="USD to spend"></div>`;
 if(k==='sell')return `<div class="row"><select id="ppA">${Object.keys(d.h).map(x=>`<option>${x}</option>`).join('')}</select><input id="ppAmt" type="number" placeholder="Fraction 0–1 to sell" step=".1" value="1"></div>`;
 if(k==='grant')return `<div class="row"><select id="ppA">${S.wallets.map(x=>`<option value="${x.id}">You: ${esc(x.name)}</option>`).join('')}<option value="ext">Outside artist</option></select><input id="ppAmt" type="number" placeholder="USD"></div>`;
 if(k==='buyback'||k==='dividend')return `<input id="ppAmt" type="number" placeholder="USD">`;
 if(k==='buynft')return `<select id="ppA">${S.nfts.filter(n=>n.listings.some(l=>l.w==='ext')).map(n=>`<option value="${n.id}">${esc(n.name)} (${usd(Math.min(...n.listings.map(l=>l.price)))})</option>`).join('')}</select>`;return ''}
function daoPropose(id){const d=S.daos.find(x=>x.id===id),k=MEM.ppk||'buy';const p={id:uid(6),title:val('ppT')||PROP_KINDS[k],kind:k,amt:num('ppAmt'),asset:val('ppA'),yes:0,no:0,uv:{},end:S.t+Math.max(.1,num('ppD'))*86400e3,status:'open',by:'you'};d.proposals.push(p);
 addTx(W().addr,'dao:'+d.id,d.sym,0,'proposal',p.title);save();toast('Proposal submitted.');render()}
function daoVote(id,pid,yes){const d=S.daos.find(x=>x.id===id),p=d.proposals.find(x=>x.id===pid),w=W(),v=w.h[d.sym]||0;if(!v||p.uv[w.id])return;p.uv[w.id]=yes?'yes':'no';if(yes)p.yes+=v;else p.no+=v;addTx(w.addr,'dao:'+d.id,d.sym,v,'vote',(yes?'Yes on: ':'No on: ')+p.title);save();render()}
function daoDonate(id,amt){const d=S.daos.find(x=>x.id===id),w=W();if(!(amt>0)||amt>w.cash)return toast('Check the amount.');w.cash-=amt;d.cash+=amt;addTx(w.addr,'dao:'+d.id,'USD',amt,'donation','Donation');save();render()}
function daoExec(d,p){const a=A(d.sym);let r='';
 if(p.kind==='buy'){const x=A(p.asset),amt=Math.min(p.amt,d.cash);if(x&&amt>0){d.cash-=amt;d.h[x.id]=(d.h[x.id]||0)+amt/quote(x).ask;r=`Bought ${fmt(amt/x.p)} ${x.sym}.`}}
 else if(p.kind==='sell'){const x=A(p.asset),f=clamp(p.amt||1,0,1);if(x&&d.h[x.id]){const q=d.h[x.id]*f;d.h[x.id]-=q;if(d.h[x.id]<1e-9)delete d.h[x.id];d.cash+=q*quote(x).bid;r=`Sold ${fmt(q)} ${x.sym}.`}}
 else if(p.kind==='grant'){const amt=Math.min(p.amt,d.cash);d.cash-=amt;const w=S.wallets.find(x=>x.id===p.asset);if(w)w.cash+=amt;r=`Granted ${usd(amt)}.`}
 else if(p.kind==='buyback'){const amt=Math.min(p.amt,d.cash);d.cash-=amt;const q=amt/a.p;a.sup=Math.max(1,a.sup-q);a.p*=1+amt/Math.max(1e4,a.liq||1e5)*.5;r=`Bought back and burned ${big(q)} ${d.sym}.`}
 else if(p.kind==='dividend'){const amt=Math.min(p.amt,d.cash);d.cash-=amt;S.wallets.forEach(w=>{const s=(w.h[d.sym]||0)/a.sup;if(s>0){w.cash+=amt*s}});r=`Paid ${usd(amt)} out; your wallets got their share.`}
 else if(p.kind==='buynft'){const n=nftById(p.asset);const l=n&&n.listings.find(l=>l.w==='ext');if(l&&d.cash>=l.price){d.cash-=l.price;l.qty--;if(!l.qty)n.listings=n.listings.filter(x=>x!==l);n.own['dao:'+d.id]=(n.own['dao:'+d.id]||0)+1;n.last=l.price;n.hist.push({t:S.t,k:'sale',from:'collector',to:d.name,q:1,px:l.price});r='Bought the NFT.'}else r='Could not buy (sold out or not enough cash).'}
 else r='Signal recorded.';addTx('dao:'+d.id,'',p.kind,p.amt||0,'dao-exec',p.title+': '+r);return r}
function daoTick(dt){for(const d of S.daos){const a=A(d.sym);if(!a)continue;const pt=daoNAV(d)/a.sup;a.p+=(pt*(d.mine?1.05:.95)-a.p)*Math.min(1,dt*.15);
 if(!d.mine&&Math.random()<dt*.25&&d.proposals.filter(p=>p.status==='open').length<3){const pool=S.assets.filter(x=>d.focus==='any'||x.cls===d.focus||(d.focus==='gem'&&x.cls==='pearl'));const x=pick(pool.length?pool:S.assets);
  d.proposals.push(pick([{title:'Buy '+x.sym+' for the treasury',kind:'buy',asset:x.id,amt:Math.round(d.cash*rnd(.02,.08))},{title:'Quarterly dividend',kind:'dividend',amt:Math.round(d.cash*.01)},{title:'Buy back tokens',kind:'buyback',amt:Math.round(d.cash*.02)},{title:'Fund a community grant',kind:'text',amt:0}]));const p=d.proposals[d.proposals.length-1];Object.assign(p,{id:uid(6),yes:0,no:0,uv:{},end:S.t+86400e3*rnd(1,3),status:'open',by:'member'})}
 for(const p of d.proposals){if(p.status!=='open')continue;const others=a.sup-daoGovHeld(d);p.yes+=others*dt*rnd(0,.09)*(d.mine?.3:1);p.no+=others*dt*rnd(0,.06)*(d.mine?.3:1);
  if(S.t>=p.end){const tq=(p.yes+p.no)/a.sup;if(tq>=d.quorum&&p.yes>p.no){p.status='passed';p.result=daoExec(d,p)}else{p.status='failed';p.result=tq<d.quorum?'Not enough votes (quorum missed).':'More no than yes.'}
   if(p.by==='you'||Object.keys(p.uv).length)alertMsg(`${d.name}: “${p.title}” ${p.status}.`)}}
 if(d.proposals.length>30)d.proposals.splice(0,d.proposals.length-30)}}

function emission(d){const out=[];for(let y=0;y<=10;y++){const m=y*12;const vestF=m<d.cliff?d.tge/100:Math.min(1,d.tge/100+(1-d.tge/100)*(m-d.cliff)/Math.max(1,d.vest));const locked=(d.alloc.team+d.alloc.investors)/100,free=1-locked;let base=d.supply*(free+locked*vestF);
 if(d.model==='inflation')base*=Math.pow(1+d.infl/100,y);if(d.model==='burn')base*=Math.pow(1-Math.min(.5,d.burnPct/100*3),y);if(d.model==='halving'){let mined=0,r=.5;for(let k=0;k<y;k+=d.halvYears){mined+=r*Math.min(d.halvYears,y-k)/d.halvYears;r/=2}base=d.supply*Math.min(1,.02+mined)}
 out.push(Math.max(0,base))}return out}
function riskCheck(d){const it=[];let s=100;const add=(lvl,t,p)=>{it.push([lvl,t]);s-=p};const insiders=(+d.alloc.team||0)+(+d.alloc.investors||0);

 return {score:clamp(Math.round(s),0,100),items:it}}

 inh.push('Ownable');const sup=BigInt(Math.round(d.supply));const ov=['ERC20'].concat(f.capped?['ERC20Capped']:[]).concat(f.pausable?['ERC20Pausable']:[]).concat(f.votes?['ERC20Votes']:[]);

 const c={id:setId+'-'+(j.no||no),set:setId,no:j.no||no,name:String(j.name||'Card').slice(0,40),rar:R,type:String(j.type||'Creature').slice(0,20),sub:j.subtype?String(j.subtype).slice(0,24):null,cost:j.cost==null?null:String(j.cost).slice(0,3),atk:j.power==null?null:j.power,def:j.defence==null?(j.defense==null?null:j.defense):j.defence,
  stats:typeof j.stats==='object'&&j.stats?Object.fromEntries(Object.entries(j.stats).slice(0,6).map(([k,v])=>[String(k).slice(0,8),String(v).slice(0,6)])):{},abil:Array.isArray(j.abilities)?j.abilities.slice(0,4).map(a=>String(a).slice(0,140)):[],lore:String(j.lore||'').slice(0,140),artist:String(j.artist||'').slice(0,30),color:/^#[0-9a-f]{6}$/i.test(j.color||'')?j.color:(CTYPES[j.type]||'#2f5d45'),art,seed:j.art_seed||hashNum(String(j.name)+no)+1,
  sup:{n:Math.max(1,+(j.supply&&j.supply.normal)||RAR[R][3]),f:Math.max(0,+(j.supply&&j.supply.foil)||RAR[R][4])},mint:{n:0,f:0},p:{n:RAR[R][2],f:RAR[R][2]*6},cl:{n:[],f:[]}};

function packEV(s){const cards=T().cards.filter(c=>c.set===s.id);const n=s.packSize||8;const avg=r=>{const l=cards.filter(c=>c.rar===r);return l.length?l.reduce((t,c)=>t+c.p.n*.94+c.p.f*.06,0)/l.length:0};
 const top=.74*avg('R')+.18*avg('E')+.06*avg('L')+.01*avg('M')+.01*avg('R');return Math.max(0,n-3)*avg('C')+2*avg('U')+(top||avg('U'))}
function rollPack(s){const cards=T().cards.filter(c=>c.set===s.id);const open=c=>c.mint.n<c.sup.n||c.mint.f<c.sup.f;const byR=r=>cards.filter(c=>c.rar===r&&open(c));const n=s.packSize||8,out=[];
 for(let i=0;i<n;i++){let r;if(i<n-3)r='C';else if(i<n-1)r='U';else{const x=Math.random();r=x<.01?'M':x<.07?'L':x<.25?'E':'R'}
  let pool=byR(r),k=RKEYS.indexOf(r);while(!pool.length&&k>0){k--;pool=byR(RKEYS[k])}if(!pool.length)pool=cards.filter(open);if(!pool.length)break;

function buyPacks(sid,n){const s=setById(sid),w=W();n=Math.max(1,Math.floor(n||1));const cost=n*s.packPrice;if(w.cash<cost)return toast('Not enough cash.');w.cash-=cost;
 const p=T().packs[w.id]||(T().packs[w.id]={});p[sid]=(p[sid]||0)+n;if(s.mine&&s.owner){const ow=S.wallets.find(x=>x.id===s.owner);if(ow)ow.cash+=cost*.95;s.revenue=(s.revenue||0)+cost*.95}s.sold=(s.sold||0)+n;
 addTx('tcard:'+s.code,w.addr,'PACK-'+s.code,n,'pack-buy',n+' sealed '+s.name+' pack(s)');save();toast(`Bought ${n} pack(s).`);render()}
function openPack(sid){const s=setById(sid),w=W(),p=T().packs[w.id]||{};if(!p[sid])return;const got=rollPack(s);if(!got.length)return toast('This set is fully opened: no copies left.');p[sid]--;
 got.forEach(g=>{addCopy(w.id,g.c,g.v,g.s);tcardHist(g.c,g.v,g.s,'pack',w.name,0,'pulled')});addTx('tcard:'+s.code,w.addr,'PACK-'+s.code,1,'pack-open',got.length+' cards');
 const val=got.reduce((t,g)=>t+cardById(g.c).p[g.v],0);save();render();
 modal(`<h3>${esc(s.name)} pack · worth ≈ ${usd(val)} <span class="small muted">(paid ${usd(s.packPrice)})</span></h3><div class="cgrid" style="justify-content:center">${got.map((g,i)=>{const c=cardById(g.c);return `<div class="reveal" style="animation-delay:${i*.18+(i===got.length-1?.5:0)}s;text-align:center">${cardHTML(c,g.v,g.s,150)}<div class="small" style="line-height:1.3">${g.v==='f'?'★ ':''}<span style="color:${RAR[c.rar][1]}">${RAR[c.rar][0]}</span> · ${usd(c.p[g.v])}</div></div>`}).join('')}</div>
 ${(p[sid]||0)?`<div class="row end" style="margin-top:8px"><button class="pri" onclick="closeModal();openPack('${sid}')">Open another (${p[sid]} left)</button></div>`:''}`)}
function freeSerial(c,v){const held=heldSerials(c.id,v);if(c.mint[v]<=held.size)return null;for(let i=0;i<40;i++){const s=1+Math.floor(Math.random()*c.mint[v]);if(!held.has(s))return s}for(let s=1;s<=c.mint[v];s++)if(!held.has(s))return s;return null}
function buyCard(cid,v){const c=cardById(cid),w=W(),px=cAsk(c,v);if(w.cash<px)return toast('Not enough cash.');const s=freeSerial(c,v);if(!s)return toast('No copies for sale.');w.cash-=px;addCopy(w.id,cid,v,s);c.p[v]*=1.004;tcardHist(cid,v,s,'collector',w.name,px,'sale');addTx('tcard:market',w.addr,'CARD-'+cid,1,'card-buy',c.name+' #'+s);save();toast(`Bought ${c.name} #${s}.`);render()}
function sellCard(cid,v,s){const c=cardById(cid),w=W();const px=cBid(c,v)*(lowSerial(c,s,v)?1.3:1);if(!takeCopy(w.id,cid,v,s))return;w.cash+=px;c.p[v]*=.996;tcardHist(cid,v,s,w.name,'collector',px,'sale');addTx(w.addr,'tcard:market','CARD-'+cid,1,'card-sell',c.name+' #'+s);save();toast('Sold for '+usd(px));render()}

function delistCard(id){const l=T().lists.find(x=>x.id===id);if(!l)return;addCopy(l.w,l.c,l.v,l.s);T().lists=T().lists.filter(x=>x!==l);save();render()}
function sendCard(cid,v,s,to){const w=W(),tw=S.wallets.find(x=>x.id===to);if(!tw)return toast('Make a second wallet first (Wallets page).');if(!takeCopy(w.id,cid,v,s))return;addCopy(tw.id,cid,v,s);tcardHist(cid,v,s,w.name,tw.name,0,'transfer');addTx(w.addr,tw.addr,'CARD-'+cid,1,'card-transfer',cardById(cid).name+' #'+s);save();render()}
function dlCard(cid,v,s){const c=cardById(cid);download(`${(setById(c.set)||{}).code}-${c.no}-${c.name.replace(/\W+/g,'_')}${v==='f'?'-foil':''}-${s}.svg`,cardFile(c,v,s),'image/svg+xml')}
function dlCardJSON(cid,v,s){const c=cardById(cid);const j=rcardJSON(c,v,s);j.sha256=cardHash(c,v,s);download(`${(setById(c.set)||{}).code}-${c.no}${v==='f'?'-foil':''}-${s}.rcard.json`,JSON.stringify(j,null,2),'application/json')}
function verifyCard(cid,v,f){const c=cardById(cid);const r=new FileReader();r.onload=()=>{const h=sha256(new Uint8Array(r.result));const mine=S.wallets.flatMap(w=>copies(w.id,cid,v));const hit=[...heldSerials(cid,v)].find(s=>cardHash(c,v,s)===h);
 modal(hit?`<h3 class="up">✔ Genuine: ${esc(c.name)} #${hit}</h3><p>Byte-for-byte the card file for serial #${hit}${mine.includes(hit)?' (you own it)':''}.</p>`:`<h3 class="dn">✘ Not a known copy</h3><p>That file doesn't match any serial of this card held here. Edited or copied-and-changed files never match.</p>`)};r.readAsArrayBuffer(f)}
function acceptTrade(id){const o=T().offers.find(x=>x.id===id);if(!o)return;const w=S.wallets.find(x=>copies(x.id,o.want.c,o.want.v).includes(o.want.s));if(!w){T().offers=T().offers.filter(x=>x!==o);save();render();return toast('You no longer have that card.')}
 takeCopy(w.id,o.want.c,o.want.v,o.want.s);tcardHist(o.want.c,o.want.v,o.want.s,w.name,o.who,0,'trade');if(o.give){addCopy(w.id,o.give.c,o.give.v,o.give.s);tcardHist(o.give.c,o.give.v,o.give.s,o.who,w.name,0,'trade')}w.cash+=o.cash||0;
 T().offers=T().offers.filter(x=>x!==o);addTx('tcard:'+o.who,w.addr,'CARD-'+o.want.c,1,'card-trade','Trade with '+o.who);save();toast('Trade done.');render()}
function tcardTick(dt){const t=T();if(!t)return;
 for(const c of t.cards){if(!(setById(c.set)||{}).published)continue;for(const v of ['n','f']){if(!c.mint[v])continue;c.p[v]=Math.max(.01,c.p[v]*Math.exp(gauss()*.045*Math.sqrt(dt)+(c.hot||0)*dt));c.cl[v].push(+c.p[v].toPrecision(4));if(c.cl[v].length>60)c.cl[v].shift()}if(c.hot){c.hotLeft-=dt;if(c.hotLeft<=0)c.hot=0}}
 if(Math.random()<dt*.12){const c=pick(t.cards.filter(c=>(setById(c.set)||{}).published&&c.mint.n));if(c){c.hot=.5;c.hotLeft=1.5;news(`Tournament winner plays ${c.name}; collectors chase copies`)}}
 for(const l of [...t.lists]){const c=cardById(l.c);if(!c)continue;if(Math.random()<dt*.8*Math.exp(-(l.price/c.p[l.v]-1)*4)){const w=S.wallets.find(x=>x.id===l.w);t.lists=t.lists.filter(x=>x!==l);if(w)w.cash+=l.price*.97;tcardHist(l.c,l.v,l.s,w?w.name:'you','collector',l.price,'sale');alertMsg(`Card sold: ${c.name} #${l.s} for ${usd(l.price)}`)}}
 for(const s of t.sets){if(!s.mine||!s.published)continue;const ev=packEV(s),d=dt*30*Math.pow(clamp(ev/Math.max(.01,s.packPrice),.1,2),2)*(1+S.hype*.2);let n=Math.floor(d)+(Math.random()<d%1?1:0);
  if(n>0){let sold=0;for(let i=0;i<n;i++){if(!rollPack(s).length)break;sold++}if(sold){const ow=S.wallets.find(x=>x.id===s.owner);const rev=sold*s.packPrice*.95;if(ow)ow.cash+=rev;s.sold=(s.sold||0)+sold;s.revenue=(s.revenue||0)+rev}}}
 if(Math.random()<dt*.3&&t.offers.length<5){const all=[];S.wallets.forEach(w=>{const o=t.own[w.id]||{};for(const k in o)o[k].forEach(s=>all.push([k,s]))});if(all.length){const [k,s]=pick(all),[cid,v]=k.split('|'),c=cardById(cid);
  const val=c.p[v]*(lowSerial(c,s,v)?1.3:1);const g=Math.random()<.5?pick(t.cards.filter(x=>x.id!==cid&&x.mint.n&&x.p.n<val*1.1&&(setById(x.set)||{}).published)):null;const gs=g?freeSerial(g,'n'):null;
  t.offers.push({id:uid(6),who:pick(['deckbuilder99','foil.hunter','matrix_mage','collector.eth','sealedpack','grailseeker']),want:{c:cid,v,s},give:g&&gs?{c:g.id,v:'n',s:gs}:null,cash:+Math.max(0,val*rnd(1,1.25)-(g&&gs?g.p.n:0)).toFixed(2)})}}}

const CARD_FORMAT_MD=`# Randis card file format (v1)

Randis UDS™ by Randy Moore · https://github.com/RandyWilliamMoore/randis-uds

Used by Mintworks Exchange's Trading Card Card Exchange. Any tab or program can read and write it. Cards move between tabs as files.

## A set: \`*.rset.json\`
\`\`\`json
{ "format": "randis-card-set", "version": 1, "game": "MCM",
  "set": { "code": "MCM1", "name": "My first set", "description": "", "pack_price": 4, "pack_size": 8 },
  "cards": [ CARD, ... ] }
\`\`\`

## A card (CARD)
| field | type | notes |
|---|---|---|
| no | number | collector number in the set |
| name | text | required |
| rarity | C, U, R, E, L, M | common to mythic |
| type, subtype | text | e.g. Hero / Mage |
| cost | text | shown in the corner |
| power, defence | number or null | shown bottom right |
| stats | object | any numbers your game needs, e.g. {"SPD":3} (up to 6) |
| abilities | list of text | up to 4 |
| lore, artist | text | |
| color | #rrggbb | frame colour |
| art | data URL or null | null = generated art from art_seed |
| supply | {"normal":n,"foil":n} | the most copies that can ever exist |

## One owned copy: \`*.rcard.json\`
\`\`\`json
{ "format": "randis-card", "version": 1, "game": "MCM",
  "set": { "code": "MCM1", "name": "My first set" },
  "card": CARD,
  "copy": { "variant": "normal", "serial": 12 } }
\`\`\`
Many copies: \`{"format":"randis-card-list","version":1,"cards":[ ...randis-card... ]}\`.

## Card picture files
A copy's SVG holds the same randis-card JSON in its \`<metadata>\` tag, so the picture itself is the token. Its SHA-256 is the fingerprint; any change to the file changes it.
`;

 let s='';edges.forEach(([f,t,a,q])=>{const A_=nodes.get(f),B=nodes.get(t);if(!A_||!B)return;const r=Math.max(A_.risk,0);s+=`<line x1="${A_.x}" y1="${A_.y}" x2="${B.x}" y2="${B.y}" stroke="${r>=.85?'#ec5f67':r>=.3?'#f2b632':'#4b5263'}" stroke-width="1.5" marker-end="url(#ar)"/>`});
 nodes.forEach(n=>{const c=n.lvl===0?'#7c6cf0':n.risk>=.85?'#ec5f67':n.risk>=.3?'#f2b632':S.wallets.some(w=>w.addr===n.a)?'#33c3d6':'#2fbf6a';s+=`<g><circle cx="${n.x}" cy="${n.y}" r="9" fill="${c}"/><text x="${n.x}" y="${n.y+22}" font-size="10" text-anchor="middle" fill="#bfc4d1">${esc(addrName(n.a).slice(0,22))}</text></g>`});
 return `<svg viewBox="0 0 ${W_} ${H_}" style="width:100%;height:${H_}px"><defs><marker id="ar" viewBox="0 0 10 10" refX="18" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#868c9c"/></marker></defs>
 <text x="${60}" y="14" font-size="11" fill="#868c9c" text-anchor="middle">2 hops back</text><text x="${60+(W_-120)/3}" y="14" font-size="11" fill="#868c9c" text-anchor="middle">1 hop back</text><text x="${60+2*(W_-120)/3}" y="14" font-size="11" fill="#868c9c" text-anchor="middle">selected</text><text x="${W_-60}" y="14" font-size="11" fill="#868c9c" text-anchor="middle">sent to</text>${s}</svg>`}
function newCase(){const k=pick(Object.keys(PATTERNS)),n=(S.caseTotal||0)+1,ad=()=>'0x'+hex(4)+'…'+hex(3),t0=ri(1,20);let rows=[],tell='';const tm=i=>`Day ${t0}, ${String(8+Math.floor(i/3)).padStart(2,'0')}:${String((i*17)%60).padStart(2,'0')}`;
 if(k==='peel'){let amt=ri(40,90),cur=ad();for(let i=0;i<7;i++){const nx=ad(),cut=+(rnd(.3,1.2)).toFixed(2);rows.push([tm(i),cur,ad(),cut+' BTC']);amt-=cut;rows.push([tm(i),cur,nx,amt.toFixed(2)+' BTC']);cur=nx}tell='each hop sends a small piece out and the big remainder to a brand-new wallet.'}
 if(k==='smurf'){const dst=ad();for(let i=0;i<9;i++)rows.push([tm(i),ad(),dst,'$'+ri(9100,9950).toLocaleString()+' USDT']);tell='many senders, one receiver, every amount just below $10,000.'}
 if(k==='mixer'){const m='Mixer pool';rows.push([tm(0),ad(),m,'7.31 ETH']);for(let i=1;i<8;i++)rows.push([tm(i+3),m,ad(),'1.00 ETH']);tell='an odd amount goes in; identical round amounts come out to new wallets.'}
 if(k==='bridge'){const a=ad();rows=[[tm(0),a,'Bridge → Chain B','120,000 USDC'],[tm(1),'Bridge (Chain B)',ad(),'119,880 USDC'],[tm(2),'DEX swap','—','→ 41.2 ETH'],[tm(3),ad(),'Bridge → Chain C','41.2 ETH'],[tm(4),'DEX swap','—','→ 1,960 SOL'],[tm(5),ad(),'Exchange deposit','1,955 SOL']];tell='rapid bridge jumps and swaps within hours, ending at an exchange.'}
 if(k==='wash'){const a=ad(),b=ad();for(let i=0;i<6;i++){const p=(2+i*1.5).toFixed(1);rows.push([tm(i),i%2?b:a,i%2?a:b,'NFT #4471 for '+p+' ETH'])}tell='the same NFT bounces between the same two wallets at rising prices, both funded from one source.'}
 if(k==='round'){const me=ad(),c1=ad(),c2=ad();rows=[[tm(0),me,c1,'50,000 USDC'],[tm(1),c1,c2,'49,900 USDC'],[tm(2),c2,'"Consulting LLC"','49,800 USDC'],[tm(3),'"Consulting LLC"',me,'49,500 USDC (invoice: services)']];tell='the money comes back to where it started, dressed up as payment for services.'}
 if(k==='fan'){const src=ad(),dst=ad();for(let i=0;i<5;i++)rows.push([tm(i),src,ad(),'0.8 BTC']);for(let i=0;i<5;i++)rows.push([tm(i+6),ad(),dst,'0.79 BTC']);tell='one wallet splits funds to many, which a day later all send to one new wallet.'}
 return {k,n,rows,tell,done:false}}
function answerCase(k){const c=MEM.case;if(c.done)return;c.done=true;c.ok=k===c.k;S.caseTotal=(S.caseTotal||0)+1;if(c.ok)S.caseScore=(S.caseScore||0)+1;save();render()}

/* ================= LEARN ================= */
const GLOSS=[['Blockchain','A shared ledger copied across many computers; new entries are added in blocks that link to the previous one.'],['Coin vs token','A coin runs on its own blockchain (BTC); a token is issued by a contract on someone else\'s chain (an ERC-20 on Ethereum).'],
 ['NFT','Non-fungible token: a unique token. Here it holds the whole file; on most real chains it only points to a file stored elsewhere, which is why “real” on-chain storage is rare and expensive.'],['Fractional NFT','An NFT locked in a vault and split into many fungible coins.'],
 ['Hash / fingerprint','A short code computed from data. Change one byte and the hash changes completely, which is how files are verified.'],['Wallet & keys','A wallet holds the private key that signs transfers. Whoever has the recovery words owns the coins.'],
 ['Stablecoin','A token designed to stay at a fixed price, usually $1, by holding reserves or using algorithms.'],['Tokenised gold / gems / pearls','A token that is a claim on a physical item held by a custodian. It is only as good as the custodian and the audits.'],
 ['Proof of reserve','Public evidence that backing assets really exist.'],['DAO','Decentralised autonomous organisation: a treasury controlled by votes of token holders.'],['Quorum','The minimum share of votes needed for a proposal to count.'],['NAV','Net asset value: what a treasury holds, divided by tokens.'],
 ['Liquidity pool','Two assets locked in a contract so people can trade; price comes from the ratio.'],['Rug pull','Creators remove liquidity or dump tokens, leaving buyers with worthless coins.'],['Vesting & cliff','Locked tokens that unlock gradually; nothing unlocks before the cliff.'],
 ['ICO / IEO / IDO','Initial coin, exchange and DEX offerings: ways of selling a new token to the public.'],['STO','Security token offering: a token sale run under securities law.'],['Howey test','The US test for whether something is an investment contract (a security).'],['MiCA','The EU\'s crypto-asset rules: white papers, licensed service providers, stablecoin rules.'],
 ['KYC / AML','Know your customer and anti-money laundering checks that licensed exchanges must run.'],['Travel Rule','Exchanges must pass sender and receiver details along with larger transfers.'],['Mixer','A service that pools and re-sends coins to hide their origin; widely used for laundering and often sanctioned.'],
 ['Taint','The share of coins linked to illicit sources by chain analysis.'],['Wash trading','Trading with yourself to fake volume or prices.'],['Market cap / FDV','Price × circulating supply / price × total supply.'],['Order book','The list of buy (bid) and sell (ask) orders waiting to fill.'],['Limit / stop orders','Limit: only at your price or better. Stop: becomes an order once a trigger price is hit.'],
 ['Slippage','The difference between expected and actual fill price, larger in thin markets.'],['Gas','The fee paid to the network to process a transaction.'],['Airdrop','Free tokens sent to many wallets, usually for marketing.'],['Halving','A scheduled cut in the mining reward (Bitcoin\'s happens about every 4 years).'],['Burn','Sending tokens to an address nobody controls, removing them from supply.'],['Royalty','A creator\'s share of each resale of their NFT.']];
PAGES.learn=()=>`<h1>Learn</h1><div class="grid g2"><div class="card"><h3>How a coin goes from idea to market here</h3><ol class="small"><li><b>Creation Suite:</b> design the kind, supply, backing, allocation and contract features. Fix what the Risk check flags.</li><li><b>Mint:</b> create the supply and seed a liquidity pool.</li><li><b>Launchpad:</b> sell the sale share in an ICO/IEO/IDO/etc., or skip and list directly.</li><li><b>Marketing:</b> plan the budget, make the content kit and landing page, stay within the rules.</li><li><b>Trading Cards:</b> design card sets, sell packs, trade serial-numbered card files; import sets from your own card game.</li><li><b>Exchange:</b> it trades; manage supply and liquidity on the Mint page.</li><li><b>Coin Laundry / Hyper Laundry:</b> keep your record clean and learn what investigators look for.</li></ol></div>
 <div class="card"><h3>Before doing any of this for real</h3><ul class="small"><li>Never invest more than you can lose.</li><li>Talk to a lawyer about token sales. Many are securities offerings.</li><li>Get contracts audited; use a multisig.</li><li>Keep records for tax.</li><li>Beware anyone who DMs you first, promises returns, or asks for recovery words.</li></ul></div></div>
 <div class="card"><h3>Glossary</h3><input placeholder="Filter…" oninput="$$('.gl').forEach(e=>e.style.display=e.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')" style="margin-bottom:8px">${GLOSS.map(([k,v])=>`<div class="gl small" style="margin:5px 0"><b>${k}</b>: ${v}</div>`).join('')}</div>`;

/* ================= SETTINGS ================= */
PAGES.set=()=>`<h1>Settings</h1><div class="grid g2"><div class="card"><h3>Simulation</h3><label class="f">Speed<select onchange="S.speed=+this.value;save();renderTop()">${SPEEDS.map(([v,l])=>`<option value="${v}" ${S.speed===v?'selected':''}>${l}</option>`).join('')}</select></label>
 <label class="f" style="margin-top:6px">Trading fee (%)<input type="number" step=".01" value="${S.opts.fee*100}" onchange="S.opts.fee=clamp(+this.value/100,0,.05);save()"></label>
 <label class="ck" style="margin-top:6px"><input type="checkbox" ${S.opts.rug?'checked':''} onchange="S.opts.rug=this.checked;save()"> Run the MOON rug-pull lesson</label>
 <label class="ck"><input type="checkbox" ${S.opts.dust?'checked':''} onchange="S.opts.dust=this.checked;save()"> Unrequested deposits (for Coin Laundry practice)</label></div>
 <div class="card"><h3>Your data</h3><p class="small">Everything saves inside this tab. Storage used: <b>${fsize(storeBytes())}</b> of 1 MB.</p><div class="bar"><i style="width:${Math.min(100,storeBytes()/1048576*100)}%;background:${storeBytes()>900000?'var(--dn)':'var(--ac)'}"></i></div>
 <div class="row" style="margin-top:10px"><button onclick="download('mintworks-backup.json',JSON.stringify(S),'application/json')">Save backup</button><button onclick="pickFile('.json',f=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.assets||!d.wallets)throw 0;S=d;MEM.candles={};save();render();toast('Backup loaded.')}catch(e){toast('That isn\\'t a Mintworks backup.')}};r.readAsText(f)})">Load backup</button>
 <button class="sell" onclick="if(confirm('Start over? Everything in this tab is erased.')){S=freshState();seedNFTs();seedDAOs();seedCards();MEM.candles={};save();render()}">Start over</button></div></div></div>
 <div class="card small muted">Mintworks Exchange is a simulation for learning and designing. It does not connect to any blockchain, exchange or wallet, and nothing in it has real-world value. Randis UDS™ by Randy Moore.</div>`;

/* ================= BOOT ================= */
function boot(d){if(loaded)return;try{S=d&&d.assets&&d.wallets?d:null}catch(e){S=null}
 if(!S){S=freshState();seedNFTs();seedDAOs()}if(!S.tcard)seedCards();S.opts=Object.assign({fee:.001,rug:true,dust:true},S.opts||{});S.mkt=S.mkt||{plan:{}};['nfts','daos','drafts','sales','alerts','quar','certs','orders','fills'].forEach(k=>S[k]=S[k]||[]);
 loaded=true;render();if(!window._tk)window._tk=setInterval(tick,1000)}
addEventListener('message',e=>{const d=e.data;if(!d||typeof d.uds!=='string')return;
 if(d.uds==='store'){if(fallback){fallback=false;loaded=false}boot(d.data)}
 if(d.uds==='store-error')toast('Could not save: '+d.note,6000);
 if(d.uds==='exported'||d.uds==='exporting')toast(d.note,4000)});
if(HOST){parent.postMessage({uds:'store-get'},'*');setTimeout(()=>{if(!loaded){fallback=true;let d=null;try{d=JSON.parse(localStorage.getItem('mintworks'))}catch(e){}boot(d);toast('Couldn\'t reach the app\'s storage; changes won\'t be saved this session.',6000)}},3000)}
else{let d=null;try{d=JSON.parse(localStorage.getItem('mintworks'))}catch(e){}boot(d)}
</script>
