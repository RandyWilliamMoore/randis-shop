let S;
function load() {

function logIt(kind, text, extra) { S.log.push(Object.assign({ t: now(), kind, text }, extra || {})); if (S.log.length > 1500) S.log.splice(0, S.log.length - 1500); save(); }

// ---- the app bridge: {uds:"media", id, op, args} -> {uds:"media", id, r}
const PEND = {};
let BRIDGE = window.parent !== window;

// ---- the AI newsroom
let AI_BUSY = 0;
function aiState() { const el = $("#aiState"); if (el) el.innerHTML = AI_BUSY ? `<span class="busy"></span> AI working (${AI_BUSY})` : ""; }

    `HOUSE VOICE: ${S.style.voice}\nRULES:\n${S.style.rules}\nAVOID WORDS: ${S.style.banned}`;
}
async function ai(prompt, opts) {
  opts = opts || {};

  try {
    const r = await call("ask", { text: prompt, system: styleBrief() + (opts.system ? "\n" + opts.system : ""), max: opts.max || 6000 });
    if (r.error) throw new Error(r.error);
    let p;
    for (;;) {
      await sleep(700);
      p = await call("poll", { job: r.job });
      if (p.error) throw new Error(p.error);

function parseJSON(text) {
  let t = String(text || "");
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (m) t = m[1];
  const a = t.indexOf("{"), b = t.lastIndexOf("}"), a2 = t.indexOf("[");

  const text = await ai(prompt + "\n\nReply with ONLY JSON in one ```json block, this shape:\n" + shape, opts);

  catch (e) {
    const fix = await ai("This should be valid JSON but isn't. Return it fixed, ONLY the JSON in one ```json block:\n" + text.slice(0, 30000), { max: opts && opts.max });

// ---- markdown (small, safe: escapes first)
function md(src) {
  const inl = s => esc(s)
    .replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, '<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+|mailto:[^)\s]+|[\w./#-]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  const lines = String(src || "").replace(/\r/g, "").split("\n"); let out = "", list = null, para = [];
  const flush = () => { if (para.length) { out += "<p>" + inl(para.join(" ")) + "</p>\n"; para = []; } };
  const endList = () => { if (list) { out += `</${list}>\n`; list = null; } };
  for (const ln of lines) {
    let m;
    if (!ln.trim()) { flush(); endList(); continue; }
    if ((m = ln.match(/^(#{1,4})\s+(.*)/))) { flush(); endList(); const n = m[1].length + 1; out += `<h${n}>${inl(m[2])}</h${n}>\n`; continue; }
    if ((m = ln.match(/^>\s?(.*)/))) { flush(); endList(); out += `<blockquote>${inl(m[1])}</blockquote>\n`; continue; }
    if (/^(-{3,}|\*{3,})$/.test(ln.trim())) { flush(); endList(); out += "<hr>\n"; continue; }
    if ((m = ln.match(/^\s*[-*•]\s+(.*)/))) { flush(); if (list !== "ul") { endList(); out += "<ul>"; list = "ul"; } out += `<li>${inl(m[1])}</li>`; continue; }
    if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { flush(); if (list !== "ol") { endList(); out += "<ol>"; list = "ol"; } out += `<li>${inl(m[1])}</li>`; continue; }
    endList(); para.push(ln.trim());
  }
  flush(); endList();
  return out;
}
const plain = s => String(s || "").replace(/!\[[^\]]*\]\([^)]*\)/g, "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/[#>*_`]/g, "").replace(/\n{2,}/g, "\n").trim();

// ---- files to/from the engine
const b64 = buf => { let s = "", u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

    if (r.error) throw new Error(r.error);
    if (onProg) onProg(Math.min(1, (i + CH) / buf.byteLength));

ETABS.check = p => {

  return `<p class="mu">The editor reads the piece against its sources and lists every claim: supported, not in the sources, or contradicted. Approve only when it's clean.</p>

  ${fc ? `<div class="${fc.verdict === "pass" ? "okb" : "warn"}">${esc(fc.summary || "")}</div><table><tr><th>Claim</th><th>Status</th><th>Note / fix</th></tr>${(fc.claims || []).map(c => `<tr><td>${esc(c.claim)}</td><td><span class="tag ${c.status === "supported" ? "st-published" : c.status === "opinion" ? "st-edit" : "st-factcheck"}">${esc(c.status)}</span></td><td class="sm">${esc(c.note || "")}${c.source ? " [" + esc(c.source) + "]" : ""}</td></tr>`).join("")}</table>
  ${(fc.claims || []).some(c => c.status !== "supported" && c.status !== "opinion") ? `<button data-act="fixClaims">✨ Fix the flagged claims</button>` : ""}` : ""}
  <h3>Other checks</h3><button data-act="aiCheck" data-arg="bias">Balance & fairness</button> <button data-act="aiCheck" data-arg="legal">Legal risk (defamation, privacy, copyright)</button> <button data-act="aiCheck" data-arg="readability">Readability</button><div id="chk"></div>`;
};
function pieceText(p) { return p.kind === "podcast" ? p.lines.map(l => `${byName(l.who)}: ${l.text}`).join("\n") : (p.kind === "video" || p.kind === "newscast") ? p.scenes.map(s => [s.heading, s.text, (s.bullets || []).join("; "), s.stat, s.narration].filter(Boolean).join(" | ")).join("\n") + "\n\n" + p.body : p.body; }
async function factcheck(p) {
  const r = await aiJSON(`Fact-check this ${KINDS[p.kind].name} against its sources. List every factual claim (names, numbers, dates, events, quotes). status: supported (in a source), unsupported (not in any source), contradicted (a source says otherwise) or opinion (clearly labeled view). verdict is pass only if nothing is unsupported or contradicted.\n\nTITLE: ${p.title}\n${pieceText(p).slice(0, 30000)}\n\n${srcBlock(p)}`,
    `{"verdict":"pass|fix","summary":"one or two sentences","claims":[{"claim":"","status":"supported|unsupported|contradicted|opinion","source":"[n] or empty","note":"why / how to fix"}]}`, { max: 7000 });
  p.factcheck = Object.assign({ t: now() }, r); if (r.verdict === "pass" && ["edit", "factcheck", "draft"].includes(p.status)) p.status = "approved"; else if (p.status === "edit" || p.status === "draft") p.status = "factcheck";
  save(); return r;
}

function needEngine(r) { if (r && r.error) throw new Error(r.error); return r; }

// ---- rendering speech
async function speakLines(p, prog) {
  await voices();
  const hosts = hostsOf(p);
  for (let i = 0; i < p.lines.length; i++) {
    const l = p.lines[i], st = staff(l.who) || hosts[0] || {};
    if (l.file && l.said === l.text + "|" + voiceOf(st, hosts.indexOf(st))) continue;
    if (prog) prog(`Voicing line ${i + 1} of ${p.lines.length} (${st.name || "host"})…`, i / p.lines.length);
    const v = voiceOf(st, Math.max(0, hosts.indexOf(st)));
    const r = needEngine(await call("tts", { text: l.text, voice: v, rate: st.rate || 0, name: `l-${p.id}-${i}.wav` }));
    l.file = r.file; l.secs = r.seconds; l.said = l.text + "|" + v; save();
  }
}

  const mp3 = await call("convert", { file: r.file, fmt: "mp3" });
  if (!mp3.error) { p.files.mp3 = mp3.file; forgetURL(mp3.file); }

}
async function narrateArticle(p, prog) {

async function publishPiece(p, t, say) {
  say = say || (() => { });
  const prev = p.status; p.status = "published"; p.pubAt = p.pubAt || now(); save();
  const files = [];
  try { files.push(await coverFile(p)); } catch (e) { say("Cover: " + e.message); }
  if (p.kind === "podcast" && !(p.files.mp3 || p.files.audio) && p.lines.length) { say("Recording the episode first…"); await mixEpisode(p, say); }
  if (p.files.mp4 || p.files.video) files.unshift(p.files.mp4 || p.files.video); else if (p.files.mp3 || p.files.audio) files.unshift(p.files.mp3 || p.files.audio);
  let ok = 0, fail = 0;
  if (t.site) {
    try { say("Building the website…"); await buildSite(say); say("Publishing the website…"); const url = await sitePublish(`Publish: ${p.title}`, say); p.published.push({ t: now(), where: "Website", url: pieceUrl(p) }); logIt("push", "Website: " + p.title, { ok: true, where: "Website", url }); ok++; }
    catch (e) { say("Website: " + e.message); logIt("push", "Website failed: " + e.message, { ok: false, where: "Website" }); fail++; }
  }
  for (const id of t.outlets || []) {
    const o = OUT.find(x => x.id === id) || { name: id, type: "" };
    say(`Sending to ${o.name}…`);
    const soc = p.social || {};
    const social = ({ bluesky: soc.bluesky, mastodon: soc.mastodon, discord: soc.facebook, telegram: soc.facebook, slack: soc.linkedin })[o.type] || soc.x || p.dek;
    const r = await call("push", { id, item: { kind: p.kind, title: p.title, summary: p.dek, social, body_md: bodyFor(p), body_html: htmlFor(p), url: pieceUrl(p), tags: p.tags, files, status: t.status, disclosure: S.net.discloseOn ? S.net.disclosure : "" } });
    if (r.error) { say(`✗ ${o.name}: ${r.error}`); logIt("push", `${o.name} failed: ${r.error}`, { ok: false, where: o.name }); fail++; }
    else { say(`✓ ${o.name}${r.url ? ": " + r.url : ""}${r.note ? " (" + r.note + ")" : ""}`); p.published.push({ t: now(), where: o.name, url: r.url || "", note: r.note || "" }); logIt("push", `${o.name}: ${p.title}`, { ok: true, where: o.name, url: r.url }); ok++; }
  }
  if (!ok && fail) { p.status = prev === "scheduled" ? "approved" : prev; }
  p.updated = now(); save(); say(`Finished: ${ok} sent, ${fail} failed.`); nav();
  return { ok, fail };
}
function bodyFor(p) { return p.kind === "podcast" ? p.body + "\n\n## Transcript\n\n" + p.lines.map(l => `**${byName(l.who)}:** ${l.text}`).join("\n\n") : p.body; }
function htmlFor(p) { return md(bodyFor(p)); }

function nextRun(r) {
  if (!r.last) { const d = new Date(); if (r.at) { const [h, m] = r.at.split(":").map(Number); d.setHours(h, m, 0, 0); if (d.getTime() < now() - 60e3) return now(); return d.getTime(); } return now(); }
  return r.last + r.every * 36e5;
}
let RULE_BUSY = false;
async function runRule(r) {
  if (RULE_BUSY) return; RULE_BUSY = true; r.last = now(); save();
  try {
    logIt("auto", `Rule running: ${r.count} × ${KINDS[r.kind].name}`);
    let pool = [];
    if (r.from === "topic" && r.topic) pool = await fetchFeeds([["Search: " + r.topic, "https://news.google.com/rss/search?q=" + encodeURIComponent(r.topic) + "&hl=en-US&gl=US&ceid=US:en"]]);
    else { if (now() - S.wire.fetched > 30 * 60e3) await ACT.pullWire(); pool = S.wire.items.filter(w => r.from !== "desk" || w.desk === (desk(r.deskId) || {}).name); }
    const used = new Set(S.pieces.flatMap(p => p.sources.map(s => s.link)));
    pool = pool.filter(w => !used.has(w.link)).slice(0, 60);
    if (!pool.length) { logIt("auto", "Nothing new on the wire for this rule."); return; }
    const multi = r.kind === "newscast" || r.kind === "newsletter" || r.kind === "podcast";
    const r2 = await aiJSON(`Pick the ${multi ? "5 most newsworthy distinct stories for one " + KINDS[r.kind].name : r.count + " most newsworthy distinct stories, one per piece"} from these headlines. Skip duplicates and trivial items.\n${pool.map((w, i) => `${i}. ${w.title} (${w.outlet})`).join("\n")}`, `{"items":[0,1]}`);
    const picks = (r2.items || []).map(i => pool[i]).filter(Boolean);
    const groups = multi ? Array.from({ length: r.count }, (_, k) => picks.slice(k * 5, k * 5 + 5)).filter(g => g.length) : picks.slice(0, r.count).map(w => [w]);
    for (const g of groups) {
      const p = newPiece(r.kind, { sources: g.map(srcOf), deskName: g[0].desk, silent: true, topic: r.from === "topic" ? r.topic : "" });
      p.auto = r.id;
      try {
        await generate(p);
        const fc = await factcheck(p);
        if (fc.verdict !== "pass") { await ACT_fix(p); await factcheck(p); }
        if (p.kind === "podcast") await mixEpisode(p);
        if (p.kind === "video" || p.kind === "newscast") await voiceScenes(p);
        if (r.then === "publish" && p.factcheck && p.factcheck.verdict === "pass" && p.kind !== "video" && p.kind !== "newscast") { await refreshStatus(); await publishPiece(p, { site: r.site && !!SITE.folder, outlets: r.outlets || [], status: "publish" }); }
        else { p.status = p.factcheck && p.factcheck.verdict === "pass" ? "approved" : "factcheck"; save(); }
      } catch (e) { logIt("auto", `Autopilot piece failed: ${e.message}`); p.status = "draft"; save(); }
    }
  } finally { RULE_BUSY = false; save(); nav(); if (["auto", "board", "home"].includes(PAGE)) rerender(); }
}
async function ACT_fix(p) {
  const bad = ((p.factcheck || {}).claims || []).filter(c => c.status !== "supported" && c.status !== "opinion"); if (!bad.length || !p.body) return;
  const r = await aiJSON(`Remove or correct these flagged claims so every fact is in the sources:\n${bad.map(c => "- " + c.claim).join("\n")}\n\nBODY:\n${p.body}\n\n${srcBlock(p)}`, `{"body_markdown":""}`, { max: 9000 });
  if (r.body_markdown) { p.revs.push({ t: now(), title: p.title, body: p.body }); p.body = r.body_markdown; save(); }
}
async function tick() {
  for (const p of S.pieces.filter(p => p.status === "scheduled" && p.scheduledAt && p.scheduledAt <= now())) {
    await refreshStatus(); logIt("auto", "Scheduled publish: " + p.title);
    await publishPiece(p, p.schedTargets || { site: !!SITE.folder, outlets: [], status: "draft" });
  }
  if (!S.autopilot) return;
  S.lastAuto = now(); save();
  for (const r of S.rules.filter(r => r.on)) if (nextRun(r) <= now()) { await runRule(r); break; }
}
setInterval(() => { tick().catch(e => logIt("auto", "Autopilot error: " + e.message)); }, 60e3);
