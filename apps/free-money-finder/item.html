<style>

html,body{height:100%}

h3{font-size:15px;margin:2px 0 6px;color:var(--acc)}

p{margin:4px 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 7px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc)}
textarea{width:100%;resize:vertical;min-height:70px}
button{cursor:pointer;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#08130c;border-color:var(--acc);font-weight:600}
button.sm{padding:1px 7px;font-size:12px}
.lnk{color:var(--acc2);cursor:pointer;text-decoration:underline;margin-right:10px;display:inline-block}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
header .t{font-weight:700;font-size:16px}
header .sub{color:var(--mut);font-size:12px}
header .tot{margin-left:auto;font-size:12px;color:var(--mut)}
header .tot b{color:var(--acc)}
main{flex:1;display:flex;min-height:0}
nav{width:210px;background:var(--bg2);border-right:1px solid var(--line);overflow:auto;padding:6px 0;flex-shrink:0}
nav div{padding:5px 14px;cursor:pointer;color:var(--mut)}
nav div:hover{color:var(--tx)}
nav div.on{color:var(--tx);background:var(--bg3);border-left:3px solid var(--acc);padding-left:11px}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;cursor:default;padding-top:12px;color:var(--mut);opacity:.75}
nav .n{float:right;font-size:11px;opacity:.7}
#view{flex:1;overflow:auto;padding:16px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.grid .card{margin:0}
.it .top{display:flex;gap:8px;align-items:flex-start}
.it .top h3{flex:1;margin:0}
.it .val{color:var(--acc2);font-weight:600;font-size:13px;margin:4px 0}
.it .k{color:var(--mut);font-size:12px;font-weight:600}
.it .how{font-size:13px}
.it ol{margin:4px 0 6px 18px;padding:0;font-size:13px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin:0 4px 2px 0;color:var(--mut)}
.tag.ref{border-color:var(--acc);color:var(--acc)}
.tag.r0,.tag.r1{border-color:var(--ok);color:var(--ok)}
.tag.r2{border-color:var(--warn);color:var(--warn)}
.tag.r3{border-color:var(--bad);color:var(--bad)}
.tag.chk{border-color:var(--warn);color:var(--warn)}
.mut{color:var(--mut)}
.sm{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
.chips label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:2px 10px;margin:0 6px 6px 0;cursor:pointer;font-size:13px}
.chips label.on{border-color:var(--acc);background:var(--bg3)}
.chips input{display:none}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{color:var(--mut);font-weight:600}
td input,td select{width:100%}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:150px}
.stat b{display:block;font-size:20px;color:var(--acc)}
.stat span{font-size:12px;color:var(--mut)}
.warnbox{border-left:4px solid var(--warn);background:var(--bg3);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13px}
.badbox{border-left:4px solid var(--bad);background:var(--bg3);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13px}
.okbox{border-left:4px solid var(--ok);background:var(--bg3);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13px}
.aitx{white-space:pre-wrap;background:var(--bg3);border-radius:8px;padding:10px;min-height:60px;font-size:13px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--acc);color:#08130c;padding:7px 14px;border-radius:8px;display:none;z-index:9;font-weight:600;max-width:80%}
.foot{color:var(--mut);font-size:11px;margin-top:20px}
.saved{color:var(--ok)}
</style>
</head>

<div id="toast"></div>

const inApp = window.parent !== window;
const tell = m => { try { window.parent.postMessage(m, "*"); } catch (e) {} };
const money = n => (n < 0 ? "-" : "") + "$" + Math.abs(Math.round(+n || 0)).toLocaleString();
let toastT; function toast(t, ms) { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => e.style.display = "none", ms || 3200); }

/* ---------- links ---------- */
let WEB_ON = false;
function openLink(url) {
  if (!inApp) { window.open(url, "_blank", "noopener"); return; }
  if (WEB_ON) { tell({ uds: "web-pop", url }); return; }
  try { navigator.clipboard.writeText(url); toast("Link copied – paste it into your browser. (Turn on web for this tab to open links straight from here.)", 5000); }
  catch (e) { prompt("Copy this link:", url); }
}

/* ===== Legal strategies ===== */
{ id: "s-roth", cat: "strategy", risk: 1, title: "Roth IRA, backdoor Roth & mega backdoor", value: "Growth is never taxed again",
  what: "Roth money grows and comes out tax-free. High earners can use the 'backdoor' (non-deductible IRA then convert); some 401(k)s allow after-tax contributions converted to Roth (mega backdoor).",
  how: ["Contribute directly if under the income limit.", "Backdoor: watch the pro-rata rule if you have other IRA money."],
  links: [["IRS Roth IRAs", "https://www.irs.gov/retirement-plans/roth-iras"]], fit: ["employed", "investor"] },
{ id: "s-0cg", cat: "strategy", risk: 1, title: "0% capital gains bracket", value: "Sell gains with $0 federal tax",
  what: "Long-term gains are taxed at 0% while taxable income stays under about $48,000 single / $97,000 joint (2025; a bit higher each year). Retirees and low-income years can 'harvest' gains tax-free and reset the cost basis.",
  how: ["Estimate taxable income for the year.", "Sell and immediately rebuy (no wash rule for gains) up to the limit."],
  links: [["IRS capital gains", "https://www.irs.gov/taxtopics/tc409"]], fit: ["investor", "senior", "lowinc"] },
{ id: "s-tlh", cat: "strategy", risk: 1, title: "Tax-loss harvesting", value: "Offset gains plus $3,000 of other income a year",
  what: "Selling losers cancels gains; extra losses carry forward forever.",
  how: ["Don't rebuy the same or a 'substantially identical' investment within 30 days (wash sale)."],
  links: [["IRS Pub 550", "https://www.irs.gov/publications/p550"]], fit: ["investor"] },
{ id: "s-529", cat: "strategy", risk: 1, title: "529 plans & 529-to-Roth rollover", value: "Tax-free school money; leftover up to $35,000 can move to a Roth",
  what: "Many states also give a state tax deduction for 529 deposits. The 2025 law widened what K-12 and job-training costs count.",
  how: ["Use your state's plan if it gives a deduction.", "Rollover needs the account to be 15+ years old."],
  links: [["IRS 529", "https://www.irs.gov/newsroom/529-plans-questions-and-answers"]], fit: ["kids", "baby", "student"] },
{ id: "s-home", cat: "strategy", risk: 1, title: "Home sale exclusion", value: "$250,000 ($500,000 joint) of profit tax-free",
  what: "If you owned and lived in the home 2 of the last 5 years.",
  how: ["Keep records of improvements; they raise your basis too."],
  links: [["IRS Pub 523", "https://www.irs.gov/publications/p523"]], fit: ["owner"] },
{ id: "s-aug", cat: "strategy", risk: 2, title: "Rent your home 14 days or less (\"Augusta rule\")", value: "Rent received is tax-free",
  what: "Section 280A(g): renting your home for 14 or fewer days a year isn't taxable income. If your own business rents it for real meetings, the business may deduct fair rent.",
  how: ["Charge a documented fair-market rate (compare local venues).", "Keep agendas, minutes and invoices. Fake meetings are a common audit target."],
  links: [["IRS Pub 527", "https://www.irs.gov/publications/p527"]], fit: ["owner", "selfemp"] },
{ id: "s-kids", cat: "strategy", risk: 2, title: "Hire your kids in your business", value: "Wages up to the standard deduction can be income-tax-free",
  what: "A sole proprietor (or parent-only partnership) paying children under 18 for real work owes no Social Security/Medicare on those wages. Kids can put the earnings in a Roth IRA.",
  how: ["Real work, reasonable pay, timesheets, W-2.", "Doesn't work the same way for S- or C-corporations."],
  links: [["IRS family employees", "https://www.irs.gov/businesses/small-businesses-self-employed/family-help"]], fit: ["selfemp", "kids"] },
{ id: "s-qcd", cat: "strategy", risk: 1, title: "Giving from your IRA (QCD) & giving stock", value: "Give to charity tax-free from income",
  what: "At 70½+, send IRA money straight to charity (counts toward required withdrawals, not taxed). At any age, give appreciated stock instead of cash: no capital gains tax and a full deduction if you itemize.",
  how: ["Your IRA custodian sends the check directly to the charity."],
  links: [["IRS QCD", "https://www.irs.gov/retirement-plans/retirement-plans-faqs-regarding-iras-distributions-withdrawals"]], fit: ["senior", "investor"] },
{ id: "s-oz", cat: "strategy", risk: 2, title: "Opportunity Zones", value: "Deferred gains, and no tax on growth after 10 years",
  what: "Reinvest capital gains into a Qualified Opportunity Fund. Made permanent in 2025 with new rolling zones starting 2027.",
  how: ["Invest within 180 days of the sale.", "Vet the fund carefully; returns aren't guaranteed."],
  links: [["IRS Opportunity Zones", "https://www.irs.gov/credits-deductions/businesses/opportunity-zones"]], fit: ["investor"] },
{ id: "s-1031", cat: "strategy", risk: 2, title: "1031 exchange (real estate)", value: "Defer all gain when swapping investment property",
  what: "Sell rental or business real estate and buy more; the tax waits. Held until death, heirs get a stepped-up basis.",
  how: ["Use a qualified intermediary; identify in 45 days, close in 180."],
  links: [["IRS like-kind", "https://www.irs.gov/businesses/small-businesses-self-employed/like-kind-exchanges-real-estate-tax-tips"]], fit: ["owner", "investor"] },
{ id: "s-str", cat: "strategy", risk: 3, title: "Short-term rental & real estate pro status", value: "Paper losses can offset wages",
  what: "Rentals with average stays of 7 days or less where you materially participate, or qualifying as a real estate professional (750+ hours), can let depreciation losses offset other income. Often paired with cost segregation.",
  how: ["Keep a contemporaneous hours log.", "Use a CPA; this is heavily audited."],
  links: [["IRS Pub 925", "https://www.irs.gov/publications/p925"]], fit: ["owner", "investor"] },

  const ev = S.track.filter(t => t.due && !["Received", "Denied"].includes(t.status)).map(t => {
    const d = t.due.replace(/-/g, "");
    return `BEGIN:VEVENT\r\nUID:${t.id}@freemoney\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${d}\r\nSUMMARY:Deadline: ${t.name.replace(/[,;\n]/g, " ")}\r\nBEGIN:VALARM\r\nTRIGGER:-P3D\r\nACTION:DISPLAY\r\nDESCRIPTION:Deadline in 3 days\r\nEND:VALARM\r\nEND:VEVENT`;
  });
  download("free-money-deadlines.ics", `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Randis UDS//Free Money Finder//EN\r\n${ev.join("\r\n")}\r\nEND:VCALENDAR\r\n`, "text/calendar");
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const u = t.closest("[data-url]"); if (u) return openLink(u.dataset.url);
  const g = t.closest("[data-go]"); if (g) return go(g.dataset.go);
  if (t.dataset.track) { const it = ITEMS.find(i => i.id === t.dataset.track); S.track.push({ id: uid(), ref: it.id, name: it.title, status: "Idea", amount: "", got: "", due: "", notes: it.value }); save(); render(); toast("Added to your Tracker."); return; }
  if (t.dataset.deltr != null) { S.track.splice(+t.dataset.deltr, 1); save(); render(); return; }
  const act = t.dataset.act; if (!act) return;
  if (act === "theme") { S.theme = S.theme === "dark" ? "light" : "dark"; save(); render(); }
  if (act === "addTrack") { S.track.push({ id: uid(), ref: "", name: "New item", status: "Idea", amount: "", got: "", due: "", notes: "" }); save(); render(); }
  if (act === "csv") { const rows = [["What", "Status", "Worth", "Received", "Deadline", "Notes"], ...S.track.map(t => [t.name, t.status, t.amount, t.got, t.due, t.notes])]; download("free-money-tracker.csv", rows.map(r => r.map(c => `"${String(c == null ? "" : c).replace(/"/g, '""')}"`).join(",")).join("\r\n"), "text/csv"); }
  if (act === "ics") ics();
  if (act === "ask") { S.ai = ($("#aiQ") || {}).value || ""; save(); ask(S.ai); }
  if (act === "draft") ask(grantPrompt("draft"));
  if (act === "fitcheck") ask(grantPrompt("fit"));
  if (act === "budget") ask(grantPrompt("budget"));
  if (act === "copyAI") { try { navigator.clipboard.writeText(AI.text); toast("Copied."); } catch (err) {} }
  if (act === "scan") $("#scanOut").innerHTML = scan($("#scamTx").value);
  if (act === "scanAI") { const tx = $("#scamTx").value; if (!tx.trim()) return toast("Paste the message first."); view = "ask"; ask("Is this message a scam? Explain the warning signs and what I should do:\n\n" + tx); }
  if (act === "export") download("free-money-finder-backup.json", JSON.stringify(S, null, 1));
  if (act === "wipe") { if (confirm("Erase everything in this tab? Save a backup first if you want to keep it.")) { S = fresh(); save(); render(); } }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.tag) { S.tags[t.dataset.tag] = t.checked; save(); render(); return; }
  if (t.dataset.bind) { set(t.dataset.bind, t.value); save(); renderKeepFocus(); return; }
  if (t.dataset.uc) { S.ucheck[t.dataset.uc] = t.checked; save(); render(); return; }
  if (t.dataset.tr) { const [i, f] = t.dataset.tr.split("|"); S.track[+i][f] = t.value; save(); renderKeepFocus(); return; }
  if (t.id === "imp" && t.files[0]) { t.files[0].text().then(x => { try { const d = JSON.parse(x); if (!d || !Array.isArray(d.track)) throw 0; S = Object.assign(fresh(), d); save(); render(); toast("Backup loaded."); } catch (err) { toast("That isn't a backup from this tab."); } }); }
});
document.addEventListener("input", e => {
  if (e.target.id === "sq") { q = e.target.value; clearTimeout(window._sq); window._sq = setTimeout(() => { const pos = e.target.selectionStart; render(); const n = $("#sq"); n.focus(); n.setSelectionRange(pos, pos); }, 200); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "aiQ" && !e.shiftKey) { e.preventDefault(); $("[data-act=ask]").click(); } });
window.addEventListener("message", e => {
  const m = e.data || {};
  if (m.uds === "web-state") WEB_ON = !!m.on;
  if (m.uds === "exported") toast(m.note || (m.ok ? "Saved." : "Not saved."));
  if (m.uds === "planner" && m.id === AI.id) {
    if (m.done) { AI.status = m.error ? "⚠ " + m.error : ""; AI.text = m.text || AI.text; } else { AI.status = m.status || ""; if (m.text) AI.text = m.text; }
    const st = $("#aiSt"), tx = $("#aiTx"); if (st) st.textContent = AI.status; if (tx) tx.textContent = AI.text || "—"; else if (m.done) render();
  }
});
if (inApp) tell({ uds: "web-hello" });
render();
</script>
</body>
</html>
