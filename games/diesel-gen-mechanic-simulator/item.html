body{margin:0;background:#1e1f22;color:#e6e6e6;font:14px/1.45 Segoe UI,Arial,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#2b2d31;border-bottom:2px solid #c98b2b;flex-wrap:wrap}

.stat{background:#1e1f22;border:1px solid #3a3c42;border-radius:6px;padding:4px 9px;font-size:13px}

nav{display:flex;gap:4px;padding:8px 16px;background:#25272b;flex-wrap:wrap}
nav button{background:#2f3136;color:#ccc;border:1px solid #3a3c42;padding:6px 13px;border-radius:6px;cursor:pointer}
nav button.on{background:#c98b2b;color:#111;font-weight:bold}
main{padding:14px 16px;max-width:1250px}
.card{background:#2b2d31;border:1px solid #3a3c42;border-radius:8px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;color:#f0b44c;font-size:15px}
button.b{background:#3d4048;color:#e6e6e6;border:1px solid #555;padding:6px 10px;border-radius:5px;cursor:pointer;margin:3px 3px 3px 0;font-size:13px}
button.b:hover{background:#4a4e57}
button.go{background:#2e7d32;border-color:#43a047}
button.warn{background:#8a3b12;border-color:#b5541c}
button.b:disabled{opacity:.4;cursor:default}
.test{text-align:left;width:100%}
.done{border-color:#c98b2b!important}
.muted{color:#999;font-size:12px}
.find{border-left:3px solid #c98b2b;padding:4px 8px;margin:4px 0;background:#232428}
.log{max-height:220px;overflow:auto;font-size:13px}
.log div{padding:3px 0;border-bottom:1px solid #333}
.earl{color:#f0b44c}
.bad{color:#ff7b6b}.good{color:#7bd88f}
a{color:#6cb6ff}
table{width:100%;border-collapse:collapse}td{padding:4px 6px;border-bottom:1px solid #35373c}
input{background:#1e1f22;color:#e6e6e6;border:1px solid #555;border-radius:5px;padding:6px;width:100%}
.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:260px}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9}
#ov .card{max-width:440px;text-align:center}
.links a{display:block;padding:3px 0}
.tag{display:inline-block;background:#3a3c42;border-radius:4px;padding:1px 6px;font-size:11px;margin-right:4px}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.steps span{background:#232428;border:1px solid #3a3c42;border-radius:14px;padding:3px 10px;font-size:12px;color:#888}
.steps span.on{background:#c98b2b;color:#111;font-weight:bold;border-color:#f0b44c}
.vbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.hovbar{background:#17181b;border:1px solid #3a3c42;border-radius:5px;padding:5px 9px;margin-bottom:6px;font-size:13px;color:#f0d04c;min-height:30px}
.scenewrap{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
svg.scene{flex:2.2;min-width:420px;width:100%;background:#111;border-radius:6px;border:1px solid #3a3c42}
.insp{flex:1;min-width:250px;background:#232428;border:1px solid #3a3c42;border-radius:6px;padding:10px}
.scene text{pointer-events:none;font-family:Arial,sans-serif}
.hot{cursor:pointer;transition:filter .1s}
.hot.seen{filter:drop-shadow(0 0 3px #f0b44c)}
.hot:hover{filter:brightness(1.35) drop-shadow(0 0 5px #ffffffaa)}
.hot.sel{filter:brightness(1.25) drop-shadow(0 0 6px #fff)}
.st{font:bold 13px Arial;text-anchor:middle}
.st2{font:bold 9px Arial;text-anchor:middle}
.lbl{font:bold 10px Arial;text-anchor:middle;fill:#4a3a10}
.tg{font:bold 11px Arial;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:3px}
.lcd{font:15px Consolas,monospace;fill:#7cfc9a}
.blink{animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
</style>
</head>

function needTool(t){
  if(!t||S.tools[t])return true;

  const c=Math.max(25,Math.round(TOOLS[t].c*.08));S.money-=c;log("Rented a "+TOOLS[t].n+" for $"+c+".","bad");return true;

function act(id){const J=S.job,a=ACT[id];needTool(a.t);hrs(a.h);
  const t=[FAULTS[J.f].cl[id],...J.wear.filter(w=>WEAR[w].a===id).map(w=>WEAR[w].t)].filter(Boolean).join(" ")||OK[id];
  J.tests[id]=t;if(id.startsWith("panel."))J.lcd=id;

function repair(){
  const J=S.job,F=FAULTS[J.dx];F.t.forEach(needTool);
  if(Math.random()<.35){
    log("🩹 \"WHERE'S THE GAFFER TAPE?!\"","earl");
    if(S.gaffer>0){S.gaffer--;hrs(.25);log("Found it under the seat with the Hardee's bags.")}
    else{J.ev="tape";save();render();return}
  }
  finish();
}
function tape(o){const J=S.job;
  if(o==="dig"){hrs(.75);log(Math.random()<.5?"Found an old roll stuck to the dash. Lint and all.":"Found three pencils, a dead mouse and no tape. Made it work anyway.")}
  if(o==="zip"){S.zip--;log("Zip-tied it like a professional. Mostly.")}
  if(o==="cust"){S.rep=Math.max(0,S.rep-2);log("Borrowed duct tape from the customer. They judged you.","bad")}
  J.ev=null;finish();
}
function finish(){
  const J=S.job,F=FAULTS[J.dx],m=MODELS[J.m];
  for(const p in J.have)if(J.have[p]==="truck"){S.parts[p]--;J.pc+=PARTS[p].c}
  hrs(F.h);
  if(J.dx!==J.f){J.wrong++;S.rep=Math.max(0,S.rep-8);log("🔥 Fired it up… it still does it. Wrong call.","bad");earl(pick(EARL.wrong));J.dx=null;J.have={};save();render();return}
  const r=rank(),before=r,C=CUSTS[J.c];
  let pay=own()?Math.round(J.hrs*135*C[1]+J.pc*1.25):Math.round(J.hrs*RANKS[r].w+J.pc);
  let xp=Math.max(5,Math.round((15+F.h*6)*m.d)-J.wrong*8-J.borrow*2-J.hints*3);
  const fl=Object.keys(J.flags),good=fl.filter(p=>W(p)),bad=fl.length-good.length,missed=J.wear.filter(w=>!J.flags[WEAR[w].p]).map(w=>WEAR[w].n);
  const up=good.length*(own()?90:45);pay+=up;xp+=good.length*4;S.rep=Math.max(0,S.rep-bad*3);
  S.money+=pay;S.xp+=xp;S.done++;if(!J.wrong)S.rep=Math.min(100,S.rep+4);
  const ws=(good.length?"<br>🏷️ Quoted "+good.length+" worn part(s): +$"+up:"")+(bad?"<br>❌ "+bad+" good part(s) flagged as worn: −"+bad*3+" rep":"")+(missed.length?"<br>👀 You missed: "+h(missed.join(", ")):"");
  S.job=null;save();
  const after=rank();
  if(after>before)ov(1,"PROMOTED: "+RANKS[after].n+"!",(after===5?"Earl hands you the keys to a beat-up service truck. \"Your show now, partner. Don't call me at 2 AM.\" Now you bill $135/hr, buy your own tools and parts, and no more 'I got that in the truck.'":"Earl: \"Well I'll be. Don't let it go to your head.\" Your wage is now $"+RANKS[after].w+"/hr and bigger iron is on the board.")+ws);
  else ov(1,"Fixed: "+F.n,(own()?"You did it. ":"Earl: \""+pick(EARL.win)+"\" ")+"<br><br>+$"+pay+" · +"+xp+" XP · "+J.hrs.toFixed(1)+" hrs on the job"+ws);
  render();
}

function vInsp(){const J=S.job,p=J.sel;
  if(!p)return`<h3>🔦 Inspector</h3><p class="muted">Hover over anything in the picture to see what it is. Click it to look closer or test it. Doors and cabinets open new views.</p><p class="muted">Gold glow = you've checked it.<br>Spot a worn part (cracked belt, swollen hose, dirty filter, crusty battery posts)? Click it and flag it for extra pay.</p>`;
  const H=HOT[p];let o=`<h3>🔦 ${h(H.n)}</h3>`;
  o+=(H.a||[]).map(a=>{const id=a[0],x=ACT[id];return`<button class="b test ${J.tests[id]?"done":""}" onclick="act('${id}')">${h(a[1])}<br><span class="muted">${x.t?h(TOOLS[x.t].n)+(S.tools[x.t]?" ✓":own()?" (rent)":" (borrow Earl's)"):"hands & eyes"} · ${Math.round(x.h*60)} min</span></button>`+(J.tests[id]?`<div class="find">${h(J.tests[id])}</div>`:"")}).join("");

function vJob(){
  const J=S.job;
  if(!J)return`<div class="card"><h3>No ticket on the board</h3><p>${own()?"Your phone's quiet. Too quiet.":"Earl's leaning on the truck, spitting sunflower seeds."}</p><p class="muted">On a job you walk around the generator, open it up, click parts to look at and test them, then make your call and fix it.</p><button class="b go" onclick="newJob()">Grab the next ticket</button></div>`;
  const m=MODELS[J.m],C=CUSTS[J.c],nt=Object.keys(J.tests).filter(k=>!FLAV[k]).length;
  const step=J.dx?4:nt>=3?3:nt?1:Object.keys(J.opened).length?1:0;
  let o=`<div class="card"><h3>🎫 ${h(C[0])}</h3><b>${h(m.n)}</b> <span class="muted">${h(m.s)}</span><p>Customer says: "${h(FAULTS[J.f].sym)}"</p><span class="tag">${J.hrs.toFixed(1)} hrs on job</span>${J.wrong?`<span class="tag bad">${J.wrong} callback(s)</span>`:""}
  <div class="steps" style="margin-top:8px">${["① Walk around & open doors","② Click parts: look & test","③ Read your clipboard","④ Make the call","⑤ Get parts & turn wrenches"].map((s,i)=>`<span class="${i===step?"on":""}">${s}</span>`).join("")}</div></div>`;
  if(J.ev==="tape")o+=`<div class="card"><h3>🩹 WHERE'S THE GAFFER TAPE?!</h3><p>You need to hold a harness out of the way and the roll's gone. ${own()?"":"Earl swears he \"thought you had it.\""}</p>
  <button class="b" onclick="tape('dig')">Tear the truck apart (+45 min)</button><button class="b" onclick="tape('zip')" ${S.zip>0?"":"disabled"}>Use zip ties (${S.zip})</button><button class="b" onclick="tape('cust')">Ask the customer</button></div>`;
  else if(!J.dx){
    const VS={ext:svgExt,eng:svgEng,ctl:svgCtl,alt:svgAlt,ats:svgAts};
    o+=`<div class="card"><h3>🔧 Go look at it</h3>
    <div class="vbar">${Object.keys(VN).map(v=>`<button class="b ${J.view===v?"go":""}" ${v==="ext"||J.opened[v]?"":"disabled title='Open it from outside first'"} onclick="view('${v}')">${VN[v]}</button>`).join("")}
    <label class="muted" style="margin-left:8px"><input type="checkbox" style="width:auto" ${S.lbl?"checked":""} onchange="S.lbl=this.checked;save();render()"> show labels</label></div>
    <div id="hov" class="hovbar">🖱️ Hover over things in the picture. Click to inspect or open.</div>
    <div class="scenewrap">${VS[J.view]()}<div class="insp">${vInsp()}</div></div></div>`;
    const f=Object.keys(J.tests).filter(k=>!FLAV[k]);
    o+=`<div class="card"><h3>📋 Clipboard (what you found)</h3>`+(f.length?f.map(k=>`<div class="find"><b>${h(HOT[ACT[k].p].n)}</b> <span class="muted">(${h(ACT[k].l)})</span><br>${h(J.tests[k])}</div>`).join(""):`<p class="muted">Nothing yet. Click parts in the picture above.</p>`)+
      (Object.keys(J.flags).length?`<p>🏷️ Flagged worn: ${Object.keys(J.flags).map(p=>h(HOT[p].n)).join(", ")}</p>`:"")+
      (rank()<4?`<button class="b" onclick="hint()">Ask Earl where to look (−3 XP pride)</button>`:"")+`</div>`;
    o+=`<div class="card"><h3>🎯 Make the call: what's wrong with it?</h3><p class="muted">Pick when you're sure. A wrong call costs time, rep and a callback.</p>`+J.cands.map(k=>`<button class="b warn" onclick="dx('${k}')">${h(FAULTS[k].n)}</button>`).join("")+`</div>`;
  }else{
    const F=FAULTS[J.dx];let ready=true;
    o+=`<div class="card"><h3>🧰 Parts & tools for: ${h(F.n)}</h3>`;
    if(!F.p.length)o+=`<p class="muted">No parts needed, just know-how.</p>`;
    o+=`<table>`+F.p.map(p=>{const v=J.have[p];if(!v)ready=false;return`<tr><td>${h(PARTS[p].n)}</td><td>${v?`<span class="good">✓ ${{truck:"in your truck",earl:"from Earl's truck",order:"arrived",house:"bought"}[v]}</span>`:
      (!own()&&!J.tried[p]?`<button class="b" onclick="earlPart('${p}')">"I got that in the truck"</button>`:"")+`<button class="b" onclick="order('${p}')">Order $${PARTS[p].c} (1–3 days)</button><button class="b" onclick="house('${p}')">Parts house $${Math.round(PARTS[p].c*1.4)} (+1 hr)</button>`}</td></tr>`}).join("")+`</table>`;
    o+=`<p class="muted">Tools: ${F.t.map(t=>TOOLS[t].n+(S.tools[t]?" ✓":own()?" (rent)":" (borrow)")).join(", ")} · Book time ${F.h} hrs</p>
    <button class="b go" ${ready?"":"disabled"} onclick="repair()">Turn wrenches</button><button class="b" onclick="undx()">Rethink it</button>
    <p class="muted">${F.how.map((s,i)=>(i+1)+". "+h(s)).join("<br>")}<br>${A(yt(F.yt),"▶ Watch how it's done (YouTube)")}</p></div>`;
  }
  o+=`<div class="card"><h3>Job log</h3><div class="log">${J.log.slice().reverse().map(l=>`<div class="${l[1]}">${h(l[0])}</div>`).join("")}</div></div>`;
  return o;
}
function vTruck(){
  return`<div class="row"><div class="card"><h3>🧰 Your toolbox</h3><table>`+Object.keys(TOOLS).map(t=>`<tr><td>${h(TOOLS[t].n)}</td><td>${S.tools[t]?'<span class="good">owned</span>':`<button class="b" onclick="buyT('${t}')">Buy $${TOOLS[t].c}</button>`}</td></tr>`).join("")+`</table></div>
  <div class="card"><h3>🚚 Truck stock</h3><table>`+Object.keys(PARTS).map(p=>`<tr><td>${h(PARTS[p].n)}</td><td>${S.parts[p]||0}</td><td><button class="b" onclick="buyP('${p}')">+1 $${PARTS[p].c}</button></td></tr>`).join("")+
  `<tr><td>Gaffer tape</td><td>${S.gaffer}</td><td><button class="b" onclick="buyC('gaffer',8)">+1 $8</button></td></tr><tr><td>Zip ties (bag)</td><td>${S.zip}</td><td><button class="b" onclick="buyC('zip',5)">+1 $5</button></td></tr></table>
  <p class="muted">Stocking common parts saves order days. Earl's truck is a coin flip.</p></div></div>`;
}
function vMan(){
  return MODELS.map(m=>`<div class="card"><h3>📘 ${h(m.n)} ${m.r>rank()?'<span class="tag">unlocks at '+RANKS[m.r].n+'</span>':""}</h3><b>${h(m.s)}</b><br><span class="muted">Service: ${h(m.iv)}</span>
  <p><b>Known issues:</b><br>${m.f.map(f=>`• ${h(FAULTS[f].n)}: <i>"${h(FAULTS[f].sym)}"</i> ${A(yt(FAULTS[f].yt),"▶ video")}`).join("<br>")}</p>
  <span class="muted">Mock model. For real units, look up your engine/gen maker's manual: ${A(ddg(m.s.split(",")[0]+" diesel generator service manual pdf"),"search manuals")}</span></div>`).join("")+
  `<div class="card"><h3>🛠️ Field guide</h3>`+Object.keys(FAULTS).map(k=>{const F=FAULTS[k];return`<details><summary><b>${h(F.n)}</b></summary><p class="muted">${F.how.map((s,i)=>(i+1)+". "+h(s)).join("<br>")}<br>Where to look: ${h([...new Set(Object.keys(F.cl).filter(a=>ACT[a]).map(a=>HOT[ACT[a].p].n))].join(", "))}<br>${A(yt(F.yt),"▶ YouTube how-to")}</p></details>`}).join("")+`<p class="muted">⚠️ Real life: lockout/tagout, verify dead, and respect stored energy. Generators bite.</p></div>`;
}
function vRes(){
  const sec=(t,l)=>`<div class="card links"><h3>${t}</h3>${l.map(x=>A(x[0],x[1])).join("")}</div>`;
  return`<div class="row">`+sec("🎓 Trade schools & apprenticeships",[["https://www.apprenticeship.gov","Apprenticeship.gov (US Dept. of Labor)"],["https://www.careeronestop.org","CareerOneStop: find local training"],["https://www.uti.edu","Universal Technical Institute (diesel)"],["https://www.lincolntech.edu","Lincoln Tech"],["https://www.wyotech.edu","WyoTech"],["https://www.nccer.org","NCCER: craft training"],["https://www.egsa.org","EGSA: generator tech certification"],["https://www.ase.com","ASE certification"],["https://www.iuoe.org","IUOE (Operating Engineers union)"],["https://www.ibew.org","IBEW (Electrical Workers union)"]])+
  sec("📚 Manuals & training docs",[["https://quickserve.cummins.com","Cummins QuickServe Online"],["https://sis2.cat.com","Cat SIS 2.0"],["https://www.rehlko.com","Rehlko (formerly Kohler Energy)"],["https://www.generac.com","Generac"],["https://www.perkins.com","Perkins Engines"],["https://www.kubota.com","Kubota"],["https://www.manualslib.com","ManualsLib"],["https://www.osha.gov/control-hazardous-energy","OSHA Lockout/Tagout"],["https://www.nfpa.org","NFPA 110 (emergency power)"]])+`</div><div class="row">`+
  sec("🔩 Tool suppliers",[["https://www.snapon.com","Snap-on"],["https://www.mactools.com","Mac Tools"],["https://www.matcotools.com","Matco Tools"],["https://www.fluke.com","Fluke (meters)"],["https://www.kleintools.com","Klein Tools"],["https://www.milwaukeetool.com","Milwaukee"],["https://www.grainger.com","Grainger"],["https://www.mcmaster.com","McMaster-Carr"],["https://www.harborfreight.com","Harbor Freight"],["https://www.napaonline.com","NAPA"]])+
  sec("▶️ YouTubers worth your time",[[yt("Diesel Creek"),"Diesel Creek"],[yt("Watch Wes Work"),"Watch Wes Work"],[yt("Mustie1"),"Mustie1"],[yt("Adept Ape"),"Adept Ape"],[yt("AvE tools"),"AvE"],[yt("Engineering Explained diesel"),"Engineering Explained"],[yt("diesel generator troubleshooting training"),"Generator troubleshooting (search)"],[yt("transfer switch training"),"ATS training (search)"]])+`</div>
  <div class="card"><h3>🛍️ My Etsy shop</h3>${S.etsy?A(S.etsy,S.etsy):'<span class="muted">Set your shop link in the Profile tab.</span>'}</div><p class="muted">These open on outside websites. Search links are used where channel addresses change.</p>`;
}
function vProf(){
  const r=rank();
  return`<div class="row"><div class="card" style="text-align:center">${HILL(150)}<h3>${h(RANKS[r].n)}</h3><p class="earl">${own()?"\"Your show now, partner.\"":"Earl says: \"You'll make a mechanic yet.\""}</p></div>
  <div class="card"><h3>📈 Career</h3><table>${RANKS.map((k,i)=>`<tr><td>${i<=r?"✅":"⬜"} ${h(k.n)}</td><td>${k.x} XP</td><td>${k.w?"$"+k.w+"/hr":"$135/hr billed"}</td></tr>`).join("")}</table>
  <p>Jobs done: ${S.done} · XP: ${S.xp} · Rep: ${S.rep}</p></div></div>
  <div class="card"><h3>🛍️ Your Etsy shop link</h3><input id="etsyIn" placeholder="https://www.etsy.com/shop/YourShop" value="${h(S.etsy)}"><button class="b go" onclick="setEtsy()">Save</button></div>
  <div class="card"><button class="b warn" onclick="if(confirm('Start a brand new career?')){S=Object.assign(fresh(),{etsy:S.etsy});save();render()}">Start over as a greenhorn</button></div>`;
}
function setEtsy(){const v=etsyIn.value.trim();S.etsy=/^https?:\/\//.test(v)?v:(v?"https://"+v:"");save();render()}

function render(){
  const r=rank(),nx=RANKS[r+1];
  hRank.innerHTML=`<b>${h(RANKS[r].n)}</b><div class="xpbar"><div style="width:${nx?Math.min(100,(S.xp-RANKS[r].x)/(nx.x-RANKS[r].x)*100):100}%"></div></div>`;
  hMoney.textContent="💵 $"+S.money;hDay.textContent="📅 Day "+S.day;hRep.textContent="⭐ Rep "+S.rep;
  hEtsy.href=S.etsy||"#";hEtsy.onclick=S.etsy?null:(e=>{e.preventDefault();tab="prof";render()});
  earlSmall.innerHTML=HILL(46);
  const T=[["job","🎫 Job Board"],["truck","🚚 Truck & Tools"],["man","📘 Manuals"],["res","🔗 Resources"],["prof","🤠 Profile"]];
  nav.innerHTML=T.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("");
  main.innerHTML={job:vJob,truck:vTruck,man:vMan,res:vRes,prof:vProf}[tab]();
}
render();
</script>
</body>
</html>
