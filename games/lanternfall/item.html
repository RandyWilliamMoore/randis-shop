<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lanternfall</title>
<!-- Randis UDS™ by Randy Moore. Original: https://github.com/RandyWilliamMoore/randis-uds · Support: https://ko-fi.com/moorescombinatoricsmatrix -->
<style>
:root{--bg:#0c121d;--bg2:#141e2e;--bg3:#1d2b42;--line:#2d4263;--tx:#eef3f8;--mut:#93a6bf;--amb:#f5b54a;--amb2:#c9832a;--red:#e2574c;--grn:#58c27d;--blu:#4aa8f0;--pur:#b07df0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;user-select:none;overflow:hidden;background:var(--bg)}
body{background:radial-gradient(ellipse at 50% 35%,#22314a 0,#0c121d 65%)}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:linear-gradient(#24365a,#182640);color:var(--tx);padding:8px 16px;border-radius:8px;font-size:14px}
button:hover:not(:disabled){border-color:var(--amb);box-shadow:0 0 10px #f5b54a44}
button:disabled{opacity:.4;cursor:default}
button.amb{background:linear-gradient(#ffc964,#c9832a);color:#1d1205;font-weight:700;border-color:#ffd78a}
button.big{font-size:18px;padding:12px 26px}
#app{height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:6px 12px;background:#0a0f18cc;border-bottom:1px solid var(--line);font-size:15px;min-height:44px;flex-wrap:wrap}
.top .hp{color:#ff8a80;font-weight:700}.top .gold{color:#ffd166;font-weight:700}
.top .sp{flex:1}
.slot{display:inline-grid;place-items:center;width:30px;height:30px;border:1px dashed #3b5378;border-radius:50%;font-size:17px;cursor:pointer;margin-right:2px}
.slot.full{border-style:solid;border-color:#6b88b5;background:#1b2a42}
.slot.sel{box-shadow:0 0 10px var(--amb);border-color:var(--amb)}
.tr{font-size:20px;cursor:default;margin-right:3px;display:inline-block}
.tr.flash{animation:pop .5s}
.screen{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;position:relative}
h1,h2,h3{margin:.3em 0}
.mut{color:var(--mut)}
.panel{background:#121c2bdd;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:16px;max-width:820px}
/* title */
.logo{font-size:64px;font-weight:800;letter-spacing:3px;margin-top:9vh;background:linear-gradient(#ffe2a3,#f5a73a 60%,#b0601c);-webkit-background-clip:text;color:transparent;text-shadow:0 0 40px #f5b54a33}
.lamp{font-size:70px;animation:sway 4s ease-in-out infinite;transform-origin:50% 0;filter:drop-shadow(0 0 22px #ffb84d)}
@keyframes sway{50%{transform:rotate(6deg)}0%,100%{transform:rotate(-6deg)}}
.btncol{display:flex;flex-direction:column;gap:10px;margin-top:22px;width:240px}
.heroes{display:flex;gap:26px;margin-top:24px;flex-wrap:wrap;justify-content:center}
.heroc{width:300px;background:linear-gradient(#1c2a42,#111a29);border:2px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;text-align:center;transition:.15s}
.heroc:hover{transform:translateY(-4px);border-color:var(--amb);box-shadow:0 0 22px #f5b54a33}
.heroc .art{font-size:72px}
/* cards */
.card{width:126px;height:176px;border-radius:11px;background:linear-gradient(#26364f,#16202f);border:2px solid #777;position:relative;padding:6px 7px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;cursor:pointer;box-shadow:0 4px 12px #0008}
.card.tA{border-color:#e2675c}.card.tS{border-color:#58c27d}.card.tP{border-color:#f5b54a}.card.tX,.card.tK{border-color:#6a6a7a;background:linear-gradient(#2a2a35,#18181f)}
.card .cost{position:absolute;left:-9px;top:-9px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe19a,#c9832a);color:#241503;font-weight:800;display:grid;place-items:center;font-size:16px;border:2px solid #1a1206}
.card.cant .cost{background:#555;color:#ccc}
.card .cn{font-weight:700;font-size:13px;text-align:center;margin-top:2px;padding:1px 6px;border-radius:5px;width:100%}
.card.rC .cn{background:#3a4458}.card.rU .cn{background:#2a5185}.card.rR .cn{background:#8a6a1e}.card.rS .cn{background:#3a4458}
.card.up .cn{color:#9effa9}
.card .art{font-size:36px;height:50px;display:grid;place-items:center}
.card .ty{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.card .cd{font-size:11.5px;text-align:center;line-height:1.3;margin-top:4px;color:#dde6f0}
.cd b.up{color:#7dff8e}.cd b.dn{color:#ff8a80}
.cd .k{color:#ffd27a}
.cardgrid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:10px}
.cardgrid .card:hover{transform:scale(1.06)}
/* combat */
.field{flex:1;display:flex;align-items:center;justify-content:space-around;padding:10px 30px;min-height:250px}
.enemies{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.unit{display:flex;flex-direction:column;align-items:center;width:150px;position:relative;border-radius:14px;padding:6px;transition:.15s}
.unit .art{font-size:76px;line-height:1.1;filter:drop-shadow(0 6px 10px #000a)}
.unit.boss .art{font-size:104px}.unit.elite .art{font-size:90px}
.unit .un{font-size:13px;font-weight:700;margin-top:2px;text-align:center}
.unit.dead{opacity:0;pointer-events:none;transition:opacity .6s}
.unit.tgt{cursor:crosshair}
.unit.tgt:hover{background:#f5b54a22;box-shadow:0 0 0 2px var(--amb)}
.hpbar{width:130px;height:15px;background:#311;border-radius:8px;position:relative;overflow:hidden;border:1px solid #000;margin-top:4px}
.hpbar>div{height:100%;background:linear-gradient(#ff6b5e,#b5281e);transition:width .3s}
.hpbar>span{position:absolute;inset:0;font-size:11px;text-align:center;line-height:14px;font-weight:700;text-shadow:0 1px 2px #000}
.hpbar.blk{border-color:#6fb6ff;box-shadow:0 0 6px #6fb6ff}
.blkb{position:absolute;left:-14px;bottom:42px;background:#2c6ab3;border:2px solid #9fd0ff;border-radius:8px 8px 14px 14px;padding:0 6px;font-weight:800;font-size:14px}
.sts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:4px;min-height:22px}
.st{font-size:12px;background:#0008;border-radius:6px;padding:1px 4px;border:1px solid #334}
.st.d{border-color:#a44}.st.p{border-color:#a8822a}
.intent{font-size:15px;font-weight:800;background:#0009;border:1px solid #445;border-radius:10px;padding:2px 9px;margin-bottom:4px;min-height:26px;white-space:nowrap}
.intent.atk{color:#ff9b8f;border-color:#a44}
.tide{width:130px;height:12px;background:#0b2033;border:1px solid #2a5d88;border-radius:6px;overflow:hidden;margin-top:4px;position:relative}
.tide>div{height:100%;background:linear-gradient(90deg,#1d6fb8,#6ed3ff)}
.tide>span{position:absolute;inset:0;font-size:10px;text-align:center;line-height:11px;font-weight:700}
.bottom{display:flex;align-items:flex-end;gap:12px;padding:0 14px 10px;height:232px}
.pile{width:70px;text-align:center;cursor:pointer;font-size:12px;color:var(--mut)}
.pile .pc{width:56px;height:76px;margin:0 auto 4px;border-radius:8px;background:repeating-linear-gradient(45deg,#2a3f63 0 6px,#22344f 6px 12px);border:2px solid #4d6b9a;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.pile.dp .pc{background:repeating-linear-gradient(45deg,#4a2f2f 0 6px,#3a2626 6px 12px);border-color:#8a5a5a}
.energy{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe7a8,#f0a030 55%,#8a4a10);display:grid;place-items:center;font-size:24px;font-weight:800;color:#2a1600;box-shadow:0 0 22px #f5a53a88;border:3px solid #ffdf9a;flex-shrink:0;margin-bottom:60px}
.energy.zero{filter:grayscale(.8) brightness(.7);box-shadow:none}
.hand{flex:1;display:flex;justify-content:center;align-items:flex-end;height:220px;padding-bottom:4px}
.hand .card{margin:0 -3px;transition:transform .12s,box-shadow .12s}
.hand .card:hover{transform:translateY(-30px) scale(1.13);z-index:5}
.hand .card.sel{transform:translateY(-44px) scale(1.15);z-index:6;box-shadow:0 0 22px var(--amb)}
.hand .card .key{position:absolute;bottom:3px;right:6px;font-size:10px;color:#7d8da6}
.endt{margin-bottom:56px}
.msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:800;color:var(--amb);text-shadow:0 0 20px #000,0 0 30px #f5b54a88;pointer-events:none;animation:msg 1.2s forwards;z-index:30;white-space:nowrap}
@keyframes msg{0%{opacity:0;transform:translate(-50%,-30%)}20%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0}}
.float{position:fixed;font-weight:900;font-size:26px;pointer-events:none;z-index:50;animation:fl 1s forwards;text-shadow:0 2px 4px #000}
.float.dmg{color:#ff6a5e}.float.blk{color:#8fd0ff}.float.heal{color:#7dff8e}.float.st{color:#ffd27a;font-size:17px}.float.crest{color:#7fe0ff;font-size:32px}
@keyframes fl{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes pop{50%{transform:scale(1.6)}}
.lunge{animation:lunge .3s}
@keyframes lunge{50%{transform:translateX(-30px)}}
/* map */
.mapwrap{flex:1;overflow-y:auto;width:100%;display:flex;justify-content:center}
.mapside{position:absolute;left:16px;top:16px;width:220px}
svg .nd{cursor:default}
svg .nd circle{fill:#18263c;stroke:#3a5478;stroke-width:2}
svg .nd.can{cursor:pointer}
svg .nd.can circle{stroke:var(--amb);stroke-width:3;animation:pulse 1.2s infinite}
svg .nd.can:hover circle{fill:#3a3420}
svg .nd.done circle{fill:#2d3d22;stroke:#7fbf5a}
svg .nd.here circle{fill:#5a4416;stroke:#ffd27a;stroke-width:4}
@keyframes pulse{50%{stroke-width:6;stroke:#ffe1a0}}
svg line{stroke:#2f4566;stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
svg line.walked{stroke:#d9a441;stroke-dasharray:none}
/* overlays */
#ov{position:fixed;inset:0;background:#000b;display:none;z-index:40;overflow:auto}
#ov.on{display:flex;flex-direction:column;align-items:center;padding:30px 10px}
#tip{position:fixed;display:none;z-index:99;max-width:280px;background:#0b111c;border:1px solid var(--amb2);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.4;pointer-events:none;box-shadow:0 4px 16px #000}
#tip b{color:var(--amb)}
.rw{display:flex;flex-direction:column;gap:8px;width:360px}
.rw button{text-align:left;font-size:15px;padding:11px 14px}
.shop{display:grid;grid-template-columns:repeat(5,auto);gap:18px 16px;justify-content:center}
.price{text-align:center;color:#ffd166;font-weight:700;margin-top:6px}
.price.no{color:#a86}
.sold{opacity:.25;pointer-events:none}
.item{display:flex;flex-direction:column;align-items:center;width:126px;cursor:pointer;background:#162236;border:1px solid var(--line);border-radius:12px;padding:10px}
.item:hover{border-color:var(--amb)}
.item .ic{font-size:40px}
.evart{font-size:90px;text-align:center}
.opt{display:block;width:100%;text-align:left;margin-top:8px;font-size:15px;padding:11px 14px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2a1414;border:1px solid #a44;padding:8px 18px;border-radius:8px;z-index:60;animation:msg 1.6s forwards}
kbd{background:#223;border:1px solid #445;border-radius:4px;padding:0 5px;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<div id="tip"></div>
<script>
(function(){var ok=false;try{ok=!!window.localStorage;localStorage.getItem('x')}catch(e){ok=false}
if(!ok){var m={};var st={getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}}};try{Object.defineProperty(window,'localStorage',{value:st,configurable:true})}catch(e){window.__ls=st}}})();

'use strict';
/* ============ helpers ============ */
const SAVE='lanternfall_run',STATS='lanternfall_stats';
const $=s=>document.querySelector(s);
const R=n=>Math.floor(Math.random()*n);
const pick=a=>a[R(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
let uidc=1;
let S=null,C=null;
const has=id=>S&&S.relics.includes(id);
const inC=()=>C&&!C.over;

/* ============ keywords & statuses ============ */
const KW={
 Burn:'At the start of its turn, it takes damage equal to its Burn (ignores Block), then Burn goes down by 1.',
 Might:'Each attack hit deals this much more damage.',
 Poise:'Each Block card gives this much more Block.',
 Sapped:'Deals 25% less attack damage. Goes down by 1 each turn.',
 Exposed:'Takes 50% more attack damage. Goes down by 1 each turn.',
 Brittle:'Gets 25% less Block from cards. Goes down by 1 each turn.',
 Tide:'Builds up during a fight. At the end of your turn, if you have 10 or more Tide, a Crest crashes: lose 10 Tide and deal 12 damage to ALL enemies.',
 Crest:'When you end your turn with 10+ Tide: lose 10 Tide and deal 12 damage to ALL enemies.',
 Exhaust:'Removed from play until the fight ends.',
 Thorns:'When attacked, deals this much damage back to the attacker.',
 Unplayable:'Can\'t be played.',
 Block:'Stops attack damage. Goes away at the start of your next turn.',
 Power:'Played once, it lasts the rest of the fight.'
};
const ST={
 might:['Might','💪','b','Each attack hit deals this much more damage.'],
 poise:['Poise','🧘','b','Block cards give this much more Block.'],
 sapped:['Sapped','🥀','d','Deals 25% less attack damage. Goes down by 1 each turn.'],
 exposed:['Exposed','🎯','d','Takes 50% more attack damage. Goes down by 1 each turn.'],
 brittle:['Brittle','🧊','d','Gets 25% less Block from cards. Goes down by 1 each turn.'],
 burn:['Burn','🔥','d','At the start of its turn, takes this much damage (ignores Block), then Burn goes down by 1.'],
 thorns:['Thorns','🌵','b','When attacked, deals this much damage back.'],
 ritual:['Ritual','🕯','b','Gains this much Might at the end of each of its turns.'],
 tide:['Tide','🌊','b',KW.Tide],
 drain:['Drained','🌑','d','Next turn you get this much less energy.'],
 nextblock:['Coral','🐚','b','Gain this much Block at the start of your next turn.'],
 energyNext:['Surge','⚡','b','Gain this much extra energy next turn.'],
 drawNext:['Foresight','👁','b','Draw this many extra cards next turn.']
};
const PW={
 coal:{n:'Coal Heart',i:'❤️',d:a=>`At the start of your turn, apply ${a} Burn to ALL enemies.`},
 heathaze:{n:'Heat Haze',i:'♨️',d:a=>`Whenever an enemy takes Burn damage, gain ${a} Block.`},
 phoenix:{n:'Phoenix Oath',i:'🔆',d:a=>`At the start of your turn, gain ${a} Might.`},
 everlit:{n:'Ever-Lit',i:'🕯',d:()=>'Enemy Burn no longer goes down.'},
 hightide:{n:'High Tide',i:'🌕',d:a=>`At the start of your turn, gain ${a} Tide.`},
 moonpull:{n:'Moon Pull',i:'🌙',d:()=>'Crests crash at 7 Tide instead of 10.'},
 abyssal:{n:'Abyssal Calm',i:'💧',d:a=>`Whenever a Crest crashes, next turn gain ${a} energy and draw ${2*a} cards.`},
 leviathan:{n:'Leviathan Form',i:'🐋',d:a=>`At the start of your turn, gain ${a} Might and ${2*a} Tide.`}
};

/* ============ combat number helpers for card text ============ */
function D(n){if(!inC())return `${n}`;const st=C.P.st;let v=n+(st.might||0);if(st.sapped)v=Math.floor(v*.75);v=Math.max(0,v);return v===n?`${n}`:`<b class="${v>n?'up':'dn'}">${v}</b>`}
function B(n){if(!inC())return `${n}`;const st=C.P.st;let v=n+(st.poise||0);if(st.brittle)v=Math.floor(v*.75);v=Math.max(0,v);return v===n?`${n}`:`<b class="${v>n?'up':'dn'}">${v}</b>`}
const TD=()=>inC()?(C.P.st.tide||0):0;
const U=(u,a,b)=>u?b:a;

/* ============ cards ============ */
// t: A attack, S skill, P power, X status, K curse. r: S starter, C common, U uncommon, R rare. h: L, T, S(shared starter), N(neutral)
const CARDS={
 strike:{n:'Strike',h:'S',r:'S',t:'A',c:1,tg:1,art:'🗡️',d:u=>`Deal ${D(U(u,6,9))} damage.`,p:(u,t)=>hit(t,U(u,6,9))},
 ward:{n:'Ward',h:'S',r:'S',t:'S',c:1,art:'🛡️',d:u=>`Gain ${B(U(u,5,8))} Block.`,p:u=>blk(U(u,5,8))},
 // ---- Lamplighter
 flare:{n:'Flare',h:'L',r:'S',t:'A',c:1,tg:1,art:'🎇',d:u=>`Deal ${D(U(u,5,7))} damage. Apply ${U(u,3,4)} Burn.`,p:(u,t)=>{hit(t,U(u,5,7));ap(t,'burn',U(u,3,4))}},
 wickslash:{n:'Wick Slash',h:'L',r:'C',t:'A',c:1,tg:1,art:'🔪',d:u=>`Deal ${D(U(u,8,11))} damage. If the enemy has Burn, draw 1 card.`,p:(u,t)=>{const b=t.st.burn>0;hit(t,U(u,8,11));if(b)drw(1)}},
 sootcloud:{n:'Soot Cloud',h:'L',r:'C',t:'S',c:1,art:'🌫️',d:u=>`Gain ${B(U(u,6,9))} Block. Apply 1 Sapped to ALL enemies.`,p:u=>{blk(U(u,6,9));apAll('sapped',1)}},
 cindertoss:{n:'Cinder Toss',h:'L',r:'C',t:'A',c:0,tg:1,art:'✨',d:u=>`Deal ${D(U(u,3,5))} damage. Apply ${U(u,2,3)} Burn.`,p:(u,t)=>{hit(t,U(u,3,5));ap(t,'burn',U(u,2,3))}},
 stoke:{n:'Stoke',h:'L',r:'C',t:'S',c:1,tg:1,art:'🔥',d:u=>`Apply ${U(u,5,8)} Burn.`,p:(u,t)=>ap(t,'burn',U(u,5,8))},
 brace:{n:'Brace',h:'L',r:'C',t:'S',c:1,art:'🧱',d:u=>`Gain ${B(U(u,8,11))} Block.`,p:u=>blk(U(u,8,11))},
 twinspark:{n:'Twin Spark',h:'L',r:'C',t:'A',c:1,tg:1,art:'⚡',d:u=>`Deal ${D(U(u,4,6))} damage twice.`,p:(u,t)=>hit(t,U(u,4,6),2)},
 ashstep:{n:'Ash Step',h:'L',r:'C',t:'S',c:1,art:'👣',d:u=>`Gain ${B(U(u,4,7))} Block. Draw 2 cards.`,p:u=>{blk(U(u,4,7));drw(2)}},
 scorchline:{n:'Scorch Line',h:'L',r:'C',t:'A',c:1,art:'〰️',d:u=>`Deal ${D(U(u,5,8))} damage to ALL enemies. Apply 1 Burn to ALL enemies.`,p:u=>{hitAll(U(u,5,8));apAll('burn',1)}},
 kindling:{n:'Kindling',h:'L',r:'C',t:'S',c:0,ex:1,art:'🌾',d:u=>`Draw ${U(u,2,3)} cards.`,p:u=>drw(U(u,2,3))},
 heatshield:{n:'Heat Shield',h:'L',r:'C',t:'S',c:1,art:'🔰',d:u=>`Gain ${B(U(u,6,9))} Block. Gain ${U(u,3,4)} more if any enemy has Burn.`,p:u=>{blk(U(u,6,9));if(liveEn().some(e=>e.st.burn))blkRaw(U(u,3,4))}},
 emberjab:{n:'Ember Jab',h:'L',r:'C',t:'A',c:0,tg:1,art:'👊',d:u=>`Deal ${D(U(u,3,5))} damage. Apply ${U(u,1,2)} Exposed.`,p:(u,t)=>{hit(t,U(u,3,5));ap(t,'exposed',U(u,1,2))}},
 bellows:{n:'Bellows',h:'L',r:'C',t:'S',c:1,cu:0,tg:1,art:'💨',d:u=>`Double the enemy's Burn.`,p:(u,t)=>{if(t.st.burn)ap(t,'burn',t.st.burn,1)}},
 wildfire:{n:'Wildfire',h:'L',r:'U',t:'S',c:2,art:'🌋',d:u=>`Apply ${U(u,6,9)} Burn to ALL enemies.`,p:u=>apAll('burn',U(u,6,9))},
 pyrewall:{n:'Pyre Wall',h:'L',r:'U',t:'S',c:2,art:'🏯',d:u=>`Gain ${B(U(u,14,19))} Block.`,p:u=>blk(U(u,14,19))},
 fanflames:{n:'Fan the Flames',h:'L',r:'U',t:'A',c:1,cu:0,tg:1,art:'🌬️',d:u=>`Deal damage equal to the enemy's Burn${inC()&&C.P.st.might?' (+Might)':''}.`,p:(u,t)=>hit(t,t.st.burn||0)},

/* ============ map ============ */
const RW=14,CL=7;
function genMap(){
 const nodes={},edges=new Set(),K=(r,c)=>r+'_'+c;
 const s0=R(CL);let s1=R(CL);while(s1===s0)s1=R(CL);
 for(let p=0;p<6;p++){
  let c=p===0?s0:p===1?s1:R(CL);
  for(let r=0;r<RW;r++){
   const k=K(r,c);if(!nodes[k])nodes[k]={r,c,t:null,nx:[],x:R(23)-11,y:R(15)-7};
   if(r<RW-1){
    let nc=pick([c-1,c,c+1].filter(x=>x>=0&&x<CL));
    if(nc===c+1&&edges.has(K(r,c+1)+'>'+K(r+1,c)))nc=c;
    if(nc===c-1&&edges.has(K(r,c-1)+'>'+K(r+1,c)))nc=c;
    const ek=k+'>'+K(r+1,nc);if(!edges.has(ek)){edges.add(ek);nodes[k].nx.push(K(r+1,nc))}
    c=nc;
   }else if(!nodes[k].nx.length)nodes[k].nx.push('boss');
  }
 }
 nodes.boss={r:RW,c:3,t:'B',nx:[],x:0,y:0};
 const par={};for(const k in nodes)for(const n of nodes[k].nx)(par[n]=par[n]||[]).push(k);
 const W={F:45,Q:22,E:14,R:12,S:7};
 const keys=Object.keys(nodes).filter(k=>k!=='boss').sort((a,b)=>nodes[a].r-nodes[b].r);
 for(const k of keys){
  const n=nodes[k];
  if(n.r===0){n.t='F';continue}
  if(n.r===8){n.t='T';continue}
  if(n.r===RW-1){n.t='R';continue}
  for(let tries=0;tries<12;tries++){
   let tot=0;for(const t in W)tot+=W[t];let x=Math.random()*tot,t='F';
   for(const tt in W){x-=W[tt];if(x<=0){t=tt;break}}
   if((t==='E'||t==='R')&&n.r<5)continue;
   if(t==='R'&&n.r===RW-2)continue;
   if('ERS'.includes(t)&&(par[k]||[]).some(p=>nodes[p].t===t))continue;
   n.t=t;break;
  }
  if(!n.t)n.t='F';
 }
 return nodes;
}
const NODE={F:['⚔️','Fight'],E:['💀','Elite: a tough fight with a trinket reward'],R:['🔥','Rest site: heal or upgrade a card'],S:['🛒','Shop'],Q:['❓','Unknown: something strange happens'],T:['💎','Treasure'],B:['👑','Boss']};
function canGo(k){const n=S.map[k];if(S.pos===null)return n.r===0;return S.map[S.pos].nx.includes(k)}
function goNode(k){

 S.pos=k;S.path.push(k);S.floor++;
 const t=S.map[k].t;
 if(t==='F'){const pool=S.fights<3?ENC[S.act].easy:ENC[S.act].hard;let e;do{e=pick(pool)}while(pool.length>1&&e.join()===S.lastEnc);S.lastEnc=e.join();S.fights++;startCombat(e,'fight')}
 else if(t==='E')startCombat(pick(ENC[S.act].elite),'elite');
 else if(t==='B')startCombat(S.boss,'boss');
 else if(t==='R'){S.screen='rest';S.node={};save();render()}
 else if(t==='S'){S.screen='shop';S.node=genShop();save();render()}
 else if(t==='T'){S.screen='treasure';S.node={open:false};save();render()}

}

const baseEnergy=()=>3+['eye','crown','gear','fang'].filter(has).length;

function calc(src,tgt,base){let d=base+(src.st.might||0);if(src.st.sapped)d*=.75;if(tgt.st.exposed)d*=1.5;return Math.max(0,Math.floor(d))}

function decay(st){['sapped','exposed','brittle'].forEach(k=>{if(st[k]){st[k]--;if(!st[k])delete st[k]}})}
function playable(c){const d=CARDS[c.id];if(d.un)return 'That card can\'t be played.';if(d.c!==-1&&costOf(c)>C.energy)return 'Not enough energy.';if(d.can&&!d.can(c.u))return 'You don\'t have enough Tide.';return ''}
function clickCard(i){

function playCard(i,t){

async function endTurn(){

 for(const c of C.hand)if(c.id==='regret'){hurtPlayer(1,true)}

/* ============ win / lose ============ */
function winFight(){
 const kind=C.kind;
 if(has('lantern')){heal(6)}
 let gold=kind==='boss'?95+R(11):kind==='elite'?28+R(11):12+R(9);
 if(has('purse'))gold=Math.floor(gold*1.5);
 const rw=[{t:'gold',v:gold}];
 if(kind!=='boss'&&Math.random()<S.tonicChance){rw.push({t:'tonic',v:randTonic()});S.tonicChance=.4}else S.tonicChance=Math.min(.8,S.tonicChance+.1);
 if(kind==='elite'){rw.push({t:'trinket',v:randTrinket()});S.elites++}
 if(C.extra==='trinket')rw.push({t:'trinket',v:randTrinket()});
 rw.push({t:'card',v:cardChoices(kind)});
 if(kind==='boss'){S.bosses++;const pool=shuffle(Object.keys(TR).filter(k=>TR[k].r==='B'&&!has(k)));rw.push({t:'boss',v:pool.slice(0,3)})}
 S.rewards=rw.filter(r=>r.v);S.screen='reward';C=null;save();render();
}
function lose(){

function flushFx(){

  const el=document.querySelector(`[data-ent="${f.k}"]`);if(!el)continue;
  const n=byKey[f.k]=(byKey[f.k]||0)+1;
  const r=el.getBoundingClientRect();const d=document.createElement('div');
  d.className='float '+f.cls;d.textContent=f.txt;d.style.left=(r.left+r.width/2+(n%2?1:-1)*R(30))+'px';d.style.top=(r.top+30+n*18)+'px';

function rMap(){

 const pos=k=>{const n=N[k];if(k==='boss')return [W/2,55];return [40+n.c*74+n.x,Hh-50-n.r*76+n.y]};
 let lines='',nodes='';
 const walked=new Set();for(let i=0;i<S.path.length-1;i++)walked.add(S.path[i]+'>'+S.path[i+1]);
 for(const k in N)for(const n of N[k].nx){const [x1,y1]=pos(k),[x2,y2]=pos(n);lines+=`<line class="${walked.has(k+'>'+n)?'walked':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}
 for(const k in N){
  const n=N[k],[x,y]=pos(k),can=canGo(k),done=S.path.includes(k),here=S.pos===k,big=k==='boss';
  const t=k==='boss'?NODE.B:NODE[n.t];
  nodes+=`<g class="nd ${can?'can':''} ${done?'done':''} ${here?'here':''}" ${can?`onclick="goNode('${k}')"`:''} data-tip="${esc(k==='boss'?'<b>Boss: '+EN[S.boss[0]].n+'</b>':t[1])}">
   <circle cx="${x}" cy="${y}" r="${big?40:21}"/><text x="${x}" y="${y+(big?16:7)}" text-anchor="middle" font-size="${big?44:20}">${big?EN[S.boss[0]].art:t[0]}</text></g>`;
 }
 return `<div class="screen"><div class="mapside panel" style="margin:0"><h3>${ACTS[S.act]}</h3><div class="mut" style="font-size:13px">Depth ${S.act} of 3. Pick a glowing room. Bottom is the start.</div><hr style="border-color:#2d4263">
  ${Object.keys(NODE).map(t=>`<div style="font-size:13px">${NODE[t][0]} ${NODE[t][1].split(':')[0]}</div>`).join('')}</div>
  <div class="mapwrap"><svg width="${W}" height="${Hh}" style="flex-shrink:0">${lines}${nodes}</svg></div></div>`;
}
function rCombat(){
 const P=C.P,H=HEROES[S.hero];
 const selC=C.sel>=0||C.tsel>=0;
 const isT=S.hero==='T'||P.st.tide>0;
 const thr=P.pw.moonpull?7:10;
 const player=`<div class="unit" data-ent="p">${P.block?`<div class="blkb" data-tip="<b>Block</b><br>${esc(KW.Block)}">🛡${P.block}</div>`:''}<div class="art">${H.art}</div>
  <div class="hpbar ${P.block?'blk':''}"><div style="width:${100*S.hp/S.max}%"></div><span>${S.hp}/${S.max}</span></div>
  ${isT?`<div class="tide" data-tip="${esc('<b>Tide</b> '+(P.st.tide||0)+'/'+thr+'<br>'+KW.Tide)}"><div style="width:${Math.min(100,100*(P.st.tide||0)/thr)}%"></div><span>🌊 ${P.st.tide||0}/${thr}</span></div>`:''}
  ${stsHTML(P.st,P.pw)}<div class="un">${H.n}</div></div>`;
 const ens=C.en.map(e=>{const kind=C.kind==='boss'?'boss':C.kind==='elite'?'elite':'';
  return `<div class="unit ${kind} ${e.dead?'dead':''} ${selC&&!e.dead?'tgt':''}" data-ent="e${e.uid}" onclick="clickEnemy(${e.uid})">
  ${e.dead?'<div class="intent"></div>':has('eye')?`<div class="intent" data-tip="Third Eye hides intents.">❔</div>`:intentOf(e)}
  ${e.block?`<div class="blkb">🛡${e.block}</div>`:''}<div class="art">${e.art}</div>
  <div class="hpbar ${e.block?'blk':''}"><div style="width:${100*e.hp/e.max}%"></div><span>${e.hp}/${e.max}</span></div>${stsHTML(e.st)}<div class="un">${e.n}</div></div>`}).join('');
 const hand=C.hand.map((c,i)=>cardHTML(c,{click:`clickCard(${i})`,cls:(playable(c)?'cant ':'')+(C.sel===i?'sel':''),key:i<10?(i+1)%10:''})).join('');
 return `<div class="field">${player}<div class="enemies">${ens}</div></div>
 <div style="text-align:center;height:20px;color:var(--amb);font-size:14px">${C.sel>=0?'Click an enemy to target it (Esc to cancel)':C.tsel>=0?'Click an enemy to throw the tonic at (Esc to cancel)':''}</div>
 <div class="bottom">
  <div class="pile" onclick="showPile('draw')" data-tip="Draw pile"><div class="pc">${C.draw.length}</div>Draw</div>
  <div class="energy ${C.energy?'':'zero'}" data-tip="Energy. Cards cost energy to play. Refills each turn.">${C.energy}/${baseEnergy()}</div>
  <div class="hand">${hand}</div>
  <button class="amb big endt" onclick="endTurn()" ${C.busy?'disabled':''}>End turn</button>
  <div class="pile dp" onclick="showPile('disc')" data-tip="Discard pile"><div class="pc">${C.disc.length}</div>Discard${C.exh.length?`<div style="margin-top:4px;cursor:pointer" onclick="event.stopPropagation();showPile('exh')">🗑 ${C.exh.length}</div>`:''}</div>
 </div>`;
}
function rReward(){
 const lbl=r=>r.t==='gold'?`💰 ${r.v} gold`:r.t==='tonic'?`${TN[r.v].i} ${TN[r.v].n}`:r.t==='trinket'?`${TR[r.v].i} ${TR[r.v].n} <span class="mut">— ${TR[r.v].d}</span>`:r.t==='card'?'🂠 Add a card to your deck':'👑 Choose a boss trinket';
 return `<div class="screen"><div class="panel" style="margin-top:8vh;text-align:center"><h1>Victory</h1><p class="mut">Take what you want.</p>
 <div class="rw">${S.rewards.map((r,i)=>`<button onclick="takeReward(${i})">${lbl(r)}</button>`).join('')}</div>
 <button class="amb big" style="margin-top:16px" onclick="proceed()">${S.pos==='boss'?(S.act>=3?'Finish':'Go deeper ⬇'):'Continue'}</button></div></div>`;
}
function rRest(){
 const crown=has('crown'),n=Math.floor(S.max*.3)+(has('tea')?15:0);
 if(S.node&&S.node.done)return `<div class="screen"><div class="panel" style="margin-top:10vh;text-align:center"><div class="evart">🔥</div><p>${S.node.done}</p><button class="amb big" onclick="leaveNode()">Continue</button></div></div>`;
 return `<div class="screen"><div class="panel" style="margin-top:10vh;text-align:center"><div class="evart">🔥</div><h1>Rest Site</h1><p class="mut">A small fire in a dry corner. You have time for one thing.</p>
 <div style="display:flex;gap:16px;justify-content:center"><button class="big" ${crown?'disabled':''} onclick="doRest()">😴 Rest<br><span class="mut" style="font-size:13px">${crown?'Heavy Crown: no healing':'Heal '+n+' HP'}</span></button>
 <button class="big" onclick="doSmith()">⚒️ Smith<br><span class="mut" style="font-size:13px">Upgrade a card</span></button></div></div></div>`;
}
function rShop(){
 const sh=S.node,pr=p=>{const v=disc(p);return `<div class="price ${S.gold<v?'no':''}">💰 ${v}</div>`};
 return `<div class="screen"><div class="panel" style="text-align:center;max-width:900px"><h1>🛒 The Lamp Shop</h1><p class="mut">"Everything works. Mostly."</p>
 <div class="cardgrid">${sh.cards.map((c,i)=>`<div class="${c.sold?'sold':''}">${cardHTML(c,{click:`buy('cards',${i})`})}${pr(c.price)}</div>`).join('')}</div>
 <div class="cardgrid">${sh.trs.map((t,i)=>`<div class="item ${t.sold?'sold':''}" onclick="buy('trs',${i})" data-tip="${esc(trTip(t.id))}"><div class="ic">${TR[t.id].i}</div><b style="font-size:13px">${TR[t.id].n}</b>${pr(t.price)}</div>`).join('')}
 ${sh.tns.map((t,i)=>`<div class="item ${t.sold?'sold':''}" onclick="buy('tns',${i})" data-tip="${esc(`<b>${TN[t.id].n}</b><br>${TN[t.id].d}`)}"><div class="ic">${TN[t.id].i}</div><b style="font-size:13px">${TN[t.id].n}</b>${pr(t.price)}</div>`).join('')}
 <div class="item ${sh.removed?'sold':''}" onclick="buyRemove()" data-tip="Remove one card from your deck. Costs 25 more each time."><div class="ic">✂️</div><b style="font-size:13px">Remove a card</b>${pr(S.removeCost)}</div></div>
 <button class="amb big" onclick="leaveNode()">Leave shop</button></div></div>`;
}
function rTreasure(){
 const n=S.node;
 return `<div class="screen"><div class="panel" style="margin-top:10vh;text-align:center"><div class="evart">${n.open?'📭':'🧰'}</div><h1>Treasure</h1>
 ${n.open?`<p>${n.res}</p><button class="amb big" onclick="leaveNode()">Continue</button>`:`<button class="amb big" onclick="openChest()">Open the chest</button>`}</div></div>`;
}
function rEvent(){
 const n=S.node,ev=EVENTS[n.ev];
 return `<div class="screen"><div class="panel" style="margin-top:6vh;width:600px"><div class="evart">${ev.art}</div><h1 style="text-align:center">${ev.n}</h1><p>${ev.txt}</p>
 ${n.stage===0?ev.opts.map((o,i)=>`<button class="opt" ${o.ok&&!o.ok()?'disabled':''} onclick="chooseOpt(${i})">${o.t}</button>`).join(''):`<p style="color:var(--amb)">${n.res}</p><button class="amb big" onclick="leaveNode()">Continue</button>`}</div></div>`;
}
function rEnd(won){
 const fl=floorTotal();
 const score=fl*5+S.kills*2+S.elites*15+S.bosses*50+Math.floor(S.gold/10)+(won?250:0);
 const H=HEROES[S.hero];
 return `<div class="screen"><div class="panel" style="margin-top:8vh;text-align:center;width:480px"><div class="evart">${won?'🌅':'🕯️'}</div>
 <h1>${won?'The lights are lit again':'Your lantern goes out'}</h1>
 <p class="mut">${H.n} · ${won?'cleared all 3 depths':'fell on floor '+fl+' in '+ACTS[S.act]}</p>
 <p>Enemies beaten: ${S.kills} · Elites: ${S.elites} · Bosses: ${S.bosses} · Cards in deck: ${S.deck.length}</p>
 <h2 style="color:var(--amb)">Score ${score}</h2>
 <button class="amb big" onclick="S=null;C=null;render()">Back to title</button></div></div>`;
}

/* ============ input ============ */
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'){if($('#ov').classList.contains('on')){closeOv();return}if(C){C.sel=-1;C.tsel=-1;render()}return}
 if($('#ov').classList.contains('on'))return;
 if(!S)return;
 if(S.screen==='combat'&&inC()){
  if(/^[0-9]$/.test(ev.key)){const i=ev.key==='0'?9:+ev.key-1;clickCard(i)}
  else if(ev.key==='e'||ev.key==='E')endTurn();
 }
 if(ev.key==='d'||ev.key==='D')showPile('deck');
});
document.addEventListener('mousemove',ev=>{
 const tip=$('#tip'),el=ev.target.closest&&ev.target.closest('[data-tip]');
 if(!el){tip.style.display='none';return}
 tip.innerHTML=el.getAttribute('data-tip');tip.style.display='block';
 const w=tip.offsetWidth,h=tip.offsetHeight;
 let x=ev.clientX+16,y=ev.clientY+16;if(x+w>innerWidth-6)x=ev.clientX-w-12;if(y+h>innerHeight-6)y=ev.clientY-h-12;
 tip.style.left=x+'px';tip.style.top=y+'px';
});
render();
</script>
</body>
</html>
