<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI",system-ui,sans-serif;color:#fff;user-select:none}
#view{position:fixed;inset:0}#view canvas{display:block}
#credit{position:fixed;right:8px;bottom:6px;font-size:11px;opacity:.75;z-index:60;text-shadow:0 1px 2px #000}
#credit a{color:#bff7b0}
#hud{position:fixed;left:0;right:0;top:0;padding:10px 16px;display:none;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 4px #000a;font-weight:800;z-index:10}
#hearts{font-size:26px;letter-spacing:1px}#hearts .dim{opacity:.25;filter:grayscale(1)}
#wname{font-size:14px;opacity:.9;margin-top:2px}
#counts{font-size:19px;text-align:right;line-height:1.45}
#bossbar{position:fixed;left:50%;top:14px;transform:translateX(-50%);width:min(520px,60%);display:none;text-align:center;z-index:11;font-weight:800;text-shadow:0 2px 4px #000}
#bossbar .bar{height:16px;background:#0009;border:2px solid #fff;border-radius:9px;overflow:hidden;margin-top:4px}
#bossfill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3d6e,#ffb03d);transition:width .3s}
#dialog{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);width:min(780px,92%);background:rgba(10,13,30,.93);border:3px solid #5ee04a;border-radius:18px;padding:14px 20px 10px 100px;display:none;min-height:78px;z-index:40;box-shadow:0 10px 34px #000a;box-sizing:border-box;cursor:pointer}
#dialog .face{position:absolute;left:16px;top:14px;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:#ffffff14;border:2px solid #fff3}
#dialog .who{font-weight:900;margin-bottom:4px;font-size:15px;letter-spacing:.5px}
#dialog .txt{font-size:18px;line-height:1.42;min-height:50px}
#dialog .hint{text-align:right;font-size:11px;opacity:.55;margin-top:4px}
#screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.72))}
.panel{background:rgba(12,16,34,.95);border:3px solid #5ee04a;border-radius:22px;padding:22px 28px;max-width:min(940px,94vw);max-height:86vh;overflow:auto;box-shadow:0 12px 44px #000b;box-sizing:border-box}
.panel h2{margin:0 0 12px;color:#8ff07a;font-size:28px}
.panel h3{margin:16px 0 6px;color:#ffd34a}
.panel p{line-height:1.5;margin:6px 0}
h1.title{font-size:96px;margin:0;line-height:.9;color:#5ee04a;text-shadow:0 7px 0 #1d6b18,0 12px 30px #000;letter-spacing:3px;font-style:italic;text-align:center}
.subt{text-align:center;font-size:24px;font-weight:800;color:#ffd34a;margin:10px 0 4px;text-shadow:0 3px 0 #7a4b00}
.tag{text-align:center;opacity:.8;margin-bottom:18px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
button{font:inherit;font-weight:800;font-size:17px;padding:10px 20px;border-radius:14px;border:3px solid #5ee04a;background:#1b2a18;color:#fff;cursor:pointer;transition:transform .08s,background .15s}
button:hover,button:focus{background:#2f5a25;transform:translateY(-2px);outline:none}
button.alt{border-color:#7fd6ff;background:#12263a}button.alt:hover,button.alt:focus{background:#1d4466}
button:disabled{opacity:.35;cursor:default;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:2px solid #ffffff22;border-radius:16px;padding:12px 14px;background:#ffffff08}
.card.lock{opacity:.45}
.card .big{font-size:34px}
.card b{font-size:18px}
.small{font-size:13px;opacity:.8}
.tape{border-left:4px solid #ffd34a;padding:6px 12px;margin:8px 0;background:#ffffff08;border-radius:0 10px 10px 0}
.tape.lock{border-color:#555;opacity:.5}
kbd{background:#ffffff1c;border:1px solid #fff4;border-bottom-width:3px;border-radius:6px;padding:1px 7px;font-family:inherit;font-weight:800}
table.keys td{padding:4px 10px 4px 0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(10,13,30,.9);border:2px solid #ffd34a;color:#fff;padding:8px 18px;border-radius:14px;font-weight:800;display:none;z-index:25;text-align:center;max-width:80%}
#hint{position:fixed;bottom:8px;left:12px;font-size:12px;opacity:.75;z-index:10;text-shadow:0 1px 2px #000;display:none}
#flash{position:fixed;inset:0;background:#ff2a2a;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:35}
</style>

<script>/* REV! The Frog Who Saved the World: story and lore (original characters).
Randis UDS™ by Randy Moore. Original: https://github.com/RandyWilliamMoore/randis-uds · Support: https://ko-fi.com/moorescombinatoricsmatrix */
const WHO = {
  N: ['📜', 'Narrator', '#e6cf8f'],
  REV: ['🐸', 'Rev', '#6ef05a'],
  GRAN: ['🍃', 'Granny Lilypad', '#a8e090'],
  SPR: ['⚙️', 'Sprocket', '#7fd6ff'],
  HUSH: ['🎩', 'Baron Hushwick', '#c39cff'],
  SHUSH: ['🔇', 'Sergeant Shush', '#b9c3cf'],
  GRID: ['🚧', 'Gridlock', '#ff9a3c'],
  SNOW: ['❄️', 'The Snow Muffler', '#dff2ff'],
  DAMP: ['🔥', 'Doctor Damper', '#ff7a5a']
};

const INTRO = [
  ['N', 'Long ago, the Earth learned to sing. Every river, city and cricket hums along to the Great Beat, kept alive by Beat Cores glowing on top of the Pulse Towers in five lands.'],
  ['N', 'In a noisy little pond lived Rev: the loudest, fastest, most completely bonkers frog who ever ribbited. He never learned to say "hello". He only ever learned to go REEEEEV.'],
  ['GRAN', 'Rev! Stop revving at the ducks and LISTEN. The sky has gone grey. The birds have stopped. Something has stolen the noise!'],
  ['SPR', 'Bzzt! Sprocket the robo-fly reporting! Scans show every Beat Core is wrapped in a muffler. That is the work of the Mute Corps, the robot army of Baron Hushwick!'],
  ['HUSH', 'Citizens of Earth. Shhhhh. From my Muffler Machine on the Moon I will silence every song, every honk, every hiccup. At last... the world will be QUIET.'],
  ['REV', 'REV-REV-REEEEEEEEV!!!'],
  ['GRAN', 'That\'s the spirit. Free the five Beat Cores in each land, flatten Hushwick\'s generals and bring back the Great Beat. Go, you magnificent maniac!']
];

const WORLD_TEXT = [
  { intro: [
      ['SPR', 'Pondopolis, your home town! Hush Drones have clamped mufflers on all five Pulse Towers. Hop up the spiral steps and grab each Beat Core.'],
      ['GRAN', 'Bounce on their heads, or give them a lick with that tongue. And mind your manners. Ha! No, don\'t.']],
    boss: [
      ['SHUSH', 'SHHHHH! No running in the city! No hopping! No croaking! And absolutely NO FUN!'],
      ['SPR', 'He drops from the sky and makes shockwaves. Jump the rings! When he wobbles, the red valve on top is the weak spot!']],
    win: [
      ['SHUSH', 'My... my lovely silence...'],
      ['SPR', 'Listen! The pond is singing again! Next stop: the Neon Nightway!']] },
  { intro: [
      ['SPR', 'The city that never sleeps now never makes a sound. Hushwick muted every horn, radio and karaoke bar.'],
      ['SPR', 'Watch the ring road! Those hover-cars don\'t brake for frogs.']],
    boss: [
      ['GRID', 'HALT. You are exceeding the noise limit by four hundred percent. Prepare to be... PARKED.'],
      ['SPR', 'He charges in straight lines and spits traffic lights. Dodge sideways, then lick the beacon on his head!']],
    win: [
      ['GRID', 'Gridlock... cleared...'],
      ['SPR', 'Car horns! Sirens! Lovely, awful noise! Onward to Frostbyte Peaks!']] },
  { intro: [
      ['SPR', 'Brrr-zzt. These mountains used to yodel. Now even the avalanches tiptoe.'],
      ['GRAN', '(on the radio) The ice is slippery, Rev. Hop small, slide smart, and don\'t lick anything metal.']],
    boss: [
      ['SNOW', 'I am the Snow Muffler. I wrap the world in soft white silence. Lie down, little frog. Sleep.'],
      ['SPR', 'Shockwaves AND snowballs! Keep moving, and stomp his earmuffs when he gets tired!']],
    win: [
      ['SNOW', 'Melting... it is all so... LOUD...'],
      ['SPR', 'The yodels are back! My scans say Hushwick builds his mufflers under the volcano. Lava Labs, here we come!']] },
  { intro: [
      ['SPR', 'This is where the Mute Corps is made. Don\'t touch the lava. Frogs are not fireproof!'],
      ['SPR', 'Some stepping stones drift about. Wait for them, then hop.']],
    boss: [
      ['DAMP', 'Ah, the noisy frog. I am Doctor Damper, inventor of the Muffler Machine. It turns every sound into... nothing. Shall I demonstrate?'],
      ['SPR', 'He does everything: charges, slams AND shoots. Hit the glowing chimney when he overheats!']],
    win: [
      ['DAMP', 'Very well. The Machine is on the Moon. The rocket leaves from my roof. Go. I find I rather miss the birds.'],
      ['SPR', 'Did the bad guy just... help us? TO THE MOON!']] },
  { intro: [
      ['SPR', 'Orbit Station! Low gravity: your jumps go WAY higher. Out here there is no sound at all. Hushwick\'s dream.'],
      ['GRAN', '(very crackly radio) Free the last Cores, Rev. The whole world is listening for you.']],
    boss: [
      ['HUSH', 'You. The frog who cannot be quiet. Do you know why I did this? The world is so LOUD. I only wanted one moment of peace.'],
      ['REV', '...rev?'],
      ['HUSH', 'No! No more! MUFFLER MACHINE, FULL POWER!']],
    win: [
      ['HUSH', 'The noise... it doesn\'t hurt. It sounds like... music?'],
      ['GRAN', 'There\'s room for quiet in a loud world, Baron. You just have to ask nicely.'],
      ['SPR', 'Bzzt! Every Beat Core is free! THE GREAT BEAT IS BACK!']] }
];

const ENDING = [
  ['N', 'And so the world sang again. The ponds croaked, the cities honked, the mountains yodelled and the volcano went BLORP.'],
  ['N', 'Baron Hushwick moved into a cosy library on the Moon, where he is very happy. Doctor Damper invented earplugs that are polite.'],
  ['N', 'And every year, on Rev Day, the whole planet goes REEEEV for one full minute. Even the Baron. Quietly.'],
  ['REV', 'REV-REV-REEEEEEEEEEEEEEEEV!!!']
];

/* Ten lore tapes, two hidden in each land. */
const TAPES = [
  { id: 'pond_a', w: 0, title: 'Rev\'s First Rev', text: 'Rev hatched on the same morning the mail scooter broke down outside the pond. It spluttered, it backfired, it went REEEV. Rev listened very carefully. His first word was the scooter. He has never said another one, and he has never needed to.' },
  { id: 'pond_b', w: 0, title: 'Granny Lilypad', text: 'Before she was the oldest frog in Pondopolis, Granny Lilypad was the drummer of the Bog Band, the loudest act ever banned from the Swamp Fair. She still keeps her sticks under her lily pad, "for emergencies".' },
  { id: 'neon_a', w: 1, title: 'How Sprocket Was Built', text: 'Sprocket was an alarm clock until Rev sat on it. Rev glued it back together with pond weed, two springs and a lot of hope. It woke up as a fly that cannot stop buzzing, talking or scanning things. It is still technically set for 6:45.' },

}
function updateEnemies(dt) {
  const W = curW(), pc = new T.Vector3(P.pos.x, P.pos.y + 0.7, P.pos.z), lvl = wi * 0.35;
  for (const e of enemies) {
    if (!e.alive) continue; e.t += dt;
    if (e.stun > 0) { e.stun -= dt; e.g.rotation.z = Math.sin(e.t * 20) * 0.3; }
    else {
      e.g.rotation.z = 0;
      const dx = P.pos.x - e.pos.x, dz = P.pos.z - e.pos.z, d = Math.hypot(dx, dz);
      if (e.type === 'drone') {
        e.rotor.rotation.z += dt * 20;
        if (d < 10 && Math.abs(P.pos.y - e.pos.y) < 6) { const sp = 3.1 + lvl; e.pos.x += dx / d * sp * dt; e.pos.z += dz / d * sp * dt; e.pos.y += clamp(P.pos.y + 1.1 - e.pos.y, -1, 1) * 1.6 * dt; e.g.rotation.y = Math.atan2(dx, dz); }
        else { e.ang += dt * 0.7; const tx = e.home.x + Math.cos(e.ang) * e.range, tz = e.home.z + Math.sin(e.ang) * e.range; e.pos.x += (tx - e.pos.x) * dt; e.pos.z += (tz - e.pos.z) * dt; e.pos.y += (e.home.y + Math.sin(e.t) * 0.4 - e.pos.y) * dt; e.g.rotation.y = e.ang + Math.PI; }

        let tx, tz, sp;

        const ex = tx - e.pos.x, ez = tz - e.pos.z, ed = Math.hypot(ex, ez);
        if (ed > 0.1) { e.pos.x += ex / ed * sp * dt; e.pos.z += ez / ed * sp * dt; e.g.rotation.y = angLerp(e.g.rotation.y, Math.atan2(ex, ez), Math.min(1, 6 * dt)); }
        const hx = e.pos.x - e.home.x, hz = e.pos.z - e.home.z, hd = Math.hypot(hx, hz), lim = e.range * 1.5 + 0.5; if (hd > lim) { e.pos.x = e.home.x + hx / hd * lim; e.pos.z = e.home.z + hz / hd * lim; }
        e.pos.y = e.home.y + Math.abs(Math.sin(e.t * 8)) * 0.08;
      } else if (e.type === 'turret') {
        e.head.rotation.y = angLerp(e.head.rotation.y, Math.atan2(dx, dz), Math.min(1, 4 * dt)); e.cd -= dt;
        if (d < 18 && e.cd <= 0) { e.cd = 2.8 - wi * 0.2; const from = e.pos.clone().add(new T.Vector3(0, 0.15, 0)); fireShot(from, pc, 9, 0xff3ddc); }
      }
    }

  for (const c of cars) {
    c.a += c.dir * c.speed * dt; const x = Math.cos(c.a) * c.lane, z = Math.sin(c.a) * c.lane; c.g.position.set(x, 0, z); c.g.rotation.y = -c.a + (c.dir > 0 ? 0 : Math.PI);

}
function fireShot(from, at, speed, color, big) {
  const m = mk(GS, bas(color), from.x, from.y, from.z, big ? 0.5 : 0.28, big ? 0.5 : 0.28, big ? 0.5 : 0.28);
  const v = new T.Vector3().subVectors(at, from); if (v.lengthSq() < 0.01) v.set(0, 0, 1); v.normalize().multiplyScalar(speed);

}
function updateShots(dt) {
  const pc = new T.Vector3(P.pos.x, P.pos.y + 0.7, P.pos.z);
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i]; s.life -= dt; s.pos.addScaledVector(s.v, dt);
    if (s.pos.distanceTo(pc) < s.r) { hurt(1, s.pos); s.life = 0; }
    if (s.life <= 0 || s.pos.y < -2) { level.remove(s.m); shots.splice(i, 1); }
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.r += r.speed * dt; r.m.scale.set(r.r, 0.7, r.r); r.m.material.opacity = clamp(1 - r.r / r.max, 0, 1);
    const d = Math.hypot(P.pos.x - r.x, P.pos.z - r.z);

  }
}

/* ---------------- boss logic ---------------- */
function bossNext(s) { const b = boss; b.state = s; b.fired = 0;
  if (s === 'chase') b.t = 2.4 - Math.min(1, (b.max - b.hp) * 0.25);
  else if (s === 'slam') { b.t = 1.1; b.from.copy(b.pos); b.to.set(clamp(P.pos.x, -16, 16), 0, clamp(P.pos.z, -16, 16)); }
  else if (s === 'volley') b.t = 1.8;
  else if (s === 'charge') { b.t = 2.0; b.dir.set(P.pos.x - b.pos.x, 0, P.pos.z - b.pos.z).normalize(); }
  else if (s === 'tired') { b.t = 2.8; sfx('beep'); if (b.B.minions && enemies.filter(e => e.alive).length < 4) { for (const s2 of [-1, 1]) makeEnemy('drone', s2 * 14, 2.5, -14, { range: 3 }); } }
  else if (s === 'hurt') b.t = 0.9;
}
function hitBoss() {
  const b = boss; if (!b || b.state !== 'tired') return; b.hp--; sfx('bosshit'); cam.shake = 0.5; b.flash = 0.6; burst(new T.Vector3(b.pos.x, b.top, b.pos.z), 0xffd34a, 30, 8);
  P.vel.y = JV * 1.1; P.jumps = 1; const d = new T.Vector3(P.pos.x - b.pos.x, 0, P.pos.z - b.pos.z); if (d.lengthSq() < 0.01) d.set(0, 0, 1); d.normalize(); P.vel.x = d.x * 9; P.vel.z = d.z * 9; P.inv = Math.max(P.inv, 0.8);
  if (b.hp <= 0) { b.state = 'dead'; b.t = 2.6; musicStop(); } else { bossNext('hurt'); b.speed += 0.5; }
}
function updateBoss(dt) {
  const b = boss; if (!b) return; b.t -= dt; const W = curW();
  const dx = P.pos.x - b.pos.x, dz = P.pos.z - b.pos.z, d = Math.hypot(dx, dz);
  const look = Math.atan2(dx, dz);
  b.flash -= dt; b.body.visible = !(b.flash > 0 && Math.floor(gtime * 25) % 2);
  const tired = b.state === 'tired';
  const sq = tired ? 0.6 : 1; b.body.scale.y += (sq - b.body.scale.y) * Math.min(1, 8 * dt); if (b.B.kind !== 'machine') b.weak.position.y = b.weakY * b.body.scale.y;
  const top = b.top * b.body.scale.y;
  b.weak.material = tired ? bas(Math.floor(gtime * 8) % 2 ? 0xffee55 : 0xff3355) : bas(0x553344);
  b.weak.scale.setScalar(tired ? 0.65 + Math.sin(gtime * 12) * 0.12 : 0.45);
  if (b.B.kind === 'drone') b.body.position.y = tired ? 0 : Math.sin(gtime * 2) * 0.3;
  switch (b.state) {
    case 'intro': if (b.t <= 0) bossNext('chase'); break;
    case 'chase': {
      b.face = angLerp(b.face, look, Math.min(1, 5 * dt));
      if (d > b.r + 1) { b.pos.x += dx / d * b.speed * dt; b.pos.z += dz / d * b.speed * dt; }
      if (b.t <= 0) { const at = b.B.attacks; bossNext(at[b.ai++ % at.length]); }
      break;
    }
    case 'slam': {
      const k = clamp(1 - b.t / 1.1, 0, 1); b.pos.x = lerp(b.from.x, b.to.x, k); b.pos.z = lerp(b.from.z, b.to.z, k); b.pos.y = Math.sin(k * Math.PI) * 8;
      if (b.t <= 0) {
        b.pos.y = 0; sfx('slam'); cam.shake = 0.6; burst(b.pos, 0xffffff, 24, 9, 0.6, 2);
        const rm = mk(GBand, new T.MeshBasicMaterial({ color: W.accent, transparent: true, side: T.DoubleSide }), b.pos.x, 0.35, b.pos.z, 1, 0.7, 1); rm.userData.ownMat = true;
        rings.push({ m: rm, x: b.pos.x, z: b.pos.z, y: 0, r: b.r, speed: 11 + wi, max: 34 });
        b.slams++; if (b.slams < (wi >= 2 ? 2 : 1) + (b.hp <= 1 ? 1 : 0)) { bossNext('slam'); b.t = 1.1 + 0.3; b.from.copy(b.pos); } else { b.slams = 0; bossNext('tired'); }

        b.fired++;
      }
      if (b.t <= 0) bossNext('tired');
      break;
    }
    case 'charge': {
      if (b.t > 1.4) { b.face = angLerp(b.face, look, Math.min(1, 6 * dt)); b.dir.set(dx, 0, dz).normalize(); b.body.position.x = Math.sin(gtime * 60) * 0.1; }
      else {
        b.body.position.x = 0; b.pos.addScaledVector(b.dir, 22 * dt); b.face = Math.atan2(b.dir.x, b.dir.z);
        if (Math.random() < 0.5) burst(b.pos, 0xbbbbbb, 1, 2, 0.4, 1);

    case 'dead': b.body.rotation.z += dt * 2; b.pos.y -= dt * 1.2; if (Math.random() < 0.5) burst(new T.Vector3(b.pos.x + (Math.random() - 0.5) * 4, b.pos.y + Math.random() * 5, b.pos.z + (Math.random() - 0.5) * 4), [0xffd34a, 0xff5a1a, 0xffffff][Math.floor(Math.random() * 3)], 6, 7);

}

function toast(t, ms = 2200) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = 'none', ms); }

let dlg = null, dqueue = [];

  let h = `<div class="panel"><h2>📖 The Lore Book</h2><p class="small">Everything known about the Great Hush. Find all ten Lore Tapes to fill it in.</p><h3>The story so far</h3>`;
  h += INTRO.map(l => `<p><b style="color:${WHO[l[0]][2]}">${WHO[l[0]][1]}:</b> ${l[1]}</p>`).join('');
  h += `<h3>Who's who</h3><div class="grid">` + BIOS.map(b => b.need <= met ? `<div class="card"><div class="big">${WHO[b.who][0]}</div><b>${b.name}</b><p class="small">${b.text}</p></div>` : `<div class="card lock"><div class="big">❔</div><b>???</b><p class="small">Save ${b.need} land${b.need > 1 ? 's' : ''} to learn more.</p></div>`).join('') + `</div>`;
  h += `<h3>The lands</h3>` + WORLDS.map((W, i) => `<p>${W.icon} <b>${W.name}</b>, ${W.sub}: ${SAVE.beaten.includes(i) ? 'saved by Rev. Its Beat Cores ring again.' : i < SAVE.unlocked ? 'still muffled.' : 'not yet reached.'}</p>`).join('');
  h += `<h3>Lore Tapes (${Object.keys(SAVE.tapes).length}/10)</h3>` + TAPES.map(t => SAVE.tapes[t.id] ? `<div class="tape"><b>📼 ${t.title}</b> <span class="small">(${WORLDS[t.w].name})</span><p>${t.text}</p></div>` : `<div class="tape lock"><b>📼 ???</b> <span class="small">Hidden somewhere in ${WORLDS[t.w].name}</span></div>`).join('');
  if (SAVE.finished) h += `<h3>How it ended</h3>` + ENDING.map(l => `<p><b style="color:${WHO[l[0]][2]}">${WHO[l[0]][1]}:</b> ${l[1]}</p>`).join('');
  h += `<div class="btns"><button data-a="${back || 'title'}">← Back</button></div></div>`;
  screen(h);
}
function showPause() {
  mode = 'pause'; if (AC && musG) musG.gain.value = SAVE.music ? 0.06 : 0;
  screen(`<div class="panel"><h2>⏸ Paused</h2><p>${curW().icon} ${curW().name}${kind === 'boss' ? ' · Boss fight' : ' · Beat Cores ' + coresGot + '/' + CORES}</p>
  <div class="btns"><button data-a="resume">▶ Resume</button><button class="alt" data-a="restart">↻ Restart ${kind === 'boss' ? 'fight' : 'land'}</button><button class="alt" data-a="phelp">🎮 Controls</button><button class="alt" data-a="plore">📖 Lore Book</button><button class="alt" data-a="popts">⚙ Options</button><button class="alt" data-a="map">🌍 World Map</button></div></div>`);
}
function resume() { screen(''); mode = 'play'; setVolumes(); pressed = {}; }
function startWorld(i) {
  screen(''); fadeOut(() => {
    buildWorld(i); showHUD(true); musicPlay(makeSong(WORLDS[i].seed, WORLDS[i].music.root, WORLDS[i].music.minor, WORLDS[i].music.tempo, WORLDS[i].music.lead)); fadeIn();
    $('#hint').textContent = 'WASD move · Space jump ×2 · Shift dash · F/click tongue · R rev · drag/Q/E camera · Esc pause';
    dialog([['N', WORLDS[i].icon + ' ' + WORLDS[i].name + ': ' + WORLDS[i].sub]].concat(WORLD_TEXT[i].intro), () => { mode = 'play'; });
  });
}
function goBoss() {
  mode = 'busy'; sfx('portal');
  fadeOut(() => {
    buildBoss(wi); showHUD(true); const W = curW(); musicPlay(makeSong(W.seed * 7 + 3, W.music.root + 2, true, W.music.tempo + 14, 'sawtooth')); fadeIn();
    dialog(WORLD_TEXT[wi].boss, () => { mode = 'play'; });
  });
}
function bossDefeated() {
  const W = curW(); boss.g.visible = false; burst(boss.pos, W.lit, 60, 12, 1.5, 6); sfx('win'); mode = 'busy';
  if (!SAVE.beaten.includes(wi)) SAVE.beaten.push(wi); SAVE.unlocked = Math.max(SAVE.unlocked, Math.min(5, wi + 2)); saveGame();
  boss = null; $('#bossbar').style.display = 'none';
  setTimeout(() => dialog(WORLD_TEXT[wi].win, () => {
    if (wi === 4) { SAVE.finished = true; saveGame(); dialog(ENDING, showCredits); }
    else showResults();
  }), 1400);
}
function showResults() {
  mode = 'menu'; showHUD(false); musicPlay(titleSong());
  const W = WORLDS[wi], tp = TAPES.filter(t => t.w === wi && SAVE.tapes[t.id]).length;
  SAVE.best[wi] = Math.max(SAVE.best[wi] || 0, worldFlies); saveGame();
  screen(`<div class="panel" style="text-align:center"><h2>${W.icon} ${W.name} is singing again!</h2><p>Flies eaten: <b>${worldFlies}</b> · Lore tapes: <b>${tp}/2</b> · Times muffled: <b>${worldMuffles}</b></p>
  <p class="small">${tp < 2 ? 'A lore tape is still hiding here. Replay the land from the World Map to find it.' : 'Both lore tapes found. Nice listening.'}</p>
  <div class="btns">${wi < 4 ? `<button data-a="go" data-w="${wi + 1}">▶ On to ${WORLDS[wi + 1].name}</button>` : ''}<button class="alt" data-a="map">🌍 World Map</button></div></div>`);
}
function showCredits() {
  mode = 'menu'; showHUD(false); musicPlay(makeSong(99, 60, false, 132, 'square')); revSound(true);
  screen(`<div class="panel" style="text-align:center"><h1 class="title" style="font-size:64px">THE WORLD IS SAVED!</h1>
  <div class="subt">The Great Beat is back, thanks to Rev.</div><p>Lands saved: 5/5 · Lore tapes: ${Object.keys(SAVE.tapes).length}/10 · Times muffled (all time): ${SAVE.muffles}</p>
  <p class="small">REV! The Frog Who Saved the World: an original game made in Randis UDS. Characters, story, music and sound are all original.<br>Randis UDS™ by Randy Moore · 3D by three.js (MIT)</p>
  ${Object.keys(SAVE.tapes).length < 10 ? '<p class="small">Some Lore Tapes are still out there. The World Map lets you replay any land.</p>' : '<p>📼 Every Lore Tape found. You know the whole story!</p>'}
  <div class="btns"><button data-a="map">🌍 World Map</button><button class="alt" data-a="lore">📖 Lore Book</button><button class="alt" data-a="title">Title</button></div></div>`);
}
let worldFlies = 0, worldMuffles = 0;

$('#screen').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; audioInit(); sfx('beep'); const a = b.dataset.a, w = +b.dataset.w;
  if (a === 'play') { if (!SAVE.introSeen) { screen(''); mode = 'story'; dialog(INTRO, () => { SAVE.introSeen = true; saveGame(); mode = 'menu'; showMap(); }); } else showMap(); }
  else if (a === 'intro') { screen(''); dialog(INTRO, () => { mode = 'menu'; showMap(); }); }
  else if (a === 'go') startWorld(w);
  else if (a === 'boss') { screen(''); wi = w; coresGot = CORES; fliesGot = 0; runMuffles = 0; goBoss(); }
  else if (a === 'map') { if (mode === 'pause') { screen(''); } showMap(); }
  else if (a === 'title') showTitle();
  else if (a === 'lore') showLore('title'); else if (a === 'help') showHelp('title'); else if (a === 'opts') showOpts('title');
  else if (a === 'plore') showLore('pause'); else if (a === 'phelp') showHelp('pause'); else if (a === 'popts') showOpts('pause');
  else if (a === 'pause') showPause();
  else if (a === 'resume') resume();
  else if (a === 'restart') { screen(''); if (kind === 'boss') goBoss(); else startWorld(wi); }
  else if (a === 'tsound') { SAVE.sound = !SAVE.sound; saveGame(); setVolumes(); showOpts(showOpts.back); }
  else if (a === 'tmusic') { SAVE.music = !SAVE.music; saveGame(); setVolumes(); showOpts(showOpts.back); }
  else if (a === 'tinvert') { SAVE.invert = !SAVE.invert; saveGame(); showOpts(showOpts.back); }
  else if (a === 'tsens') { SAVE.sens = SAVE.sens >= 2 ? 0.5 : SAVE.sens + 0.5; saveGame(); showOpts(showOpts.back); }
  else if (a === 'reset') { if (confirm('Erase all saved progress and lore tapes?')) { const s = SAVE.sound, m = SAVE.music; SAVE = { unlocked: 1, beaten: [], tapes: {}, best: {}, muffles: 0, sound: s, music: m, invert: false, sens: 1, introSeen: false, finished: false }; saveGame(); showTitle(); } }
});
$('#dialog').addEventListener('click', () => { audioInit(); dialogAdvance(); });

/* ---------------- input ---------------- */
function onKey(code) {
  if (mode === 'dialog') { if (code === 'Enter' || code === 'Space' || code === 'KeyF' || code === 'NumpadEnter') dialogAdvance(); else if (code === 'Escape') dialogEnd(); return true; }
  if (mode === 'play') {
    if (code === 'Escape' || code === 'KeyP') { showPause(); return true; }
    if (code === 'KeyM') { SAVE.music = !SAVE.music; saveGame(); setVolumes(); toast('Music ' + (SAVE.music ? 'on' : 'off'), 900); return true; }
    return false;
  }
  if (mode === 'pause' && (code === 'Escape' || code === 'KeyP') && $('#screen').querySelector('[data-a="resume"]')) { resume(); return true; }
  return mode !== 'play';
}
addEventListener('keydown', e => {
  audioInit();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code) && mode !== 'menu' && mode !== 'title') e.preventDefault();
  if (e.repeat) return;
  const used = onKey(e.code);
  KEYS[e.code] = true; if (!used && mode === 'play') pressed[e.code] = true;
});
addEventListener('keyup', e => { KEYS[e.code] = false; });
addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });
const cv = renderer.domElement; let md = null;
cv.addEventListener('mousedown', e => { audioInit(); md = { x: e.clientX, y: e.clientY, moved: 0 }; });
addEventListener('mousemove', e => { if (!md) return; const dx = e.clientX - md.x, dy = e.clientY - md.y; md.moved += Math.abs(dx) + Math.abs(dy); md.x = e.clientX; md.y = e.clientY; if (mode === 'play' || mode === 'dialog') { cam.yaw -= dx * 0.006 * SAVE.sens; cam.pitch = clamp(cam.pitch + dy * 0.005 * SAVE.sens * (SAVE.invert ? -1 : 1), -0.1, 1.2); } });
addEventListener('mouseup', () => { if (md && md.moved < 6 && mode === 'play') pressed.KeyF = true; md = null; });
cv.addEventListener('wheel', e => { cam.dist = clamp(cam.dist + Math.sign(e.deltaY) * 0.8, 5, 18); e.preventDefault(); }, { passive: false });
const padPrev = {};
function pollPad() {
  PAD.x = PAD.y = PAD.cx = PAD.cy = 0; const gps = navigator.getGamepads ? navigator.getGamepads() : []; const gp = gps && gps[0]; if (!gp) return;
  const dz = v => Math.abs(v) < 0.2 ? 0 : v; PAD.x = dz(gp.axes[0] || 0); PAD.y = -dz(gp.axes[1] || 0); PAD.cx = dz(gp.axes[2] || 0); PAD.cy = dz(gp.axes[3] || 0);
  const map = { 0: 'Space', 2: 'KeyF', 1: 'ShiftLeft', 5: 'ShiftLeft', 3: 'KeyR', 9: 'Escape' };
  for (const i in map) { const now = !!(gp.buttons[i] && gp.buttons[i].pressed); if (now && !padPrev[i]) { audioInit(); const used = onKey(map[i]); if (!used && mode === 'play') pressed[map[i]] = true; if (mode === 'menu' || mode === 'title') { if (i === '0') { const f = document.activeElement; if (f && f.tagName === 'BUTTON') f.click(); } } } padPrev[i] = now; }
}

/* ---------------- HUD, camera, loop ---------------- */
let hudCache = '';
function updateHUD() {
  const hearts = Array.from({ length: P.max }, (_, i) => i < P.hearts ? '❤️' : '<span class="dim">❤️</span>').join('');
  const W = curW(); const tp = TAPES.filter(t => t.w === wi && SAVE.tapes[t.id]).length;
  const right = kind === 'boss' ? `✨ Flies ${fliesGot}` : `💠 Beat Cores ${coresGot}/${CORES}<br>✨ Flies ${fliesGot}<br>📼 Tapes ${tp}/2`;
  const s = hearts + '|' + right + '|' + W.name;
  if (s !== hudCache) { hudCache = s; $('#hearts').innerHTML = hearts; $('#counts').innerHTML = right; $('#wname').textContent = W.icon + ' ' + W.name + (kind === 'boss' ? ' · BOSS' : coresGot >= CORES ? ' · Boss Gate open!' : ''); }
  if (kind === 'boss' && boss) { $('#bossname').textContent = boss.B.name; $('#bossfill').style.width = (boss.hp / boss.max * 100) + '%'; }
}
const camPos = new T.Vector3();
function updateCamera(dt) {
  if (mode === 'title' || (mode === 'menu' && kind !== 'boss')) {
    cam.yaw += dt * 0.12; const t = new T.Vector3(0, 3, 0); const d = 26;
    camera.position.set(Math.sin(cam.yaw) * d, 9 + Math.sin(gtime * 0.3) * 2, Math.cos(cam.yaw) * d); camera.lookAt(t); return;
  }
  if (KEYS.KeyQ) cam.yaw += dt * 2.2 * SAVE.sens; if (KEYS.KeyE) cam.yaw -= dt * 2.2 * SAVE.sens;
  cam.yaw -= PAD.cx * dt * 2.6 * SAVE.sens; cam.pitch = clamp(cam.pitch + PAD.cy * dt * 1.8 * SAVE.sens * (SAVE.invert ? -1 : 1), -0.1, 1.2);
  const tgt = new T.Vector3(P.pos.x, P.pos.y + 1.4, P.pos.z); cam.tgt.lerp(tgt, 1 - Math.exp(-10 * dt));
  const cp = Math.cos(cam.pitch);
  camPos.set(cam.tgt.x + Math.sin(cam.yaw) * cp * cam.dist, cam.tgt.y + Math.sin(cam.pitch) * cam.dist, cam.tgt.z + Math.cos(cam.yaw) * cp * cam.dist);
  const W = curW(); if (W.hazard !== 'void' && W.hazard !== 'lava') camPos.y = Math.max(camPos.y, 0.6);
  camera.position.copy(camPos);
  if (cam.shake > 0) { cam.shake -= dt; const s = cam.shake * 0.6; camera.position.x += (Math.random() - 0.5) * s; camera.position.y += (Math.random() - 0.5) * s; }
  camera.lookAt(cam.tgt);
}
const clock = new T.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); gtime += dt;
  pollPad(); step(dt); updateCamera(dt); renderer.render(scene, camera);
}
function step(dt) {
  if (mode === 'play') {
    updateSolids(); updatePlayer(dt); updateEnemies(dt); updateShots(dt); updateItems(dt); if (kind === 'boss') updateBoss(dt); updateHUD();
    worldFlies = fliesGot; worldMuffles = runMuffles;
  } else if (mode === 'dialog') { updateDialog(dt); updateSolids(); if (portal) updateItems(0); }
  else if (mode === 'busy') { updateSolids(); if (kind === 'boss' && boss && boss.state === 'dead') updateBoss(dt); }
  else if (mode === 'title' || mode === 'menu' || mode === 'story') { updateSolids(); P.face += dt * 0.5; if (mode === 'story') updateDialog(dt); }
  if (mode === 'story' && dlg) updateDialog(dt);
  animateFrog(dt); updateParts(dt);
  if (lavaMesh) lavaMesh.material.color.setHSL(0.05, 1, 0.5 + Math.sin(gtime * 2) * 0.06);
  if (snow) { snow.position.set(P.pos.x, 0, P.pos.z); const a = snow.geometry.attributes.position; for (let i = 0; i < a.count; i++) { let y = a.getY(i) - dt * 2.5; if (y < 0) y += 30; a.setY(i, y); } a.needsUpdate = true; }
  pressed = {};
}
showTitle();
requestAnimationFrame(frame);

/* test hooks (used by the build's headless test) */
window.REV = {
  get mode() { return mode; }, get kind() { return kind; }, get wi() { return wi; }, P, get boss() { return boss; }, get coresGot() { return coresGot; }, items: () => items, towers: () => towers, solids: () => solids, enemies: () => enemies,
  cam, startWorld, goBoss, showMap, showLore, showTitle, step, dialogEnd, take, hitBoss, bossNext, KEYS, press: c => { pressed[c] = true; }, SAVE: () => SAVE
};
</script>
